&lt;script&gt;

/* ==================================================
   BASIC VARIABLES
================================================== */

const canvas =
document.getElementById(&quot;canvas&quot;);

const ctx =
canvas.getContext(&quot;2d&quot;);


/*
   Universal gas constant
*/

const R = 8.314;


/*
   Simulation values
*/

let temperature = 27;

let volume = 10;

let moles = 1;

let particleCount = 80;


/*
   Simulation state
*/

let running = false;

let paused = false;


/*
   Particle array
*/

let particles = [];


/* ==================================================
   KELVIN
================================================== */

function kelvin(){

    return temperature + 273.15;

}


/* ==================================================
   IDEAL GAS PRESSURE
================================================== */

function pressurePa(){

    /*
       Volume must be in m³.
    */

    const volumeM3 =
        volume / 1000;


    /*
       P = nRT / V
    */

    return (
        moles *
        R *
        kelvin()
    ) /
    volumeM3;

}


/* ==================================================
   PRESSURE IN ATM
================================================== */

function pressureAtm(){

    return pressurePa() / 101325;

}


/* ==================================================
   GET EXACT CHAMBER BOUNDARIES
================================================== */

function getChamberBounds(){

    /*
       The chamber width changes
       with the volume.

       IMPORTANT:
       This exact calculation is
       also used by the particles.
    */

    const chamberWidth =
        300 +
        (volume / 30) * 420;


    const left =
        450 -
        chamberWidth / 2;


    const right =
        450 +
        chamberWidth / 2;


    return {

        left:
            left + 12,

        right:
            right - 12,

        top:
            112,

        bottom:
            428

    };

}


/* ==================================================
   CREATE PARTICLES
================================================== */

function createParticles(){

    particles = [];


    const bounds =
        getChamberBounds();


    /*
       Every particle is created
       directly inside the chamber.
    */

    for(
        let i = 0;
        i &lt; particleCount;
        i++
    ){

        particles.push({

            x:
                bounds.left +
                Math.random() *
                (
                    bounds.right -
                    bounds.left
                ),

            y:
                bounds.top +
                Math.random() *
                (
                    bounds.bottom -
                    bounds.top
                ),

            vx:
                (Math.random() - 0.5) * 3,

            vy:
                (Math.random() - 0.5) * 3

        });

    }

}


/* ==================================================
   PARTICLE SPEED
================================================== */

function particleSpeed(){

    /*
       Average molecular speed increases
       with absolute temperature.
    */

    return Math.sqrt(
        kelvin() / 300
    ) * 2.2;

}


/* ==================================================
   KEEP PARTICLES INSIDE
================================================== */

function keepParticleInside(
    p,
    bounds
){

    /*
       LEFT WALL
    */

    if(
        p.x &lt; bounds.left
    ){

        p.x =
            bounds.left;

        p.vx =
            Math.abs(p.vx);

    }


    /*
       RIGHT WALL
    */

    if(
        p.x &gt; bounds.right
    ){

        p.x =
            bounds.right;

        p.vx =
            -Math.abs(p.vx);

    }


    /*
       TOP WALL
    */

    if(
        p.y &lt; bounds.top
    ){

        p.y =
            bounds.top;

        p.vy =
            Math.abs(p.vy);

    }


    /*
       BOTTOM WALL
    */

    if(
        p.y &gt; bounds.bottom
    ){

        p.y =
            bounds.bottom;

        p.vy =
            -Math.abs(p.vy);

    }

}


/* ==================================================
   UPDATE PARTICLES
================================================== */

function updateParticles(){

    const bounds =
        getChamberBounds();


    /*
       If the chamber was resized,
       immediately make sure every
       particle is inside.
    */

    particles.forEach(
        p =&gt; {

            keepParticleInside(
                p,
                bounds
            );

        }
    );


    /*
       Don&#39;t move particles when
       paused or stopped.
    */

    if(
        paused ||
        !running
    ){

        return;

    }


    const speed =
        particleSpeed();


    particles.forEach(
        p =&gt; {

            /*
               Normalize velocity
            */

            const currentSpeed =
                Math.sqrt(
                    p.vx * p.vx +
                    p.vy * p.vy
                );


            if(
                currentSpeed &gt; 0
            ){

                p.vx =
                    (
                        p.vx /
                        currentSpeed
                    ) *
                    speed;


                p.vy =
                    (
                        p.vy /
                        currentSpeed
                    ) *
                    speed;

            }


            /*
               Move
            */

            p.x += p.vx;

            p.y += p.vy;


            /*
               Collision with walls
            */

            keepParticleInside(
                p,
                bounds
            );

        }
    );

}


/* ==================================================
   DRAW CHAMBER
================================================== */

function drawChamber(){

    /*
       SAME width calculation
       used by particle system.
    */

    const chamberWidth =
        300 +
        (volume / 30) * 420;


    const left =
        450 -
        chamberWidth / 2;


    const right =
        450 +
        chamberWidth / 2;


    /*
       Gas chamber background
    */

    ctx.fillStyle =
        &quot;rgba(80,160,255,.08)&quot;;


    ctx.fillRect(
        left,
        100,
        chamberWidth,
        340
    );


    /*
       Chamber border
    */

    ctx.strokeStyle =
        &quot;#65c9ff&quot;;

    ctx.lineWidth = 3;


    ctx.strokeRect(
        left,
        100,
        chamberWidth,
        340
    );


    /*
       Piston
    */

    ctx.fillStyle =
        &quot;#8f8f9e&quot;;


    ctx.fillRect(
        left - 8,
        85,
        chamberWidth + 16,
        15
    );


    ctx.strokeStyle =
        &quot;#e1e1e8&quot;;


    ctx.strokeRect(
        left - 8,
        85,
        chamberWidth + 16,
        15
    );


    /*
       Pressure arrows
    */

    const pressure =
        pressureAtm();


    ctx.font =
        &quot;bold 20px Arial&quot;;

    ctx.fillStyle =
        &quot;#ff9f43&quot;;


    if(
        pressure &gt; 2
    ){

        ctx.fillText(
            &quot;←&quot;,
            left + 15,
            275
        );

        ctx.fillText(
            &quot;→&quot;,
            right - 35,
            275
        );

    }


    /*
       Chamber title
    */

    ctx.font =
        &quot;bold 17px Arial&quot;;

    ctx.fillStyle =
        &quot;white&quot;;


    ctx.fillText(
        &quot;Gas Chamber&quot;,
        375,
        65
    );


    /*
       Volume label
    */

    ctx.font =
        &quot;14px Arial&quot;;

    ctx.fillStyle =
        &quot;#bfcce0&quot;;


    ctx.fillText(
        &quot;V = &quot; +
        volume.toFixed(1) +
        &quot; L&quot;,
        390,
        470
    );


    /*
       Pressure label
    */

    ctx.fillText(
        &quot;P = &quot; +
        pressure.toFixed(2) +
        &quot; atm&quot;,
        500,
        470
    );

}


/* ==================================================
   DRAW PARTICLES
================================================== */

function drawParticles(){

    particles.forEach(
        p =&gt; {

            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                4,
                0,
                Math.PI * 2
            );


            /*
               Temperature-based particle colour.
            */

            let color;


            if(
                temperature &lt; 0
            ){

                color =
                    &quot;#54c7ff&quot;;

            }

            else if(
                temperature &lt; 100
            ){

                color =
                    &quot;#ffd166&quot;;

            }

            else{

                color =
                    &quot;#ff7043&quot;;

            }


            ctx.fillStyle =
                color;


            ctx.shadowBlur =
                12;


            ctx.shadowColor =
                color;


            ctx.fill();


            ctx.shadowBlur =
                0;

        }
    );

}


/* ==================================================
   DRAW THERMOMETER
================================================== */

function drawThermometer(){

    const x = 70;

    const y = 150;

    const height = 240;


    const min = -200;

    const max = 500;


    const ratio =
        (
            temperature - min
        )
        /
        (
            max - min
        );


    const fill =
        Math.max(
            0,
            Math.min(
                1,
                ratio
            )
        );


    /*
       Thermometer body
    */

    ctx.fillStyle =
        &quot;rgba(255,255,255,.1)&quot;;


    ctx.fillRect(
        x,
        y,
        22,
        height
    );


    /*
       Mercury
    */

    let color =
        temperature &lt; 0
        ?
        &quot;#35b9ff&quot;
        :
        &quot;#ff6b35&quot;;


    ctx.fillStyle =
        color;


    ctx.fillRect(
        x,
        y +
        height -
        fill * height,
        22,
        fill * height
    );


    /*
       Thermometer bulb
    */

    ctx.beginPath();


    ctx.arc(
        x + 11,
        y + height + 15,
        18,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color;


    ctx.fill();


    /*
       Temperature display
    */

    ctx.font =
        &quot;bold 15px Arial&quot;;

    ctx.fillStyle =
        color;


    ctx.fillText(
        temperature.toFixed(0) +
        &quot;°C&quot;,
        45,
        y - 15
    );


    /*
       Scale
    */

    ctx.font =
        &quot;11px Arial&quot;;

    ctx.fillStyle =
        &quot;#ddd&quot;;


    ctx.fillText(
        &quot;500°C&quot;,
        42,
        y
    );


    ctx.fillText(
        &quot;0°C&quot;,
        50,
        y +
        height * .714
    );


    ctx.fillText(
        &quot;−200°C&quot;,
        35,
        y + height
    );

}


/* ==================================================
   DRAW EVERYTHING
================================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawChamber();

    drawParticles();

    drawThermometer();

}


/* ==================================================
   INTERFACE UPDATE
================================================== */

function updateInterface(){

    /*
       Slider values
    */

    document.getElementById(
        &quot;tempValue&quot;
    ).textContent =
        temperature;


    document.getElementById(
        &quot;volumeValue&quot;
    ).textContent =
        volume.toFixed(1);


    document.getElementById(
        &quot;molesValue&quot;
    ).textContent =
        moles.toFixed(2);


    document.getElementById(
        &quot;particlesValue&quot;
    ).textContent =
        particleCount;


    /*
       Statistics
    */

    document.getElementById(
        &quot;tempStat&quot;
    ).textContent =
        temperature +
        &quot; °C&quot;;


    document.getElementById(
        &quot;kelvinStat&quot;
    ).textContent =
        kelvin().toFixed(2) +
        &quot; K&quot;;


    document.getElementById(
        &quot;volumeStat&quot;
    ).textContent =
        volume.toFixed(1) +
        &quot; L&quot;;


    document.getElementById(
        &quot;pressureStat&quot;
    ).textContent =
        pressureAtm().toFixed(2) +
        &quot; atm&quot;;


    document.getElementById(
        &quot;molesStat&quot;
    ).textContent =
        moles.toFixed(2) +
        &quot; mol&quot;;


    updateLawExplanation();

}


/* ==================================================
   LAW EXPLANATION
================================================== */

function updateLawExplanation(){

    const law =
        document.getElementById(
            &quot;law&quot;
        ).value;


    const box =
        document.getElementById(
            &quot;lawExplanation&quot;
        );


    if(
        law === &quot;boyle&quot;
    ){

        box.innerHTML =

        &quot;&lt;strong&gt;Boyle&#39;s Law&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;At constant temperature, pressure is inversely proportional to volume.&quot; +

        &quot;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;&lt;strong&gt;P₁V₁ = P₂V₂&lt;/strong&gt;&quot; +

        &quot;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;Decrease the volume → particles collide with the walls more frequently → pressure increases.&quot;;

    }


    else if(
        law === &quot;charles&quot;
    ){

        box.innerHTML =

        &quot;&lt;strong&gt;Charles&#39; Law&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;At constant pressure, volume is directly proportional to absolute temperature.&quot; +

        &quot;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;&lt;strong&gt;V₁/T₁ = V₂/T₂&lt;/strong&gt;&quot; +

        &quot;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;Temperature must be expressed in Kelvin.&quot;;

    }


    else if(
        law === &quot;gay&quot;
    ){

        box.innerHTML =

        &quot;&lt;strong&gt;Gay-Lussac&#39;s Law&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;At constant volume, pressure is directly proportional to absolute temperature.&quot; +

        &quot;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;&lt;strong&gt;P₁/T₁ = P₂/T₂&lt;/strong&gt;&quot; +

        &quot;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;Heating the gas increases the average kinetic energy of particles.&quot;;

    }


    else{

        box.innerHTML =

        &quot;&lt;strong&gt;Ideal Gas Equation&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;Pressure, volume, temperature and amount of gas are connected by:&quot; +

        &quot;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;&lt;strong&gt;PV = nRT&lt;/strong&gt;&quot; +

        &quot;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;The pressure shown is calculated from the current values.&quot;;

    }

}


/* ==================================================
   TEMPERATURE CONTROL
================================================== */

document.getElementById(
    &quot;temperature&quot;
).oninput = function(){

    temperature =

    updateInterface();

};

   VOLUME CONTROL

   IMPORTANT FIX:

    &quot;volume&quot;
).oninput = function(){

================================================== */

};

).oninput = function(){

       New particles are created

    */

};


/* ==================================================
   LAW SELECTOR
================================================== */

document.getElementById(
    &quot;law&quot;
).onchange = function(){

    updateLawExplanation();

};


/* ==================================================
   START
================================================== */

function startSimulation(){

    /*
       Final safety check.

       Every particle is guaranteed
       to be inside the container.
    */

    createParticles();


    running = true;

    paused = false;


    document.getElementById(
        &quot;pauseBtn&quot;
    ).textContent =
        &quot;⏸ Pause&quot;;


    const law =
        document.getElementById(
            &quot;law&quot;
        ).value;


    if(
        law === &quot;boyle&quot;
    ){

        document.getElementById(
            &quot;status&quot;
        ).innerHTML =

        &quot;🔵 &lt;strong&gt;Boyle&#39;s Law active:&lt;/strong&gt; &quot; +

        &quot;Change the volume and observe the inverse pressure relationship.&quot;;

    }


    else if(
        law === &quot;charles&quot;
    ){

        document.getElementById(
            &quot;status&quot;
        ).innerHTML =

        &quot;🟠 &lt;strong&gt;Charles&#39; Law active:&lt;/strong&gt; &quot; +

        &quot;Temperature changes affect the gas volume.&quot;;

    }


    else if(
        law === &quot;gay&quot;
    ){

        document.getElementById(
            &quot;status&quot;
        ).innerHTML =

        &quot;🔥 &lt;strong&gt;Gay-Lussac&#39;s Law active:&lt;/strong&gt; &quot; +

        &quot;Increasing temperature increases pressure.&quot;;

    }


    else{

        document.getElementById(
            &quot;status&quot;
        ).innerHTML =

        &quot;🧪 &lt;strong&gt;Ideal Gas Simulation:&lt;/strong&gt; &quot; +

        &quot;Particle motion represents molecular kinetic energy.&quot;;

    }

}


/* ==================================================
   PAUSE / RESUME
================================================== */

function pauseSimulation(){

    paused =
        !paused;


    document.getElementById(
        &quot;pauseBtn&quot;
    ).textContent =
        paused
        ?
        &quot;▶ Resume&quot;
        :
        &quot;⏸ Pause&quot;;

}


/* ==================================================
   RESET
================================================== */

function resetSimulation(){

    temperature = 27;

    volume = 10;

    moles = 1;

    particleCount = 80;


    running = false;

    paused = false;


    /*
       Restore sliders
    */

    document.getElementById(
        &quot;temperature&quot;
    ).value = 27;


    document.getElementById(
        &quot;volume&quot;
    ).value = 10;


    document.getElementById(
        &quot;moles&quot;
    ).value = 1;


    document.getElementById(
        &quot;particles&quot;
    ).value = 80;


    document.getElementById(
        &quot;pauseBtn&quot;
    ).textContent =
        &quot;⏸ Pause&quot;;


    document.getElementById(
        &quot;status&quot;
    ).textContent =

        &quot;Adjust the pressure, volume and temperature to observe gas behaviour.&quot;;


    /*
       Re-create all particles
       inside the chamber.
    */

    createParticles();


    updateInterface();

}


/* ==================================================
   MAIN ANIMATION LOOP
================================================== */

function animate(){

    /*
       First update particle positions.
    */

    updateParticles();


    /*
       Then draw the chamber and particles.
    */

    draw();


    /*
       Continue animation.
    */

    requestAnimationFrame(
        animate
    );

}


/* ==================================================
   INITIALIZATION
================================================== */

createParticles();

updateInterface();

animate();

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
