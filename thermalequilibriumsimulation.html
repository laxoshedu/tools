&lt;div class=&quot;formula&quot;&gt;

&lt;strong&gt;Heat equation&lt;/strong&gt;

&lt;br&gt;

Q = m × c × ΔT

&lt;br&gt;&lt;br&gt;

&lt;strong&gt;Thermal equilibrium&lt;/strong&gt;

&lt;br&gt;

m₁c₁(T₁ − Tₑ)
+
m₂c₂(T₂ − Tₑ)
= 0

&lt;br&gt;&lt;br&gt;

&lt;br&gt;

&lt;strong&gt;
Tₑ =
(m₁c₁T₁ + m₂c₂T₂)
/
(m₁c₁ + m₂c₂)
&lt;/strong&gt;

&lt;script&gt;

/* =====================================================
   SUBSTANCE DATABASE

   Specific heat values approximately in J/g°C

===================================================== */

const substances={

ice:{
name:&quot;Ice&quot;,
state:&quot;solid&quot;,
c:2.09,
emoji:&quot;🧊&quot;
},

aluminium:{
name:&quot;Aluminium&quot;,
state:&quot;solid&quot;,
c:0.897,
emoji:&quot;⬜&quot;
},

state:&quot;solid&quot;,
c:0.385,
emoji:&quot;🟤&quot;
},

state:&quot;solid&quot;,
c:0.449,
emoji:&quot;⚙️&quot;
},

c:0.84,
emoji:&quot;🔷&quot;
},

emoji:&quot;💧&quot;
},

c:2.44,
emoji:&quot;💧&quot;
},

},

c:2.0,

},

},

state:&quot;gas&quot;,

emoji:&quot;💨&quot;
},

state:&quot;gas&quot;,
c:14.30,
emoji:&quot;💨&quot;
}

};


/* =====================================================
   VARIABLES
===================================================== */

const canvas=
document.getElementById(&quot;canvas&quot;);

const ctx=
canvas.getContext(&quot;2d&quot;);

let leftTemp=-20;
let rightTemp=80;

let leftMass=100;
let rightMass=100;

let leftSub=&quot;water&quot;;
let rightSub=&quot;air&quot;;

let speed=1;

let running=false;
let paused=false;

let equilibriumReached=false;

let leftParticles=[];
let rightParticles=[];
let heatParticles=[];

let initialLeftTemp=-20;
let initialRightTemp=80;


/* =====================================================
   GET DATA
===================================================== */

function getLeft(){

    return substances[leftSub];

}

function getRight(){

    return substances[rightSub];

}


/* =====================================================
   EQUILIBRIUM

   Te =
   (m1 c1 T1 + m2 c2 T2)
   /
   (m1 c1 + m2 c2)

===================================================== */

function calculateEquilibrium(){

    const L=getLeft();
    const R=getRight();

    return (

        leftMass*
        L.c*
        leftTemp

        +

        rightMass*
        R.c*
        rightTemp

    )
    /

    (

        leftMass*L.c
        +
        rightMass*R.c

    );

}


/* =====================================================
   HEAT DIRECTION
===================================================== */

function getDirection(){

    if(
        Math.abs(
            leftTemp-rightTemp
        )&lt;0.02
    ){

        return &quot;equilibrium&quot;;

    }

    if(leftTemp&gt;rightTemp){

        return &quot;left-right&quot;;

    }

    return &quot;right-left&quot;;

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(){

    leftParticles=[];
    rightParticles=[];
    heatParticles=[];


    for(let i=0;i&lt;65;i++){

        leftParticles.push({

            x:130+
            Math.random()*230,

            y:145+
            Math.random()*270,

            vx:
            Math.random()-.5,

            vy:
            Math.random()-.5

        });


        rightParticles.push({

            x:500+
            Math.random()*230,

            y:145+
            Math.random()*270,

            vx:
            Math.random()-.5,

            vy:
            Math.random()-.5

        });

    }

}


createParticles();


/* =====================================================
   PARTICLE SPEED
===================================================== */

function particleSpeed(
    state,
    temperature
){

    const normalized=
    Math.max(
        0,
        Math.min(
            1,
            (temperature+200)/700
        )
    );


    if(state===&quot;solid&quot;){

        return .25+
        normalized*.25;

    }

    if(state===&quot;liquid&quot;){

        return .7+
        normalized*.8;

    }

    return 1.8+
    normalized*2.5;

}


/* =====================================================
   UPDATE PARTICLES
===================================================== */

function updateParticles(
    particles,
    substance,
    minX,
    maxX,
    temperature
){

    const state=
    substance.state;


    if(state===&quot;solid&quot;){

        particles.forEach(
            (p,i)=&gt;{

                const col=i%7;

                const row=
                Math.floor(i/7);

                const targetX=
                minX+20+
                col*35;

                const targetY=
                165+
                row*31;


                p.x+=
                (targetX-p.x)*.12;

                p.y+=
                (targetY-p.y)*.12;


                p.x+=
                (Math.random()-.5)
                *.7;

                p.y+=
                (Math.random()-.5)
                *.7;

            }
        );

        return;

    }


    const maxSpeed=
    particleSpeed(
        state,
        temperature
    );


    particles.forEach(
        p=&gt;{

            p.vx+=
            (Math.random()-.5)
            *.18;

            p.vy+=
            (Math.random()-.5)
            *.18;


            const current=
            Math.sqrt(
                p.vx*p.vx+
                p.vy*p.vy
            );


            if(current&gt;maxSpeed){

                p.vx=
                p.vx/current*
                maxSpeed;

                p.vy=
                p.vy/current*
                maxSpeed;

            }


            p.x+=
            p.vx*speed;

            p.y+=
            p.vy*speed;


            if(p.x&lt;minX){

                p.x=minX;
                p.vx=Math.abs(p.vx);

            }


            if(p.x&gt;maxX){

                p.x=maxX;
                p.vx=-Math.abs(p.vx);

            }


            if(p.y&lt;125){

                p.y=125;
                p.vy=Math.abs(p.vy);

            }


            if(p.y&gt;420){

                p.y=420;
                p.vy=-Math.abs(p.vy);

            }

        }
    );

}


/* =====================================================
   TEMPERATURE → COLOR

   -200 = very cold
   0 = blue
   positive = warmer
===================================================== */

function temperatureColor(
    temperature
){

    if(equilibriumReached){

        return &quot;#b46cff&quot;;

    }


    /*
       Cold range:
       -200°C → deep blue
       0°C → cyan

       Warm range:
       0°C → orange
       500°C → red
    */

    if(temperature&lt;0){

        const ratio=
        Math.min(
            1,
            Math.abs(temperature)/200
        );


        const r=
        Math.round(
            50+
            (1-ratio)*20
        );


        const g=
        Math.round(
            220-
            ratio*100
        );


        const b=255;


        return `rgb(${r},${g},${b})`;

    }


    const ratio=
    Math.min(
        1,
        temperature/500
    );


    const r=255;

    const g=
    Math.round(
        220-
        ratio*190
    );

    const b=
    Math.round(
        255-
        ratio*255
    );


    return `rgb(${r},${g},${b})`;

}


/* =====================================================
   PARTICLE DRAW
===================================================== */

function drawParticle(
    p,
    color
){

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        5,
        0,
        Math.PI*2
    );

    ctx.fillStyle=color;

    ctx.shadowBlur=10;

    ctx.shadowColor=color;

    ctx.fill();

    ctx.shadowBlur=0;

}


/* =====================================================
   THERMOMETER

   Supports -200°C to +500°C
===================================================== */

function drawThermometer(
    x,
    y,
    temperature,
    color
){

    const min=-200;
    const max=500;

    const height=250;

    const ratio=
    (
        temperature-min
    )/
    (
        max-min
    );


    const mercury=
    Math.max(
        0,
        Math.min(
            1,
            ratio
        )
    )*height;


    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        24,
        height,
        12
    );

    ctx.fillStyle=
    &quot;rgba(255,255,255,.1)&quot;;

    ctx.fill();

    ctx.strokeStyle=
    &quot;rgba(255,255,255,.7)&quot;;

    ctx.lineWidth=2;

    ctx.stroke();


    ctx.beginPath();

    ctx.roundRect(
        x+6,
        y+
        height-
        mercury,
        12,
        mercury,
        6
    );

    ctx.fillStyle=color;

    ctx.shadowBlur=15;

    ctx.shadowColor=color;

    ctx.fill();

    ctx.shadowBlur=0;


    /* BULB */

    ctx.beginPath();

    ctx.arc(
        x+12,
        y+height+14,
        18,
        0,
        Math.PI*2
    );

    ctx.fillStyle=color;

    ctx.fill();


    /* SCALE */

    ctx.font=&quot;10px Arial&quot;;

    ctx.fillStyle=&quot;white&quot;;


    const marks=[
        500,
        300,
        100,
        0,
        -100,
        -200
    ];


    marks.forEach(
        value=&gt;{

            const r=
            (
                value-min
            )/
            (
                max-min
            );


            const yy=
            y+
            height-
            r*height;


            ctx.fillText(
                value+&quot;°&quot;,
                x+32,
                yy+4
            );

        }
    );


    ctx.font=
    &quot;bold 14px Arial&quot;;

    ctx.fillStyle=color;

    ctx.fillText(
        formatTemp(temperature),
        x-15,
        y-15
    );

}


/* =====================================================
   TEMPERATURE FORMAT
===================================================== */

function formatTemp(t){

    const rounded=
    Math.round(t*10)/10;

    return (
        rounded+
        &quot;°C&quot;
    );

}


/* =====================================================
   CONTAINERS
===================================================== */

function drawContainers(){

    const leftColor=
    temperatureColor(
        leftTemp
    );

    const rightColor=
    temperatureColor(
        rightTemp
    );


    /* LEFT */

    ctx.fillStyle=
    leftColor
    .replace(&quot;rgb&quot;,&quot;rgba&quot;)
    .replace(&quot;)&quot;,&quot;,0.10)&quot;);

    ctx.fillRect(
        70,100,330,340
    );


    ctx.strokeStyle=
    leftColor;

    ctx.lineWidth=3;

    ctx.strokeRect(
        70,100,330,340
    );


    /* RIGHT */

    ctx.fillStyle=
    rightColor
    .replace(&quot;rgb&quot;,&quot;rgba&quot;)
    .replace(&quot;)&quot;,&quot;,0.10)&quot;);

    ctx.fillRect(
        500,100,330,340
    );


    ctx.strokeStyle=
    rightColor;

    ctx.strokeRect(
        500,100,330,340
    );


    /* LABELS */

    ctx.font=
    &quot;bold 17px Arial&quot;;


    ctx.fillStyle=
    leftColor;

    ctx.fillText(
        getLeft().emoji+
        &quot; &quot;+
        getLeft().name,
        160,
        75
    );


    ctx.fillStyle=
    rightColor;

    ctx.fillText(
        getRight().emoji+
        &quot; &quot;+
        getRight().name,
        585,
        75
    );


    /* TEMPERATURE LABEL */

    ctx.font=
    &quot;bold 16px Arial&quot;;

    ctx.fillStyle=&quot;white&quot;;

    ctx.fillText(
        formatTemp(leftTemp),
        210,
        465
    );


    ctx.fillText(
        formatTemp(rightTemp),
        640,
        465
    );


    /* STATE */

    ctx.font=
    &quot;13px Arial&quot;;

    ctx.fillStyle=&quot;#cfc6d5&quot;;

    ctx.fillText(
        capitalize(
            getLeft().state
        ),
        220,
        487
    );


    ctx.fillText(
        capitalize(
            getRight().state
        ),
        650,
        487
    );


    /* CENTRAL HEAT ZONE */

    ctx.fillStyle=
    &quot;rgba(255,180,60,.07)&quot;;

    ctx.fillRect(
        400,
        100,
        100,
        340
    );


    if(
        running &amp;&amp;
        !equilibriumReached
    ){

        ctx.font=
        &quot;bold 38px Arial&quot;;

        ctx.fillStyle=&quot;#ffd166&quot;;


        if(
            leftTemp&gt;rightTemp
        ){

            ctx.fillText(
                &quot;→&quot;,
                430,
                215
            );

            ctx.fillText(
                &quot;→&quot;,
                430,
                285
            );

            ctx.fillText(
                &quot;→&quot;,
                430,
                355
            );

        }

        else{

            ctx.fillText(
                &quot;←&quot;,
                430,
                215
            );

            ctx.fillText(
                &quot;←&quot;,
                430,
                285
            );

            ctx.fillText(
                &quot;←&quot;,
                430,
                355
            );

        }

    }


    /* THERMOMETERS */

    drawThermometer(
        95,
        135,
        leftTemp,
        leftColor
    );


    drawThermometer(
        525,
        135,
        rightTemp,
        rightColor
    );

}


/* =====================================================
   HEAT PARTICLES
===================================================== */

function createHeatParticle(){

    if(
        !running ||
        equilibriumReached
    )
        return;


    if(
        leftTemp&gt;
        rightTemp
    ){

        heatParticles.push({

            x:395,

            y:
            190+
            Math.random()*180,

            vx:
            2+
            Math.random()*2

        });

    }

    else{

        heatParticles.push({

            x:505,

            y:
            190+
            Math.random()*180,

            vx:
            -(
                2+
                Math.random()*2
            )

        });

    }

}


function updateHeatParticles(){

    if(
        running &amp;&amp;
        Math.random()&lt;.35
    ){

        createHeatParticle();

    }


    heatParticles.forEach(
        p=&gt;{
            p.x+=p.vx*speed;
        }
    );


    heatParticles=
    heatParticles.filter(
        p=&gt;
        p.x&gt;390 &amp;&amp;
        p.x&lt;510
    );

}


function drawHeatParticles(){

    heatParticles.forEach(
        p=&gt;{

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                4,
                0,
                Math.PI*2
            );

            ctx.fillStyle=&quot;#ffd166&quot;;

            ctx.shadowBlur=14;

            ctx.shadowColor=&quot;#ff9f1c&quot;;

            ctx.fill();

            ctx.shadowBlur=0;

        }
    );

}


/* =====================================================
   THERMAL TRANSFER

   IMPORTANT:
   Works for both positive and
   negative Celsius temperatures.

===================================================== */

function updateThermalTransfer(){

    if(
        !running ||
        paused
    )
        return;


    const difference=
    leftTemp-rightTemp;


    if(
        Math.abs(difference)&lt;0.02
    ){

        const finalT=
        calculateEquilibrium();


        leftTemp=finalT;
        rightTemp=finalT;


        running=false;
        equilibriumReached=true;


        heatParticles=[];


        document.getElementById(
            &quot;equilibrium&quot;
        ).style.display=&quot;block&quot;;


        document.getElementById(
            &quot;result&quot;
        ).innerHTML=

        &quot;⚖️ &lt;strong&gt;Thermal equilibrium reached.&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot;+

        &quot;Final temperature: &lt;strong&gt;&quot;+

        formatTemp(finalT)+

        &quot;&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot;+

        &quot;Both substances now have the same temperature, so there is no net heat transfer.&quot;;


        return;

    }


    /*
       Heat capacity

       C = m × c
    */

    const CL=
    leftMass*
    getLeft().c;


    const CR=
    rightMass*
    getRight().c;


    /*
       Small temperature approach step

       The larger the temperature difference,
       the faster the initial transfer.
    */

    const rate=
    Math.abs(difference)
    *
    0.0025
    *
    speed;


    /*
       LEFT HOTTER
    */

    if(difference&gt;0){

        const dQL=
        rate*
        CL;


        leftTemp-=
        dQL/CL;


        rightTemp+=
        dQL/CR;

    }


    /*
       RIGHT HOTTER
    */

    else{

        const dQR=
        rate*
        CR;


        rightTemp-=
        dQR/CR;


        leftTemp+=
        dQR/CL;

    }


    /*
       Prevent crossing equilibrium.
    */

    const equilibrium=
    calculateEquilibrium();


    if(difference&gt;0){

        if(
            rightTemp&gt;
            equilibrium
        ){

            rightTemp=
            equilibrium;

        }

        if(
            leftTemp&lt;
            equilibrium
        ){

            leftTemp=
            equilibrium;

        }

    }

    else{

        if(
            leftTemp&gt;
            equilibrium
        ){

            leftTemp=
            equilibrium;

        }

        if(
            rightTemp&lt;
            equilibrium
        ){

            rightTemp=
            equilibrium;

        }

    }

}


/* =====================================================
   INTERFACE
===================================================== */

function updateInterface(){

    const equilibrium=
    calculateEquilibrium();


    document.getElementById(
        &quot;leftTempStat&quot;
    ).textContent=
    formatTemp(leftTemp);


    document.getElementById(
        &quot;rightTempStat&quot;
    ).textContent=
    formatTemp(rightTemp);


    document.getElementById(
        &quot;equilibriumTemp&quot;
    ).textContent=
    formatTemp(equilibrium);


    document.getElementById(
        &quot;leftName&quot;
    ).textContent=
    getLeft().name;


    document.getElementById(
        &quot;rightName&quot;
    ).textContent=
    getRight().name;


    /*
       Heat transferred
    */

    const qLeft=
    Math.abs(
        leftMass*
        getLeft().c*
        (
            leftTemp-
            initialLeftTemp
        )
    );


    const qRight=
    Math.abs(
        rightMass*
        getRight().c*
        (
            rightTemp-
            initialRightTemp
        )
    );


    const q=
    Math.max(
        qLeft,
        qRight
    );


    document.getElementById(
        &quot;heatTransferred&quot;
    ).textContent=
    q.toFixed(1)+&quot; J&quot;;


    const direction=
    getDirection();


    const flowText=
    document.getElementById(
        &quot;flowText&quot;
    );


    const arrow=
    document.getElementById(
        &quot;flowArrow&quot;
    );


    arrow.classList.remove(
        &quot;active&quot;
    );


    if(
        direction===&quot;left-right&quot;
    ){

        flowText.textContent=
        &quot;🔥 HEAT: LEFT → RIGHT&quot;;

        arrow.textContent=&quot;→&quot;;

        arrow.classList.add(
            &quot;active&quot;
        );


        document.getElementById(
            &quot;direction&quot;
        ).textContent=

        &quot;🔥 The LEFT substance is hotter. Heat is transferred from LEFT → RIGHT.&quot;;


    }

    else if(
        direction===&quot;right-left&quot;
    ){

        flowText.textContent=
        &quot;🔥 HEAT: RIGHT → LEFT&quot;;

        arrow.textContent=&quot;←&quot;;

        arrow.classList.add(
            &quot;active&quot;
        );


        document.getElementById(
            &quot;direction&quot;
        ).textContent=

        &quot;🔥 The RIGHT substance is hotter. Heat is transferred from RIGHT → LEFT.&quot;;


    }

    else{

        flowText.textContent=
        &quot;⚖️ NO NET HEAT FLOW&quot;;

        arrow.textContent=&quot;•&quot;;


        document.getElementById(
            &quot;direction&quot;
        ).textContent=

        &quot;⚖️ Both substances have the same temperature. There is no net heat transfer.&quot;;

    }

}


/* =====================================================
   SUBSTANCE INFORMATION
===================================================== */

function updateSubstanceInfo(){

    const L=getLeft();
    const R=getRight();


    document.getElementById(
        &quot;leftInfo&quot;
    ).innerHTML=

    L.emoji+
    &quot; &lt;strong&gt;&quot;+
    L.name+
    &quot;&lt;/strong&gt;&lt;br&gt;&quot;+
    &quot;State: &quot;+
    capitalize(L.state)+
    &quot;&lt;br&gt;&quot;+
    &quot;Specific heat: &quot;+
    L.c+
    &quot; J/g°C&quot;;


    document.getElementById(
        &quot;rightInfo&quot;
    ).innerHTML=

    R.emoji+
    &quot; &lt;strong&gt;&quot;+
    R.name+
    &quot;&lt;/strong&gt;&lt;br&gt;&quot;+
    &quot;State: &quot;+
    capitalize(R.state)+
    &quot;&lt;br&gt;&quot;+
    &quot;Specific heat: &quot;+
    R.c+
    &quot; J/g°C&quot;;

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    if(!paused){

        updateParticles(
            leftParticles,
            getLeft(),
            125,
            380,
            leftTemp
        );


        updateParticles(
            rightParticles,
            getRight(),
            555,
            810,
            rightTemp
        );


        updateThermalTransfer();

        updateHeatParticles();

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawContainers();

    drawHeatParticles();


    leftParticles.forEach(
        p=&gt;
        drawParticle(
            p,
            temperatureColor(
                leftTemp
            )
        )
    );


    rightParticles.forEach(
        p=&gt;
        drawParticle(
            p,
            temperatureColor(
                rightTemp
            )
        )
    );


    updateInterface();


    requestAnimationFrame(
        animate
    );

}


animate();

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
