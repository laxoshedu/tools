  .nav-overlay-bar {

    -webkit-backdrop-filter: blur(16px);

    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;

  .nav-overlay-bar.hidden {
    display: none !important;
  }

    background: rgba(255, 255, 255, 0.08);

    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

  .nav-toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99989;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .nav-toggle-btn.visible {
    display: grid !important;

    color: #7bd1ff; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .rotate-icon-wrap {

    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;
    animation: phoneRotate 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;

  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff, #a7b3d8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {
    margin: 0; color: #94a3b8; font-size: 0.92rem; line-height: 1.5; font-weight: 450;
  }
  .btn-rotate {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, #65c9ff, #3b82f6);
    color: #061225; font-weight: 800; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>

function hexToRgb(hex) {
  let c = hex.replace(&#39;#&#39;, &#39;&#39;);
  if (c.length === 3) c = c.split(&#39;&#39;).map(x =&gt; x + x).join(&#39;&#39;);
  let num = parseInt(c, 16);
  return [num &gt;&gt; 16, (num &gt;&gt; 8) &amp; 255, num &amp; 255];
}

function rgbToHex(r, g, b) {
  return &#39;#&#39; + [r, g, b].map(x =&gt; Math.round(x).toString(16).padStart(2, &#39;0&#39;)).join(&#39;&#39;);
}

function blendHexColors(hex1, hex2, ratio) {
  let [r1, g1, b1] = hexToRgb(hex1);
  let [r2, g2, b2] = hexToRgb(hex2);
  let r = r1 + (r2 - r1) * ratio;
  let g = g1 + (g2 - g1) * ratio;
  let b = b1 + (b2 - b1) * ratio;
  return rgbToHex(r, g, b);
}

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;

  if (type === &#39;snap&#39;) {
    osc.type = &#39;sine&#39;;
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(750, now + 0.09);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
    osc.start(now); osc.stop(now + 0.09);
  } else if (type === &#39;pour&#39;) {
    osc.type = &#39;triangle&#39;;
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.linearRampToValueAtTime(450, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === &#39;click&#39;) {
    osc.type = &#39;triangle&#39;;
    osc.frequency.setValueAtTime(400, now);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
    osc.start(now); osc.stop(now + 0.05);
  } else if (type === &#39;drip&#39;) {
    osc.type = &#39;sine&#39;;
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === &#39;complete&#39;) {
    osc.type = &#39;sine&#39;;
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(554.37, now + 0.12);
    osc.frequency.setValueAtTime(659.25, now + 0.24);
    osc.frequency.setValueAtTime(880, now + 0.36);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
    osc.start(now); osc.stop(now + 0.6);
  }
}

function getSVGCoords(e) {
  const svg = document.getElementById(&#39;lab-svg&#39;);
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function startPinDrag(e, hoseId, pinId) {
  e.stopPropagation();
  activeDraggingPin = { hoseId, pinId };
}

function handleSVGMouseMove(e) {
  if (!activeDraggingPin) return;
  const coords = getSVGCoords(e);
  const hose = hoseState[activeDraggingPin.hoseId];
  const pin = hose[activeDraggingPin.pinId];
  pin.x = coords.x; pin.y = coords.y;
  pin.snappedTo = null;

  let closestPort = null;
  let minDist = 35;
  Object.values(PORTS).forEach(port =&gt; {
    const dist = Math.hypot(port.x - coords.x, port.y - coords.y);
    const targetNode = document.getElementById(`target-${port.id}`);
    if (targetNode) targetNode.classList.remove(&#39;port-highlight&#39;);
    if (dist &lt; minDist) { minDist = dist; closestPort = port; }
  });
  if (closestPort) {
    document.getElementById(`target-${closestPort.id}`).classList.add(&#39;port-highlight&#39;);
  }
  renderHoses();
}

function handleSVGMouseUp(e) {
  if (!activeDraggingPin) return;
  const hose = hoseState[activeDraggingPin.hoseId];
  const pin = hose[activeDraggingPin.pinId];
  const coords = getSVGCoords(e);

  let snappedPort = null;
  let minDist = 35;
  Object.values(PORTS).forEach(port =&gt; {
    const dist = Math.hypot(port.x - coords.x, port.y - coords.y);
    document.getElementById(`target-${port.id}`).classList.remove(&#39;port-highlight&#39;);
    if (dist &lt; minDist) { minDist = dist; snappedPort = port; }
  });

  if (snappedPort) {
    pin.x = snappedPort.x;
    pin.y = snappedPort.y;
    pin.snappedTo = snappedPort.id;
    playSound(&#39;snap&#39;);
    showToast(`Clip attached to ${snappedPort.name}!`);
  }
  activeDraggingPin = null;
  renderHoses();
  updateStepGuidance();
}

function renderHoses() {
  [&#39;hose1&#39;, &#39;hose2&#39;].forEach(hoseId =&gt; {
    const h = hoseState[hoseId];
    const p1 = h.p1;
    const p2 = h.p2;
    const pin1El = document.getElementById(`pin-${hoseId}-p1`);
    const pin2El = document.getElementById(`pin-${hoseId}-p2`);
    if (pin1El) pin1El.setAttribute(&#39;transform&#39;, `translate(${p1.x}, ${p1.y})`);
    if (pin2El) pin2El.setAttribute(&#39;transform&#39;, `translate(${p2.x}, ${p2.y})`);

    const midX = (p1.x + p2.x) / 2;
    const sag = Math.min(70, Math.abs(p1.x - p2.x) * 0.35);
    const midY = Math.max(p1.y, p2.y) + sag;
    const pathD = `M ${p1.x} ${p1.y} Q ${midX} ${midY} ${p2.x} ${p2.y}`;
    const bodyPath = document.getElementById(`${hoseId}-body`);
    const flowPath = document.getElementById(`${hoseId}-flow`);
    if (bodyPath) bodyPath.setAttribute(&#39;d&#39;, pathD);
    if (flowPath) flowPath.setAttribute(&#39;d&#39;, pathD);
  });
}

let currentDraggedPart = null;
function handleDragStart(e, partId) {
  if (completedTasks.has(partId)) { e.preventDefault(); return; }
  currentDraggedPart = partId;
  e.dataTransfer.setData(&#39;text/plain&#39;, partId);
}
function handleDragOver(e) { e.preventDefault(); }
function handleDrop(e) {
  e.preventDefault();
  const partId = e.dataTransfer.getData(&#39;text/plain&#39;) || currentDraggedPart;
  if (partId) handlePartSelect(partId);
}

function handlePartSelect(partId) {
  if (completedTasks.has(partId)) return;
  if (partId.startsWith(&#39;beaker&#39;)) {
    if (!completedTasks.has(&#39;flask&#39;)) {
      showToast(&quot;Place the Distillation Flask first!&quot;); return;
    }
    if (completedTasks.has(&#39;thermometer&#39;)) {
      showToast(&quot;Cannot pour! Flask is already sealed with stopper.&quot;); return;
    }
    let mixKey = &#39;salt_water&#39;;
    if (partId === &#39;beaker-ethanol&#39;) mixKey = &#39;ethanol_water&#39;;
    if (partId === &#39;beaker-acetone&#39;) mixKey = &#39;acetone_water&#39;;
    pourLiquid(mixKey);
    return;
  }
  if (partId === &#39;thermometer&#39; &amp;&amp; !completedTasks.has(&#39;beakerPoured&#39;)) {
    showToast(&quot;Pour a solution into the flask before sealing with stopper!&quot;); return;
  }
  if ((partId === &#39;hose1&#39; || partId === &#39;hose2&#39;) &amp;&amp; !completedTasks.has(&#39;condenser&#39;)) {
    showToast(&quot;Attach the Liebig Condenser first!&quot;); return;
  }
  snapPartIntoPlace(partId);
}

function snapPartIntoPlace(partId) {
  completedTasks.add(partId);
  const svgNode = document.getElementById(`node-${partId}`);

  const zoneNode = document.getElementById(`zone-${partId}`);
  if (zoneNode) zoneNode.style.display = &#39;none&#39;;

    partCard.classList.add(&#39;placed&#39;);
    partCard.setAttribute(&#39;draggable&#39;, &#39;false&#39;);
  }

  if (partId === &#39;condenser&#39;) {
    document.getElementById(&#39;target-PORT_COND_IN&#39;).style.display = &#39;block&#39;;
    document.getElementById(&#39;target-PORT_COND_OUT&#39;).style.display = &#39;block&#39;;
    document.getElementById(&#39;target-PORT_TAP&#39;).style.display = &#39;block&#39;;
    document.getElementById(&#39;target-PORT_SINK&#39;).style.display = &#39;block&#39;;
  }
  if (partId === &#39;hose1&#39;) {
    hoseState.hose1.p1 = { x: PORTS.PORT_TAP.x, y: PORTS.PORT_TAP.y, snappedTo: &#39;PORT_TAP&#39; };
    hoseState.hose1.p2 = { x: PORTS.PORT_COND_IN.x, y: PORTS.PORT_COND_IN.y, snappedTo: &#39;PORT_COND_IN&#39; };
    renderHoses();
  } else if (partId === &#39;hose2&#39;) {
    hoseState.hose2.p1 = { x: PORTS.PORT_COND_OUT.x, y: PORTS.PORT_COND_OUT.y, snappedTo: &#39;PORT_COND_OUT&#39; };
    hoseState.hose2.p2 = { x: PORTS.PORT_SINK.x, y: PORTS.PORT_SINK.y, snappedTo: &#39;PORT_SINK&#39; };
    renderHoses();
  }
  playSound(&#39;snap&#39;);
  showToast(`Attached ${getPartName(partId)}`);
  updateStepGuidance();
}

function pourLiquid(mixKey = &#39;salt_water&#39;) {
  if (completedTasks.has(&#39;beakerPoured&#39;)) return;

    flaskLiquidSurface.setAttribute(&#39;opacity&#39;, &#39;1&#39;);

    let splashInterval = setInterval(() =&gt; {
      if (splashContainer) {
        let px = 195 + Math.random() * 10;
        let py = 350 + Math.random() * 15;

      }

  }, 1800);

function isPlumbingCorrect() {
  const h1 = hoseState.hose1;
  const h2 = hoseState.hose2;
  const hose1Valid = (h1.p1.snappedTo === &#39;PORT_TAP&#39; &amp;&amp; h1.p2.snappedTo === &#39;PORT_COND_IN&#39;) || (h1.p2.snappedTo === &#39;PORT_TAP&#39; &amp;&amp; h1.p1.snappedTo === &#39;PORT_COND_IN&#39;);
  const hose2Valid = (h2.p1.snappedTo === &#39;PORT_COND_OUT&#39; &amp;&amp; h2.p2.snappedTo === &#39;PORT_SINK&#39;) || (h2.p2.snappedTo === &#39;PORT_COND_OUT&#39; &amp;&amp; h1.p1.snappedTo === &#39;PORT_SINK&#39;);
  const altHose1Valid = (h2.p1.snappedTo === &#39;PORT_TAP&#39; &amp;&amp; h2.p2.snappedTo === &#39;PORT_COND_IN&#39;) || (h2.p2.snappedTo === &#39;PORT_TAP&#39; &amp;&amp; h2.p1.snappedTo === &#39;PORT_COND_IN&#39;);
  const altHose2Valid = (h1.p1.snappedTo === &#39;PORT_COND_OUT&#39; &amp;&amp; h1.p2.snappedTo === &#39;PORT_SINK&#39;) || (h1.p2.snappedTo === &#39;PORT_COND_OUT&#39; &amp;&amp; h1.p1.snappedTo === &#39;PORT_SINK&#39;);
  return (hose1Valid &amp;&amp; hose2Valid) || (altHose1Valid &amp;&amp; altHose2Valid);
}

  const guideText = document.getElementById(&#39;guide-text&#39;);
  if (!completedTasks.has(&#39;stand&#39;) || !completedTasks.has(&#39;burner&#39;) || !completedTasks.has(&#39;flask&#39;)) {
    guideText.innerHTML = `&lt;strong&gt;Step 1:&lt;/strong&gt; Place the &lt;b&gt;Retort Stand&lt;/b&gt;, &lt;b&gt;Bunsen Burner&lt;/b&gt;, and &lt;b&gt;Distillation Flask&lt;/b&gt;.`;
  } else if (!completedTasks.has(&#39;beakerPoured&#39;)) {
    guideText.innerHTML = `&lt;strong&gt;Step 2:&lt;/strong&gt; Select and Pour any of the &lt;b&gt;3 Solution Beakers&lt;/b&gt; into the flask.`;

  if (!completedTasks.has(&#39;stand&#39;)) snapPartIntoPlace(&#39;stand&#39;);
  if (!completedTasks.has(&#39;burner&#39;)) snapPartIntoPlace(&#39;burner&#39;);
  if (!completedTasks.has(&#39;flask&#39;)) snapPartIntoPlace(&#39;flask&#39;);
  if (!completedTasks.has(&#39;beakerPoured&#39;)) pourLiquid(&#39;salt_water&#39;);
  setTimeout(() =&gt; {
    [&#39;thermometer&#39;, &#39;condenser&#39;, &#39;adapter&#39;, &#39;receiver&#39;, &#39;hose1&#39;, &#39;hose2&#39;].forEach(id =&gt; {
      if (!completedTasks.has(id)) snapPartIntoPlace(id);

}

let lastTime = performance.now();
let wavePhase = 0;
let hangingDropRadius = 0;
let activeFallingDrop = null;
let flameSparks = [];

function startSimulationLoop() {
  function loop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    if (isAssemblyComplete &amp;&amp; !isExperimentFinished) {
      updatePhysics(dt);
    }
    renderParticles(dt);
    animateWideFlame(now);
    updateGauges();
    animFrameId = requestAnimationFrame(loop);
  }
  animFrameId = requestAnimationFrame(loop);
}

// REALISTIC WIDE FLAME ANIMATION ENGINE
function animateWideFlame(time) {
  if (heatLevel === 0) return;

  const t = time * 0.005;
  
  // Base scales per heat level
  const levelMult = (heatLevel === 1) ? 0.65 : (heatLevel === 2) ? 0.9 : 1.25;
  const targetScaleY = levelMult;
  const targetScaleX = 0.85 + (heatLevel * 0.35); // Wide expansion!

  // Organic flickering math
  const flickerY = Math.sin(t * 7.5) * 0.06 + Math.cos(t * 13.2) * 0.04;
  const flickerX = Math.cos(t * 6.1) * 0.05 + Math.sin(t * 11.4) * 0.03;
  const tilt = Math.sin(t * 4.8) * 2.2; // Flame swaying angle

  const finalScaleY = targetScaleY + flickerY;
  const finalScaleX = targetScaleX + flickerX;

  const flameGroup = document.getElementById(&#39;flame-group&#39;);
  if (flameGroup) {
    flameGroup.setAttribute(&#39;transform&#39;, 
      `translate(200, 440) scale(${finalScaleX}, ${finalScaleY}) rotate(${tilt}) translate(-200, -440)`
    );
  }

  // Dynamic Ember Sparks rising from flame
  const sparksContainer = document.getElementById(&#39;flame-sparks&#39;);
  if (sparksContainer &amp;&amp; Math.random() &lt; (0.15 * heatLevel)) {
    flameSparks.push({
      x: 200 + (Math.random() * 40 - 20) * finalScaleX,
      y: 410,
      vx: (Math.random() - 0.5) * 25,
      vy: -(60 + Math.random() * 80),
      r: 1.0 + Math.random() * 2.0,
      alpha: 1.0
    });
  }

  let sparksHTML = &#39;&#39;;
  for (let i = flameSparks.length - 1; i &gt;= 0; i--) {
    let s = flameSparks[i];
    s.x += s.vx * 0.016;
    s.y += s.vy * 0.016;
    s.alpha -= 0.03;
    if (s.alpha &lt;= 0) {
      flameSparks.splice(i, 1);
    } else {
      sparksHTML += `&lt;circle cx=&quot;${s.x}&quot; cy=&quot;${s.y}&quot; r=&quot;${s.r}&quot; fill=&quot;#fef08a&quot; opacity=&quot;${s.alpha}&quot; /&gt;`;
    }
  }
  if (sparksContainer) sparksContainer.innerHTML = sparksHTML;
}

function updatePhysics(dt) {
  let maxHeatTemp = 25.0;
  if (heatLevel === 1) maxHeatTemp = 65.0;
  if (heatLevel === 2) maxHeatTemp = 88.0;
  if (heatLevel === 3) maxHeatTemp = 115.0;

  let targetTemp = maxHeatTemp;
  if (flaskWaterVolume &gt; (100.0 - selectedMixture.f1TargetVol) &amp;&amp; maxHeatTemp &gt;= selectedMixture.f1BoilTemp) {
    targetTemp = selectedMixture.f1BoilTemp;
  }

  const tempRate = 4.5 * heatLevel;
  if (currentTemp &lt; targetTemp) {
    currentTemp += tempRate * dt;
  } else if (currentTemp &gt; targetTemp) {
    currentTemp -= 1.8 * dt;
  }

  if (volumeCollected &gt;= selectedMixture.f1TargetVol) {
    triggerDistillationCompletion();
  }
}

function updateGauges() {
  const formattedTemp = `${currentTemp.toFixed(1)} °C`;
  document.getElementById(&#39;temp-readout&#39;).innerText = formattedTemp;
  document.getElementById(&#39;svg-temp-text&#39;).textContent = formattedTemp;

  const mercury = document.getElementById(&#39;mercury-column&#39;);
  if (mercury) {
    const minY = 210, maxY = 85;
    const clampedTemp = Math.min(105, Math.max(25, currentTemp));
    const targetY2 = minY - ((clampedTemp - 25) / 80) * (minY - maxY);
    mercury.setAttribute(&#39;y2&#39;, targetY2);
  }

  const liquidBody = document.getElementById(&#39;flask-liquid-body&#39;);
  const liquidSurface = document.getElementById(&#39;flask-liquid-surface&#39;);
  const saltCrystals = document.getElementById(&#39;salt-crystals-group&#39;);

  if (completedTasks.has(&#39;beakerPoured&#39;)) {
    const volRatio = flaskWaterVolume / 100.0;
    const surfaceY = 390 - (volRatio * 55);
    const halfWidth = Math.sqrt(Math.max(0, 55*55 - Math.pow(surfaceY - 335, 2)));

    wavePhase += 0.08;
    const waveOffset = Math.sin(wavePhase) * (heatLevel &gt; 0 ? 3 : 1);

    if (selectedMixture.isMisciblePair) {
      let progressRatio = Math.min(1.0, volumeCollected / selectedMixture.f1TargetVol);
      let currentFlaskColor1 = blendHexColors(selectedMixture.liquidColor1, WATER_BLUE_1, progressRatio);
      let currentFlaskColor2 = blendHexColors(selectedMixture.liquidColor2, WATER_BLUE_2, progressRatio);

      document.getElementById(&#39;liquid-stop-1&#39;).setAttribute(&#39;stop-color&#39;, currentFlaskColor1);
      document.getElementById(&#39;liquid-stop-2&#39;).setAttribute(&#39;stop-color&#39;, currentFlaskColor2);
    }

    liquidBody.setAttribute(&#39;d&#39;, `M ${200 - halfWidth} ${surfaceY} A 55 55 0 0 0 ${200 + halfWidth} ${surfaceY} Z`);
    liquidSurface.setAttribute(&#39;d&#39;, `M ${200 - halfWidth} ${surfaceY} Q 200 ${surfaceY + waveOffset} ${200 + halfWidth} ${surfaceY}`);

    if (!selectedMixture.isMisciblePair &amp;&amp; volumeCollected &gt; 10) {
      saltCrystals.setAttribute(&#39;opacity&#39;, Math.min(1.0, (volumeCollected - 10) / 70.0).toString());
    }
  }

  const liquidPath = document.getElementById(&#39;distilled-liquid&#39;);
  if (liquidPath) {
    const fillRatio = Math.min(1.0, volumeCollected / 100.0);
    const baseY = 525;
    const baseWidth = 120;
    const maxFillHeight = 85;
    const currentHeight = fillRatio * maxFillHeight;
    const surfaceY = baseY - currentHeight;
    const surfaceWidth = baseWidth - (fillRatio * 68);
    const leftX = 700 - (surfaceWidth / 2);
    const rightX = 700 + (surfaceWidth / 2);
    const meniscusCurveY = surfaceY + (fillRatio &gt; 0.05 ? 3 : 0);

    liquidPath.setAttribute(&#39;d&#39;,
      `M 640 ${baseY} L 760 ${baseY} L ${rightX} ${surfaceY} Q 700 ${meniscusCurveY} ${leftX} ${surfaceY} Z`
    );
  }

  document.getElementById(&#39;volume-readout&#39;).innerText = `${volumeCollected.toFixed(1)} mL`;
  const pct = Math.min(100, (volumeCollected / selectedMixture.f1TargetVol) * 100);
  document.getElementById(&#39;distill-progress-bar&#39;).style.width = `${pct}%`;

  if (completedTasks.has(&#39;beakerPoured&#39;)) {
    document.getElementById(&#39;res-f1-vol&#39;).textContent = `${volumeCollected.toFixed(1)} mL`;
    document.getElementById(&#39;res-f2-vol&#39;).textContent = `${flaskWaterVolume.toFixed(1)} mL`;
  }
}

let particles = { bubbles: [], steam: [], condenserDrops: [] };

function renderParticles(dt) {
  if (!isAssemblyComplete) return;

  const bubbleContainer = document.getElementById(&#39;boiling-bubbles&#39;);
  if (currentTemp &gt;= (selectedMixture.f1BoilTemp - 15) &amp;&amp; heatLevel &gt; 0 &amp;&amp; flaskWaterVolume &gt; (100.0 - selectedMixture.f1TargetVol) &amp;&amp; !isExperimentFinished) {
    if (Math.random() &lt; (currentTemp / 90)) {
      const volRatio = flaskWaterVolume / 100.0;
      const surfaceY = 390 - (volRatio * 55);
      particles.bubbles.push({
        x: 170 + Math.random() * 60,
        y: 380,
        maxY: surfaceY,
        r: 1.5 + Math.random() * 3.5,
        speed: 25 + Math.random() * 45
      });
    }
  }

  let bubbleHTML = &#39;&#39;;
  particles.bubbles.forEach((b, idx) =&gt; {
    b.y -= b.speed * dt;
    if (b.y &lt; b.maxY) particles.bubbles.splice(idx, 1);
    else bubbleHTML += `&lt;circle cx=&quot;${b.x}&quot; cy=&quot;${b.y}&quot; r=&quot;${b.r}&quot; fill=&quot;rgba(255,255,255,0.7)&quot; /&gt;`;
  });
  if (bubbleContainer) bubbleContainer.innerHTML = bubbleHTML;

  const steamContainer = document.getElementById(&#39;steam-particles&#39;);
  if (currentTemp &gt;= (selectedMixture.f1BoilTemp - 5) &amp;&amp; heatLevel &gt; 0 &amp;&amp; flaskWaterVolume &gt; (100.0 - selectedMixture.f1TargetVol) &amp;&amp; !isExperimentFinished) {
    if (Math.random() &lt; 0.6) {
      particles.steam.push({
        stage: &#39;neck&#39;,
        x: 200 + (Math.random() * 10 - 5),
        y: 310,
        r: 4 + Math.random() * 5,
        opacity: 0.65
      });
    }
  }

  let steamHTML = &#39;&#39;;
  particles.steam.forEach((s, idx) =&gt; {
    if (s.stage === &#39;neck&#39;) {
      s.y -= 40 * dt;
      if (s.y &lt; 220) { s.stage = &#39;arm&#39;; s.x = 210; s.y = 220; }
    } else if (s.stage === &#39;arm&#39;) {
      s.x += 60 * dt;
      s.y += 15 * dt;
      if (s.x &gt; 295) s.stage = &#39;condenser&#39;;
    } else if (s.stage === &#39;condenser&#39;) {
      s.x += 80 * dt;
      s.y += 20 * dt;
      if (tapOpen) {
        s.opacity -= 0.02;
        if (Math.random() &lt; 0.25) {
          particles.condenserDrops.push({ x: s.x, y: s.y + 4, r: 2 + Math.random() * 2 });
        }
      }
      if (s.x &gt; 630 || s.opacity &lt;= 0) {
        particles.steam.splice(idx, 1);
        return;
      }
    }
    steamHTML += `&lt;circle cx=&quot;${s.x}&quot; cy=&quot;${s.y}&quot; r=&quot;${s.r}&quot; fill=&quot;rgba(248,250,252,${s.opacity})&quot; /&gt;`;
  });
  if (steamContainer) steamContainer.innerHTML = steamHTML;

  const condenserDropContainer = document.getElementById(&#39;condenser-droplets&#39;);
  let dropHTML = &#39;&#39;;
  particles.condenserDrops.forEach((cd, idx) =&gt; {
    cd.x += 50 * dt;
    cd.y += 12.5 * dt;
    if (cd.x &gt; 635) {
      particles.condenserDrops.splice(idx, 1);
      hangingDropRadius = Math.min(4.5, hangingDropRadius + 0.8);
    } else {
      dropHTML += `&lt;circle cx=&quot;${cd.x}&quot; cy=&quot;${cd.y}&quot; r=&quot;${cd.r}&quot; fill=&quot;${selectedMixture.distillColor1}&quot; opacity=&quot;0.8&quot; /&gt;`;
    }
  });
  if (condenserDropContainer) condenserDropContainer.innerHTML = dropHTML;

  const hangingDrop = document.getElementById(&#39;hanging-drop&#39;);
  const fallingDropGroup = document.getElementById(&#39;falling-drop-group&#39;);

  if (hangingDropRadius &gt; 0) {
    hangingDrop.setAttribute(&#39;fill&#39;, selectedMixture.distillColor1);
    hangingDrop.setAttribute(&#39;rx&#39;, (hangingDropRadius * 0.8).toFixed(1));
    hangingDrop.setAttribute(&#39;ry&#39;, (hangingDropRadius * 1.2).toFixed(1));
  } else {
    hangingDrop.setAttribute(&#39;rx&#39;, &#39;0&#39;);
    hangingDrop.setAttribute(&#39;ry&#39;, &#39;0&#39;);
  }

  if (hangingDropRadius &gt;= 4.0 &amp;&amp; !activeFallingDrop) {
    hangingDropRadius = 0;
    activeFallingDrop = { x: 700, y: 418, vy: 140 };
  }

  if (activeFallingDrop) {
    activeFallingDrop.y += activeFallingDrop.vy * dt;
    activeFallingDrop.vy += 220 * dt;

    const fillRatio = Math.min(1.0, volumeCollected / 100.0);
    const targetSurfaceY = 525 - (fillRatio * 85);

    if (activeFallingDrop.y &gt;= targetSurfaceY) {
      playSound(&#39;drip&#39;);
      if (!isExperimentFinished) {
        const dropVol = 1.0;
        volumeCollected = Math.min(selectedMixture.f1TargetVol, volumeCollected + dropVol);
        flaskWaterVolume = Math.max(100.0 - selectedMixture.f1TargetVol, 100.0 - volumeCollected);
      }
      triggerSurfaceRipple(targetSurfaceY);
      activeFallingDrop = null;
      fallingDropGroup.innerHTML = &#39;&#39;;
    } else {
      fallingDropGroup.innerHTML = `&lt;ellipse cx=&quot;${activeFallingDrop.x}&quot; cy=&quot;${activeFallingDrop.y}&quot; rx=&quot;2.5&quot; ry=&quot;4.5&quot; fill=&quot;${selectedMixture.distillColor1}&quot; /&gt;`;
    }
  }
}

function triggerSurfaceRipple(y) {
  const ripple = document.getElementById(&#39;surface-ripple&#39;);
  if (!ripple) return;
  ripple.setAttribute(&#39;cy&#39;, y);
  ripple.setAttribute(&#39;rx&#39;, &#39;4&#39;);
  ripple.setAttribute(&#39;ry&#39;, &#39;1.5&#39;);
  ripple.setAttribute(&#39;opacity&#39;, &#39;0.9&#39;);

  let radius = 4;
  let opacity = 0.9;
  let rippleAnim = setInterval(() =&gt; {
    radius += 2.5;
    opacity -= 0.12;
    if (opacity &lt;= 0) {
      clearInterval(rippleAnim);
      ripple.setAttribute(&#39;opacity&#39;, &#39;0&#39;);
    } else {
      ripple.setAttribute(&#39;rx&#39;, radius.toString());
      ripple.setAttribute(&#39;ry&#39;, (radius * 0.35).toString());
      ripple.setAttribute(&#39;opacity&#39;, opacity.toString());
    }
  }, 30);
}

function showToast(msg, duration = 2500) {
  const toast = document.getElementById(&#39;toast-msg&#39;);
  toast.innerText = msg;
  toast.classList.add(&#39;show&#39;);
  setTimeout(() =&gt; toast.classList.remove(&#39;show&#39;), duration);
}

window.addEventListener(&#39;load&#39;, () =&gt; {
  renderHoses();
  updateStepGuidance();
  startSimulationLoop();
});
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1783;
  const STAGE_H = 1003;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
</html>
