            { z: 33, sym: &#39;As&#39;, val: 5, group: 15, period: 4, col: &#39;#ffaa22&#39;, type: &#39;metalloid&#39;, cT: -1, mass: 74.9 },
            { z: 34, sym: &#39;Se&#39;, val: 6, group: 16, period: 4, col: &#39;#ffff22&#39;, type: &#39;nonmetal&#39;, cT: -1, mass: 79.0 },
            { z: 35, sym: &#39;Br&#39;, val: 7, group: 17, period: 4, col: &#39;#88ff88&#39;, type: &#39;nonmetal&#39;, cT: -1, mass: 79.9 },

        ];

        // --- RENDER PERIODIC TABLE ---
        const ptGrid = document.getElementById(&#39;pt-grid&#39;);
        const groups = [1, 2, 13, 14, 15, 16, 17, 18];
        const periods = [1, 2, 3, 4];

        periods.forEach(p =&gt; {
            groups.forEach(g =&gt; {
                const el = ptElements.find(e =&gt; e.period === p &amp;&amp; e.group === g);
                if (el) {
                    const cell = document.createElement(&#39;div&#39;);
                    cell.className = &#39;pt-cell&#39;;
                    cell.onclick = () =&gt; spawnAtom(el);
                    cell.innerHTML = `&lt;div class=&quot;pt-num&quot;&gt;${el.z}&lt;/div&gt;&lt;div class=&quot;pt-sym&quot; style=&quot;color:${el.col}&quot;&gt;${el.sym}&lt;/div&gt;&lt;div class=&quot;pt-dot-container&quot;&gt;&lt;/div&gt;`;
                    renderTileLewisDots(cell.querySelector(&#39;.pt-dot-container&#39;), el.val);
                    ptGrid.appendChild(cell);
                } else {
                    const empty = document.createElement(&#39;div&#39;);
                    empty.className = &#39;pt-empty&#39;;
                    ptGrid.appendChild(empty);
                }
            });
        });

        function renderTileLewisDots(container, valency) {
            const topDots = valency &gt;= 5 ? 2 : (valency &gt;= 1 ? 1 : 0);
            const rightDots = valency &gt;= 6 ? 2 : (valency &gt;= 2 ? 1 : 0);
            const bottomDots = valency &gt;= 7 ? 2 : (valency &gt;= 3 ? 1 : 0);
            const leftDots = valency &gt;= 8 ? 2 : (valency &gt;= 4 ? 1 : 0);
            const positions = [{ pos: &#39;top&#39;, count: topDots }, { pos: &#39;right&#39;, count: rightDots }, { pos: &#39;bottom&#39;, count: bottomDots }, { pos: &#39;left&#39;, count: leftDots }];
            positions.forEach(p =&gt; {
                if (p.count &gt; 0) {
                    const group = document.createElement(&#39;div&#39;);
                    group.className = `pt-dot-group ${p.pos}`;
                    for (let i = 0; i &lt; p.count; i++) {
                        const dot = document.createElement(&#39;div&#39;);
                        dot.className = &#39;pt-dot&#39;;
                        group.appendChild(dot);
                    }
                    container.appendChild(group);
                }
            });
        }

        // --- CANVAS SETUP ---
        const canvas = document.getElementById(&#39;simCanvas&#39;);
        const ctx = canvas.getContext(&#39;2d&#39;);
        let width, height;
        function resize() { width = canvas.width = canvas.parentElement.clientWidth; height = canvas.height = canvas.parentElement.clientHeight; }
        window.addEventListener(&#39;resize&#39;, resize);
        window.addEventListener(&#39;orientationchange&#39;, resize);
        resize();

        let atoms = [], bonds = [], attractionBeams = [];
        let draggingAtom = null, dragOffsetX = 0, dragOffsetY = 0;
        let dragStartX = 0, dragStartY = 0;

        // Touch double tap tracking
        let lastTapTime = 0;
        let lastTapAtom = null;

        // --- MODE STATES ---
        let selectiveMode = false;
        let autoMoleculeMode = false;
        let isPaused = false; 
        let selectedDonor = null; 
        let currentMousePos = { x: 0, y: 0 };
        let hoveredSlot = null;

        const MAGNETIC_RADIUS = 150; 
        const SNAP_DISTANCE = 90; 

        class Atom {
            constructor(data, x, y) {
                this.id = Math.random().toString(36).substring(2, 9);
                this.sym = data.sym;
                this.val = data.val;
                this.col = data.col;
                this.type = data.type;
                this.cT = data.cT;
                this.mass = data.mass || 12.0;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.slotAngle = Math.random() * Math.PI * 2; 
                this.bondCooldown = 0; 
                
                // Animation smoothing targets
                this.renderBase = this.slotAngle;
                this.renderStep = 0;

                if (this.sym === &#39;H&#39; || this.sym === &#39;He&#39;) {
                    this.unpaired = this.val === 1 ? 1 : 0;
                } else {
                    this.unpaired = this.val &lt;= 4 ? this.val : 8 - this.val;
                }
            }

            get bonds() { return bonds.filter(b =&gt; b.a === this || b.b === this); }
            get remainingSlots() { return this.unpaired - this.bonds.length; }
            get lonePairs() {
                if (this.sym === &#39;H&#39; || this.sym === &#39;He&#39;) return this.val === 2 ? 1 : 0;
                return (this.val - this.unpaired) / 2;
            }

            get acceptorPower() {
                let base = this.type === &#39;nonmetal&#39; ? 20 : (this.type === &#39;metalloid&#39; ? 10 : 0);
                return base + this.val;
            }
        }

        // --- HELPER: MOLECULE MASS CALCULATION ---
        function getMoleculeAtoms(startAtom) {
            let mol = [], q = [startAtom], visited = new Set([startAtom]);
            while (q.length &gt; 0) {
                let curr = q.shift();
                mol.push(curr);
                curr.bonds.forEach(b =&gt; {
                    let neighbor = b.a === curr ? b.b : b.a;
                    if (!visited.has(neighbor)) { visited.add(neighbor); q.push(neighbor); }
                });
            }
            return mol;
        }

        function getMoleculeMass(atom) {
            const mol = getMoleculeAtoms(atom);
            return mol.reduce((sum, a) =&gt; sum + a.mass, 0);
        }

        // --- TOGGLE CONTROLLER ---
        function togglePause(enabled) {
            isPaused = enabled;
            updateModeUI();
        }

        function toggleSelectiveBonding(enabled) {
            selectiveMode = enabled;
            if (enabled) {
                autoMoleculeMode = false;
                document.getElementById(&#39;auto-toggle&#39;).checked = false;
            }
            updateModeUI();
        }

        function toggleAutoMolecule(enabled) {
            autoMoleculeMode = enabled;
            if (enabled) {
                selectiveMode = false;
                document.getElementById(&#39;selective-toggle&#39;).checked = false;
                selectedDonor = null;
            }
            updateModeUI();
        }

        function updateModeUI() {
            const banner = document.getElementById(&#39;mode-banner&#39;);
            const inst = document.getElementById(&#39;instructions-text&#39;);

                inst.innerHTML = `• &lt;span class=&quot;highlight&quot;&gt;Selective Mode Active:&lt;/span&gt; Tap an open donor electron slot on an atom, then tap an accepting slot on another atom.&lt;br&gt;• Automatic attraction &amp; auto-bonding are &lt;strong style=&quot;color:#ff4444;&quot;&gt;DISABLED&lt;/strong&gt;.&lt;br&gt;• Double-tap an atom to delete it.`;
            } else if (autoMoleculeMode) {
                banner.style.display = &#39;block&#39;;
                banner.innerText = &#39;AUTO-MOLECULE MODE: Dynamic Curved Navigation &amp; Molecular Mass Preference Active!&#39;;
                banner.style.borderColor = &#39;var(--accent-purple)&#39;;
                banner.style.color = &#39;#e1bee7&#39;;
                banner.style.background = &#39;rgba(171, 71, 188, 0.2)&#39;;
                inst.innerHTML = `• &lt;strong style=&quot;color:#e1bee7;&quot;&gt;Curved Navigation &amp; Mass Preference:&lt;/strong&gt;&lt;br&gt;` +
                    `1. Atoms navigate around blocking obstacles along &lt;span class=&quot;highlight&quot;&gt;flexibly curved paths&lt;/span&gt; without getting stuck.&lt;br&gt;` +
                    `2. Donors are attracted &lt;strong style=&quot;color:#00e5ff;&quot;&gt;faster to higher Molecular Mass targets&lt;/strong&gt;.&lt;br&gt;` +
                    `3. All molecules attract simultaneously according to local perception.`;
            } else {
                banner.style.display = &#39;none&#39;;
                selectedDonor = null;
                inst.innerHTML = `• &lt;strong&gt;Drag atoms near each other:&lt;/strong&gt; Watch the electrons and holes slowly rotate to lock perfectly into place.&lt;br&gt;• &lt;strong&gt;Double/Triple Bonds:&lt;/strong&gt; Watch the electrons literally &lt;span class=&quot;highlight&quot;&gt;slide around the atom&lt;/span&gt; to form the 2nd and 3rd bonds!&lt;br&gt;• &lt;strong&gt;Double-tap / Double-click&lt;/strong&gt; an atom on the canvas to delete it.`;
            }
        }

        function spawnAtom(data) {
            const padding = 60;
            const x = padding + Math.random() * (width - padding * 2);
            const y = padding + Math.random() * (height - padding * 2);
            atoms.push(new Atom(data, x, y));
        }

        function clearCanvas() { atoms = []; bonds = []; selectedDonor = null; }

        // --- SLOT HELPER FOR SELECTIVE BONDING ---
        function getAllAvailableSlots() {
            let slots = [];
            atoms.forEach(a =&gt; {
                if (a.remainingSlots &gt; 0) {
                    let totalSpots = a.lonePairs + a.remainingSlots;
                    let step = a.renderStep || ((Math.PI * 2) / (totalSpots || 1));
                    let base = a.renderBase;

                    for (let i = 0; i &lt; a.remainingSlots; i++) {
                        let spotIdx = a.lonePairs + i;
                        let ang = base + (spotIdx * step);
                        let sx = a.x + Math.cos(ang) * 35;
                        let sy = a.y + Math.sin(ang) * 35;
                        slots.push({ atom: a, slotIdx: i, x: sx, y: sy });
                    }
                }
            });
            return slots;
        }

        function findClosestSlot(mx, my, maxDist = 38) {
            const slots = getAllAvailableSlots();
            let closest = null, minD = maxDist;
            slots.forEach(s =&gt; {
                let d = Math.sqrt((mx - s.x)**2 + (my - s.y)**2);
                if (d &lt; minD) { minD = d; closest = s; }
            });
            return closest;
        }

        // --- UNIFIED TOUCH &amp; MOUSE POSITION HELPER ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches &amp;&amp; e.touches.length &gt; 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches &amp;&amp; e.changedTouches.length &gt; 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        // --- INPUT EVENT HANDLERS (TOUCH &amp; MOUSE) ---
        function handleStart(x, y) {
            dragStartX = x; dragStartY = y;
            currentMousePos = { x, y };

            let touchedAtom = null;
            for (let i = atoms.length - 1; i &gt;= 0; i--) {
                const a = atoms[i];
                if (Math.sqrt((x - a.x)**2 + (y - a.y)**2) &lt; 35) {
                    touchedAtom = a;
                    draggingAtom = a;
                    dragOffsetX = x - a.x;
                    dragOffsetY = y - a.y;
                    break;
                }
            }

            // Mobile Double Tap Detection
            const now = Date.now();
            if (touchedAtom &amp;&amp; lastTapAtom === touchedAtom &amp;&amp; (now - lastTapTime) &lt; 300) {
                bonds = bonds.filter(b =&gt; b.a !== touchedAtom &amp;&amp; b.b !== touchedAtom);
                if (selectedDonor &amp;&amp; selectedDonor.atom === touchedAtom) selectedDonor = null;
                atoms = atoms.filter(a =&gt; a !== touchedAtom);
                draggingAtom = null;
                lastTapAtom = null;
                return;
            }
            lastTapTime = now;
            lastTapAtom = touchedAtom;
        }

        function handleMove(x, y) {
            currentMousePos = { x, y };

            if (draggingAtom) {
                draggingAtom.x = x - dragOffsetX;
                draggingAtom.y = y - dragOffsetY;
                draggingAtom.vx = 0; draggingAtom.vy = 0;
            }

            if (selectiveMode) {
                hoveredSlot = findClosestSlot(x, y);
            }
        }

        function handleEnd(x, y) {
            const clickDist = Math.sqrt((x - dragStartX)**2 + (y - dragStartY)**2);

            if (clickDist &lt; 8 &amp;&amp; selectiveMode) {
                let clickedSlot = findClosestSlot(x, y);
                let clickedAtom = null;
                if (!clickedSlot) {
                    atoms.forEach(a =&gt; {
                        if (Math.sqrt((x - a.x)**2 + (y - a.y)**2) &lt; 35 &amp;&amp; a.remainingSlots &gt; 0) {
                            clickedAtom = a;
                        }
                    });
                }

                let targetAtom = clickedSlot ? clickedSlot.atom : clickedAtom;

                if (targetAtom) {
                    if (!selectedDonor) {
                        let slotToUse = clickedSlot || { atom: targetAtom, slotIdx: 0, x: targetAtom.x, y: targetAtom.y };
                        selectedDonor = slotToUse;
                    } else {
                        if (selectedDonor.atom === targetAtom) {
                            selectedDonor = null;
                        } else {
                            let a = selectedDonor.atom;
                            let b = targetAtom;

                            let sharedBonds = bonds.filter(bond =&gt; (bond.a === a &amp;&amp; bond.b === b) || (bond.a === b &amp;&amp; bond.b === a)).length;

                            if (a.remainingSlots &gt; 0 &amp;&amp; b.remainingSlots &gt; 0 &amp;&amp; sharedBonds &lt; 3) {
                                bonds.push({ a, b });
                                a.bondCooldown = 40;
                                b.bondCooldown = 40;
                            }
                            selectedDonor = null;
                        }
                    }
                } else {
                    selectedDonor = null;
                }
            }

            draggingAtom = null;
        }

        // --- MOUSE LISTENERS ---
        canvas.addEventListener(&#39;mousedown&#39;, (e) =&gt; { const p = getPos(e); handleStart(p.x, p.y); });
        canvas.addEventListener(&#39;mousemove&#39;, (e) =&gt; { const p = getPos(e); handleMove(p.x, p.y); });
        canvas.addEventListener(&#39;mouseup&#39;, (e) =&gt; { const p = getPos(e); handleEnd(p.x, p.y); });
        canvas.addEventListener(&#39;mouseleave&#39;, () =&gt; draggingAtom = null);

        // --- TOUCH LISTENERS (MOBILE SUPPORT) ---
        canvas.addEventListener(&#39;touchstart&#39;, (e) =&gt; {
            e.preventDefault();
            const p = getPos(e);
            handleStart(p.x, p.y);
        }, { passive: false });

        canvas.addEventListener(&#39;touchmove&#39;, (e) =&gt; {
            e.preventDefault();
            const p = getPos(e);
            handleMove(p.x, p.y);
        }, { passive: false });

        canvas.addEventListener(&#39;touchend&#39;, (e) =&gt; {
            e.preventDefault();
            const p = getPos(e);
            handleEnd(p.x, p.y);
        }, { passive: false });

        // --- PHYSICS, ROTATION, MASS ATTRACTION &amp; CURVED PATHFINDING ---
        function applyPhysics() {
            attractionBeams = []; 

            if (!isPaused) {
                atoms.forEach(a =&gt; { 
                    if (a !== draggingAtom) { a.vx *= 0.82; a.vy *= 0.82; } 
                    if (a.bondCooldown &gt; 0) a.bondCooldown--; 
                });
            }

            // Standard spring forces for already bonded atoms
            for (let i = 0; i &lt; atoms.length; i++) {
                for (let j = i + 1; j &lt; atoms.length; j++) {
                    const a = atoms[i];
                    const b = atoms[j];
                    let sharedBonds = bonds.filter(bond =&gt; (bond.a === a &amp;&amp; bond.b === b) || (bond.a === b &amp;&amp; bond.b === a)).length;
                    
                    if (sharedBonds &gt; 0) {
                        if (!isPaused) {
                            let dx = b.x - a.x;
                            let dy = b.y - a.y;
                            let dist = Math.sqrt(dx*dx + dy*dy) || 1;
                            const targetLength = 95 - (sharedBonds * 12); 
                            const force = (dist - targetLength) * 0.05;
                            if (a !== draggingAtom) { a.vx += (dx/dist)*force; a.vy += (dy/dist)*force; }
                            if (b !== draggingAtom) { b.vx -= (dx/dist)*force; b.vy -= (dy/dist)*force; }
                        }
                    } else {
                        if (!isPaused) {
                            let dx = b.x - a.x, dy = b.y - a.y;
                            let dist = Math.sqrt(dx*dx + dy*dy) || 1;
                            if (dist &lt; 75 &amp;&amp; a.remainingSlots === 0 &amp;&amp; b.remainingSlots === 0) {
                                const pushForce = (75 - dist) * 0.04;
                                if (a !== draggingAtom) { a.vx -= (dx/dist)*pushForce; a.vy -= (dy/dist)*pushForce; }
                                if (b !== draggingAtom) { b.vx += (dx/dist)*pushForce; b.vy += (dy/dist)*pushForce; }
                            }
                        }
                    }
                }
            }

            // --- AUTO-MOLECULE &amp; STANDARD ATTRACTION LOGIC ---
            if (!selectiveMode) {
                if (autoMoleculeMode) {
                    atoms.forEach(donor =&gt; {
                        if (donor.remainingSlots &lt;= 0 || donor === draggingAtom) return;

                        let bestTarget = null;
                        let bestScore = -Infinity;
                        let bestDist = 0;
                        let bestTargetMolMass = 0;

                        atoms.forEach(acceptor =&gt; {
                            if (acceptor === donor || acceptor.remainingSlots &lt;= 0) return;

                            let sharedBonds = bonds.filter(b =&gt; (b.a === donor &amp;&amp; b.b === acceptor) || (b.a === acceptor &amp;&amp; b.b === donor)).length;
                            if (sharedBonds &gt;= 3) return;

                            let targetMolMass = getMoleculeMass(acceptor);
                            let dx = acceptor.x - donor.x;
                            let dy = acceptor.y - donor.y;
                            let dist = Math.sqrt(dx * dx + dy * dy) || 1;

                            let score = (1 + targetMolMass * 0.08) / Math.pow(dist, 1.15);

                            if (score &gt; bestScore) {
                                bestScore = score;
                                bestTarget = acceptor;
                                bestDist = dist;
                                bestTargetMolMass = targetMolMass;
                            }
                        });

                        if (bestTarget) {
                            let acceptor = bestTarget;
                            let dist = bestDist;
                            let dx = acceptor.x - donor.x;
                            let dy = acceptor.y - donor.y;
                            let dirX = dx / dist;
                            let dirY = dy / dist;

                            if (!isPaused) {
                                if (donor.bonds.length === 0) {
                                    let tA = donor.lonePairs + donor.remainingSlots;
                                    let stepA = (Math.PI * 2) / (tA || 1);
                                    let angleToB = Math.atan2(dy, dx);
                                    let diffA = (angleToB - ((tA - 1) * stepA)) - donor.slotAngle;
                                    while (diffA &lt; -Math.PI) diffA += 2 * Math.PI;
                                    while (diffA &gt; Math.PI) diffA -= 2 * Math.PI;
                                    donor.slotAngle += diffA * 0.12;
                                }
                            }

                            let perpX = -dirY;
                            let perpY = dirX;

                            let steerX = 0;
                            let steerY = 0;
                            let avoidRadius = 85;
                            let donorMol = getMoleculeAtoms(donor);
                            let acceptorMol = getMoleculeAtoms(acceptor);

                            atoms.forEach(obs =&gt; {
                                if (!donorMol.includes(obs) &amp;&amp; !acceptorMol.includes(obs)) {
                                    let vox = obs.x - donor.x;
                                    let voy = obs.y - donor.y;
                                    let proj = vox * dirX + voy * dirY;

                                    if (proj &gt; 25 &amp;&amp; proj &lt; dist - 35) {
                                        let perpDist = vox * perpX + voy * perpY;
                                        if (Math.abs(perpDist) &lt; avoidRadius) {
                                            let detourSide = perpDist &gt;= 0 ? -1 : 1;
                                            let mag = (avoidRadius - Math.abs(perpDist)) / avoidRadius;
                                            steerX += perpX * detourSide * mag * 0.35;
                                            steerY += perpY * detourSide * mag * 0.35;
                                        }
                                    }
                                }
                            });

                            if (!isPaused) {
                                let massSpeedMultiplier = 1 + (bestTargetMolMass * 0.022);
                                let basePull = 0.05 * massSpeedMultiplier;

                                donor.vx += (dirX * basePull) + steerX;
                                donor.vy += (dirY * basePull) + steerY;
                            }

                            let ctrlX = (donor.x + acceptor.x) / 2 + steerX * 160;
                            let ctrlY = (donor.y + acceptor.y) / 2 + steerY * 160;

                            attractionBeams.push({
                                x1: donor.x, y1: donor.y,
                                x2: acceptor.x, y2: acceptor.y,
                                ctrlX: ctrlX, ctrlY: ctrlY,
                                isCurved: Math.abs(steerX) &gt; 0.01 || Math.abs(steerY) &gt; 0.01,
                                dist: dist
                            });

                            if (!isPaused) {
                                if (dist &lt; SNAP_DISTANCE &amp;&amp; donor.bondCooldown &lt;= 0 &amp;&amp; acceptor.bondCooldown &lt;= 0) {
                                    bonds.push({ a: donor, b: acceptor });
                                    donor.bondCooldown = 85;
                                    acceptor.bondCooldown = 85;
                                }
                            }
                        }
                    });
                } else {
                    for (let i = 0; i &lt; atoms.length; i++) {
                        for (let j = i + 1; j &lt; atoms.length; j++) {
                            const a = atoms[i];
                            const b = atoms[j];
                            let dx = b.x - a.x;
                            let dy = b.y - a.y;
                            let dist = Math.sqrt(dx*dx + dy*dy) || 1;

                            let sharedBonds = bonds.filter(bond =&gt; (bond.a === a &amp;&amp; bond.b === b) || (bond.a === b &amp;&amp; bond.b === a)).length;
                            let canBondMore = a.remainingSlots &gt; 0 &amp;&amp; b.remainingSlots &gt; 0 &amp;&amp; sharedBonds &lt; 3;

                            if (canBondMore &amp;&amp; dist &lt; MAGNETIC_RADIUS) {
                                attractionBeams.push({ x1: a.x, y1: a.y, x2: b.x, y2: b.y, dist: dist, isCurved: false });

                                if (!isPaused) {
                                    const angleToB = Math.atan2(dy, dx);
                                    const angleToA = Math.atan2(-dy, -dx);

                                    if (a.bonds.length === 0) {
                                        let tA = a.lonePairs + a.remainingSlots;
                                        let stepA = (Math.PI * 2) / (tA || 1);
                                        let diffA = (angleToB - ((tA - 1) * stepA)) - a.slotAngle;
                                        while (diffA &lt; -Math.PI) diffA += 2 * Math.PI;
                                        while (diffA &gt; Math.PI) diffA -= 2 * Math.PI;
                                        a.slotAngle += diffA * 0.12;
                                    }
                                    if (b.bonds.length === 0) {
                                        let tB = b.lonePairs + b.remainingSlots;
                                        let stepB = (Math.PI * 2) / (tB || 1);
                                        let diffB = (angleToA - ((tB - 1) * stepB)) - b.slotAngle;
                                        while (diffB &lt; -Math.PI) diffB += 2 * Math.PI;
                                        while (diffB &gt; Math.PI) diffB -= 2 * Math.PI;
                                        b.slotAngle += diffB * 0.12;
                                    }

                                    const pullForce = 0.07;
                                    if (a !== draggingAtom) { a.vx += (dx/dist)*pullForce; a.vy += (dy/dist)*pullForce; }
                                    if (b !== draggingAtom) { b.vx -= (dx/dist)*pullForce; b.vy -= (dy/dist)*pullForce; }

                                    if (dist &lt; SNAP_DISTANCE &amp;&amp; a.bondCooldown &lt;= 0 &amp;&amp; b.bondCooldown &lt;= 0) {
                                        bonds.push({ a, b });
                                        a.bondCooldown = 85; 
                                        b.bondCooldown = 85;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            if (!isPaused) {
                atoms.forEach(a =&gt; {
                    if (a !== draggingAtom) {
                        a.x += a.vx; a.y += a.vy;
                        if (a.x &lt; 35) a.x = 35; if (a.x &gt; width - 35) a.x = width - 35;
                        if (a.y &lt; 35) a.y = 35; if (a.y &gt; height - 35) a.y = height - 35;
                    }
                });
            }
        }

        // --- FORMULA GENERATOR ---
        function getMolecules() {
            let visited = new Set(), molecules = [];
            atoms.forEach(start =&gt; {
                if (!visited.has(start)) {
                    let comp = getMoleculeAtoms(start);
                    comp.forEach(a =&gt; visited.add(a));
                    molecules.push(comp);
                }
            });
            return molecules;
        }

        function toSubscript(num) {
            const subs = {&#39;0&#39;:&#39;₀&#39;,&#39;1&#39;:&#39;₁&#39;,&#39;2&#39;:&#39;₂&#39;,&#39;3&#39;:&#39;₃&#39;,&#39;4&#39;:&#39;₄&#39;,&#39;5&#39;:&#39;₅&#39;,&#39;6&#39;:&#39;₆&#39;,&#39;7&#39;:&#39;₇&#39;,&#39;8&#39;:&#39;₈&#39;,&#39;9&#39;:&#39;₉&#39;};
            return num.toString().split(&#39;&#39;).map(c =&gt; subs[c] || c).join(&#39;&#39;);
        }

        function getChemicalFormula(atomGroup) {
            const counts = {}, typeMap = {};
            let netCharge = 0;

            atomGroup.forEach(a =&gt; { 
                counts[a.sym] = (counts[a.sym] || 0) + 1;
                typeMap[a.sym] = a.type;
                netCharge += (a.remainingSlots * a.cT); 
            });

            const elements = Object.keys(counts);
            elements.sort((a, b) =&gt; {
                const typeOrder = { &#39;metal&#39;: 1, &#39;metalloid&#39;: 2, &#39;nonmetal&#39;: 3 };
                const orderA = typeOrder[typeMap[a]] || 3;
                const orderB = typeOrder[typeMap[b]] || 3;

                if (orderA !== orderB) return orderA - orderB; 
                if (typeMap[a] === &#39;nonmetal&#39; &amp;&amp; typeMap[b] === &#39;nonmetal&#39;) {
                    if (counts[&#39;C&#39;]) {
                        if (a === &#39;C&#39;) return -1; if (b === &#39;C&#39;) return 1;
                        if (a === &#39;H&#39;) return -1; if (b === &#39;H&#39;) return 1;
                    }
                }
                return a.localeCompare(b);
            });

            let formula = &#39;&#39;;
            elements.forEach(sym =&gt; { formula += sym + (counts[sym] &gt; 1 ? toSubscript(counts[sym]) : &#39;&#39;); });

            if (netCharge !== 0) {
                const sign = netCharge &gt; 0 ? &#39;⁺&#39; : &#39;⁻&#39;;
                const abs = Math.abs(netCharge);
                const sups = {&#39;0&#39;:&#39;⁰&#39;,&#39;1&#39;:&#39;¹&#39;,&#39;2&#39;:&#39;²&#39;,&#39;3&#39;:&#39;³&#39;,&#39;4&#39;:&#39;⁴&#39;,&#39;5&#39;:&#39;⁵&#39;,&#39;6&#39;:&#39;⁶&#39;,&#39;7&#39;:&#39;⁷&#39;,&#39;8&#39;:&#39;⁸&#39;,&#39;9&#39;:&#39;⁹&#39;};
                let supNum = (abs === 1 ? &#39;&#39; : abs.toString()).split(&#39;&#39;).map(c =&gt; sups[c] || c).join(&#39;&#39;);
                formula = `[${formula}]${supNum}${sign}`;
            }

            return { formula, isStable: netCharge === 0 &amp;&amp; atomGroup.every(a =&gt; a.remainingSlots === 0) };
        }

        // --- RENDER LOOP ---
        function render() {
            ctx.clearRect(0, 0, width, height);

            // 0. Attraction Beams
            if (!selectiveMode) {
                attractionBeams.forEach(beam =&gt; {
                    let alpha = autoMoleculeMode ? 0.45 : (1 - beam.dist / MAGNETIC_RADIUS) * 0.8;
                    ctx.strokeStyle = autoMoleculeMode ? `rgba(171, 71, 188, ${alpha})` : `rgba(0, 229, 255, ${alpha})`;
                    ctx.lineWidth = autoMoleculeMode ? 2.5 : 3; 
                    ctx.setLineDash([6, 6]);
                    
                    ctx.beginPath(); 
                    ctx.moveTo(beam.x1, beam.y1);
                    if (beam.isCurved) {
                        ctx.quadraticCurveTo(beam.ctrlX, beam.ctrlY, beam.x2, beam.y2);
                    } else {
                        ctx.lineTo(beam.x2, beam.y2);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]); 
                });
            }

            // 1. Bonds
            let bondGroups = {};
            bonds.forEach(b =&gt; {
                let key = b.a.id &lt; b.b.id ? b.a.id + &#39;_&#39; + b.b.id : b.b.id + &#39;_&#39; + b.a.id;
                if (!bondGroups[key]) bondGroups[key] = { a: b.a, b: b.b, count: 0 };
                bondGroups[key].count++;
            });

            Object.values(bondGroups).forEach(group =&gt; {
                const { a, b, count } = group;
                const dx = b.x - a.x, dy = b.y - a.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const nx = dx/dist, ny = dy/dist, px = -ny, py = nx;       

                const offsets = count === 1 ? [0] : (count === 2 ? [-9, 9] : [-14, 0, 14]);

                offsets.forEach(offset =&gt; {
                    let sX = a.x + px*offset, sY = a.y + py*offset;
                    let eX = b.x + px*offset, eY = b.y + py*offset;

                    ctx.strokeStyle = &#39;rgba(255, 255, 255, 0.25)&#39;; ctx.lineWidth = 6;
                    ctx.beginPath(); ctx.moveTo(sX, sY); ctx.lineTo(eX, eY); ctx.stroke();

                    const mx = sX + (eX - sX)/2, my = sY + (eY - sY)/2;
                    ctx.fillStyle = a.col; ctx.beginPath(); ctx.arc(mx + px*5, my + py*5, 4.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(mx - px*5, my - py*5, 4.5, 0, Math.PI*2); ctx.fill();
                });
            });

            // 2. Atoms &amp; SMOOTH ELECTRON ANIMATION
            atoms.forEach(a =&gt; {
                let targetBase = a.slotAngle;
                let totalSpots = a.lonePairs + a.remainingSlots;
                let targetStep = (Math.PI * 2) / (totalSpots || 1);

                if (a.bonds.length &gt; 0) {
                    let vecX = 0, vecY = 0;
                    a.bonds.forEach(b =&gt; {
                        let other = (b.a === a) ? b.b : b.a;
                        vecX += (other.x - a.x); vecY += (other.y - a.y);
                    });
                    let oppAngle = Math.atan2(vecY, vecX) + Math.PI; 
                    if (totalSpots &gt; 1) targetStep = Math.PI / totalSpots;

                    let normalBase = oppAngle - (targetStep * (totalSpots - 1)) / 2;
                    targetBase = normalBase;

                    let multiPartner = null;
                    for (let b of a.bonds) {
                        let p = b.a === a ? b.b : b.a;
                        let shBonds = bonds.filter(x =&gt; (x.a===a &amp;&amp; x.b===p) || (x.a===p &amp;&amp; x.b===a)).length;
                        if (shBonds &lt; 3 &amp;&amp; a.remainingSlots &gt; 0 &amp;&amp; p.remainingSlots &gt; 0) { multiPartner = p; break; }
                    }

                    if (multiPartner) {
                        let angleToPartner = Math.atan2(multiPartner.y - a.y, multiPartner.x - a.x);
                        let sweptBase = angleToPartner - (totalSpots - 1) * targetStep;
                        
                        let sweepFactor = 1 - (a.bondCooldown / 85); 
                        sweepFactor = Math.max(0, Math.min(1, sweepFactor));

                        let diff = sweptBase - normalBase;
                        while(diff &lt; -Math.PI) diff += 2*Math.PI; while(diff &gt; Math.PI) diff -= 2*Math.PI;
                        targetBase = normalBase + diff * sweepFactor;
                    }
                }

                if (!isPaused) {
                    let dBase = targetBase - a.renderBase;
                    while(dBase &lt; -Math.PI) dBase += 2*Math.PI; while(dBase &gt; Math.PI) dBase -= 2*Math.PI;
                    a.renderBase += dBase * 0.15;
                    a.renderStep += (targetStep - a.renderStep) * 0.15;
                }

                // Draw Atom Body
                ctx.beginPath(); ctx.arc(a.x, a.y, 25, 0, Math.PI * 2);
                ctx.fillStyle = a.col; ctx.fill();
                ctx.strokeStyle = &#39;#000&#39;; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = &#39;#000&#39;; ctx.font = &#39;bold 17px Arial&#39;;
                ctx.textAlign = &#39;center&#39;; ctx.textBaseline = &#39;middle&#39;; ctx.fillText(a.sym, a.x, a.y);

                let currentSpot = 0;

                // Draw Lone Pairs
                for (let i = 0; i &lt; a.lonePairs; i++) {
                    const ang = a.renderBase + (currentSpot * a.renderStep);
                    const ex = a.x + Math.cos(ang) * 35, ey = a.y + Math.sin(ang) * 35;
                    const px = Math.cos(ang + Math.PI/2) * 4.5, py = Math.sin(ang + Math.PI/2) * 4.5;
                    ctx.fillStyle = &#39;#fff&#39;;
                    ctx.beginPath(); ctx.arc(ex + px, ey + py, 3.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(ex - px, ey - py, 3.5, 0, Math.PI*2); ctx.fill();
                    currentSpot++;
                }

                // Draw Remaining Slots
                for (let i = 0; i &lt; a.remainingSlots; i++) {
                    const ang = a.renderBase + (currentSpot * a.renderStep);
                    const ex = a.x + Math.cos(ang) * 35, ey = a.y + Math.sin(ang) * 35;
                    const px = Math.cos(ang + Math.PI/2) * 4.5, py = Math.sin(ang + Math.PI/2) * 4.5;
                    
                    ctx.fillStyle = &#39;#fff&#39;;
                    ctx.beginPath(); ctx.arc(ex + px, ey + py, 3.5, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = &#39;#ffeb3b&#39;; ctx.setLineDash([2, 2]); ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(ex - px, ey - py, 4.5, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
                    currentSpot++;
                }
            });

            // 3. Selective Bonding Mode Visual Highlights
            if (selectiveMode) {
                const slots = getAllAvailableSlots();

                slots.forEach(s =&gt; {
                    ctx.strokeStyle = &#39;rgba(255, 235, 59, 0.5)&#39;;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, 8, 0, Math.PI * 2);
                    ctx.stroke();
                });

                if (hoveredSlot) {
                    ctx.strokeStyle = &#39;#00e5ff&#39;;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(hoveredSlot.x, hoveredSlot.y, 11, 0, Math.PI * 2);
                    ctx.stroke();
                }

                if (selectedDonor) {
                    let donorAtom = selectedDonor.atom;
                    let donorX = selectedDonor.x, donorY = selectedDonor.y;
                    
                    let totalSpots = donorAtom.lonePairs + donorAtom.remainingSlots;
                    let step = donorAtom.renderStep || ((Math.PI * 2) / (totalSpots || 1));
                    let spotIdx = donorAtom.lonePairs + Math.min(selectedDonor.slotIdx, donorAtom.remainingSlots - 1);
                    let ang = donorAtom.renderBase + (spotIdx * step);
                    donorX = donorAtom.x + Math.cos(ang) * 35;
                    donorY = donorAtom.y + Math.sin(ang) * 35;

                    ctx.strokeStyle = &#39;#ffeb3b&#39;;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(donorX, donorY);
                    ctx.lineTo(currentMousePos.x, currentMousePos.y);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.fillStyle = &#39;rgba(255, 235, 59, 0.3)&#39;;
                    ctx.beginPath();
                    ctx.arc(donorX, donorY, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = &#39;#ffeb3b&#39;;
                    ctx.stroke();
                }
            }

            // 4. Chemical Formula Labels
            getMolecules().forEach(mol =&gt; {
                let cx = 0, minY = height;
                mol.forEach(a =&gt; { cx += a.x; if (a.y &lt; minY) minY = a.y; });
                cx /= mol.length;
                const { formula, isStable } = getChemicalFormula(mol);
                const labelY = Math.max(35, minY - 60);

                ctx.font = &#39;bold 22px sans-serif&#39;; ctx.textAlign = &#39;center&#39;;
                const tW = ctx.measureText(formula).width;
                ctx.fillStyle = &#39;rgba(0, 0, 0, 0.6)&#39;;
                ctx.beginPath(); ctx.roundRect(cx - (tW/2) - 10, labelY - 22, tW + 20, 30, 8); ctx.fill();
                ctx.fillStyle = isStable ? &#39;#00ff88&#39; : &#39;#ffea00&#39;;
                ctx.fillText(formula, cx, labelY);
            });
        }

        function loop() { applyPhysics(); render(); requestAnimationFrame(loop); }
        loop();
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
