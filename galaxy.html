<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<title>galaxy</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100dvh; margin: 0; padding: 0;
    overflow: hidden; background: #070b14;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  #viewportContainer {
    position: fixed; inset: 0; width: 100%; height: 100dvh;
    overflow: hidden; background: #070b14;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  #appStage {
    width: 1280px;
    height: 720px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform-style: flat;
  }

  #appStage iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  /* FLOATING MOBILE NAVIGATION, PAN & ZOOM BAR */
  .nav-overlay-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99990;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;
    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

  /* UNHIDE TRIGGER BUTTON */
  .nav-toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99989;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #7bd1ff; font-size: 0.9rem;
    display: none; place-items: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .nav-toggle-btn.visible {
    display: grid !important;
  }

  /* HIGH-END PROFESSIONAL ROTATE OVERLAY */
  .rotate-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }
  .rotate-card {
    width: min(440px, 90vw); padding: 36px 28px; border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .rotate-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    background: rgba(123, 209, 255, 0.12); border: 1px solid rgba(123, 209, 255, 0.3);
    color: #7bd1ff; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .rotate-icon-wrap {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;
    animation: phoneRotate 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff, #a7b3d8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {
    margin: 0; color: #94a3b8; font-size: 0.92rem; line-height: 1.5; font-weight: 450;
  }
  .btn-rotate {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, #65c9ff, #3b82f6);
    color: #061225; font-weight: 800; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>
</head>

    &lt;script&gt;
        // --- 1. SCENE SETUP ---
        const container = document.getElementById(&#39;canvas-container&#39;);
        const labelsContainer = document.getElementById(&#39;labels-container&#39;);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 15000);
        camera.position.set(0, 800, 1600);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.maxDistance = 5000; controls.minDistance = 2;

        scene.add(new THREE.AmbientLight(0x404050, 0.8));

        // --- 2. TEXTURES ---
        function createStarTexture(colorHex) {
            const canvas = document.createElement(&#39;canvas&#39;); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext(&#39;2d&#39;);
            const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, &#39;#ffffff&#39;); grad.addColorStop(0.2, colorHex); grad.addColorStop(1, &#39;rgba(0,0,0,0)&#39;);
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        function createPlanetTexture(baseColor, stripeColor) {
            const canvas = document.createElement(&#39;canvas&#39;); canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext(&#39;2d&#39;);
            ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 256, 128);
            ctx.fillStyle = stripeColor;
            for (let i = 0; i &lt; 15; i++) ctx.fillRect(0, Math.random() * 128, 256, Math.random() * 10 + 2);
            return new THREE.CanvasTexture(canvas);
        }

        // --- 3. STARS BACKGROUND ---
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(8000 * 3);
        for (let i = 0; i &lt; 8000 * 3; i++) starPositions[i] = (Math.random() - 0.5) * 8000;
        starGeo.setAttribute(&#39;position&#39;, new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 })));

        // --- 4. DATA (Planets, Moons, &amp; Asteroid Belts) ---
        const systemsData = [
            {
                id: &quot;Sol&quot;, position: { x: 0, y: 0, z: 0 },
                star: { name: &quot;Sun&quot;, radius: 18, color: &quot;#ffaa00&quot;, type: &quot;Yellow Dwarf Star&quot;, year: &quot;Galactic: 230M Yrs&quot;, day: &quot;27 Earth Days&quot;, moons: &quot;8 Planets&quot;, desc: &quot;The heart of our solar system.&quot; },
                belts: [

                ],
                planets: [
                    { id: &quot;Sol_Mercury&quot;, orbitNum: 1, name: &quot;Mercury&quot;, radius: 1.5, distance: 40, orbitSpeed: 0.04, daySpeed: 0.001, color: &quot;#999&quot;, stripe: &quot;#666&quot;, type: &quot;Terrestrial&quot;, year: &quot;88 Earth Days&quot;, day: &quot;59 Earth Days&quot;, moons: &quot;0&quot;, desc: &quot;Smallest planet, nearest to the Sun.&quot; },
                    { id: &quot;Sol_Venus&quot;, orbitNum: 2, name: &quot;Venus&quot;, radius: 2.5, distance: 65, orbitSpeed: 0.015, daySpeed: -0.002, color: &quot;#e3bb76&quot;, stripe: &quot;#c29b53&quot;, type: &quot;Terrestrial&quot;, year: &quot;225 Earth Days&quot;, day: &quot;243 Earth Days&quot;, moons: &quot;0&quot;, desc: &quot;Spins backwards; the hottest planet.&quot; },
                    { id: &quot;Sol_Earth&quot;, orbitNum: 3, name: &quot;Earth&quot;, radius: 2.8, distance: 90, orbitSpeed: 0.01, daySpeed: 0.02, color: &quot;#2233ff&quot;, stripe: &quot;#22aa55&quot;, type: &quot;Terrestrial&quot;, year: &quot;365.25 Days&quot;, day: &quot;24 Hours&quot;, moons: &quot;1 (The Moon)&quot;, desc: &quot;Our home planet.&quot;, 
                      satellites: [{ name: &quot;Luna (Moon)&quot;, radius: 0.6, distance: 6, speed: 0.05, color: &quot;#cccccc&quot; }] },
                    { id: &quot;Sol_Mars&quot;, orbitNum: 4, name: &quot;Mars&quot;, radius: 2.0, distance: 120, orbitSpeed: 0.008, daySpeed: 0.019, color: &quot;#c1440e&quot;, stripe: &quot;#8a2e07&quot;, type: &quot;Terrestrial&quot;, year: &quot;687 Earth Days&quot;, day: &quot;24.6 Hours&quot;, moons: &quot;2 (Phobos, Deimos)&quot;, desc: &quot;A dusty, cold, desert world.&quot;,
                      satellites: [{ name: &quot;Phobos&quot;, radius: 0.3, distance: 4, speed: 0.06, color: &quot;#998877&quot; }, { name: &quot;Deimos&quot;, radius: 0.2, distance: 6, speed: 0.04, color: &quot;#887766&quot; }] },
                    { id: &quot;Sol_Jupiter&quot;, orbitNum: 5, name: &quot;Jupiter&quot;, radius: 8.0, distance: 180, orbitSpeed: 0.003, daySpeed: 0.04, color: &quot;#b07f35&quot;, stripe: &quot;#5e3e14&quot;, type: &quot;Gas Giant&quot;, year: &quot;12 Earth Years&quot;, day: &quot;9.9 Hours&quot;, moons: &quot;95 Known&quot;, desc: &quot;Twice as massive as all other planets combined.&quot;,
                      satellites: [{ name: &quot;Io&quot;, radius: 0.7, distance: 11, speed: 0.04, color: &quot;#ffffaa&quot; }, { name: &quot;Europa&quot;, radius: 0.6, distance: 13, speed: 0.03, color: &quot;#ffffff&quot; }, { name: &quot;Ganymede&quot;, radius: 0.9, distance: 16, speed: 0.02, color: &quot;#aaaaaa&quot; }, { name: &quot;Callisto&quot;, radius: 0.8, distance: 19, speed: 0.015, color: &quot;#888888&quot; }] },
                    { id: &quot;Sol_Saturn&quot;, orbitNum: 6, name: &quot;Saturn&quot;, radius: 6.5, distance: 240, orbitSpeed: 0.002, daySpeed: 0.038, color: &quot;#e2bf7d&quot;, stripe: &quot;#b59353&quot;, type: &quot;Gas Giant&quot;, year: &quot;29.5 Earth Years&quot;, day: &quot;10.7 Hours&quot;, moons: &quot;146 Known&quot;, desc: &quot;Adorned with a dazzling system of icy rings.&quot;,
                      satellites: [{ name: &quot;Titan&quot;, radius: 1.0, distance: 14, speed: 0.03, color: &quot;#ffcc66&quot; }, { name: &quot;Rhea&quot;, radius: 0.5, distance: 11, speed: 0.04, color: &quot;#dddddd&quot; }] },
                    { id: &quot;Sol_Uranus&quot;, orbitNum: 7, name: &quot;Uranus&quot;, radius: 4.5, distance: 290, orbitSpeed: 0.001, daySpeed: 0.025, color: &quot;#4b70dd&quot;, stripe: &quot;#2b4080&quot;, type: &quot;Ice Giant&quot;, year: &quot;84 Earth Years&quot;, day: &quot;17.2 Hours&quot;, moons: &quot;28&quot;, desc: &quot;Rotates at a nearly 90-degree angle.&quot; },
                    { id: &quot;Sol_Neptune&quot;, orbitNum: 8, name: &quot;Neptune&quot;, radius: 4.2, distance: 330, orbitSpeed: 0.0008, daySpeed: 0.026, color: &quot;#274687&quot;, stripe: &quot;#122244&quot;, type: &quot;Ice Giant&quot;, year: &quot;165 Earth Years&quot;, day: &quot;16.1 Hours&quot;, moons: &quot;16&quot;, desc: &quot;Dark, cold, and whipped by supersonic winds.&quot; }
                ]
            },
            {
                id: &quot;Kepler&quot;, position: { x: 1000, y: 150, z: -800 },
                star: { name: &quot;Kepler-90 Star&quot;, radius: 20, color: &quot;#00d2ff&quot;, type: &quot;F-type Main Sequence&quot;, year: &quot;Unknown&quot;, day: &quot;9 Earth Days&quot;, moons: &quot;8 Planets&quot;, desc: &quot;Distant star hosting an 8-planet system.&quot; },
                belts: [],
                planets: [
                    { id: &quot;Kepler_b&quot;, orbitNum: 1, name: &quot;Kepler-90b&quot;, radius: 2.0, distance: 45, orbitSpeed: 0.03, daySpeed: 0.01, color: &quot;#00bfff&quot;, stripe: &quot;#005f7f&quot;, type: &quot;Rocky&quot;, year: &quot;7 Earth Days&quot;, day: &quot;Tidally Locked&quot;, moons: &quot;?&quot;, desc: &quot;Scorching hot.&quot; },
                    { id: &quot;Kepler_c&quot;, orbitNum: 2, name: &quot;Kepler-90c&quot;, radius: 2.5, distance: 75, orbitSpeed: 0.018, daySpeed: 0.01, color: &quot;#1e90ff&quot;, stripe: &quot;#104e8b&quot;, type: &quot;Super-Earth&quot;, year: &quot;8.7 Earth Days&quot;, day: &quot;Tidally Locked&quot;, moons: &quot;?&quot;, desc: &quot;A rocky world slightly larger than Earth.&quot; },
                    { id: &quot;Kepler_i&quot;, orbitNum: 3, name: &quot;Kepler-90i&quot;, radius: 3.0, distance: 110, orbitSpeed: 0.01, daySpeed: 0.01, color: &quot;#00ffff&quot;, stripe: &quot;#008b8b&quot;, type: &quot;Hot Super-Earth&quot;, year: &quot;14.4 Earth Days&quot;, day: &quot;Tidally Locked&quot;, moons: &quot;?&quot;, desc: &quot;Discovered using AI.&quot; }
                ]
            }
        ];

        // --- 5. BUILD SYSTEMS ---
        const interactables = {}; 
        const labelElements = [];
        const orbitLines = [];
        const rotatingObjects = []; // Stores meshes that rotate on their own axis (Days)
        const orbitingPivots = []; // Stores pivots that revolve around parents (Years/Moons)

        systemsData.forEach(sys =&gt; {
            const sysGroup = new THREE.Group();
            sysGroup.position.set(sys.position.x, sys.position.y, sys.position.z);
            scene.add(sysGroup);

            // Star
            sysGroup.add(new THREE.PointLight(sys.star.color, 2, 2000));
            const starMesh = new THREE.Mesh(new THREE.SphereGeometry(sys.star.radius, 32, 32), new THREE.MeshBasicMaterial({ map: createStarTexture(sys.star.color) }));
            sysGroup.add(starMesh);

            interactables[sys.id + (sys.id === &quot;Sol&quot; ? &quot;_Sun&quot; : &quot;_Star&quot;)] = { mesh: starMesh, radius: sys.star.radius, data: { name: sys.star.name, type: sys.star.type, sys: sys.id, rad: sys.star.radius*10000+&#39; km&#39;, spd: &#39;Stationary&#39;, year: sys.star.year, day: sys.star.day, moons: sys.star.moons, desc: sys.star.desc }};
            createHtmlLabel(starMesh, sys.star.name, null, true);

            // Asteroid Belts (Stones)
            if(sys.belts) {
                sys.belts.forEach(belt =&gt; {
                    const astGeo = new THREE.DodecahedronGeometry(0.5, 0);
                    const astMat = new THREE.MeshStandardMaterial({ color: belt.color, roughness: 1 });
                    const astMesh = new THREE.InstancedMesh(astGeo, astMat, belt.count);
                    
                    const dummy = new THREE.Object3D();
                    for(let i=0; i&lt;belt.count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const r = belt.inner + Math.random() * (belt.outer - belt.inner);
                        dummy.position.set(Math.cos(angle)*r, (Math.random()-0.5)*4, Math.sin(angle)*r);
                        dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                        const s = Math.random() * 0.8 + 0.2;
                        dummy.scale.set(s, s, s);
                        dummy.updateMatrix();
                        astMesh.setMatrixAt(i, dummy.matrix);
                    }
                    astMesh.userData = { speed: belt.speed }; // Asteroid belt slow rotation
                    sysGroup.add(astMesh);
                    orbitingPivots.push(astMesh);
                });
            }

            // Planets
            sys.planets.forEach(p =&gt; {
                const pivot = new THREE.Group();
                pivot.userData = { speed: p.orbitSpeed };
                sysGroup.add(pivot);
                orbitingPivots.push(pivot);

                // Container holds planet and moons (moves along orbit, doesn&#39;t spin on axis)
                const pContainer = new THREE.Group();
                pContainer.position.x = p.distance;
                pivot.add(pContainer);

                // Actual Planet Mesh (Spins on its own axis for Day Cycle)
                const pMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(p.radius, 32, 32),
                    new THREE.MeshStandardMaterial({ map: createPlanetTexture(p.color, p.stripe), roughness: 0.7 })
                );
                pMesh.userData = { daySpeed: p.daySpeed };
                rotatingObjects.push(pMesh);
                pContainer.add(pMesh);

                interactables[p.id] = { mesh: pMesh, radius: p.radius, data: { name: p.name, type: p.type, sys: sys.id, rad: p.distance+&#39;M km&#39;, spd: (p.orbitSpeed*1000).toFixed(1)+&#39; km/s&#39;, year: p.year, day: p.day, moons: p.moons, desc: p.desc }};

                // Moons
                if (p.satellites) {
                    p.satellites.forEach(moon =&gt; {
                        const moonPivot = new THREE.Group();
                        moonPivot.userData = { speed: moon.speed };
                        pContainer.add(moonPivot);
                        orbitingPivots.push(moonPivot);

                        const moonMesh = new THREE.Mesh(
                            new THREE.SphereGeometry(moon.radius, 16, 16),
                            new THREE.MeshStandardMaterial({ color: moon.color, roughness: 0.9 })
                        );
                        moonMesh.position.x = moon.distance;
                        moonPivot.add(moonMesh);

                        // Thin moon orbit line
                        const mOrbit = new THREE.Mesh(new THREE.TorusGeometry(moon.distance, 0.02, 4, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 }));
                        mOrbit.rotation.x = Math.PI / 2;
                        pContainer.add(mOrbit);
                        orbitLines.push(mOrbit);
                    });
                }

                // ULTRA-THIN WHITE ORBIT (Reduced thickness to 0.04)
                const orbitMesh = new THREE.Mesh(
                    new THREE.TorusGeometry(p.distance, 0.04, 8, 128),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                orbitMesh.rotation.x = Math.PI / 2; 
                sysGroup.add(orbitMesh);
                orbitLines.push(orbitMesh);

                createHtmlLabel(pMesh, p.name, p.orbitNum, false);
            });
        });

        function createHtmlLabel(mesh, name, orbitNum, isStar) {
            const div = document.createElement(&#39;div&#39;);
            div.className = `planet-label ${isStar ? &#39;star-label&#39; : &#39;&#39;}`;
            
            if (orbitNum) {
                const badge = document.createElement(&#39;span&#39;);
                badge.className = &#39;orbit-badge&#39;; badge.innerText = `Orbit #${orbitNum}`;
                div.appendChild(badge);
            }
            const text = document.createElement(&#39;span&#39;);
            text.className = &#39;planet-name-text&#39;; text.innerText = name;
            div.appendChild(text);

            labelsContainer.appendChild(div);
            labelElements.push({ element: div, mesh: mesh });
        }

        // --- 6. UI &amp; CAMERA LOGIC ---
        let speedMultiplier = 1; let isPaused = false;
        let trackedObject = null; let trackingRadius = 10;
        let isFlyingTo = false; let lastTrackedPos = new THREE.Vector3();

        document.getElementById(&#39;speedSlider&#39;).addEventListener(&#39;input&#39;, e =&gt; {
            speedMultiplier = parseFloat(e.target.value);
            document.getElementById(&#39;speedVal&#39;).innerText = speedMultiplier + &#39;x&#39;;
        });
        document.getElementById(&#39;pauseBtn&#39;).addEventListener(&#39;click&#39;, e =&gt; {
            isPaused = !isPaused; e.target.innerText = isPaused ? &#39;Play Time&#39; : &#39;Pause Time&#39;;
        });

        document.getElementById(&#39;toggleOrbits&#39;).addEventListener(&#39;change&#39;, e =&gt; orbitLines.forEach(l =&gt; l.visible = e.target.checked));
        document.getElementById(&#39;toggleNames&#39;).addEventListener(&#39;change&#39;, e =&gt; {
            if(e.target.checked) labelsContainer.classList.remove(&#39;hide-names&#39;); else labelsContainer.classList.add(&#39;hide-names&#39;);
        });
        document.getElementById(&#39;toggleNumbers&#39;).addEventListener(&#39;change&#39;, e =&gt; {
            if(e.target.checked) labelsContainer.classList.remove(&#39;hide-numbers&#39;); else labelsContainer.classList.add(&#39;hide-numbers&#39;);
        });

        const infoCard = document.getElementById(&#39;info-card&#39;);
        document.getElementById(&#39;focusSelect&#39;).addEventListener(&#39;change&#39;, e =&gt; {
            const val = e.target.value;
            if (val === &quot;ALL&quot;) {
                trackedObject = null; infoCard.classList.remove(&#39;active&#39;);
                controls.target.set(0, 0, 0); camera.position.set(0, 800, 1600);
            } else {
                const obj = interactables[val];
                trackedObject = obj.mesh;
                trackingRadius = obj.radius;
                isFlyingTo = true;
                
                document.getElementById(&#39;info-title&#39;).innerText = obj.data.name;
                document.getElementById(&#39;info-type&#39;).innerText = obj.data.type;
                document.getElementById(&#39;info-sys&#39;).innerText = obj.data.sys;
                document.getElementById(&#39;info-rad&#39;).innerText = obj.data.rad;
                document.getElementById(&#39;info-spd&#39;).innerText = obj.data.spd;
                document.getElementById(&#39;info-year&#39;).innerText = obj.data.year;
                document.getElementById(&#39;info-day&#39;).innerText = obj.data.day;
                document.getElementById(&#39;info-moons&#39;).innerText = obj.data.moons;
                document.getElementById(&#39;info-desc&#39;).innerText = obj.data.desc;
                infoCard.classList.add(&#39;active&#39;);
            }
        });

        document.getElementById(&#39;resetCamBtn&#39;).addEventListener(&#39;click&#39;, () =&gt; {
            document.getElementById(&#39;focusSelect&#39;).value = &quot;ALL&quot;;
            trackedObject = null; infoCard.classList.remove(&#39;active&#39;);
            controls.target.set(0, 0, 0); camera.position.set(0, 800, 1600);
        });

        // --- 7. ANIMATION LOOP ---
        const tempV = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                // 1. Orbital Revolution (Years &amp; Moons &amp; Asteroid Belts)
                orbitingPivots.forEach(pivot =&gt; {
                    pivot.rotation.y += pivot.userData.speed * 0.5 * speedMultiplier;
                });
                
                // 2. Axial Rotation (Days)
                rotatingObjects.forEach(mesh =&gt; {
                    mesh.rotation.y += mesh.userData.daySpeed * 5 * speedMultiplier; 
                });
            }

            // Camera Tracking
            if (trackedObject) {
                const currentPos = new THREE.Vector3();
                trackedObject.getWorldPosition(currentPos);

                if (isFlyingTo) {
                    const offset = new THREE.Vector3(trackingRadius * 5, trackingRadius * 3, trackingRadius * 5);
                    const targetCamPos = currentPos.clone().add(offset);
                    camera.position.lerp(targetCamPos, 0.05);
                    controls.target.lerp(currentPos, 0.05);
                    if (camera.position.distanceTo(targetCamPos) &lt; trackingRadius * 0.5) isFlyingTo = false; 
                } else {
                    const moveDelta = currentPos.clone().sub(lastTrackedPos);
                    camera.position.add(moveDelta);
                    controls.target.copy(currentPos);
                }
                lastTrackedPos.copy(currentPos);
            }

            controls.update();
            renderer.render(scene, camera);

            // Update 2D Labels
            labelElements.forEach(item =&gt; {
                item.mesh.getWorldPosition(tempV);
                tempV.project(camera);

                if (tempV.z &gt; 1) { 
                    item.element.style.opacity = &#39;0&#39;;
                } else {
                    const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
                    item.element.style.opacity = &#39;1&#39;;
                    item.element.style.left = `${x}px`;
                    item.element.style.top = `${y - 15}px`;
                }
            });
        }

        animate();

        window.addEventListener(&#39;resize&#39;, () =&gt; {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
</html>
