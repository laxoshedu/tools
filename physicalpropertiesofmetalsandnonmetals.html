/* --------------- Build slides ---------------- */
const layer = document.getElementById(&#39;layer&#39;);
const dotsEl = document.getElementById(&#39;dots&#39;);
const counterEl = document.getElementById(&#39;counter&#39;);
const prevBtn = document.getElementById(&#39;prevBtn&#39;);
const nextBtn = document.getElementById(&#39;nextBtn&#39;);
const sidePrev = document.getElementById(&#39;sidePrev&#39;);
const sideNext = document.getElementById(&#39;sideNext&#39;);
const viewport = document.getElementById(&#39;viewport&#39;);
const autoplay = document.getElementById(&#39;autoplay&#39;);
const speed = document.getElementById(&#39;speed&#39;);
const speedLabel = document.getElementById(&#39;speedLabel&#39;);

let index = 0;
let autoplayTimer = null;
let slideEls = [];
const simInstances = {}; // key: slideIndex =&gt; sim object

function buildSlides(){
  layer.innerHTML = &#39;&#39;;
  dotsEl.innerHTML = &#39;&#39;;
  slideEls = slides.map((s, i) =&gt; {
    const sec = document.createElement(&#39;section&#39;);
    sec.className = &#39;slide&#39;;
    sec.setAttribute(&#39;role&#39;,&#39;group&#39;);
    sec.setAttribute(&#39;aria-label&#39;, `${s.title} (${i+1} of ${slides.length})`);

    const simId = `sim-${s.key}-${i}`;

    sec.innerHTML = `
      &lt;div class=&quot;ph&quot;&gt;
        &lt;div class=&quot;icon&quot;&gt;${s.icon}&lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;t&quot;&gt;${s.title}&lt;/div&gt;
          &lt;div class=&quot;d&quot;&gt;${s.desc}&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;slidegrid&quot;&gt;
        &lt;div class=&quot;cards&quot;&gt;
          &lt;div class=&quot;card metal&quot;&gt;
            &lt;span class=&quot;pill&quot;&gt;Metals&lt;/span&gt;
            &lt;div class=&quot;body&quot;&gt;${s.metal}&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;card nonmetal&quot;&gt;
            &lt;span class=&quot;pill&quot;&gt;Non‑metals&lt;/span&gt;
            &lt;div class=&quot;body&quot;&gt;${s.nonmetal}&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;simcard&quot; id=&quot;${simId}&quot;&gt;
          &lt;div class=&quot;sim-head&quot;&gt;
            &lt;div class=&quot;sim-title&quot;&gt;Simulation&lt;/div&gt;
            &lt;div class=&quot;sim-controls&quot; id=&quot;${simId}-controls&quot;&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sim-body&quot; id=&quot;${simId}-body&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    `;
    layer.appendChild(sec);

    // dot
    const d = document.createElement(&#39;div&#39;);
    d.className = &#39;dot&#39;;
    d.title = s.title;
    d.addEventListener(&#39;click&#39;, () =&gt; goTo(i));
    dotsEl.appendChild(d);

    // init sim
    const container = sec.querySelector(`#${simId}`);
    createSimulationForSlide(i, slides[i].key, container);

    return sec;
  });
  updateUI();
}

function goTo(i){
  const clamped = Math.max(0, Math.min(slides.length - 1, i));
  if (clamped === index){
    slideEls[index].classList.remove(&#39;active&#39;);
    requestAnimationFrame(()=&gt; slideEls[index].classList.add(&#39;active&#39;));
    return;
  }
  slideEls[index]?.classList.remove(&#39;active&#39;);
  // deactivate old sim
  simInstances[index]?.deactivate?.();
  index = clamped;
  slideEls[index]?.classList.add(&#39;active&#39;);
  // activate new sim
  simInstances[index]?.activate?.();
  updateUI();
}

function next(){ goTo((index + 1) % slides.length); }
function prev(){ goTo((index - 1 + slides.length) % slides.length); }

function updateUI(){
  [...dotsEl.children].forEach((dot, i) =&gt; dot.classList.toggle(&#39;active&#39;, i === index));
  counterEl.textContent = `${index+1} / ${slides.length}`;
}
function setAutoplay(on){
  if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  if (on){
    autoplayTimer = setInterval(()=&gt;{ if (!document.hidden) next(); }, +speed.value * 1000);
  }
}
function updateSpeedLabel(){ speedLabel.textContent = `• ${speed.value}s`; }

prevBtn.addEventListener(&#39;click&#39;, prev);
nextBtn.addEventListener(&#39;click&#39;, next);
sidePrev.addEventListener(&#39;click&#39;, prev);
sideNext.addEventListener(&#39;click&#39;, next);
autoplay.addEventListener(&#39;change&#39;, ()=&gt; setAutoplay(autoplay.checked));
speed.addEventListener(&#39;input&#39;, ()=&gt;{ updateSpeedLabel(); setAutoplay(autoplay.checked); });

let touchStartX = null;
viewport.addEventListener(&#39;touchstart&#39;, (e)=&gt;{ touchStartX = e.touches[0].clientX; }, {passive:true});
viewport.addEventListener(&#39;touchend&#39;, (e)=&gt;{
  if (touchStartX == null) return;
  const dx = (e.changedTouches[0].clientX - touchStartX);
  const threshold = Math.min(120, viewport.clientWidth * 0.18);
  if (dx &gt; threshold) prev(); else if (dx &lt; -threshold) next();
  touchStartX = null;
}, {passive:true});
window.addEventListener(&#39;keydown&#39;, (e)=&gt;{
  if (e.key === &#39;ArrowRight&#39;) { e.preventDefault(); next(); }
  if (e.key === &#39;ArrowLeft&#39;)  { e.preventDefault(); prev(); }
});

/* --------------- Utilities ---------------- */
const prefersReduced = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches;
const clamp = (v,min,max)=&gt; Math.max(min, Math.min(max, v));
const lerp = (a,b,t)=&gt; a + (b-a)*t;
function fitHiDPICanvas(cvs, w, h){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cvs.width = Math.round(w * dpr);
  cvs.height = Math.round(h * dpr);
  cvs.style.width = w + &#39;px&#39;;
  cvs.style.height = h + &#39;px&#39;;
  const ctx = cvs.getContext(&#39;2d&#39;);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return ctx;
}
function makeCanvas(container, height=260){
  const cvs = document.createElement(&#39;canvas&#39;);
  cvs.className = &#39;simcvs&#39;;
  container.appendChild(cvs);
  // size to container width
  const resize = ()=&gt;{
    const w = container.clientWidth || 600;
    fitHiDPICanvas(cvs, w, height);
  };
  resize();
  new ResizeObserver(resize).observe(container);
  return cvs;
}

/* --------------- Simulation builders per slide ---------------- */
function createSimulationForSlide(i, key, simcard){
  const controls = simcard.querySelector(`#${simcard.id}-controls`);
  const body = simcard.querySelector(`#${simcard.id}-body`);
  let sim = null;

  const builders = {
    define: buildDefine,
    state: buildState,
    hard: buildHard,
    malleable: buildMalleable,
    ductile: buildDuctile,
    heat: buildHeat,
    elec: buildElec,
    lustre: buildLustre,
    density: buildDensity,
    melting: buildMelting,
    boiling: buildBoiling,
    rigid: buildRigid,
    sonority: buildSonority,
    colour: buildColour
  };
  const builder = builders[key];
  sim = builder({controls, body});
  simInstances[i] = sim;
}

/* -- 0. Definition: electron transfer (Na -&gt; Cl) -- */
function buildDefine({controls, body}){
  const btn = document.createElement(&#39;button&#39;); btn.textContent = &#39;Transfer Electron&#39;;
  controls.appendChild(btn);
  const cvs = makeCanvas(body, 260);
  const ctx = cvs.getContext(&#39;2d&#39;);

  const state = {
    t: 0, anim:false, done:false
  };
  btn.addEventListener(&#39;click&#39;, ()=&gt;{ if (!state.done){ state.anim = true; } });

  function draw(){
    const w=cvs.width/ (window.devicePixelRatio||1), h=cvs.height/(window.devicePixelRatio||1);
    ctx.clearRect(0,0,w,h);
    const left = {x:w*0.28, y:h*0.55}, right={x:w*0.72, y:h*0.45};
    // atoms
    ctx.fillStyle = &#39;rgba(120,200,255,0.2)&#39;;
    ctx.beginPath(); ctx.arc(left.x, left.y, 60, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#39;rgba(200,160,255,0.2)&#39;;
    ctx.beginPath(); ctx.arc(right.x, right.y, 60, 0, Math.PI*2); ctx.fill();

    // labels
    ctx.fillStyle=&#39;rgba(200,230,255,0.9)&#39;; ctx.font=&#39;14px system-ui&#39;;
    ctx.textAlign=&#39;center&#39;;
    ctx.fillText(state.done?&#39;Na⁺ (metal)&#39;:&#39;Na (metal)&#39;, left.x, left.y-72);
    ctx.fillStyle=&#39;rgba(220,200,255,0.9)&#39;;
    ctx.fillText(state.done?&#39;Cl⁻ (non‑metal)&#39;:&#39;Cl (non‑metal)&#39;, right.x, right.y-72);

    // electron path
    const p0 = {x:left.x+40, y:left.y-10};
    const p3 = {x:right.x-40, y:right.y+8};
    const p1 = {x: lerp(p0.x, p3.x, .35), y: p0.y-60};
    const p2 = {x: lerp(p0.x, p3.x, .65), y: p3.y-60};

    // draw electron
    let ex=p0.x, ey=p0.y;
    if (state.done){
      ex = p3.x; ey = p3.y;
    }else if (state.anim){
      const t = state.t;
      const x = (1-t)**3*p0.x + 3*(1-t)**2*t*p1.x + 3*(1-t)*t**2*p2.x + t**3*p3.x;
      const y = (1-t)**3*p0.y + 3*(1-t)**2*t*p1.y + 3*(1-t)*t**2*p2.y + t**3*p3.y;
      ex=x; ey=y;
      // trail
      ctx.strokeStyle=&#39;rgba(180,255,200,0.25)&#39;; ctx.lineWidth=2; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.bezierCurveTo(p1.x,p1.y,p2.x,p2.y,p3.x,p3.y); ctx.stroke(); ctx.setLineDash([]);
    }else{
      // idle orbit electron around Na
      const t = performance.now()/1000;
      ex = left.x + 40*Math.cos(t*1.6);
      ey = left.y + 40*Math.sin(t*1.6);
    }
    // electron dot
    ctx.fillStyle=&#39;rgba(180,255,200,0.95)&#39;;
    ctx.beginPath(); ctx.arc(ex,ey,6,0,Math.PI*2); ctx.fill();

    // arrow hint
    ctx.strokeStyle=&#39;rgba(180,255,200,0.4)&#39;; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(left.x+65, left.y-20); ctx.lineTo(right.x-65, right.y-20); ctx.stroke();
    ctx.fillStyle=&#39;rgba(180,255,200,0.6)&#39;; ctx.beginPath();
    ctx.moveTo(right.x-65, right.y-20);
    ctx.lineTo(right.x-75, right.y-26);
    ctx.lineTo(right.x-75, right.y-14);
    ctx.closePath(); ctx.fill();

    // charge signs
    if (state.done){
      ctx.fillStyle=&#39;rgba(180,255,200,0.9)&#39;; ctx.font=&#39;24px system-ui&#39;;
      ctx.fillText(&#39;+&#39;, left.x, left.y+8);
      ctx.fillStyle=&#39;rgba(200,180,255,0.9)&#39;; ctx.fillText(&#39;−&#39;, right.x, right.y+8);
    }

    // caption
    ctx.fillStyle=&#39;rgba(220,240,255,0.8)&#39;; ctx.font=&#39;12px system-ui&#39;; ctx.textAlign=&#39;left&#39;;
    ctx.fillText(&#39;Click &quot;Transfer Electron&quot; to form Na⁺ and Cl⁻&#39;, 12, 20);
  }
  function update(dt){
    if (state.anim &amp;&amp; !state.done){
      state.t += dt*0.6;
      if (state.t &gt;= 1){ state.t = 1; state.anim=false; state.done=true; }
    }
  }
  return {
    activate(){ /* noop */ },
    deactivate(){ /* noop */ },
    updateDraw(dt){ update(dt); draw(); }
  };
}

/* -- 1. Physical State: particles for gas/liquid/solid (side-by-side) -- */
function buildState({controls, body}){
  const wrap = document.createElement(&#39;div&#39;);
  wrap.style.display = &#39;grid&#39;; wrap.style.gridTemplateColumns = &#39;1fr 1fr&#39;; wrap.style.gap=&#39;8px&#39;;
  body.appendChild(wrap);

  // Controls
  const leftSel = document.createElement(&#39;select&#39;);
  [&#39;Fe (solid)&#39;,&#39;Hg (liquid)&#39;].forEach((opt,i)=&gt;{ const o=document.createElement(&#39;option&#39;); o.value = i===0?&#39;solid&#39;:&#39;liquid&#39;; o.textContent = opt; leftSel.appendChild(o); });
  const rightSel = document.createElement(&#39;select&#39;);
  [&#39;O₂ (gas)&#39;,&#39;Br₂ (liquid)&#39;,&#39;S (solid)&#39;].forEach((opt,i)=&gt;{ const o=document.createElement(&#39;option&#39;); o.value = [&#39;gas&#39;,&#39;liquid&#39;,&#39;solid&#39;][i]; o.textContent = opt; rightSel.appendChild(o); });
  rightSel.value=&#39;gas&#39;;
  const lbl1 = document.createElement(&#39;span&#39;); lbl1.className=&#39;mini&#39;; lbl1.textContent=&#39;Metal&#39;;
  const lbl2 = document.createElement(&#39;span&#39;); lbl2.className=&#39;mini&#39;; lbl2.textContent=&#39;Non‑metal&#39;;
  controls.appendChild(lbl1); controls.appendChild(leftSel); controls.appendChild(lbl2); controls.appendChild(rightSel);

  // Two canvases
  const leftCard = document.createElement(&#39;div&#39;); const rightCard = document.createElement(&#39;div&#39;);
  wrap.appendChild(leftCard); wrap.appendChild(rightCard);
  const cvL = makeCanvas(leftCard, 220), cvR = makeCanvas(rightCard, 220);
  const ctxL = cvL.getContext(&#39;2d&#39;), ctxR = cvR.getContext(&#39;2d&#39;);

  function makeParticles(n, w,h, speed){ return Array.from({length:n},()=&gt;({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()*2-1)*speed, vy:(Math.random()*2-1)*speed})); }
  const state = {
    L: {mode: &#39;solid&#39;, parts: makeParticles(0, 1,1,0)},
    R: {mode: &#39;gas&#39;, parts: makeParticles(40, cvR.width, cvR.height, 70)}
  };
  leftSel.addEventListener(&#39;change&#39;, ()=&gt;{ state.L.mode = leftSel.value; if (state.L.mode===&#39;gas&#39;) state.L.parts = makeParticles(40, cvL.width, cvL.height, 70); });
  rightSel.addEventListener(&#39;change&#39;, ()=&gt;{ state.R.mode = rightSel.value; if (state.R.mode===&#39;gas&#39;) state.R.parts = makeParticles(40, cvR.width, cvR.height, 70); });

  function drawPanel(ctx, w,h, env){
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle=&#39;rgba(180,210,255,0.35)&#39;; ctx.strokeRect(10,10,w-20,h-20);
    ctx.font=&#39;12px system-ui&#39;; ctx.fillStyle=&#39;rgba(220,240,255,0.8)&#39;;
    ctx.fillText(env.mode.toUpperCase(), 16, 22);

    const iw = w-40, ih=h-40, ox=20, oy=20;
    if (env.mode===&#39;solid&#39;){
      ctx.fillStyle=&#39;rgba(200,230,255,0.9)&#39;;
      const sx = 10, sy = 10;
      for (let y=0;y&lt;ih;y+=sy){
        for (let x=0;x&lt;iw;x+=sx){
          ctx.fillRect(ox+x, oy+y, 3, 3);
        }
      }
    } else if (env.mode===&#39;liquid&#39;){
      // blobs
      ctx.fillStyle=&#39;rgba(160,200,255,0.25)&#39;;
      for(let i=0;i&lt;8;i++){
        const rx = ox + iw*0.1 + Math.random()*iw*0.8;
        const ry = oy + ih*0.2 + Math.random()*ih*0.6;
        const rw = 30 + Math.random()*50;
        ctx.beginPath(); ctx.ellipse(rx, ry, rw, rw*0.6, 0, 0, Math.PI*2); ctx.fill();
      }
      // surface wave
      ctx.strokeStyle=&#39;rgba(200,230,255,0.6)&#39;; ctx.lineWidth=2;
      ctx.beginPath();
      for(let x=0;x&lt;=iw;x+=4){
        const y = ih*0.7 + 6*Math.sin((performance.now()/400) + x*0.08);
        ctx.lineTo(ox+x, oy+y);
      }
      ctx.stroke();
    } else {
      // gas: bouncing particles
      ctx.fillStyle=&#39;rgba(180,255,220,0.9)&#39;;
      for (const p of env.parts){
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
      }
    }
  }
  function updateGas(env, w,h, dt){
    if (env.mode!==&#39;gas&#39;) return;
    const minx=20,maxx=w-20,miny=20,maxy=h-20;
    for (const p of env.parts){
      p.x += p.vx*dt; p.y += p.vy*dt;
      if (p.x&lt;minx||p.x&gt;maxx) p.vx*=-1;
      if (p.y&lt;miny||p.y&gt;maxy) p.vy*=-1;
    }
  }

  return {
    activate(){},
    deactivate(){},
    updateDraw(dt){
      const dpr = window.devicePixelRatio||1;
      const wL=cvL.width/dpr, hL=cvL.height/dpr, wR=cvR.width/dpr, hR=cvR.height/dpr;
      updateGas(state.L, wL,hL, dt);
      updateGas(state.R, wR,hR, dt);
      drawPanel(ctxL, wL,hL, state.L);
      drawPanel(ctxR, wR,hR, state.R);
    }
  };
}

/* -- 2. Hardness: scratch test (side-by-side) -- */
function buildHard({controls, body}){
  const row = document.createElement(&#39;div&#39;); row.className=&#39;sim-controls&#39;;
  row.innerHTML = `
    &lt;span class=&quot;mini&quot;&gt;Force&lt;/span&gt;
    &lt;input id=&quot;hf&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;4&quot; /&gt;
    &lt;span class=&quot;mini&quot;&gt;&lt;span id=&quot;hfVal&quot;&gt;4.0&lt;/span&gt; N&lt;/span&gt;
    &lt;button id=&quot;hReset&quot;&gt;Reset&lt;/button&gt;
  `;
  controls.appendChild(row);
  const hf = row.querySelector(&#39;#hf&#39;), hfVal=row.querySelector(&#39;#hfVal&#39;), hReset=row.querySelector(&#39;#hReset&#39;);

  const grid = document.createElement(&#39;div&#39;);
  grid.style.display=&#39;grid&#39;; grid.style.gridTemplateColumns=&#39;1fr 1fr&#39;; grid.style.gap=&#39;8px&#39;;
  body.appendChild(grid);

  function makePanel(label){
    const wrap = document.createElement(&#39;div&#39;);
    const cap = document.createElement(&#39;div&#39;); cap.className=&#39;mini&#39;; cap.textContent=label; cap.style.margin=&#39;4px 0&#39;;
    const sub = document.createElement(&#39;div&#39;);
    wrap.appendChild(cap); wrap.appendChild(sub);
    const cvs = makeCanvas(sub, 200);
    return {wrap, cvs};
  }
  const metal = makePanel(&#39;Metal&#39;); const non = makePanel(&#39;Non‑metal&#39;);
  grid.appendChild(metal.wrap); grid.appendChild(non.wrap);

  function mkSurface(name, cvs){
    const ctx = cvs.getContext(&#39;2d&#39;);
    const s = {name, ctx, cvs, w:0,h:0, brittle: (name===&#39;Non‑metal&#39;)?0.65:0.12, hardness:(name===&#39;Metal&#39;)?7.0:2.2, stylus:{x:40,y:40,down:false}, paths:[]};
    return s;
  }
  const surfM = mkSurface(&#39;Metal&#39;, metal.cvs), surfN = mkSurface(&#39;Non‑metal&#39;, non.cvs);
  let force = +hf.value;

  function initSurface(s){
    const dpr=window.devicePixelRatio||1, w=s.cvs.width/dpr, h=s.cvs.height/dpr; s.w=w; s.h=h;
    const {ctx} = s; ctx.clearRect(0,0,w,h);
    const g = ctx.createLinearGradient(0,0,0,h);
    if (s.name===&#39;Metal&#39;){ g.addColorStop(0,&#39;#0c172a&#39;); g.addColorStop(1,&#39;#0a1422&#39;); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle=&#39;rgba(200,240,255,0.06)&#39;; for(let y=10;y&lt;h;y+=6){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    } else { g.addColorStop(0,&#39;#0b1526&#39;); g.addColorStop(1,&#39;#0a1322&#39;); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      for(let i=0;i&lt;300;i++){ ctx.fillStyle=`rgba(200,220,255,${Math.random()*0.08})`; ctx.fillRect(Math.random()*w, Math.random()*h,1,1); }
    }
    ctx.fillStyle=&#39;rgba(255,255,255,0.08)&#39;; ctx.font=&#39;12px system-ui&#39;; ctx.fillText(&#39;Drag to scratch&#39;, 10, h-10);
  }
  function drawSurface(s){
    initSurface(s);
    const ctx=s.ctx;
    for (const p of s.paths){
      ctx.lineCap=&#39;round&#39;; ctx.lineJoin=&#39;round&#39;; ctx.lineWidth=p.w;

function buildElec({controls, body}){

  controls.appendChild(V); controls.appendChild(vl);
  const vv = vl.querySelector(&#39;#vv&#39;);

  const cvs = makeCanvas(body, 240); const ctx = cvs.getContext(&#39;2d&#39;);
  const Rm = { metal: 1, non: 5e6, graphite: 50 };

  const state = { V:+V.value, sM:0, sN:0 };
  V.addEventListener(&#39;input&#39;, ()=&gt;{ state.V=+V.value; vv.textContent=state.V.toFixed(1); });

    ctx.moveTo(x0+w/2+40, y0+pad); ctx.lineTo(x0+w-pad, y0+pad); ctx.lineTo(x0+w-pad, y0+h-pad); ctx.lineTo(x0+pad, y0+h-pad);

    ctx.beginPath(); ctx.moveTo(x0+w/2-40, y0+pad); ctx.lineTo(x0+w/2+40, y0+pad); ctx.stroke();

    ctx.fillText(`${label}  I=${I.toFixed(3)} A`, x0+pad, y0+h-8);

  const dm = document.createElement(&#39;input&#39;); dm.type=&#39;range&#39;; dm.min=&#39;0.3&#39;; dm.max=&#39;10&#39;; dm.step=&#39;0.1&#39;; dm.value=&#39;7.8&#39;;
  const dn = document.createElement(&#39;input&#39;); dn.type=&#39;range&#39;; dn.min=&#39;0.3&#39;; dn.max=&#39;10&#39;; dn.step=&#39;0.1&#39;; dn.value=&#39;0.8&#39;;
  const lm = document.createElement(&#39;span&#39;); lm.className=&#39;mini&#39;; lm.innerHTML=`Metal ρ=&lt;span id=&quot;dmv&quot;&gt;7.8&lt;/span&gt;`;
  const ln = document.createElement(&#39;span&#39;); ln.className=&#39;mini&#39;; ln.innerHTML=`Non‑metal ρ=&lt;span id=&quot;dnv&quot;&gt;0.8&lt;/span&gt;`;
  const drop = document.createElement(&#39;button&#39;); drop.textContent=&#39;Drop/Reset&#39;;
  controls.append(lm, dm, ln, dn, drop);
  const dmv=lm.querySelector(&#39;#dmv&#39;), dnv=ln.querySelector(&#39;#dnv&#39;);

  const cvs = makeCanvas(body, 220); const ctx = cvs.getContext(&#39;2d&#39;);
  const state = { yM:30, yN:30, vM:0, vN:0, dropping:false };
  function equilibriumY(rho, top, bottom, objH){
    const water=1.0; // g/cm^3
    // fraction submerged ~ rho/water; if &lt;1 -&gt; floats partially
    const f = clamp(rho/water, 0, 1.2);
    if (f&lt;1) return top + (bottom-top)*0.2; // float near surface
    return bottom - objH - 4; // sink
  }
  function draw(){
    const w=cvs.width/(window.devicePixelRatio||1), h=cvs.height/(window.devicePixelRatio||1);
    ctx.clearRect(0,0,w,h);
    const mid=w/2, pad=16, top=pad, bottom=h-pad, waterY=top+20;
    // tanks
    ctx.strokeStyle=&#39;rgba(180,210,255,0.35)&#39;; ctx.strokeRect(10,10,mid-20,h-20); ctx.strokeRect(mid+10,10,mid-20,h-20);
    // water
    ctx.fillStyle=&#39;rgba(120,180,255,0.15)&#39;; ctx.fillRect(12, waterY, mid-24, h-22-waterY);
    ctx.fillRect(mid+12, waterY, mid-24, h-22-waterY);
    // blocks
    const bw=40,bh=30;
    ctx.fillStyle=&#39;rgba(160,240,200,0.9)&#39;; ctx.fillRect(10+(mid-20-bw)/2, state.yM, bw, bh);
    ctx.fillStyle=&#39;rgba(255,220,170,0.9)&#39;; ctx.fillRect(mid+10+(mid-20-bw)/2, state.yN, bw, bh);
    // labels
    ctx.fillStyle=&#39;rgba(220,240,255,0.85)&#39;; ctx.font=&#39;12px system-ui&#39;;
    ctx.fillText(&#39;Metal&#39;, 16, 22); ctx.fillText(&#39;Non‑metal&#39;, mid+16, 22);
  }
  function step(dt){
    if (!state.dropping) return;
    const w=cvs.width/(window.devicePixelRatio||1), h=cvs.height/(window.devicePixelRatio||1), mid=w/2;
    const waterY=30+16, bottom=h-16, bh=30;
    const yEqM = equilibriumY(+dm.value, waterY, bottom, bh);
    const yEqN = equilibriumY(+dn.value, waterY, bottom, bh);
    // simple spring-damper to target
    const k=20, c=6;
    const aM = k*(yEqM - state.yM) - c*state.vM;
    const aN = k*(yEqN - state.yN) - c*state.vN;
    state.vM += aM*dt; state.vN += aN*dt;
    state.yM += state.vM*dt; state.yN += state.vN*dt;
  }
  drop.addEventListener(&#39;click&#39;, ()=&gt;{ state.yM=30; state.yN=30; state.vM=0; state.vN=0; state.dropping=true; });
  dm.addEventListener(&#39;input&#39;, ()=&gt; dmv.textContent=(+dm.value).toFixed(1));
  dn.addEventListener(&#39;input&#39;, ()=&gt; dnv.textContent=(+dn.value).toFixed(1));
  draw();
  return { activate(){}, deactivate(){}, updateDraw(dt){ step(dt); draw(); } };
}

/* -- 9. Melting point: heat and melt -- */
function buildMelting({controls, body}){
  const T = document.createElement(&#39;input&#39;); T.type=&#39;range&#39;; T.min=&#39;0&#39;; T.max=&#39;1600&#39;; T.step=&#39;10&#39;; T.value=&#39;25&#39;;
  const tl = document.createElement(&#39;span&#39;); tl.className=&#39;mini&#39;; tl.innerHTML=`Temperature &lt;span id=&quot;tv&quot;&gt;25&lt;/span&gt; °C`;
  controls.append(T, tl); const tv=tl.querySelector(&#39;#tv&#39;);

  const cvs = makeCanvas(body, 220); const ctx = cvs.getContext(&#39;2d&#39;);
  const mpM = 1538, mpN = 115; // Fe vs S
  function draw(){
    const w=cvs.width/(window.devicePixelRatio||1), h=cvs.height/(window.devicePixelRatio||1), mid=w/2, base=h-36;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=&#39;rgba(220,240,255,0.85)&#39;; ctx.font=&#39;12px system-ui&#39;;
    ctx.fillText(&#39;Metal (Fe)&#39;, 16, 18); ctx.fillText(&#39;Non‑metal (S)&#39;, mid+16, 18);
    ctx.strokeStyle=&#39;rgba(200,220,255,0.35)&#39;; ctx.strokeRect(10,10,mid-20,h-20); ctx.strokeRect(mid+10,10,mid-20,h-20);

    // Heater bar
    const temp=+T.value; tv.textContent=temp;
    const glow = clamp(temp/1600,0,1);
    // Metal
    ctx.fillStyle = (temp&lt;mpM)?&#39;rgba(160,240,200,0.9)&#39;:&#39;rgba(255,180,120,0.9)&#39;;
    if (temp&lt;mpM){
      ctx.fillRect(20+(mid-40-60)/2, base-60, 60, 60);
    } else {
      ctx.beginPath(); ctx.ellipse(20+(mid-40)/2, base-12, 50, 12, 0, 0, Math.PI*2); ctx.fill();
    }
    // Non-metal
    ctx.fillStyle = (temp&lt;mpN)?&#39;rgba(255,220,170,0.9)&#39;:&#39;rgba(255,180,120,0.9)&#39;;
    if (temp&lt;mpN){
      ctx.fillRect(mid+20+(mid-40-60)/2, base-60, 60, 60);
    } else {
      ctx.beginPath(); ctx.ellipse(mid+20+(mid-40)/2, base-12, 50, 12, 0, 0, Math.PI*2); ctx.fill();
    }
    // heat glow baseline
    ctx.fillStyle=`rgba(255,200,120,${0.2+0.4*glow})`; ctx.fillRect(12, base, mid-24, 6); ctx.fillRect(mid+12, base, mid-24, 6);
  }
  T.addEventListener(&#39;input&#39;, draw);
  draw();
  return { activate(){}, deactivate(){}, updateDraw(){ draw(); } };
}

/* --10. Boiling point: bubbles above threshold -- */
function buildBoiling({controls, body}){
  const T = document.createElement(&#39;input&#39;); T.type=&#39;range&#39;; T.min=&#39;0&#39;; T.max=&#39;3000&#39;; T.step=&#39;20&#39;; T.value=&#39;25&#39;;
  const tl = document.createElement(&#39;span&#39;); tl.className=&#39;mini&#39;; tl.innerHTML=`Temperature &lt;span id=&quot;tv&quot;&gt;25&lt;/span&gt; °C`;
  controls.append(T, tl); const tv=tl.querySelector(&#39;#tv&#39;);

  const cvs = makeCanvas(body, 220); const ctx = cvs.getContext(&#39;2d&#39;);
  const bpM = 2562, bpN = 59; // Cu vs Br2
  const bubblesM=[], bubblesN=[];
  function spawn(bubs, x0,x1, baseY){
    if (bubs.length&gt;80) bubs.shift();
    bubs.push({x: lerp(x0,x1,Math.random()), y: baseY, r: 2+Math.random()*3, vy: -20 - Math.random()*30});
  }
  function draw(){
    const w=cvs.width/(window.devicePixelRatio||1), h=cvs.height/(window.devicePixelRatio||1), mid=w/2, base=h-28;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=&#39;rgba(220,240,255,0.85)&#39;; ctx.font=&#39;12px system-ui&#39;;
    ctx.fillText(&#39;Metal (Cu)&#39;, 16, 18); ctx.fillText(&#39;Non‑metal (Br₂)&#39;, mid+16, 18);
    ctx.strokeStyle=&#39;rgba(200,220,255,0.35)&#39;; ctx.strokeRect(10,10,mid-20,h-20); ctx.strokeRect(mid+10,10,mid-20,h-20);
    const temp=+T.value; tv.textContent=temp;
    // liquid pools
    ctx.fillStyle=&#39;rgba(160,200,255,0.2)&#39;; ctx.fillRect(12, base-10, mid-24, 10); ctx.fillRect(mid+12, base-10, mid-24, 10);

    // bubbles when T &gt; bp
    if (temp&gt;bpM &amp;&amp; !prefersReduced &amp;&amp; Math.random()&lt;0.5) spawn(bubblesM, 12, 12+mid-24, base-12);
    if (temp&gt;bpN &amp;&amp; !prefersReduced) spawn(bubblesN, mid+12, mid+12+mid-24, base-12);
    // evolve
    function drawBubs(arr){
      ctx.strokeStyle=&#39;rgba(200,220,255,0.8)&#39;;
      for(const b of arr){
        b.y += b.vy * 0.016;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.stroke();
      }
      // remove gone
      for(let i=arr.length-1;i&gt;=0;i--){ if(arr[i].y&lt;20) arr.splice(i,1); }
    }
    drawBubs(bubblesM); drawBubs(bubblesN);

    // heat indicator
    const glow = clamp(temp/3000,0,1);
    ctx.fillStyle=`rgba(255,200,120,${0.2+0.4*glow})`; ctx.fillRect(12, base, mid-24, 6); ctx.fillRect(mid+12, base, mid-24, 6);
  }
  T.addEventListener(&#39;input&#39;, draw);
  draw();
  return { activate(){}, deactivate(){}, updateDraw(){ draw(); } };
}

/* --11. Rigidity: beam deflection under load -- */
function buildRigid({controls, body}){
  const load = document.createElement(&#39;input&#39;); load.type=&#39;range&#39;; load.min=&#39;0&#39;; load.max=&#39;1&#39;; load.step=&#39;0.01&#39;; load.value=&#39;0.4&#39;;
  const ll = document.createElement(&#39;span&#39;); ll.className=&#39;mini&#39;; ll.innerHTML=`Load &lt;span id=&quot;lv&quot;&gt;0.40&lt;/span&gt;`;
  controls.append(load, ll); const lv=ll.querySelector(&#39;#lv&#39;);

  const cvs = makeCanvas(body, 220); const ctx = cvs.getContext(&#39;2d&#39;);

  function draw(){
    const w=cvs.width/(window.devicePixelRatio||1), h=cvs.height/(window.devicePixelRatio||1), mid=w/2;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle=&#39;rgba(200,220,255,0.35)&#39;; ctx.strokeRect(10,10,mid-20,h-20); ctx.strokeRect(mid+10,10,mid-20,h-20);
    ctx.fillStyle=&#39;rgba(220,240,255,0.85)&#39;; ctx.font=&#39;12px system-ui&#39;;
    ctx.fillText(&#39;Metal (stiffer)&#39;, 16, 18); ctx.fillText(&#39;Non‑metal (less rigid)&#39;, mid+16, 18);
    const L= mid-60, x0=30, y0=h/2, x1=mid-30, y1=h/2;
    const loadVal=+load.value; lv.textContent=loadVal.toFixed(2);
    // deflection as simple bow: y = a*(x)(L-x)
    function beam(x0, y0, w, label){
      const a = (label===&#39;Metal&#39;) ? 0.0008 : 0.003; // compliance
      ctx.strokeStyle=&#39;rgba(160,240,200,0.9)&#39;; if (label!==&#39;Metal&#39;) ctx.strokeStyle=&#39;rgba(255,220,170,0.9)&#39;;
      ctx.lineWidth=6; ctx.beginPath();
      for(let i=0;i&lt;=L;i+=4){
        const x = x0 + i;
        const def = a*loadVal*(i)*(L-i);
        const y = y0 + def;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      // supports
      ctx.fillStyle=&#39;rgba(200,220,255,0.25)&#39;; ctx.fillRect(x0-6, y0+20, 12, 20); ctx.fillRect(x0+L-6, y0+20, 12, 20);
    }
    beam(30, h/2-20, L, &#39;Metal&#39;);
    beam(mid+30, h/2-20, L, &#39;Non&#39;);
  }
  load.addEventListener(&#39;input&#39;, draw);
  draw();
  return { activate(){}, deactivate(){}, updateDraw(){ draw(); } };
}

/* --12. Sonority: ring ripple animation -- */
function buildSonority({controls, body}){
  const strike = document.createElement(&#39;button&#39;); strike.textContent=&#39;Strike&#39;;
  controls.appendChild(strike);
  const cvs = makeCanvas(body, 220); const ctx = cvs.getContext(&#39;2d&#39;);
  const ringsM=[], ringsN=[];
  function addRing(arr, cx, cy, type){
    arr.push({r:6, a:1, cx, cy, decay: (type===&#39;Metal&#39;)?0.985:0.92, spd:(type===&#39;Metal&#39;)?2.4:1.5});
  }
  strike.addEventListener(&#39;click&#39;, ()=&gt;{
    const w=cvs.width/(window.devicePixelRatio||1), h=cvs.height/(window.devicePixelRatio||1), mid=w/2;
    addRing(ringsM, mid*0.5, h/2, &#39;Metal&#39;);
    addRing(ringsN, mid*1.5, h/2, &#39;Non&#39;);
  });

  function draw(){
    const w=cvs.width/(window.devicePixelRatio||1), h=cvs.height/(window.devicePixelRatio||1), mid=w/2;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle=&#39;rgba(200,220,255,0.35)&#39;; ctx.strokeRect(10,10,mid-20,h-20); ctx.strokeRect(mid+10,10,mid-20,h-20);
    ctx.fillStyle=&#39;rgba(220,240,255,0.85)&#39;; ctx.font=&#39;12px system-ui&#39;;
    ctx.fillText(&#39;Metal (ringing)&#39;, 16, 18); ctx.fillText(&#39;Non‑metal (dull)&#39;, mid+16, 18);

    function drawSide(arr, cx0){
      ctx.fillStyle=&#39;rgba(220,240,255,0.08)&#39;; ctx.beginPath(); ctx.arc(cx0, h/2, 28, 0, Math.PI*2); ctx.fill();
      for (const r of arr){
        r.r += r.spd; r.a *= r.decay;
        ctx.strokeStyle=`rgba(180,240,255,${r.a})`; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(r.cx, r.cy, r.r, 0, Math.PI*2); ctx.stroke();
      }
      for(let i=arr.length-1;i&gt;=0;i--){ if (arr[i].a &lt; 0.02) arr.splice(i,1); }
    }
    drawSide(ringsM, mid*0.5);
    drawSide(ringsN, mid*1.5);
    ctx.fillStyle=&#39;rgba(220,240,255,0.8)&#39;; ctx.font=&#39;12px system-ui&#39;; ctx.fillText(&#39;Click Strike to ring&#39;, 14, h-10);
  }
  return { activate(){}, deactivate(){}, updateDraw(){ draw(); } };
}

/* --13. Colour: choose examples -- */
function buildColour({controls, body}){
  const mSel = document.createElement(&#39;select&#39;);
  [
    {n:&#39;Al (silver)&#39;, c:&#39;#c0c0c0&#39;},{n:&#39;Cu (copper)&#39;,c:&#39;#b87333&#39;},{n:&#39;Au (gold)&#39;,c:&#39;#d4af37&#39;}
  ].forEach((o,i)=&gt;{ const el=document.createElement(&#39;option&#39;); el.value=o.c; el.textContent=o.n; mSel.appendChild(el); });
  const nSel = document.createElement(&#39;select&#39;);
  [

  ].forEach((o,i)=&gt;{ const el=document.createElement(&#39;option&#39;); el.value=o.c; el.textContent=o.n; nSel.appendChild(el); });
  const lm=document.createElement(&#39;span&#39;); lm.className=&#39;mini&#39;; lm.textContent=&#39;Metal&#39;;
  const ln=document.createElement(&#39;span&#39;); ln.className=&#39;mini&#39;; ln.textContent=&#39;Non‑metal&#39;;
  controls.append(lm,mSel,ln,nSel);

  const cvs = makeCanvas(body, 200); const ctx = cvs.getContext(&#39;2d&#39;);

  function draw(){
    const w=cvs.width/(window.devicePixelRatio||1), h=cvs.height/(window.devicePixelRatio||1), mid=w/2;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle=&#39;rgba(200,220,255,0.35)&#39;; ctx.strokeRect(10,10,mid-20,h-20); ctx.strokeRect(mid+10,10,mid-20,h-20);
    ctx.fillStyle=&#39;rgba(220,240,255,0.85)&#39;; ctx.font=&#39;12px system-ui&#39;;
    ctx.fillText(&#39;Metal&#39;, 16, 18); ctx.fillText(&#39;Non‑metal&#39;, mid+16, 18);

    // swatches
    ctx.fillStyle=mSel.value; ctx.fillRect(20, 40, mid-40, h-60);
    ctx.fillStyle=nSel.value; ctx.fillRect(mid+20, 40, mid-40, h-60);

    // subtle sheen on metal
    const grad=ctx.createLinearGradient(20,40,20,h-20);
    grad.addColorStop(0,&#39;rgba(255,255,255,0.18)&#39;); grad.addColorStop(0.5,&#39;rgba(255,255,255,0.0)&#39;); grad.addColorStop(1,&#39;rgba(255,255,255,0.12)&#39;);
    ctx.globalCompositeOperation=&#39;screen&#39;; ctx.fillStyle=grad; ctx.fillRect(20,40,mid-40,h-60); ctx.globalCompositeOperation=&#39;source-over&#39;;
  }
  mSel.addEventListener(&#39;change&#39;, draw); nSel.addEventListener(&#39;change&#39;, draw);
  draw();
  return { activate(){}, deactivate(){}, updateDraw(){ draw(); } };
}

<script>
  const STAGE_W = 1280;
  const STAGE_H = 549;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 63;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;
      baseScale = Math.min(windowW / STAGE_W, windowH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => { checkOrientation(); resizeStage(); });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { checkOrientation(); resizeStage(); }, 200);
  });

  checkOrientation();
  resizeStage();
</script>
