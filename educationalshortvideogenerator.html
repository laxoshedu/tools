<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Sync Quiz Generator - Live Mobile TTS & Video Recorder</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Dancing+Script&family=Fredoka:wght@300..700&family=Indie+Flower&family=Lobster&family=Merriweather:wght@300;700&family=Montserrat:wght@300;700&family=Nunito:wght@300;700&family=Open+Sans:wght@300;700&family=Oswald:wght@300;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;700&family=Raleway:wght@300;700&family=Righteous&family=Roboto:wght@300;700&family=Satisfy&family=Ubuntu:wght@300;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --accent: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            max-width: 1700px;
            justify-content: center;
            align-items: flex-start;
        }

        .panel {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            position: relative;
            margin-bottom: 20px;
        }

        .sidebar {
            flex: 1.5;
            min-width: 400px;
            max-width: 550px;
            display: flex;
            flex-direction: column;
        }

        .preview-area {
            flex: 2;
            min-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin: 0 0 15px 0;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            font-size: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        input[type="text"], select, input[type="number"], input[type="color"] {
            width: 100%;
            padding: 8px;
            background: #020617;
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input[type="color"] {
            padding: 4px;
            height: 38px;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            accent-color: var(--primary);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 15px;
            margin-bottom: 15px;
        }

        .grid-header {
            grid-column: span 2;
            font-weight: bold;
            color: var(--accent);
            margin-top: 5px;
            border-bottom: 1px solid #475569;
            padding-bottom: 5px;
        }

        #questions-container .panel {
            transition: border-color 0.3s;
            cursor: pointer;
        }

        #questions-container .panel.active-question {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: #be123c;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #add-question-btn {
            width: 100%;
            padding: 12px;
            background: #166534;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: -5px;
            transition: background 0.2s;
        }

        .canvas-container {
            position: relative;
            border: 2px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            background: #000;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        button {
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .btn-test { background: var(--accent); color: black; }
        .btn-rec-main { background: #22c55e; font-size: 1.0rem; }
        .btn-rec-stop { background: #b91c1c; font-size: 0.9rem; margin-top:6px; }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #fff;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .download-link {
            display: none;
            margin-top: 15px;
            background: #22c55e;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-content {
            background: #020617;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            max-width: 520px;
            width: 95%;
        }

        .mode-btn {
            width: 100%;
            margin-top: 10px;
            text-align: left;
            padding: 12px;
            border-radius: 6px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .mode-btn span { display: block; font-size: 0.8rem; opacity: 0.8; margin-top: 3px; }
    </style>
</head>
<body>

<div class="layout">
    <div class="sidebar">

        <div id="questions-container" onclick="handlePanelClick(event)">
            <h2>1. Questions</h2>
        </div>
        <button id="add-question-btn" onclick="addQuestionPanel()">+ Add New Question</button>

        <div class="panel" style="margin-top: 15px;">
            <h2>2. Voice & Typography</h2>
            <div class="controls-grid">
                <div class="grid-header">Offline Speech Voice</div>
                <div style="grid-column: span 2;">
                    <label>Voice Model</label>
                    <select id="voiceSelect"></select>
                </div>
            </div>

            <div class="controls-grid">
                <div class="grid-header">Question Text</div>
                <select id="fontQ" onchange="drawStatic()"></select>
                <input type="number" id="sizeQ" value="45" onchange="drawStatic()">
            </div>

            <div class="controls-grid">
                <div class="grid-header">Options Text</div>
                <select id="fontO" onchange="drawStatic()"></select>
                <input type="number" id="sizeO" value="28" onchange="drawStatic()">
            </div>

            <div class="controls-grid">
                <div class="grid-header">Countdown</div>
                <select id="fontC" onchange="drawStatic()"></select>
                <input type="number" id="sizeC" value="150" onchange="drawStatic()">
                <input type="color" id="colorC" value="#f59e0b" oninput="drawStatic()">
                <div style="grid-column: span 2; margin-top:5px;">
                    <label>Countdown Duration (Sec)</label>
                    <input type="number" id="countVal" value="5" min="3" max="30">
                </div>
            </div>

            <div class="controls-grid">
                <div class="grid-header">Explanation</div>
                <select id="fontE" onchange="drawStatic()"></select>
                <input type="number" id="sizeE" value="38" onchange="drawStatic()">
            </div>
        </div>

        <div class="panel">
            <h2>3. Visual Theme</h2>
            <div class="controls-grid">
                <div class="grid-header">Colors</div>
                <input type="color" id="bgColor1" value="#1e3a8a" oninput="drawStatic()">
                <input type="color" id="bgColor2" value="#020617" oninput="drawStatic()">
                <input type="color" id="cardColor" value="#FFFFFF" oninput="drawStatic()">
                <input type="color" id="correctColor" value="#22c55e" oninput="drawStatic()">
            </div>
        </div>

        <div class="panel">
            <h2>4. Live Preview & Recording</h2>
            <div class="btn-group">
                <button class="btn-test" onclick="testPlayback()">1. Test Play Live</button>
                <button class="btn-rec-main" onclick="openVideoModeModal()">2. REC VIDEO</button>
            </div>
            <button class="btn-rec-stop" onclick="stopAnyRecording()" style="width:100%;">Stop Live Process</button>
        </div>
    </div>

    <div class="preview-area">
        <div class="panel" style="width:100%; margin-bottom:10px;">
            <label>Canvas Resolution</label>
            <select id="resolution" onchange="resizeCanvas()">
                <option value="mobile">Mobile (9:16)</option>
                <option value="landscape" selected>Landscape (16:9)</option>
                <option value="square">Square (1:1)</option>
            </select>
        </div>

        <div class="canvas-container">
            <div id="overlay" class="overlay">
                <div class="spinner"></div>
                <div id="statusMsg">Synthesizing Speech Live & Recording...</div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
        <a id="dlLink" class="download-link">Download Generated Video</a>
    </div>
</div>

<div id="videoModeModal" class="modal-backdrop">
    <div class="modal-content">
        <h3>Select Recording Mode</h3>
        <button class="mode-btn" style="background:#16a34a;" onclick="recordActiveQuestionOnly()">
            <strong>Record Active Tab</strong>
            <span>Generates video during live TTS synthesis for active tab.</span>
        </button>
        <button class="mode-btn" style="background:#0ea5e9;" onclick="startFullCombinedRecordingMode()">
            <strong>Record Full Combined Video</strong>
            <span>Synthesizes speech and records all question tabs consecutively.</span>
        </button>
        <button style="background:#be123c; margin-top:10px; width:100%;" onclick="closeVideoModeModal()">Close</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay'), statusMsg = document.getElementById('statusMsg');

    let mediaStreamMic = null, mediaRecorder = null;
    let questionCounter = 0, availableVoices = [];
    let isProcessing = false;

    let currentVisualStage = "init";
    let activeCountdownNumber = "";

    const FONTS = ['Segoe UI', 'Arial', 'Impact', 'Georgia', 'Times New Roman'];
    const RESOLUTIONS = { 'mobile': { w: 720, h: 1280 }, 'landscape': { w: 1280, h: 720 }, 'square': { w: 1080, h: 1080 } };

    window.onload = () => {
        populateControls();
        resizeCanvas();
        addQuestionPanel();
        initVoices();
    };

    function populateControls() {
        ['fontQ','fontO','fontE','fontC'].forEach(id => FONTS.forEach(f => document.getElementById(id).add(new Option(f, f))));
    }

    function initVoices() {
        if ('speechSynthesis' in window) {
            const loadV = () => {
                availableVoices = window.speechSynthesis.getVoices();
                const sel = document.getElementById('voiceSelect');
                sel.innerHTML = '';
                availableVoices.forEach((v) => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.textContent = `${v.name} (${v.lang})`;
                    sel.appendChild(opt);
                });
            };
            loadV();
            window.speechSynthesis.onvoiceschanged = loadV;
        }
    }

    function addQuestionPanel() {
        questionCounter++;
        const p = document.createElement('div');
        p.className = 'panel question-panel';
        p.id = `question-panel-${questionCounter}`;
        p.dataset.qid = String(questionCounter);
        p.innerHTML = `
            <button class="remove-btn" onclick="removeQuestionPanel(${questionCounter})">&times;</button>
            <label>Question ${questionCounter}</label>
            <input type="text" class="q-text" value="Which planet is the largest in our solar system?">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
                <div><label>A</label><input type="text" class="q-opt" value="Earth"></div>
                <div><label>B</label><input type="text" class="q-opt" value="Mars"></div>
                <div><label>C</label><input type="text" class="q-opt" value="Jupiter"></div>
                <div><label>D</label><input type="text" class="q-opt" value="Saturn"></div>
            </div>
            <label style="margin-top:10px">Correct Answer</label>
            <select class="q-ans">
                <option value="0">A</option>
                <option value="1">B</option>
                <option value="2" selected>C</option>
                <option value="3">D</option>
            </select>
            <label style="margin-top:10px;"><input type="checkbox" class="q-expl-toggle" onchange="toggleExpl(this)"> Enable Explanation</label>
            <div class="expl-box" style="display:none; margin-top:5px;">
                <input type="text" class="q-expl-text" value="Jupiter is the largest planet in our solar system.">
            </div>
        `;
        document.getElementById('questions-container').appendChild(p);
        setActiveQuestion(p);
    }

    function toggleExpl(cb) {
        cb.closest('.panel').querySelector('.expl-box').style.display = cb.checked ? 'block' : 'none';
    }

    function removeQuestionPanel(id) {
        if (document.querySelectorAll('.question-panel').length <= 1) return;
        document.getElementById(`question-panel-${id}`).remove();
    }

    function handlePanelClick(event) {
        if (event.target.closest('.question-panel')) {
            setActiveQuestion(event.target.closest('.question-panel'));
        }
    }

    function setActiveQuestion(p) {
        document.querySelectorAll('.question-panel').forEach(el => el.classList.remove('active-question'));
        p.classList.add('active-question');
        drawStatic();
    }

    function getQuestionDataFromPanel(p) {
        if (!p) return null;
        return {
            qid: p.dataset.qid,
            questionText: p.querySelector('.q-text').value,
            options: Array.from(p.querySelectorAll('.q-opt')).map(i => i.value),
            correctAnswerIndex: p.querySelector('.q-ans').value,
            hasExplanation: p.querySelector('.q-expl-toggle').checked,
            explanationText: p.querySelector('.q-expl-text').value,
            styles: {
                qFont: document.getElementById('fontQ').value, qSize: document.getElementById('sizeQ').value,
                oFont: document.getElementById('fontO').value, oSize: document.getElementById('sizeO').value,
                eFont: document.getElementById('fontE').value, eSize: document.getElementById('sizeE').value,
                cFont: document.getElementById('fontC').value, cSize: document.getElementById('sizeC').value, cColor: document.getElementById('colorC').value,
                countVal: parseInt(document.getElementById('countVal').value)
            }
        };
    }

    function getActiveQuestionData() {
        return getQuestionDataFromPanel(document.querySelector('.question-panel.active-question'));
    }

    function speakUtterance(text, voiceName) {
        return new Promise((resolve) => {
            if (!('speechSynthesis' in window) || !text || !isProcessing) { resolve(); return; }
            window.speechSynthesis.cancel();
            const voice = availableVoices.find(v => v.name === voiceName) || availableVoices[0];
            const utt = new SpeechSynthesisUtterance(text);
            if (voice) utt.voice = voice;
            utt.rate = 0.95;
            utt.onend = () => resolve();
            utt.onerror = () => resolve();
            window.speechSynthesis.speak(utt);
        });
    }

    async function executeLiveQuizSequence(data) {
        const voiceName = document.getElementById('voiceSelect').value;

        // 1. Question Text
        currentVisualStage = "question";
        activeCountdownNumber = "";
        await speakUtterance(data.questionText, voiceName);

        if (!isProcessing) return;

        // 2. Options Intro & Options Speech
        currentVisualStage = "options";
        await speakUtterance("The options are", voiceName);
        await speakUtterance(data.options.join(', '), voiceName);

        if (!isProcessing) return;

        // 3. Countdown Intro Speech
        currentVisualStage = "countdown";
        await speakUtterance("Your time starts now", voiceName);

        // 4. Countdown Numbers
        for (let i = data.styles.countVal; i >= 1; i--) {
            if (!isProcessing) return;
            activeCountdownNumber = String(i);
            await speakUtterance(String(i), voiceName);
        }

        if (!isProcessing) return;

        // 5. Correct Answer
        currentVisualStage = "answer";
        activeCountdownNumber = "";
        const correctOptText = data.options[parseInt(data.correctAnswerIndex)];
        await speakUtterance(`The correct answer is option ${['A','B','C','D'][data.correctAnswerIndex]} ${correctOptText}`, voiceName);

        if (!isProcessing) return;

        // 6. Explanation (Conditional Check)
        if (data.hasExplanation && data.explanationText.trim()) {
            currentVisualStage = "explanation";
            await speakUtterance("The explanation is", voiceName);
            await speakUtterance(data.explanationText, voiceName);
        }
    }

    function renderLoop(data) {
        if (!isProcessing) return;
        drawFrame(data);
        requestAnimationFrame(() => renderLoop(data));
    }

    async function testPlayback() {
        const data = getActiveQuestionData();
        if (!data) return;
        isProcessing = true;
        renderLoop(data);
        await executeLiveQuizSequence(data);
        isProcessing = false;
        drawStatic();
    }

    function openVideoModeModal() { document.getElementById('videoModeModal').style.display = 'flex'; }
    function closeVideoModeModal() { document.getElementById('videoModeModal').style.display = 'none'; }

    async function setupMobileMicrophone() {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                mediaStreamMic = await navigator.mediaDevices.getUserMedia({ audio: true });
            }
        } catch (e) {
            console.warn("Microphone permission bypassed.");
        }
    }

    async function recordActiveQuestionOnly() {
        closeVideoModeModal();
        const data = getActiveQuestionData();
        if (!data) return;

        await setupMobileMicrophone();

        overlay.style.display = 'flex';
        statusMsg.innerText = "Synthesizing Speech Live & Recording Video...";
        isProcessing = true;

        const canvasStream = canvas.captureStream(30);
        let tracks = [...canvasStream.getVideoTracks()];

        if (mediaStreamMic) {
            tracks.push(mediaStreamMic.getAudioTracks()[0]);
        }

        const combinedStream = new MediaStream(tracks);
        let mime = 'video/webm';
        if (MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';

        mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mime });
        let chunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.getElementById('dlLink');
            a.href = url;
            a.download = `quiz_video_export.${mime.includes('mp4')?'mp4':'webm'}`;
            a.style.display = 'block';
            overlay.style.display = 'none';
        };

        mediaRecorder.start();
        renderLoop(data);
        await executeLiveQuizSequence(data);

        isProcessing = false;
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
        drawStatic();
    }

    async function startFullCombinedRecordingMode() {
        closeVideoModeModal();
        const panels = Array.from(document.querySelectorAll('.question-panel'));
        if (!panels.length) return;

        await setupMobileMicrophone();

        overlay.style.display = 'flex';
        statusMsg.innerText = "Recording Full Combined Video...";
        isProcessing = true;

        const canvasStream = canvas.captureStream(30);
        let tracks = [...canvasStream.getVideoTracks()];

        if (mediaStreamMic) {
            tracks.push(mediaStreamMic.getAudioTracks()[0]);
        }

        const combinedStream = new MediaStream(tracks);
        let mime = 'video/webm';
        if (MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';

        mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mime });
        let chunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.getElementById('dlLink');
            a.href = url;
            a.download = `quiz_FULL_COMBINED.${mime.includes('mp4')?'mp4':'webm'}`;
            a.style.display = 'block';
            overlay.style.display = 'none';
        };

        mediaRecorder.start();

        for (let i = 0; i < panels.length; i++) {
            if (!isProcessing) break;
            const p = panels[i];
            setActiveQuestion(p);
            const data = getQuestionDataFromPanel(p);
            renderLoop(data);
            await executeLiveQuizSequence(data);
        }

        isProcessing = false;
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
        drawStatic();
    }

    function drawStatic() {
        const data = getActiveQuestionData();
        currentVisualStage = "all";
        drawFrame(data);
    }

    function drawFrame(data) {
        if (!data) return;
        const w = canvas.width, h = canvas.height;

        const bg = ctx.createLinearGradient(0,0,0,h);
        bg.addColorStop(0, document.getElementById('bgColor1').value);
        bg.addColorStop(1, document.getElementById('bgColor2').value);
        ctx.fillStyle = bg;
        ctx.fillRect(0,0,w,h);

        if (currentVisualStage !== "init") {
            ctx.fillStyle = 'white';
            ctx.font = `bold ${data.styles.qSize}px "${data.styles.qFont}"`;
            ctx.textAlign = 'center';
            wrapText(ctx, data.questionText, w/2, h*0.15, w*0.9, data.styles.qSize * 1.3);
        }

        if (["options", "countdown", "answer", "explanation", "all"].includes(currentVisualStage)) {
            const isP = h > w;
            const bH = isP ? h*0.07 : h*0.1;
            const bW = isP ? w*0.85 : w*0.4;
            const cardColor = document.getElementById('cardColor').value;
            const correctColor = document.getElementById('correctColor').value;
            const correctIndex = parseInt(data.correctAnswerIndex);

            const pos = isP
                ? Array.from({length:4},(_,i)=>({x:w/2, y:h*0.4 + i*(bH+15)}))
                : [
                    {x:w/2-bW/2-10, y:h*0.45}, {x:w/2+bW/2+10, y:h*0.45},
                    {x:w/2-bW/2-10, y:h*0.45+bH+15}, {x:w/2+bW/2+10, y:h*0.45+bH+15}
                ];

            data.options.forEach((opt, i) => {
                let color = `${cardColor}1A`;
                if (["answer", "explanation", "all"].includes(currentVisualStage)) {
                    color = (i === correctIndex) ? correctColor : `${cardColor}1A`;
                }

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(pos[i].x - bW/2, pos[i].y - bH/2, bW, bH, 10);
                ctx.fill();

                ctx.fillStyle = '#f59e0b';
                ctx.font = `bold ${bH*0.4}px Arial`;
                ctx.textAlign = 'left';
                ctx.fillText(['A','B','C','D'][i], pos[i].x - bW/2 + 20, pos[i].y + 5);

                ctx.fillStyle = 'white';
                ctx.font = `${data.styles.oSize}px "${data.styles.oFont}"`;
                ctx.fillText(opt, pos[i].x - bW/2 + 60, pos[i].y + 5);
            });
        }

        if (currentVisualStage === "countdown" && activeCountdownNumber) {
            ctx.fillStyle = data.styles.cColor;
            ctx.font = `bold ${data.styles.cSize}px "${data.styles.cFont}"`;
            ctx.textAlign = 'center';
            ctx.fillText(activeCountdownNumber, w/2, h*0.85);
        }

        if (data.hasExplanation && data.explanationText.trim() && ["explanation", "all"].includes(currentVisualStage)) {
            ctx.fillStyle = 'white';
            ctx.font = `bold ${data.styles.eSize}px "${data.styles.eFont}"`;
            ctx.textAlign = 'center';
            wrapText(ctx, data.explanationText, w/2, h*0.82, w*0.9, data.styles.eSize * 1.3);
        }
    }

    function resizeCanvas() {
        const r = RESOLUTIONS[document.getElementById('resolution').value];
        canvas.width = r.w; canvas.height = r.h;
        drawStatic();
    }

    function wrapText(c, text, x, y, maxW, lineH) {
        const words = text.split(' ');
        let line = '';
        for (let i = 0; i < words.length; i++) {
            let testLine = line + words[i] + ' ';
            if (c.measureText(testLine).width > maxW && i > 0) {
                c.fillText(line, x, y);
                line = words[i] + ' ';
                y += lineH;
            } else {
                line = testLine;
            }
        }
        c.fillText(line, x, y);
    }

    function stopAnyRecording() {
        isProcessing = false;
        window.speechSynthesis.cancel();
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        overlay.style.display = 'none';
        drawStatic();
    }
</script>
</body>
</html>
