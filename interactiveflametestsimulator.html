<!DOCTYPE html>
<html lang="en">
<head>

<title>Interactive Flame Test Simulator</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100dvh; margin: 0; padding: 0;
    overflow: hidden; background: #070b14;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  #viewportContainer {
    position: fixed; inset: 0; width: 100%; height: 100dvh;
    overflow: hidden; background: #070b14;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  #appStage {
    width: 1920px;
    height: 1080px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform-style: flat;
  }

  #appStage iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  /* FLOATING MOBILE NAVIGATION, PAN & ZOOM BAR */
  .nav-overlay-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99990;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;
    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

  /* UNHIDE TRIGGER BUTTON */
  .nav-toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99989;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #7bd1ff; font-size: 0.9rem;
    display: none; place-items: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .nav-toggle-btn.visible {
    display: grid !important;
  }

  /* HIGH-END PROFESSIONAL ROTATE OVERLAY */
  .rotate-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }
  .rotate-card {
    width: min(440px, 90vw); padding: 36px 28px; border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .rotate-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    background: rgba(123, 209, 255, 0.12); border: 1px solid rgba(123, 209, 255, 0.3);
    color: #7bd1ff; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .rotate-icon-wrap {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;
    animation: phoneRotate 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff, #a7b3d8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {
    margin: 0; color: #94a3b8; font-size: 0.92rem; line-height: 1.5; font-weight: 450;
  }
  .btn-rotate {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, #65c9ff, #3b82f6);
    color: #061225; font-weight: 800; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>
</head>

</div>
<div class="nav-toggle-btn" id="navToggleBtn" onclick="toggleNavBar(false)" title="Show Controls">⚙️</div>

<div id="viewportContainer">

&lt;style&gt;
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#05080d;
    --panel:#0c1119;
    --panel2:#111923;
    --border:#263344;
    --text:#edf4ff;
    --muted:#8e9daf;
    --blue:#1687ff;
}

body{
    background:
        radial-gradient(circle at 50% -20%,#18334d 0%,transparent 45%),
        linear-gradient(#05080d,#070b11);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
}

/* HEADER */
header{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    border-bottom:1px solid #182230;
    background:rgba(3,6,10,.9);
}

.title{
    text-align:center;
    flex:1;
}

.title h1{
    font-size:27px;
    letter-spacing:.5px;
}

.title p{
    color:#8d9caf;
    font-size:13px;
    margin-top:4px;
}

.top-btns{
    display:flex;
    gap:8px;
}

.top-btn{
    background:#0e151f;
    border:1px solid #263344;
    color:white;
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
}

/* MAIN */
.wrapper{
    width:calc(100% - 28px);
    max-width:1500px;
    margin:auto;
    padding:14px 0 30px;
}

/* SIMULATION CANVAS */
.simulation{
    height:600px;
    position:relative;
    overflow:hidden;
    border:1px solid #263344;
    border-radius:15px;
    background:
        linear-gradient(rgba(2,5,9,.45), rgba(2,5,9,.72)),
        radial-gradient(ellipse at 50% 30%, #17283a, #080d13 70%);
    box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 0 100px rgba(0,0,0,.4);
}

.lab-bg{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.shelf{
    position:absolute; left:0; right:0; height:8px;
    background:#151e28; box-shadow:0 0 15px #000;
}
.shelf.s1{top:90px}
.shelf.s2{top:180px}

.bottle{
    position:absolute; bottom:410px; width:24px; height:48px;
    border:2px solid #334252; border-radius:5px 5px 8px 8px; opacity:.35;
}
.bottle:before{
    content:&quot;&quot;; position:absolute; width:12px; height:9px; left:4px; top:-10px;
    border:2px solid #334252; border-bottom:none;
}
.b1{left:7%} .b2{left:14%;height:35px} .b3{left:22%;height:55px}
.b4{left:78%;height:40px} .b5{left:85%;height:55px} .b6{left:92%;height:33px}

.grid{
    position:absolute; left:0; right:0; bottom:0; height:170px;
    background: linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:45px 45px;
    transform:perspective(400px) rotateX(50deg) scale(1.5);
    transform-origin:bottom; opacity:.35;
}

.table{
    position:absolute; bottom:0; left:0; right:0; height:100px;
    background: linear-gradient(#252f39,#111820);
    border-top:3px solid #354250;
}

#burnerLayer{ position:absolute; inset:0; }

/* BURNER &amp; FLAME */
.burner{
    position:absolute;
    width:140px;
    height:350px;
    bottom:38px;
    transform:translateX(-50%);
    cursor:grab;
    user-select:none;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.burner:active{ cursor:grabbing; }

/* DROPDOWN STYLING ON BURNER */
.burner-select {
    position: absolute;
    bottom: -25px;
    width: 120px;
    background: #1a2533;
    color: white;
    border: 1px solid #4ca3ff;
    border-radius: 4px;
    font-size: 11px;
    padding: 2px;
    cursor: pointer;
    z-index: 10;
}

.burner-label{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    white-space:nowrap; text-align:center; font-weight:bold; font-size:14px;
    text-shadow:0 2px 8px black;
}

.flame{
    position:absolute; width:76px; height:190px; left:50%; bottom:200px;
    transform:translateX(-50%) scale(.85); transform-origin:bottom;
    opacity:0; transition:opacity .25s, filter 0.3s;
    filter: drop-shadow(0 0 10px var(--flame)) drop-shadow(0 0 25px var(--flame));
}
.flame.on{ opacity:1; }

.flame-core{
    position:absolute; width:35px; height:120px; left:21px; bottom:0;
    border-radius:50% 50% 45% 45%;
    background: radial-gradient(ellipse at 50% 85%, white 0%, #fffbd2 20%, #ffe98a 45%, var(--flame) 75%, transparent 100%);
    filter:blur(1px); animation:coreFlicker .11s infinite alternate;
}
.flame-middle{
    position:absolute; width:55px; height:155px; left:10px; bottom:0;
    border-radius:55% 45% 50% 50%;
    background: radial-gradient(ellipse at 50% 80%, rgba(255,255,255,.9), var(--flame) 38%, transparent 100%);
    filter:blur(3px); animation:flameMove .18s infinite alternate;
}
.flame-outer{
    position:absolute; width:75px; height:185px; left:0; bottom:0;
    border-radius:55% 45% 50% 50%;
    background: radial-gradient(ellipse at 50% 80%, var(--flame) 0%, transparent 78%);
    filter:blur(7px); animation:flameMove .13s infinite alternate;
}

@keyframes coreFlicker{ from{transform:scaleX(.9)} to{transform:scaleX(1.1)} }
@keyframes flameMove{ from{transform:rotate(-2deg)} to{transform:rotate(2deg)} }

/* BURNER PARTS */
.base{ position:absolute; bottom:15px; width:115px; height:27px; border-radius:50%; background:linear-gradient(#77838d,#10151a); border:2px solid #626d76; }
.tube{ position:absolute; bottom:52px; width:47px; height:170px; border-radius:9px; background:linear-gradient(90deg, #172027, #a3adb4 30%, #11181e); border:1px solid #6d7780; }

/* CONTROLS */
.controls{
    margin-top:14px;
    display:grid;
    grid-template-columns:280px 1fr 330px;
    gap:14px;
}

.panel{ background:linear-gradient(145deg,#0d141d,#090e15); border:1px solid #243140; border-radius:14px; padding:18px; }
.panel h2{ font-size:17px; margin-bottom:15px; }
.panel h2.blue{color:#4ca3ff} .panel h2.orange{color:#ffb52d}

.control-btn{
    width:100%; padding:12px; margin-bottom:9px; border-radius:8px;
    font-weight:bold; background:#126fe0; color: white; cursor: pointer; border: 0;
}
.control-btn.orange { background: #e67e22; }
.control-btn.red{ background:#d93838; }
.control-btn.green{ background:#0c9f72; }

.status-list{ display:flex; flex-direction:column; gap:8px; max-height:260px; overflow:auto; }
.status-item{
    display:flex; align-items:center; gap:10px; padding:9px;
    background:#111923; border:1px solid #273543; border-radius:8px; cursor: pointer;
}
.status-item.active { border-color: #1687ff; background: #1a2635; }
.status-flame{ width:16px; height:16px; border-radius:50%; background:var(--c); box-shadow: 0 0 10px var(--c); }

.info-box{ background:#0c131c; border:1px solid #243140; border-radius:14px; padding:18px; margin-top: 15px; }
.wavelength{ margin-top:15px; height:20px; border-radius:10px; background:linear-gradient(90deg, #6900ff, #004cff, #00c9ff, #00ff71, #ffff00, #ff9900, #ff0000); position:relative; }
.wavelength-marker{ position:absolute; top:-5px; width:4px; height:30px; background:white; box-shadow:0 0 8px white; }

&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;header&gt;
    &lt;div class=&quot;title&quot;&gt;
        &lt;h1&gt;FLAME TEST SIMULATOR PRO&lt;/h1&gt;
        &lt;p&gt;Individual Burner Control &amp; Element Selection&lt;/p&gt;

&lt;div class=&quot;wrapper&quot;&gt;

    &lt;section class=&quot;simulation&quot; id=&quot;simulation&quot;&gt;
        &lt;div class=&quot;lab-bg&quot;&gt;
            &lt;div class=&quot;shelf s1&quot;&gt;&lt;/div&gt;&lt;div class=&quot;shelf s2&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;bottle b1&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bottle b2&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bottle b3&quot;&gt;&lt;/div&gt;

            &lt;h2 class=&quot;blue&quot;&gt;MASTER CONTROLS&lt;/h2&gt;
            
            &lt;button class=&quot;control-btn orange&quot; onclick=&quot;igniteSelected()&quot;&gt;
                ⚡ Ignite Selected Burner
            &lt;/button&gt;

            &lt;button class=&quot;control-btn&quot; onclick=&quot;igniteAll()&quot;&gt;
                🔥 Ignite All Burners
            &lt;/button&gt;

            &lt;button class=&quot;control-btn red&quot; onclick=&quot;extinguishAll()&quot;&gt;
                ✕ Extinguish All
            &lt;/button&gt;

            &lt;button class=&quot;control-btn green&quot; onclick=&quot;addBurner()&quot;&gt;
                ＋ Add New Burner
            &lt;/button&gt;

            &lt;hr style=&quot;border:0; border-top:1px solid #263344; margin:15px 0;&quot;&gt;

            &lt;div style=&quot;font-size:13px; color:#8e9daf;&quot;&gt;
                &lt;p&gt;1. Select a burner by clicking it.&lt;/p&gt;
                &lt;p&gt;2. Use the &lt;b&gt;dropdown on the burner&lt;/b&gt; to change its element.&lt;/p&gt;
                &lt;p&gt;3. Use &lt;b&gt;Ignite Selected&lt;/b&gt; to light just that one.&lt;/p&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;panel&quot;&gt;
            &lt;h2 class=&quot;blue&quot; style=&quot;color:#29e0a5&quot;&gt;ELEMENT PROPERTIES&lt;/h2&gt;
            &lt;div id=&quot;selectedInfo&quot;&gt;
                &lt;p style=&quot;color:#8e9daf&quot;&gt;Select a burner to see element details...&lt;/p&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;panel&quot;&gt;
            &lt;h2 class=&quot;orange&quot;&gt;BURNER STATUS&lt;/h2&gt;

&lt;script&gt;
const elements = {
    Li: { name: &quot;Lithium&quot;, symbol: &quot;Li&quot;, colour: &quot;Crimson Red&quot;, hex: &quot;#ff2447&quot;, wavelength: &quot;671 nm&quot; },
    Na: { name: &quot;Sodium&quot;, symbol: &quot;Na&quot;, colour: &quot;Yellow&quot;, hex: &quot;#ffd21f&quot;, wavelength: &quot;589 nm&quot; },
    K: { name: &quot;Potassium&quot;, symbol: &quot;K&quot;, colour: &quot;Lilac&quot;, hex: &quot;#b66cff&quot;, wavelength: &quot;766 nm&quot; },
    Ca: { name: &quot;Calcium&quot;, symbol: &quot;Ca&quot;, colour: &quot;Orange-Red&quot;, hex: &quot;#ff6338&quot;, wavelength: &quot;622 nm&quot; },
    Cu: { name: &quot;Copper&quot;, symbol: &quot;Cu&quot;, colour: &quot;Blue-Green&quot;, hex: &quot;#00d7c2&quot;, wavelength: &quot;510 nm&quot; },
    Sr: { name: &quot;Strontium&quot;, symbol: &quot;Sr&quot;, colour: &quot;Crimson Red&quot;, hex: &quot;#ff183c&quot;, wavelength: &quot;650 nm&quot; },
    Ba: { name: &quot;Barium&quot;, symbol: &quot;Ba&quot;, colour: &quot;Apple Green&quot;, hex: &quot;#62ef35&quot;, wavelength: &quot;525 nm&quot; },
    Cs: { name: &quot;Cesium&quot;, symbol: &quot;Cesium&quot;, colour: &quot;Blue&quot;, hex: &quot;#4d75ff&quot;, wavelength: &quot;455 nm&quot; }
};

let burners = [];
let selectedBurnerId = null;
let burnerCounter = 0;

function addBurner(elementKey = &quot;Na&quot;) {
    burnerCounter++;
    const id = burnerCounter;
    
    const burnerObj = {
        id: id,
        element: elementKey,
        lit: false,
        x: 20 + (burners.length * 20) % 60
    };

    burners.push(burnerObj);
    createBurnerDOM(burnerObj);
    selectBurner(id);
    updateStatusList();
}

function createBurnerDOM(data) {
    const burnerWrap = document.createElement(&quot;div&quot;);
    burnerWrap.className = &quot;burner&quot;;
    burnerWrap.id = `burner-${data.id}`;
    burnerWrap.style.left = `${data.x}%`;

    // Create Dropdown HTML
    let optionsHtml = &quot;&quot;;
    for (let key in elements) {
        optionsHtml += `&lt;option value=&quot;${key}&quot; ${key === data.element ? &#39;selected&#39; : &#39;&#39;}&gt;${elements[key].name}&lt;/option&gt;`;
    }

    burnerWrap.innerHTML = `
        &lt;div class=&quot;burner-label&quot;&gt;
            &lt;span class=&quot;bn&quot;&gt;Burner ${data.id}&lt;/span&gt;&lt;br&gt;
            &lt;small id=&quot;label-el-${data.id}&quot;&gt;${elements[data.element].name}&lt;/small&gt;
        &lt;/div&gt;
        &lt;div class=&quot;flame&quot; id=&quot;flame-${data.id}&quot; style=&quot;--flame:${elements[data.element].hex}&quot;&gt;
            &lt;div class=&quot;flame-outer&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;flame-middle&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;flame-core&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;tube&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;base&quot;&gt;&lt;/div&gt;
        &lt;select class=&quot;burner-select&quot; onchange=&quot;changeBurnerElement(${data.id}, this.value)&quot; onclick=&quot;event.stopPropagation()&quot;&gt;
            ${optionsHtml}
        &lt;/select&gt;
    `;

    burnerWrap.onclick = () =&gt; selectBurner(data.id);
    
    // Drag Logic
    let isDragging = false;
    burnerWrap.onmousedown = (e) =&gt; {
        if(e.target.tagName === &#39;SELECT&#39;) return;
        isDragging = true;
        burnerWrap.style.cursor = &quot;grabbing&quot;;
    };

    document.addEventListener(&quot;mousemove&quot;, (e) =&gt; {
        if (!isDragging) return;
        const sim = document.getElementById(&quot;simulation&quot;);
        const rect = sim.getBoundingClientRect();
        let newX = ((e.clientX - rect.left) / rect.width) * 100;
        newX = Math.max(5, Math.min(95, newX));
        burnerWrap.style.left = `${newX}%`;
        data.x = newX;
    });

    document.addEventListener(&quot;mouseup&quot;, () =&gt; {
        isDragging = false;
        burnerWrap.style.cursor = &quot;grab&quot;;
    });

    document.getElementById(&quot;burnerLayer&quot;).appendChild(burnerWrap);
}

function selectBurner(id) {
    selectedBurnerId = id;
    document.querySelectorAll(&#39;.burner&#39;).forEach(b =&gt; b.style.filter = &quot;&quot;);
    const active = document.getElementById(`burner-${id}`);
    if (active) active.style.filter = &quot;drop-shadow(0 0 10px #1687ff)&quot;;
    
    updateSelectedInfo();
    updateStatusList();
}

function changeBurnerElement(id, elementKey) {
    const burner = burners.find(b =&gt; b.id === id);
    if (!burner) return;

    burner.element = elementKey;
    const elData = elements[elementKey];
    
    // Update Flame Color
    const flame = document.getElementById(`flame-${id}`);
    flame.style.setProperty(&quot;--flame&quot;, elData.hex);
    
    // Update Label
    document.getElementById(`label-el-${id}`).textContent = elData.name;
    
    updateSelectedInfo();
    updateStatusList();
}

function igniteSelected() {
    if (!selectedBurnerId) {
        alert(&quot;Please select a burner first!&quot;);
        return;
    }
    const burner = burners.find(b =&gt; b.id === selectedBurnerId);
    burner.lit = !burner.lit;
    renderFlames();
    updateStatusList();
}

function igniteAll() {
    burners.forEach(b =&gt; b.lit = true);
    renderFlames();
    updateStatusList();
}

function extinguishAll() {
    burners.forEach(b =&gt; b.lit = false);
    renderFlames();
    updateStatusList();
}

function renderFlames() {
    burners.forEach(b =&gt; {
        const flameEl = document.getElementById(`flame-${b.id}`);
        if (b.lit) flameEl.classList.add(&quot;on&quot;);
        else flameEl.classList.remove(&quot;on&quot;);
    });
}

function updateStatusList() {
    const list = document.getElementById(&quot;statusList&quot;);
    list.innerHTML = &quot;&quot;;
    burners.forEach(b =&gt; {
        const el = elements[b.element];
        const item = document.createElement(&quot;div&quot;);
        item.className = `status-item ${b.id === selectedBurnerId ? &#39;active&#39; : &#39;&#39;}`;
        item.innerHTML = `
            &lt;div class=&quot;status-flame&quot; style=&quot;--c:${el.hex}&quot;&gt;&lt;/div&gt;
            &lt;div style=&quot;flex:1&quot;&gt;
                &lt;b&gt;Burner ${b.id}&lt;/b&gt; - &lt;small&gt;${el.symbol}&lt;/small&gt;
            &lt;/div&gt;
            &lt;span style=&quot;color:${b.lit ? &#39;#4ca3ff&#39; : &#39;#555&#39;}&quot;&gt;${b.lit ? &#39;ON&#39; : &#39;OFF&#39;}&lt;/span&gt;
        `;
        item.onclick = () =&gt; selectBurner(b.id);
        list.appendChild(item);
    });
}

function updateSelectedInfo() {
    const container = document.getElementById(&quot;selectedInfo&quot;);
    const burner = burners.find(b =&gt; b.id === selectedBurnerId);
    
    if (!burner) return;
    const el = elements[burner.element];

    const pos = ((parseInt(el.wavelength) - 380) / (750 - 380)) * 100;

    container.innerHTML = `
        &lt;h3 style=&quot;margin-bottom:10px&quot;&gt;${el.name} (${el.symbol})&lt;/h3&gt;
        &lt;p&gt;Flame Color: &lt;b style=&quot;color:${el.hex}&quot;&gt;${el.colour}&lt;/b&gt;&lt;/p&gt;
        &lt;p&gt;Wavelength: &lt;b&gt;${el.wavelength}&lt;/b&gt;&lt;/p&gt;
        &lt;div class=&quot;wavelength&quot;&gt;
            &lt;div class=&quot;wavelength-marker&quot; style=&quot;left:${pos}%&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p style=&quot;margin-top:15px; font-size:12px; color:#8e9daf&quot;&gt;
            This element emits light when electrons drop from an excited state back to the ground state.
        &lt;/p&gt;
    `;
}

function resetLab() {
    document.getElementById(&quot;burnerLayer&quot;).innerHTML = &quot;&quot;;
    burners = [];
    burnerCounter = 0;
    selectedBurnerId = null;
    addBurner(&quot;Na&quot;);
    addBurner(&quot;Cu&quot;);
    addBurner(&quot;Li&quot;);
}

// Init
addBurner(&quot;Na&quot;);
addBurner(&quot;Cu&quot;);
addBurner(&quot;Li&quot;);

&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1920;
  const STAGE_H = 1080;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
</html>
