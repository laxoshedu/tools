<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<title>States of Matter</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100dvh; margin: 0; padding: 0;
    overflow: hidden; background: #070b14;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  #viewportContainer {
    position: fixed; inset: 0; width: 100%; height: 100dvh;
    overflow: hidden; background: #070b14;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  #appStage {
    width: 1067px;
    height: 600px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform-style: flat;
  }

  #appStage iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  /* FLOATING MOBILE NAVIGATION, PAN & ZOOM BAR */
  .nav-overlay-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99990;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;
    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

  /* UNHIDE TRIGGER BUTTON */
  .nav-toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99989;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #7bd1ff; font-size: 0.9rem;
    display: none; place-items: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .nav-toggle-btn.visible {
    display: grid !important;
  }

  /* HIGH-END PROFESSIONAL ROTATE OVERLAY */
  .rotate-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }
  .rotate-card {
    width: min(440px, 90vw); padding: 36px 28px; border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .rotate-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    background: rgba(123, 209, 255, 0.12); border: 1px solid rgba(123, 209, 255, 0.3);
    color: #7bd1ff; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .rotate-icon-wrap {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;
    animation: phoneRotate 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff, #a7b3d8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {
    margin: 0; color: #94a3b8; font-size: 0.92rem; line-height: 1.5; font-weight: 450;
  }
  .btn-rotate {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, #65c9ff, #3b82f6);
    color: #061225; font-weight: 800; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>
</head>
<body>

<!-- ROTATE SCREEN PROMPT -->
<div class="rotate-overlay" id="rotateOverlay">
  <div class="rotate-card">
    <div class="rotate-badge">Display Notice</div>
    <div class="rotate-icon-wrap">📱</div>

<!-- FLOATING MOBILE NAVIGATION, PAN & ZOOM OVERLAY -->
<div class="nav-overlay-bar" id="navOverlayBar">
  <div class="nav-btn" onclick="navBack()" title="Back Page">◀</div>
  <div class="nav-btn" onclick="navForward()" title="Forward Page">▶</div>
  <div class="nav-divider"></div>
  <div class="nav-btn" onclick="zoomIn()" title="Zoom In">+</div>
  <div class="nav-btn" onclick="zoomOut()" title="Zoom Out">−</div>

  <div class="nav-btn" onclick="panStage(0, -60)" title="Pan Up">⬆</div>
  <div class="nav-btn" onclick="panStage(0, 60)" title="Pan Down">⬇</div>
  <div class="nav-btn" onclick="panStage(-60, 0)" title="Pan Left">⬅</div>
  <div class="nav-btn" onclick="panStage(60, 0)" title="Pan Right">➡</div>
  <div class="nav-btn" id="panDragToggleBtn" onclick="togglePanDragMode()" title="Drag Pan Mode">🖐️</div>
  <div class="nav-divider"></div>
  <div class="nav-btn" onclick="toggleNavBar(true)" title="Hide Controls">✕</div>
</div>
<div class="nav-toggle-btn" id="navToggleBtn" onclick="toggleNavBar(false)" title="Show Controls">⚙️</div>

<!-- MAIN VIEWPORT STAGE -->
<div id="viewportContainer">
  <div id="appStage">
    <iframe id="contentFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
  &lt;title&gt;States of Matter &amp; Fluid Simulation&lt;/title&gt;
  &lt;style&gt;
    :root {
      --bg: #090d16;
      --card: #161f32;
      --accent: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;

      --border: #26334d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    .header { text-align: center; margin-bottom: 20px; }

    .header p { font-size: 0.9rem; color: var(--subtext); margin-top: 4px; }

    .container { width: 100%; max-width: 920px; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }

    .sim-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; position: relative; }
    canvas { background: #030712; border-radius: 8px; border: 2px solid var(--border); }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }

    .state-badge { position: absolute; top: 25px; left: 25px; padding: 6px 14px; background: rgba(9, 13, 22, 0.85); backdrop-filter: blur(4px); border: 1px solid var(--accent); border-radius: 20px; color: var(--accent); font-weight: 700; font-size: 0.85rem; transition: 0.3s; }
    .state-badge.max-press { border-color: var(--danger); color: var(--danger); }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

  &lt;div class=&quot;header&quot;&gt;
    &lt;h1&gt;States of Matter &amp; Fluid Simulation&lt;/h1&gt;
    &lt;p&gt;Temperature &amp; Pressure Driven Phase Transitions&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;container&quot;&gt;
    &lt;div class=&quot;sim-box&quot;&gt;
      &lt;div class=&quot;state-badge&quot; id=&quot;stateBadge&quot;&gt;SOLID&lt;/div&gt;
      &lt;canvas id=&quot;simCanvas&quot; width=&quot;500&quot; height=&quot;420&quot;&gt;&lt;/canvas&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;div&gt;
        &lt;label style=&quot;margin-bottom: 6px;&quot;&gt;SIMULATION MODE&lt;/label&gt;
        &lt;div class=&quot;mode-switch&quot;&gt;
          &lt;button class=&quot;mode-btn active&quot; id=&quot;btnTempMode&quot; onclick=&quot;setMode(&#39;temp&#39;)&quot;&gt;Temperature Mode&lt;/button&gt;
          &lt;button class=&quot;mode-btn&quot; id=&quot;btnPressMode&quot; onclick=&quot;setMode(&#39;press&#39;)&quot;&gt;Pressure Piston Mode&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;control-group&quot; id=&quot;tempControl&quot;&gt;
        &lt;label&gt;TEMPERATURE &lt;span id=&quot;tempVal&quot;&gt;-20 °C&lt;/span&gt;&lt;/label&gt;
        &lt;input type=&quot;range&quot; id=&quot;tempSlider&quot; min=&quot;-50&quot; max=&quot;180&quot; value=&quot;-20&quot; oninput=&quot;updateControls()&quot;&gt;
      &lt;/div&gt;

      &lt;div class=&quot;control-group&quot; id=&quot;pressControl&quot;&gt;
        &lt;label&gt;PRESSURE (PISTON) &lt;span id=&quot;pressVal&quot;&gt;1.0 atm&lt;/span&gt;&lt;/label&gt;
        &lt;input type=&quot;range&quot; id=&quot;pressSlider&quot; min=&quot;1&quot; max=&quot;25&quot; value=&quot;1&quot; step=&quot;0.5&quot; oninput=&quot;updateControls()&quot;&gt;
      &lt;/div&gt;

      &lt;div class=&quot;readouts&quot;&gt;
        &lt;div class=&quot;stat-card&quot;&gt;
          &lt;div class=&quot;stat-label&quot;&gt;Phase State&lt;/div&gt;
          &lt;div class=&quot;stat-val&quot; id=&quot;dispState&quot;&gt;Solid&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-card&quot;&gt;
          &lt;div class=&quot;stat-label&quot;&gt;Liquid Volume&lt;/div&gt;
          &lt;div class=&quot;stat-val&quot; id=&quot;dispVolume&quot;&gt;0.0 mL&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-card&quot;&gt;
          &lt;div class=&quot;stat-label&quot;&gt;Temperature&lt;/div&gt;
          &lt;div class=&quot;stat-val&quot; id=&quot;dispTemp&quot;&gt;-20 °C&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-card&quot;&gt;
          &lt;div class=&quot;stat-label&quot;&gt;Pressure&lt;/div&gt;
          &lt;div class=&quot;stat-val&quot; id=&quot;dispPressure&quot;&gt;1.0 atm&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    const canvas = document.getElementById(&#39;simCanvas&#39;);
    const ctx = canvas.getContext(&#39;2d&#39;);

    const RADIUS = 8;
    const CONTAINER_LEFT = 90;
    const CONTAINER_RIGHT = 410;
    const CONTAINER_BOTTOM = 380;
    const OPEN_TOP_Y = 110;

    const NUM_PARTICLES = 66; 
    const MAX_LIQUID_HEIGHT = 80; 
    const MAX_PISTON_LIMIT_Y = CONTAINER_BOTTOM - 60 - 15;

    let mode = &#39;temp&#39;;
    let tempC = -20;
    let pressureAtm = 1.0;
    let pistonY = 120;
    let isMaxPressure = false;

    let waveOffset = 0;
    let evapTimer = 0;
    let condenseTimer = 0;

    let particles = [];

    class Particle {
      constructor(index) {
        this.index = index;
        this.x = 250;
        this.y = 300;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.tx = 0; 
        this.ty = 0; 
        this.isGas = false;     // True if particle has evaporated
        this.isFalling = false; // True during slow condensation re-entry
      }

      computeLatticeTarget() {
        let r = 0, c = 0, count = 0;
        for (let row = 0; row &lt; 4; row++) {
          let numColsInRow = (row % 2 === 0) ? 17 : 16;
          if (this.index &lt; count + numColsInRow) {
            r = row;
            c = this.index - count;
            break;
          }
          count += numColsInRow;
        }

        let spacing = (CONTAINER_RIGHT - CONTAINER_LEFT - 2 * RADIUS) / 16;
        let rowHeight = spacing * 0.866; 
        
        let startX = CONTAINER_LEFT + RADIUS;
        if (r % 2 === 1) {
          startX += spacing / 2;
        }

        this.tx = startX + c * spacing;
        this.ty = CONTAINER_BOTTOM - RADIUS - 4 - (r * rowHeight);
      }

      update(liquidSurfaceY) {
        if (mode === &#39;temp&#39;) {
          this.updateTempMode(liquidSurfaceY);
        } else {
          this.updatePressMode();
        }
      }

      updateTempMode(liquidSurfaceY) {
        if (tempC &lt; 0) {
          // EXTREME SOLID: Rigid lattice, ZERO vibration
          this.isGas = false;
          this.isFalling = false;
          this.computeLatticeTarget();
          this.x += (this.tx - this.x) * 0.25;
          this.y += (this.ty - this.y) * 0.25;
          this.vx = 0; this.vy = 0;
        } 
        else if (tempC === 0) {
          // SOLID AT 0°C: Lattice with thermal vibration
          this.isGas = false;
          this.isFalling = false;
          this.computeLatticeTarget();
          let vib = 0.8;
          this.x = this.tx + (Math.random() - 0.5) * vib;
          this.y = this.ty + (Math.random() - 0.5) * vib;
          this.vx = 0; this.vy = 0;
        } 
        else if (tempC &gt; 0 &amp;&amp; tempC &lt;= 100) {
          // LIQUID STATE (0°C to 100°C)
          if (this.isFalling) {
            // SLOW CONDENSATION FALLING PROCESS
            this.y += 0.7; // Gentle, very slow downward motion
            this.x += Math.sin(this.y * 0.05) * 0.3; // Gentle floating sway

            // Re-absorbed when touching liquid pool or container floor
            let targetFloor = (liquidSurfaceY &lt; CONTAINER_BOTTOM) ? liquidSurfaceY : CONTAINER_BOTTOM - RADIUS;
            if (this.y &gt;= targetFloor) {
              this.y = targetFloor;
              this.isGas = false;
              this.isFalling = false;
              this.vx = (Math.random() - 0.5) * 0.5;
              this.vy = 0;
            }
          } 
          else if (!this.isGas) {
            // Fluid motion inside liquid pool
            let speed = 0.4 + (tempC / 100) * 1.0;
            this.vy += 0.25; // Fluid gravity
            this.vx += (Math.random() - 0.5) * 0.5;

            this.x += this.vx * speed;
            this.y += this.vy * speed;

            this.handleFluidBoundaries(liquidSurfaceY);
          }
        } 
        else if (tempC &gt; 100) {
          // EVAPORATION ABOVE 100°C
          if (this.isGas) {
            // Gas particle floating upward out of container
            this.vy -= 0.08;
            this.x += this.vx;
            this.y += this.vy;

            // Once past upper atmosphere, store off-screen
            if (this.y &lt; -20) {
              this.y = -50;
              this.vy = 0;
              this.vx = 0;
            }
          } else {
            // Liquid pool boiling
            this.vy += 0.25;
            this.vx += (Math.random() - 0.5) * 0.8;
            this.x += this.vx * 1.4;
            this.y += this.vy * 1.4;
            this.handleFluidBoundaries(liquidSurfaceY);
          }
        }
      }

      updatePressMode() {
        this.isGas = false;
        this.isFalling = false;
        if (pressureAtm &gt;= 24.5) {
          this.computeLatticeTarget();
          this.x += (this.tx - this.x) * 0.25;
          this.y += (this.ty - this.y) * 0.25;
          this.vx = 0; this.vy = 0;
        } else if (pressureAtm &gt; 12) {
          this.vy += 0.3;
          this.vx += (Math.random() - 0.5) * 0.6;
          this.x += this.vx;
          this.y += this.vy;
          this.handlePistonCollisions();
        } else {
          let speed = 1.2 + (12 - pressureAtm) * 0.25;
          this.x += this.vx * speed;
          this.y += this.vy * speed;
          this.handlePistonCollisions();
        }
      }

      handleFluidBoundaries(liquidSurfaceY) {
        if (this.x - RADIUS &lt; CONTAINER_LEFT) { this.x = CONTAINER_LEFT + RADIUS; this.vx *= -0.8; }
        if (this.x + RADIUS &gt; CONTAINER_RIGHT) { this.x = CONTAINER_RIGHT - RADIUS; this.vx *= -0.8; }
        if (this.y + RADIUS &gt; CONTAINER_BOTTOM) { this.y = CONTAINER_BOTTOM - RADIUS; this.vy *= -0.4; }
        
        if (this.y - RADIUS &lt; liquidSurfaceY) {
          this.y = liquidSurfaceY + RADIUS;
          this.vy *= -0.5;
        }
      }

      handlePistonCollisions() {
        if (this.x - RADIUS &lt; CONTAINER_LEFT) { this.x = CONTAINER_LEFT + RADIUS; this.vx *= -1; }
        if (this.x + RADIUS &gt; CONTAINER_RIGHT) { this.x = CONTAINER_RIGHT - RADIUS; this.vx *= -1; }
        if (this.y + RADIUS &gt; CONTAINER_BOTTOM) { this.y = CONTAINER_BOTTOM - RADIUS; this.vy *= -1; }
        if (this.y - RADIUS &lt; pistonY + 15) { this.y = pistonY + 15 + RADIUS; this.vy *= -1; }
      }

      draw() {
        // HIDE EVAPORATED PARTICLES ABOVE CONTAINER RIM
        if (mode === &#39;temp&#39; &amp;&amp; this.isGas &amp;&amp; !this.isFalling) {
          if (this.y &lt; OPEN_TOP_Y - 15) {
            return; // Clean atmosphere: Do not render top-side escaped particles
          }
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, RADIUS, 0, Math.PI * 2);
        
        let hue = 210;
        if (mode === &#39;temp&#39;) {
          hue = Math.max(0, 210 - (tempC + 50) * 0.9);
        } else {
          hue = Math.max(0, 210 - (pressureAtm * 8.4));
        }

        ctx.fillStyle = `hsl(${hue}, 85%, 55%)`;
        ctx.shadowColor = `hsl(${hue}, 85%, 55%)`;
        ctx.shadowBlur = (this.isFalling || tempC &gt; 100 || (mode === &#39;press&#39; &amp;&amp; pressureAtm &lt; 12)) ? 6 : 0;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.closePath();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i &lt; NUM_PARTICLES; i++) {
        particles.push(new Particle(i));
      }
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById(&#39;btnTempMode&#39;).classList.toggle(&#39;active&#39;, mode === &#39;temp&#39;);
      document.getElementById(&#39;btnPressMode&#39;).classList.toggle(&#39;active&#39;, mode === &#39;press&#39;);
      document.getElementById(&#39;tempControl&#39;).style.display = (mode === &#39;temp&#39;) ? &#39;flex&#39; : &#39;none&#39;;
      document.getElementById(&#39;pressControl&#39;).style.display = (mode === &#39;press&#39;) ? &#39;flex&#39; : &#39;none&#39;;
      updateControls();
    }

    function updateControls() {
      if (mode === &#39;temp&#39;) {
        tempC = parseFloat(document.getElementById(&#39;tempSlider&#39;).value);
        pressureAtm = 1.0;
        isMaxPressure = false;
      } else {
        pressureAtm = parseFloat(document.getElementById(&#39;pressSlider&#39;).value);
        let maxTravel = MAX_PISTON_LIMIT_Y - 120;
        pistonY = 120 + ((pressureAtm - 1) / 24) * maxTravel;

        if (pistonY &gt;= MAX_PISTON_LIMIT_Y || pressureAtm &gt;= 24.5) {
          pistonY = MAX_PISTON_LIMIT_Y;
          isMaxPressure = true;
        } else {
          isMaxPressure = false;
        }
        tempC = 25;
      }
      updateReadouts();
    }

    function processEvaporationAndCondensation() {
      if (mode !== &#39;temp&#39;) return;

      // 1. EVAPORATION (T &gt; 100°C): Slow release one by one
      if (tempC &gt; 100) {
        evapTimer++;
        let evapInterval = Math.max(6, Math.floor(50 - (tempC - 100) * 0.4));
        
        if (evapTimer % evapInterval === 0) {
          let liquidParticles = particles.filter(p =&gt; !p.isGas);
          if (liquidParticles.length &gt; 0) {
            liquidParticles.sort((a, b) =&gt; a.y - b.y);
            let victim = liquidParticles[0];
            victim.isGas = true;
            victim.isFalling = false;
            victim.vy = -(1.5 + Math.random() * 1.5);
            victim.vx = (Math.random() - 0.5) * 1.5;
          }
        }
      }

      // 2. CONDENSATION (T &lt;= 100°C): Sequential ONE BY ONE slow re-entry
      if (tempC &lt;= 100) {
        condenseTimer++;
        // Condensation interval gets slightly faster at lower temps, but remains sequential
        let condenseInterval = tempC &lt; 0 ? 8 : Math.max(12, Math.floor(tempC * 0.3));

        if (condenseTimer % condenseInterval === 0) {
          // Find an escaped gas particle that is NOT yet currently falling
          let escapedParticle = particles.find(p =&gt; p.isGas &amp;&amp; !p.isFalling);
          if (escapedParticle) {
            // Spawn ONE BY ONE at top rim of atmosphere
            escapedParticle.x = CONTAINER_LEFT + 25 + Math.random() * (CONTAINER_RIGHT - CONTAINER_LEFT - 50);
            escapedParticle.y = OPEN_TOP_Y - 25;
            escapedParticle.vy = 0.7; // Very slow falling speed
            escapedParticle.vx = (Math.random() - 0.5) * 0.3;
            escapedParticle.isFalling = true;
          }
        }
      }
    }

    function resolveInterParticleCollisions() {
      if (tempC &lt; 0 || (mode === &#39;press&#39; &amp;&amp; pressureAtm &gt;= 24.5)) return;

      for (let i = 0; i &lt; particles.length; i++) {
        for (let j = i + 1; j &lt; particles.length; j++) {
          let p1 = particles[i];
          let p2 = particles[j];
          if (p1.isGas || p2.isGas) continue; // Skip collisions for gas/condensing particles

          let dx = p2.x - p1.x;
          let dy = p2.y - p1.y;
          let dist = Math.hypot(dx, dy);

          if (dist &lt; RADIUS * 2) {
            let overlap = (RADIUS * 2) - dist;
            let nx = dx / (dist || 1);
            let ny = dy / (dist || 1);

            p1.x -= nx * overlap * 0.5;
            p1.y -= ny * overlap * 0.5;
            p2.x += nx * overlap * 0.5;
            p2.y += ny * overlap * 0.5;

            let tempVx = p1.vx;
            let tempVy = p1.vy;
            p1.vx = p2.vx;
            p1.vy = p2.vy;
            p2.vx = tempVx;
            p2.vy = tempVy;
          }
        }
      }
    }

    function drawLiquidPool(liquidSurfaceY, liquidVolumeML) {
      if (mode === &#39;temp&#39; &amp;&amp; tempC &gt;= 0 &amp;&amp; liquidVolumeML &gt; 0) {
        waveOffset += 0.08;
        ctx.beginPath();
        ctx.moveTo(CONTAINER_LEFT, CONTAINER_BOTTOM);

        for (let x = CONTAINER_LEFT; x &lt;= CONTAINER_RIGHT; x += 5) {
          let waveY = liquidSurfaceY + Math.sin((x - CONTAINER_LEFT) * 0.05 + waveOffset) * 3;
          ctx.lineTo(x, waveY);
        }

        ctx.lineTo(CONTAINER_RIGHT, CONTAINER_BOTTOM);
        ctx.closePath();

        let grad = ctx.createLinearGradient(0, liquidSurfaceY, 0, CONTAINER_BOTTOM);
        grad.addColorStop(0, &#39;rgba(56, 189, 248, 0.45)&#39;);
        grad.addColorStop(1, &#39;rgba(2, 132, 199, 0.75)&#39;);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.fillStyle = &#39;rgba(248, 250, 252, 0.6)&#39;;
        ctx.font = &#39;10px system-ui&#39;;
        ctx.fillText(`~ ${liquidVolumeML.toFixed(1)} mL`, CONTAINER_RIGHT - 55, liquidSurfaceY - 6);
      }
    }

    function updateReadouts() {
      let liquidCount = particles.filter(p =&gt; !p.isGas).length;
      let liquidVolumeML = 0;

      if (mode === &#39;temp&#39;) {
        if (tempC &lt; 0) {
          liquidVolumeML = (liquidCount / NUM_PARTICLES) * 50.0;
        } else {
          liquidVolumeML = (liquidCount / NUM_PARTICLES) * 50.0;
        }
      } else {
        liquidVolumeML = (pressureAtm &gt; 12) ? 50.0 : 0.0;
      }

      let stateStr = &quot;SOLID&quot;;
      let badgeEl = document.getElementById(&#39;stateBadge&#39;);

      if (mode === &#39;temp&#39;) {
        badgeEl.classList.remove(&#39;max-press&#39;);
        document.getElementById(&#39;tempVal&#39;).innerText = `${tempC} °C`;
        document.getElementById(&#39;dispTemp&#39;).innerText = `${tempC} °C`;
        document.getElementById(&#39;dispPressure&#39;).innerText = `1.0 atm (Open)`;

        if (tempC &lt; 0) {
          stateStr = &quot;EXTREME SOLID&quot;;
        } else if (tempC === 0) {
          stateStr = &quot;SOLID (0°C)&quot;;
        } else if (tempC &gt; 0 &amp;&amp; tempC &lt; 100) {
          let fallingCount = particles.filter(p =&gt; p.isFalling).length;
          stateStr = fallingCount &gt; 0 ? &quot;CONDENSING...&quot; : &quot;LIQUID&quot;;
        } else if (tempC === 100) {
          stateStr = &quot;BOILING LIQUID&quot;;
        } else {
          stateStr = liquidVolumeML &gt; 0 ? &quot;EVAPORATING / BOILING&quot; : &quot;FULLY EVAPORATED&quot;;
        }
      } else {
        document.getElementById(&#39;pressVal&#39;).innerText = `${pressureAtm.toFixed(1)} atm`;
        document.getElementById(&#39;dispPressure&#39;).innerText = `${pressureAtm.toFixed(1)} atm`;
        document.getElementById(&#39;dispTemp&#39;).innerText = `25 °C`;

        if (isMaxPressure) {
          stateStr = &quot;MAX PRESSURE SOLID&quot;;
          badgeEl.classList.add(&#39;max-press&#39;);
        } else {
          badgeEl.classList.remove(&#39;max-press&#39;);
          stateStr = (pressureAtm &gt; 12) ? &quot;COMPRESSED LIQUID&quot; : &quot;GAS&quot;;
        }
      }

      badgeEl.innerText = stateStr;
      document.getElementById(&#39;dispState&#39;).innerText = stateStr;
      document.getElementById(&#39;dispVolume&#39;).innerText = `${liquidVolumeML.toFixed(1)} mL`;

      return { liquidCount, liquidVolumeML };
    }

    function renderContainer() {
      ctx.strokeStyle = &#39;#475569&#39;;
      ctx.lineWidth = 4;

      if (mode === &#39;temp&#39;) {
        ctx.beginPath();
        ctx.moveTo(CONTAINER_LEFT, OPEN_TOP_Y);
        ctx.lineTo(CONTAINER_LEFT, CONTAINER_BOTTOM);
        ctx.lineTo(CONTAINER_RIGHT, CONTAINER_BOTTOM);
        ctx.lineTo(CONTAINER_RIGHT, OPEN_TOP_Y);
        ctx.stroke();

        ctx.fillStyle = &#39;#64748b&#39;;
        ctx.font = &#39;600 12px system-ui&#39;;
        ctx.fillText(&quot;OPEN ATMOSPHERE&quot;, CONTAINER_LEFT + 95, OPEN_TOP_Y - 25);
      } else {
        ctx.beginPath();
        ctx.moveTo(CONTAINER_LEFT, 60);
        ctx.lineTo(CONTAINER_LEFT, CONTAINER_BOTTOM);
        ctx.lineTo(CONTAINER_RIGHT, CONTAINER_BOTTOM);
        ctx.lineTo(CONTAINER_RIGHT, 60);
        ctx.stroke();

        let pistonColor = isMaxPressure ? &#39;#ef4444&#39; : &#39;#38bdf8&#39;;
        let handleColor = isMaxPressure ? &#39;#dc2626&#39; : &#39;#0284c7&#39;;

        ctx.fillStyle = pistonColor;
        ctx.shadowColor = isMaxPressure ? &#39;#ef4444&#39; : &#39;transparent&#39;;
        ctx.shadowBlur = isMaxPressure ? 15 : 0;
        ctx.fillRect(CONTAINER_LEFT, pistonY, CONTAINER_RIGHT - CONTAINER_LEFT, 15);
        ctx.shadowBlur = 0;

        ctx.fillStyle = handleColor;
        ctx.fillRect(CONTAINER_LEFT + 140, pistonY - 35, 40, 35);

        if (isMaxPressure) {
          ctx.fillStyle = &#39;#ef4444&#39;;
          ctx.font = &#39;bold 12px system-ui&#39;;
          ctx.fillText(&quot;MAX PRESSURE REACHED&quot;, CONTAINER_LEFT + 75, pistonY - 12);
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let { liquidCount, liquidVolumeML } = updateReadouts();

      let liquidHeight = (liquidCount / NUM_PARTICLES) * MAX_LIQUID_HEIGHT;
      let liquidSurfaceY = CONTAINER_BOTTOM - liquidHeight;

      processEvaporationAndCondensation();
      renderContainer();
      drawLiquidPool(liquidSurfaceY, liquidVolumeML);

      particles.forEach(p =&gt; {
        p.update(liquidSurfaceY);
        p.draw();
      });

      resolveInterParticleCollisions();

      requestAnimationFrame(animate);
    }

    initParticles();
    setMode(&#39;temp&#39;);
    animate();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1067;
  const STAGE_H = 600;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
</html>
