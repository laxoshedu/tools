                presetGrid.appendChild(card);
            });
        }

        function downloadPresetImage(isTransparent) {
            if (!selectedPresetToDownload) return;

            const p = selectedPresetToDownload;
            const img = new Image();
            img.onload = () =&gt; {
                const padding = 30;
                const brandingH = 35;
                const canvas = document.createElement(&#39;canvas&#39;);
                canvas.width = img.width + (padding * 2);
                canvas.height = img.height + (padding * 2) + brandingH;
                const ctx = canvas.getContext(&#39;2d&#39;);

                if (!isTransparent) {
                    ctx.fillStyle = &#39;#ffffff&#39;;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                ctx.drawImage(img, padding, padding);

                // Add NoteKeep Branding Tag at bottom right corner
                const brandX = canvas.width - 150;
                const brandY = canvas.height - 28;

                ctx.save();
                ctx.font = &#39;bold 13px Segoe UI, sans-serif&#39;;
                const grad = ctx.createLinearGradient(brandX, brandY, brandX + 80, brandY);
                grad.addColorStop(0, &#39;#2563eb&#39;);
                grad.addColorStop(1, &#39;#ec4899&#39;);
                ctx.fillStyle = grad;
                ctx.fillText(&quot;📝 NoteKeep&quot;, brandX, brandY);

                // Play Store badge text
                ctx.font = &#39;bold 10px Segoe UI, sans-serif&#39;;
                ctx.fillStyle = &#39;#2563eb&#39;;
                ctx.fillText(&quot;Get App&quot;, brandX + 90, brandY);
                ctx.restore();

                const link = document.createElement(&#39;a&#39;);
                link.download = (p.title || &#39;NoteKeep_Preset&#39;).replace(/[^a-zA-Z0-9_-]/g, &#39;_&#39;) + &#39;.png&#39;;
                link.href = canvas.toDataURL(&#39;image/png&#39;);
                link.click();

                presetDownloadModal.style.display = &#39;none&#39;;
                showToast(&quot;Preset PNG Downloaded!&quot;);
            };
            img.src = p.dataUrl;
        }

        document.getElementById(&#39;dlTransparentBtn&#39;).onclick = () =&gt; downloadPresetImage(true);
        document.getElementById(&#39;dlWhiteBgBtn&#39;).onclick = () =&gt; downloadPresetImage(false);
        document.getElementById(&#39;closePresetDownloadModalBtn&#39;).onclick = () =&gt; presetDownloadModal.style.display = &#39;none&#39;;

        document.getElementById(&#39;optSavedPresetsBtn&#39;).onclick = () =&gt; {
            imageMenuPopover.style.display = &#39;none&#39;;
            renderPresetsGallery();
            savedPresetsModal.style.display = &#39;flex&#39;;
        };

        document.getElementById(&#39;closePresetsModalBtn&#39;).onclick = () =&gt; savedPresetsModal.style.display = &#39;none&#39;;

        // ================= TRANSPARENT BOUNDED TEXT BOX SYSTEM WITH BASELINE ALIGNMENT =================
        function createTextBox(pageIdx, x, y, initialText = &#39;&#39;, initialColor = null, initialWidth = 220) {
            const page = pages[pageIdx];
            const dims = getPageDimensions();
            const ruleH = getRuledLineHeight();
            let editStartText = null, textDragFrom = null, textResizeFrom = null;

            let safeX = Math.max(0, Math.min(x, dims.width - 60));
            let safeY = Math.max(0, Math.min(y, dims.height - 30));

            const wrapper = document.createElement(&#39;div&#39;);
            wrapper.className = &#39;textbox-wrapper&#39;;
            wrapper.style.left = safeX + &#39;px&#39;; 
            wrapper.style.top = safeY + &#39;px&#39;;
            
            let maxAvailableWidth = dims.width - safeX;
            let safeW = Math.min(initialWidth, maxAvailableWidth);
            wrapper.style.width = safeW + &#39;px&#39;;

            const deleteBtn = document.createElement(&#39;div&#39;);
            deleteBtn.className = &#39;textbox-delete-btn&#39;;
            deleteBtn.innerText = &#39;✕&#39;;

            const resizeHandle = document.createElement(&#39;div&#39;);
            resizeHandle.className = &#39;textbox-resize-handle&#39;;

            const content = document.createElement(&#39;div&#39;);
            content.className = &#39;textbox-content&#39;;
            content.contentEditable = &#39;false&#39;;
            content.innerText = initialText;

            if (useGradient) {
                content.style.background = `linear-gradient(45deg, ${gradientPrimary}, ${gradientSecondary})`;
                content.style.webkitBackgroundClip = &#39;text&#39;;
                content.style.webkitTextFillColor = &#39;transparent&#39;;
            } else {
                content.style.color = initialColor || currentColor;
            }

            content.style.fontSize = (ruleH * 0.72) + &#39;px&#39;;
            content.style.lineHeight = ruleH + &#39;px&#39;;
            content.style.minHeight = ruleH + &#39;px&#39;;

            wrapper.appendChild(deleteBtn);
            wrapper.appendChild(resizeHandle);
            wrapper.appendChild(content);
            page.card.appendChild(wrapper);

            if (!initialText) {
                enableEditing();
            }

            let isDragging = false, startLeft = safeX, startTop = safeY, startPointerX = 0, startPointerY = 0;
            let isResizing = false, resizeStartX = 0, startWidth = 0;
            let lastTap = 0;

            function enableEditing() {
                wrapper.classList.add(&#39;editing&#39;);
                content.contentEditable = &#39;true&#39;;
                if (editStartText === null) editStartText = content.innerText;
                content.focus();
            }

            function disableEditing() {
                wrapper.classList.remove(&#39;editing&#39;);
                content.contentEditable = &#39;false&#39;;
            }

            wrapper.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
                if (e.target === deleteBtn || e.target === resizeHandle) return;
                if (content.isContentEditable) return;

                e.stopPropagation();
                const now = Date.now();

                if (now - lastTap &lt; 300) {
                    enableEditing();
                    lastTap = 0;
                    return;
                }
                lastTap = now;

                isDragging = true;
                startLeft = parseFloat(wrapper.style.left) || safeX;
                startTop = parseFloat(wrapper.style.top) || safeY;
                textDragFrom = { page: ownerPageOf(wrapper), left: startLeft, top: startTop };
                startPointerX = e.clientX;
                startPointerY = e.clientY;
                wrapper.setPointerCapture(e.pointerId);
            });

            wrapper.addEventListener(&#39;pointermove&#39;, (e) =&gt; {
                if (!isDragging) return;
                let dx = (e.clientX - startPointerX) / scale;
                let dy = (e.clientY - startPointerY) / scale;

                wrapper.style.left = (startLeft + dx) + &#39;px&#39;;
                wrapper.style.top = (startTop + dy) + &#39;px&#39;;
            });

            wrapper.addEventListener(&#39;pointerup&#39;, (e) =&gt; { 
                if (isDragging) {
                    isDragging = false; 
                    try { wrapper.releasePointerCapture(e.pointerId); } catch(err){}
                    reassignElementToPage(wrapper, &#39;text&#39;);
                    const toPage = ownerPageOf(wrapper);
                    const toLeft = parseFloat(wrapper.style.left) || 0;
                    const toTop = parseFloat(wrapper.style.top) || 0;
                    const from = textDragFrom;
                    textDragFrom = null;
                    if (from &amp;&amp; from.page &amp;&amp; toPage &amp;&amp;
                        (from.page !== toPage || Math.abs(toLeft - from.left) &gt; 0.5 || Math.abs(toTop - from.top) &gt; 0.5)) {
                        pushHistory({
                            undo() { relocateBox(wrapper, &#39;text&#39;, from.page, from.left, from.top); },
                            redo() { relocateBox(wrapper, &#39;text&#39;, toPage, toLeft, toTop); }
                        });
                    }
                }
            });

            resizeHandle.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
                e.stopPropagation();
                isResizing = true;
                resizeStartX = e.clientX;
                startWidth = wrapper.offsetWidth;
                textResizeFrom = parseFloat(wrapper.style.width) || wrapper.offsetWidth;
                resizeHandle.setPointerCapture(e.pointerId);
            });

            resizeHandle.addEventListener(&#39;pointermove&#39;, (e) =&gt; {
                if (!isResizing) return;
                const dw = (e.clientX - resizeStartX) / scale;
                let newWidth = startWidth + dw;

                let currentLeft = parseFloat(wrapper.style.left) || 0;
                let maxWidth = dims.width - currentLeft;
                let finalWidth = Math.max(80, Math.min(newWidth, maxWidth));

                wrapper.style.width = finalWidth + &#39;px&#39;;
            });

            resizeHandle.addEventListener(&#39;pointerup&#39;, (e) =&gt; {
                const wasResizing = isResizing;
                isResizing = false;
                try { resizeHandle.releasePointerCapture(e.pointerId); } catch(err){}
                if (wasResizing &amp;&amp; textResizeFrom !== null) {
                    const fromW = textResizeFrom;
                    const toW = parseFloat(wrapper.style.width) || wrapper.offsetWidth;
                    textResizeFrom = null;
                    if (Math.abs(toW - fromW) &gt; 0.5) {
                        pushHistory({
                            undo() { wrapper.style.width = fromW + &#39;px&#39;; },
                            redo() { wrapper.style.width = toW + &#39;px&#39;; }
                        });
                    }
                }
            });

            content.addEventListener(&#39;blur&#39;, () =&gt; {
                disableEditing();
                const afterText = content.innerText;
                if (editStartText !== null &amp;&amp; afterText !== editStartText) {
                    const beforeText = editStartText;
                    pushHistory({
                        bytes: (beforeText.length + afterText.length) * 2,
                        undo() { content.innerText = beforeText; },
                        redo() { content.innerText = afterText; }
                    });
                }
                editStartText = null;
            });

            const textEntry = { elem: wrapper, contentElem: content };

            deleteBtn.onclick = (e) =&gt; {
                e.stopPropagation();
                const ownerPg = ownerPageOf(wrapper) || page;
                wrapper.remove();
                pages.forEach(p =&gt; p.textBoxes = p.textBoxes.filter(t =&gt; t.elem !== wrapper));
                pushHistory({
                    undo() { ownerPg.card.appendChild(wrapper); ownerPg.textBoxes.push(textEntry); },
                    redo() {
                        wrapper.remove();
                        pages.forEach(p =&gt; p.textBoxes = p.textBoxes.filter(t =&gt; t !== textEntry));
                    }
                });
            };

            page.textBoxes.push(textEntry);
            return textEntry;
        }

        // ================= IMAGE INSERTION =================
        const imageInput = document.getElementById(&#39;imageInput&#39;);
        const optAddImageBtn = document.getElementById(&#39;optAddImageBtn&#39;);

        optAddImageBtn.onclick = () =&gt; {
            imageMenuPopover.style.display = &#39;none&#39;;
            imageInput.click();
        };

        imageInput.onchange = (e) =&gt; {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) =&gt; {
                const img = new Image();
                const targetPage = activePageIndex !== null ? activePageIndex : Math.max(0, pages.length - 1);
                img.onload = () =&gt; { insertImageToPage(targetPage, img, event.target.result); recordImageAdded(targetPage); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            imageInput.value = &#39;&#39;;
        };

        function insertImageToPage(pageIdx, imgObj, src, savedState = null) {
            const page = pages[pageIdx];
            let initW = savedState ? savedState.width : Math.min(imgObj.width, 300);
            let initH = savedState ? savedState.height : (imgObj.height / imgObj.width) * initW;
            
            const existingCount = page.imageBoxes.length;
            let initTop = savedState ? savedState.top : 60 + (existingCount * 80);
            let initLeft = savedState ? savedState.left : 60;

            const box = document.createElement(&#39;div&#39;);
            box.className = &#39;image-box&#39;;
            box.style.left = initLeft + &#39;px&#39;; box.style.top = initTop + &#39;px&#39;;
            box.style.width = initW + &#39;px&#39;; box.style.height = initH + &#39;px&#39;;

            const deleteBtn = document.createElement(&#39;div&#39;);
            deleteBtn.className = &#39;image-delete-btn&#39;; deleteBtn.innerText = &#39;✕&#39;;

            const container = document.createElement(&#39;div&#39;);
            container.className = &#39;image-container&#39;;
            const img = document.createElement(&#39;img&#39;);
            img.src = src;

            const inkCanvas = document.createElement(&#39;canvas&#39;);
            inkCanvas.className = &#39;image-ink-canvas&#39;;
            
            inkCanvas.width = 1000;
            inkCanvas.height = 1000 * (initH / initW);
            const inkCtx = inkCanvas.getContext(&#39;2d&#39;);

            container.appendChild(img);
            container.appendChild(inkCanvas);

            const resizeHandle = document.createElement(&#39;div&#39;);
            resizeHandle.className = &#39;resize-handle&#39;;

            box.appendChild(deleteBtn);
            box.appendChild(container); 
            box.appendChild(resizeHandle);
            page.card.appendChild(box);

            if (savedState &amp;&amp; savedState.imageInkData) {
                const loadedInk = new Image();
                loadedInk.src = savedState.imageInkData;
                loadedInk.onload = () =&gt; {
                    inkCtx.drawImage(loadedInk, 0, 0, inkCanvas.width, inkCanvas.height);
                };
            }

            const imageEntry = { elem: box, imgElem: img, inkCanvas: inkCanvas, inkCtx: inkCtx };

            let isWritingOnImage = false;
            let imgStrokePoints = [];
            let imgSnapshot = null;

            function getInnerImageCoords(e) {
                const rect = inkCanvas.getBoundingClientRect();
                return {
                    x: ((e.clientX - rect.left) / rect.width) * inkCanvas.width,
                    y: ((e.clientY - rect.top) / rect.height) * inkCanvas.height
                };
            }

            inkCanvas.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
                if (activeTool !== &#39;writeInsideImage&#39; || pointers.length &gt; 1) return;
                e.stopPropagation();
                isWritingOnImage = true;
                inkCanvas.setPointerCapture(e.pointerId);

                imgSnapshot = inkCtx.getImageData(0, 0, inkCanvas.width, inkCanvas.height);
                const coords = getInnerImageCoords(e);
                imgStrokePoints = [coords];

                const scaleFactor = inkCanvas.width / box.offsetWidth;
                renderSmoothStroke(inkCtx, imgStrokePoints, strokeSize * scaleFactor);
            });

            inkCanvas.addEventListener(&#39;pointermove&#39;, (e) =&gt; {
                if (!isWritingOnImage || pointers.length &gt; 1) return;
                e.stopPropagation();
                const coords = getInnerImageCoords(e);
                imgStrokePoints.push(coords);

                if (imgSnapshot) {
                    inkCtx.putImageData(imgSnapshot, 0, 0);
                }
                const scaleFactor = inkCanvas.width / box.offsetWidth;
                renderSmoothStroke(inkCtx, imgStrokePoints, strokeSize * scaleFactor);
            });

            inkCanvas.addEventListener(&#39;pointerup&#39;, (e) =&gt; {
                if (!isWritingOnImage) return;
                e.stopPropagation();
                isWritingOnImage = false;
                try { inkCanvas.releasePointerCapture(e.pointerId); } catch(err){}
                if (imgSnapshot &amp;&amp; imgStrokePoints.length &gt; 0) {
                    const sf = inkCanvas.width / (box.offsetWidth || 1);
                    const region = strokeRegion(imgStrokePoints, strokeSize * sf * 5 + 40);
                    const pre = cropImageData(imgSnapshot, region);
                    const post = capturePatch(inkCtx, inkCanvas, region);
                    if (pre &amp;&amp; post) {
                        pushHistory({
                            bytes: pre.w * pre.h * 8,
                            undo() { applyPatch(inkCtx, pre); },
                            redo() { applyPatch(inkCtx, post); }
                        });
                    }
                }
                imgStrokePoints = [];
                imgSnapshot = null;
            });

            let isDragging = false, startLeft = initLeft, startTop = initTop, startPointerX = 0, startPointerY = 0;
            let imgDragFrom = null, imgResizeFrom = null;
            box.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
                if (activeTool !== &#39;editImage&#39; || pointers.length &gt; 1) return;
                if (e.target === resizeHandle || e.target === deleteBtn) return;
                e.stopPropagation(); 
                isDragging = true;
                startLeft = parseFloat(box.style.left) || initLeft;
                startTop = parseFloat(box.style.top) || initTop;
                imgDragFrom = { page: ownerPageOf(box), left: startLeft, top: startTop };
                startPointerX = e.clientX;
                startPointerY = e.clientY;
                box.setPointerCapture(e.pointerId);
            });

            box.addEventListener(&#39;pointermove&#39;, (e) =&gt; {
                if (!isDragging || pointers.length &gt; 1) return;
                let dx = (e.clientX - startPointerX) / scale;
                let dy = (e.clientY - startPointerY) / scale;

                box.style.left = (startLeft + dx) + &#39;px&#39;;
                box.style.top = (startTop + dy) + &#39;px&#39;;
            });

            box.addEventListener(&#39;pointerup&#39;, (e) =&gt; { 
                if (isDragging) {
                    isDragging = false; 
                    try { box.releasePointerCapture(e.pointerId); } catch(err){} 
                    reassignElementToPage(box, &#39;image&#39;);
                    const toPage = ownerPageOf(box);
                    const toLeft = parseFloat(box.style.left) || 0;
                    const toTop = parseFloat(box.style.top) || 0;
                    const from = imgDragFrom;
                    imgDragFrom = null;
                    if (from &amp;&amp; from.page &amp;&amp; toPage &amp;&amp;
                        (from.page !== toPage || Math.abs(toLeft - from.left) &gt; 0.5 || Math.abs(toTop - from.top) &gt; 0.5)) {
                        pushHistory({
                            undo() { relocateBox(box, &#39;image&#39;, from.page, from.left, from.top); },
                            redo() { relocateBox(box, &#39;image&#39;, toPage, toLeft, toTop); }
                        });
                    }
                }
            });

            let isResizing = false, startW = 0, startH = 0, startX = 0, startY = 0;
            const rh = box.querySelector(&#39;.resize-handle&#39;);
            rh.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
                if (activeTool !== &#39;editImage&#39; || pointers.length &gt; 1) return;
                e.stopPropagation(); isResizing = true;
                startW = box.offsetWidth; startH = box.offsetHeight;
                startX = e.clientX; startY = e.clientY;
                imgResizeFrom = { w: box.offsetWidth, h: box.offsetHeight };
                rh.setPointerCapture(e.pointerId);
            });
            rh.addEventListener(&#39;pointermove&#39;, (e) =&gt; {
                if (!isResizing || pointers.length &gt; 1) return;
                const dw = (e.clientX - startX) / scale;
                const dh = (e.clientY - startY) / scale;
                box.style.width = Math.max(60, startW + dw) + &#39;px&#39;;
                box.style.height = Math.max(60, startH + dh) + &#39;px&#39;;
            });
            rh.addEventListener(&#39;pointerup&#39;, (e) =&gt; {
                const wasResizing = isResizing;
                isResizing = false;
                try { rh.releasePointerCapture(e.pointerId); } catch(err){}
                if (wasResizing &amp;&amp; imgResizeFrom) {
                    const from = imgResizeFrom;
                    const to = { w: box.offsetWidth, h: box.offsetHeight };
                    imgResizeFrom = null;
                    if (Math.abs(to.w - from.w) &gt; 0.5 || Math.abs(to.h - from.h) &gt; 0.5) {
                        pushHistory({
                            undo() { box.style.width = from.w + &#39;px&#39;; box.style.height = from.h + &#39;px&#39;; },
                            redo() { box.style.width = to.w + &#39;px&#39;; box.style.height = to.h + &#39;px&#39;; }
                        });
                    }
                }
            });

            deleteBtn.onclick = (e) =&gt; {
                e.stopPropagation();
                const ownerPg = ownerPageOf(box) || page;
                box.remove();
                pages.forEach(p =&gt; p.imageBoxes = p.imageBoxes.filter(i =&gt; i.elem !== box));
                pushHistory({
                    undo() { ownerPg.card.appendChild(box); ownerPg.imageBoxes.push(imageEntry); },
                    redo() {
                        box.remove();
                        pages.forEach(p =&gt; p.imageBoxes = p.imageBoxes.filter(i =&gt; i !== imageEntry));
                    }
                });
            };

            page.imageBoxes.push(imageEntry);
        }

        let savedTextRange = null;

        function saveCurrentTextSelection() {
            const sel = window.getSelection();
            if (sel &amp;&amp; sel.rangeCount &gt; 0) {
                const range = sel.getRangeAt(0);
                const container = range.commonAncestorContainer;
                const richEditorElem = document.getElementById(&#39;richEditor&#39;);
                if (richEditorElem &amp;&amp; richEditorElem.contains(container)) {
                    savedTextRange = range.cloneRange();
                }
            }
        }

        function restoreTextSelection() {
            if (savedTextRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedTextRange);
                return true;
            }
            return false;
        }

            const richEditorElem = document.getElementById(&#39;richEditor&#39;);

                const anchorNode = sel.anchorNode;
                if (document.activeElement === richEditorElem || (anchorNode &amp;&amp; richEditorElem.contains(anchorNode))) {

        function generateProceduralSvgPattern(type, color) {
            const svgHeader = `data:image/svg+xml;utf8,`;
            let body = &#39;&#39;;

            if (type === &#39;grid&#39;) {
                body = `&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;30&quot; height=&quot;30&quot;&gt;&lt;path d=&quot;M 30 0 L 0 0 0 30&quot; fill=&quot;none&quot; stroke=&quot;%23cbd5e1&quot; stroke-width=&quot;1&quot;/&gt;&lt;/svg&gt;`;
            } else if (type === &#39;dots&#39;) {
                body = `&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;24&quot; height=&quot;24&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;1.5&quot; fill=&quot;%2394a3b8&quot;/&gt;&lt;/svg&gt;`;
            } else if (type === &#39;iso&#39;) {
                body = `&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;30&quot; height=&quot;52&quot;&gt;&lt;path d=&quot;M14 0 L28 8 L28 24 L14 32 L0 24 L0 8 Z M14 32 L28 40 L28 48 M14 32 L0 40 L0 48&quot; fill=&quot;none&quot; stroke=&quot;%23cbd5e1&quot; stroke-width=&quot;1&quot;/&gt;&lt;/svg&gt;`;
            } else if (type === &#39;lines&#39;) {
                body = `&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;20&quot; height=&quot;20&quot;&gt;&lt;path d=&quot;M0 20 L20 0 Z&quot; fill=&quot;none&quot; stroke=&quot;%23cbd5e1&quot; stroke-width=&quot;1&quot;/&gt;&lt;/svg&gt;`;
            } else if (type === &#39;cross&#39;) {
                body = `&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;20&quot; height=&quot;20&quot;&gt;&lt;path d=&quot;M0 0 L20 20 M20 0 L0 20&quot; fill=&quot;none&quot; stroke=&quot;%23e2e8f0&quot; stroke-width=&quot;1&quot;/&gt;&lt;/svg&gt;`;
            } else if (type === &#39;waves&#39;) {

            } else if (type === &#39;blueprint&#39;) {
                body = `&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;40&quot; height=&quot;40&quot;&gt;&lt;path d=&quot;M 40 0 L 0 0 0 40&quot; fill=&quot;none&quot; stroke=&quot;%233b82f6&quot; stroke-width=&quot;0.8&quot; opacity=&quot;0.3&quot;/&gt;&lt;/svg&gt;`;
            } else if (type === &#39;honeycomb&#39;) {
                body = `&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;28&quot; height=&quot;48&quot;&gt;&lt;path d=&quot;M14 0 L28 8 L28 24 L14 32 L0 24 L0 8 Z M14 32 L28 40 L28 48 M14 32 L0 40 L0 48&quot; fill=&quot;none&quot; stroke=&quot;%23cbd5e1&quot; stroke-width=&quot;1&quot;/&gt;&lt;/svg&gt;`;

            return svgHeader + encodeURIComponent(body);

        function makeTextImgBoxInteractive(box) {
            const dragHandle = box.querySelector(&#39;.text-img-drag-handle&#39;);
            const deleteBtn = box.querySelector(&#39;.text-img-delete-btn&#39;);
            const resizeHandle = box.querySelector(&#39;.text-img-resize-handle&#39;);
            const canvas = box.querySelector(&#39;.text-img-ink-canvas&#39;);

            deleteBtn.onclick = (e) =&gt; {
                e.stopPropagation();
                box.remove();
            };

            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            const onDragStart = (e) =&gt; {
                e.stopPropagation();
                if (e.touches &amp;&amp; e.touches.length &gt; 0) {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                } else {
                    startX = e.clientX;
                    startY = e.clientY;
                }
                isDragging = true;
                initialLeft = parseFloat(box.style.left) || 40;
                initialTop = parseFloat(box.style.top) || 120;
                if (e.pointerId &amp;&amp; dragHandle.setPointerCapture) {
                    try { dragHandle.setPointerCapture(e.pointerId); } catch(err){}
                }
            };

            const onDragMove = (e) =&gt; {
                if (!isDragging) return;
                e.preventDefault();
                e.stopPropagation();
                let clientX = e.clientX;
                let clientY = e.clientY;
                if (e.touches &amp;&amp; e.touches.length &gt; 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }
                let dx = clientX - startX;
                let dy = clientY - startY;
                box.style.left = (initialLeft + dx) + &#39;px&#39;;
                box.style.top = (initialTop + dy) + &#39;px&#39;;
            };

            const onDragEnd = (e) =&gt; {
                if (isDragging) {
                    isDragging = false;
                    if (e.pointerId &amp;&amp; dragHandle.releasePointerCapture) {
                        try { dragHandle.releasePointerCapture(e.pointerId); } catch(err){}
                    }
                }
            };

            dragHandle.addEventListener(&#39;pointerdown&#39;, onDragStart);
            dragHandle.addEventListener(&#39;pointermove&#39;, onDragMove);
            dragHandle.addEventListener(&#39;pointerup&#39;, onDragEnd);
            dragHandle.addEventListener(&#39;pointercancel&#39;, onDragEnd);

            dragHandle.addEventListener(&#39;touchstart&#39;, onDragStart, { passive: false });
            dragHandle.addEventListener(&#39;touchmove&#39;, onDragMove, { passive: false });
            dragHandle.addEventListener(&#39;touchend&#39;, onDragEnd);

            let isResizing = false, rStartX = 0, rStartY = 0, startW = 0, startH = 0;

            const onResizeStart = (e) =&gt; {
                e.stopPropagation();
                isResizing = true;
                if (e.touches &amp;&amp; e.touches.length &gt; 0) {
                    rStartX = e.touches[0].clientX;
                    rStartY = e.touches[0].clientY;
                } else {
                    rStartX = e.clientX;
                    rStartY = e.clientY;
                }
                startW = box.offsetWidth;
                startH = box.offsetHeight;
                if (e.pointerId &amp;&amp; resizeHandle.setPointerCapture) {
                    try { resizeHandle.setPointerCapture(e.pointerId); } catch(err){}
                }
            };

            const onResizeMove = (e) =&gt; {
                if (!isResizing) return;
                e.preventDefault();
                e.stopPropagation();
                let clientX = e.clientX;
                let clientY = e.clientY;
                if (e.touches &amp;&amp; e.touches.length &gt; 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }
                let dw = clientX - rStartX;
                let dh = clientY - rStartY;
                box.style.width = Math.max(120, startW + dw) + &#39;px&#39;;
                box.style.height = Math.max(80, startH + dh) + &#39;px&#39;;
            };

            const onResizeEnd = (e) =&gt; {
                if (isResizing) {
                    isResizing = false;
                    if (e.pointerId &amp;&amp; resizeHandle.releasePointerCapture) {
                        try { resizeHandle.releasePointerCapture(e.pointerId); } catch(err){}
                    }
                }
            };

            resizeHandle.addEventListener(&#39;pointerdown&#39;, onResizeStart);
            resizeHandle.addEventListener(&#39;pointermove&#39;, onResizeMove);
            resizeHandle.addEventListener(&#39;pointerup&#39;, onResizeEnd);
            resizeHandle.addEventListener(&#39;pointercancel&#39;, onResizeEnd);

            resizeHandle.addEventListener(&#39;touchstart&#39;, onResizeStart, { passive: false });
            resizeHandle.addEventListener(&#39;touchmove&#39;, onResizeMove, { passive: false });
            resizeHandle.addEventListener(&#39;touchend&#39;, onResizeEnd);

            if (canvas) {
                const ctx = canvas.getContext(&#39;2d&#39;);
                let isDrawingImg = false;

                const getEventPos = (ev) =&gt; {
                    const rect = canvas.getBoundingClientRect();
                    let clientX = ev.clientX;
                    let clientY = ev.clientY;
                    if (ev.touches &amp;&amp; ev.touches.length &gt; 0) {
                        clientX = ev.touches[0].clientX;
                        clientY = ev.touches[0].clientY;
                    }
                    return {
                        x: ((clientX - rect.left) / rect.width) * canvas.width,
                        y: ((clientY - rect.top) / rect.height) * canvas.height
                    };
                };

                const onDrawStart = (ev) =&gt; {
                    ev.stopPropagation();
                    isDrawingImg = true;
                    ctx.strokeStyle = document.getElementById(&#39;textImageInkColorPicker&#39;).value;
                    ctx.lineWidth = 3;
                    ctx.lineCap = &#39;round&#39;;
                    const pos = getEventPos(ev);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                };

                const onDrawMove = (ev) =&gt; {
                    if (!isDrawingImg) return;
                    ev.stopPropagation();
                    ev.preventDefault();
                    const pos = getEventPos(ev);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                };

                const onDrawEnd = () =&gt; isDrawingImg = false;

                canvas.addEventListener(&#39;pointerdown&#39;, onDrawStart);
                canvas.addEventListener(&#39;pointermove&#39;, onDrawMove);
                canvas.addEventListener(&#39;pointerup&#39;, onDrawEnd);

                canvas.addEventListener(&#39;touchstart&#39;, onDrawStart, { passive: false });
                canvas.addEventListener(&#39;touchmove&#39;, onDrawMove, { passive: false });
                canvas.addEventListener(&#39;touchend&#39;, onDrawEnd);
            }
        }

        function renderPageToCanvas(pageIdx) {
            const page = pages[pageIdx];
            const dims = getPageDimensions();
            const ruleH = getRuledLineHeight();
            const expCanvas = document.createElement(&#39;canvas&#39;);
            expCanvas.width = dims.width * 2; expCanvas.height = dims.height * 2;
            const ctx = expCanvas.getContext(&#39;2d&#39;); ctx.scale(2, 2);

            ctx.drawImage(page.bgCanvas, 0, 0, dims.width, dims.height);
            drawMarginGuidesOnCanvas(ctx, dims);

            if (pageSettings.borderStyle !== &#39;none&#39;) {
                ctx.strokeStyle = pageSettings.borderColor;
                ctx.lineWidth = pageSettings.borderStyle === &#39;thick&#39; ? 5 : 2;
                ctx.strokeRect(0, 0, dims.width, dims.height);
            }

            page.imageBoxes.forEach(ib =&gt; {
                const boxLeft = parseFloat(ib.elem.style.left);
                const boxTop = parseFloat(ib.elem.style.top);
                const boxW = ib.elem.offsetWidth;
                const boxH = ib.elem.offsetHeight;

                ctx.drawImage(ib.imgElem, boxLeft, boxTop, boxW, boxH);
                ctx.drawImage(ib.inkCanvas, boxLeft, boxTop, boxW, boxH);
            });

            ctx.drawImage(page.canvas, 0, 0, dims.width, dims.height);

            page.textBoxes.forEach(tb =&gt; {
                const text = tb.contentElem.innerText;
                if (text.trim().length &gt; 0) {
                    const fontSize = ruleH * 0.72;
                    ctx.font = `${fontSize}px Segoe UI, sans-serif`;
                    
                    if (useGradient) {
                        const grad = ctx.createLinearGradient(0, 0, dims.width, dims.height);
                        grad.addColorStop(0, gradientPrimary);
                        grad.addColorStop(1, gradientSecondary);
                        ctx.fillStyle = grad;
                    } else {
                        ctx.fillStyle = tb.contentElem.style.color || &#39;#000000&#39;;
                    }

                    ctx.textBaseline = &#39;alphabetic&#39;;

                    const boxLeft = parseFloat(tb.elem.style.left) || 0;
                    const boxTop = parseFloat(tb.elem.style.top) || 0;
                    const boxWidth = (parseFloat(tb.elem.style.width) || tb.elem.offsetWidth || 220) - 8;

                    const paragraphs = text.split(&#39;\n&#39;);
                    let currentLineIndex = 0;

                    paragraphs.forEach(paragraph =&gt; {
                        const words = paragraph.split(&#39; &#39;);
                        let currentLine = &#39;&#39;;

                        words.forEach((word, index) =&gt; {
                            const testLine = currentLine + (currentLine ? &#39; &#39; : &#39;&#39;) + word;
                            const metrics = ctx.measureText(testLine);
                            
                            if (metrics.width &gt; boxWidth &amp;&amp; index &gt; 0) {
                                let baselineY = boxTop + (currentLineIndex * ruleH) + (ruleH * 0.78);
                                ctx.fillText(currentLine, boxLeft + 4, baselineY);
                                currentLine = word;
                                currentLineIndex++;
                            } else {
                                currentLine = testLine;
                            }
                        });

                        if (currentLine) {
                            let baselineY = boxTop + (currentLineIndex * ruleH) + (ruleH * 0.78);
                            ctx.fillText(currentLine, boxLeft + 4, baselineY);
                            currentLineIndex++;
                        }
                    });
                }
            });

            // Draw NoteKeep Page Branding at Bottom Right
            const brandX = dims.width - 150;
            const brandY = dims.height - 18;

            ctx.save();
            ctx.font = &#39;bold 12px Segoe UI, sans-serif&#39;;
            const grad = ctx.createLinearGradient(brandX, brandY, brandX + 70, brandY);
            grad.addColorStop(0, &#39;#2563eb&#39;);
            grad.addColorStop(1, &#39;#ec4899&#39;);
            ctx.fillStyle = grad;
            ctx.fillText(&quot;📝 NoteKeep&quot;, brandX, brandY);

            ctx.font = &#39;bold 10px Segoe UI, sans-serif&#39;;
            ctx.fillStyle = &#39;#2563eb&#39;;
            ctx.fillText(&quot;Get App&quot;, brandX + 80, brandY);
            ctx.restore();

            if (pageSettings.showPageNumbers !== false) {
                ctx.save();
                ctx.font = &#39;bold 12px Segoe UI, sans-serif&#39;; ctx.fillStyle = &#39;#6b7280&#39;; ctx.textAlign = &#39;right&#39;;
                ctx.fillText(`PAGE ${pageIdx + 1}`, dims.width - 20, 25);
                ctx.restore();
            }

            return expCanvas;
        }

        document.getElementById(&#39;pageSetupBtn&#39;).onclick = () =&gt; { pageMenuPopover.style.display = &#39;none&#39;; modalOverlay.style.display = &#39;flex&#39;; };
        document.getElementById(&#39;closeModalBtn&#39;).onclick = () =&gt; {
            pageSettings.size = document.getElementById(&#39;pageSizeSelect&#39;).value;
            pageSettings.orientation = document.getElementById(&#39;pageOrientationSelect&#39;).value;
            pageSettings.borderStyle = document.getElementById(&#39;borderStyleSelect&#39;).value;
            pageSettings.borderColor = document.getElementById(&#39;borderColorInput&#39;).value;
            pageSettings.borderMargin = document.getElementById(&#39;borderMarginInput&#39;).value;
            pageSettings.pageMarginGuide = document.getElementById(&#39;pageMarginGuideSelect&#39;).value;
            pageSettings.ruledLineCount = parseInt(document.getElementById(&#39;ruledLineCountInput&#39;).value) || 25;
            pageSettings.bgColor = pageBgColorInput.value;
            pageSettings.showPageNumbers = document.getElementById(&#39;showPageNumbersSelect&#39;).value === &#39;true&#39;;

            updateAllPagesLayout();
            modalOverlay.style.display = &#39;none&#39;;
        };

        // Initialize Application State
        loadStorageTree();
    &lt;/script&gt;

&lt;script&gt;
(function() {
  function notifyParentInteraction() {
    try {
      window.parent.postMessage({ type: &#39;WRAPPER_USER_INTERACTION&#39; }, &#39;*&#39;);
    } catch(e) {}
  }
  window.addEventListener(&#39;pointerdown&#39;, notifyParentInteraction, true);
  window.addEventListener(&#39;touchstart&#39;, notifyParentInteraction, true);
  window.addEventListener(&#39;click&#39;, notifyParentInteraction, true);
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;
  const PREVENT_REFRESH = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  /* PREVENT ACCIDENTAL PAGE REFRESH OR UNLOAD */
  if (PREVENT_REFRESH) {
    window.addEventListener('beforeunload', function (e) {
      e.preventDefault();
      e.returnValue = '';
    });
  }

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* FULLSCREEN WATCHDOG & MANUAL CONTROLS */
  function isFullscreenActive() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  }

  function requestFullscreenIfPossible() {
    if (!isFullscreenActive()) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
  }

  function toggleFullscreen() {
    if (isFullscreenActive()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if (exit) exit.call(document).catch(() => {});
    } else {
      requestFullscreenIfPossible();
    }
  }

  /* FULLSCREEN WATCHDOG: Re-engages fullscreen on any user interaction if exited */
  if (AUTO_FULLSCREEN) {
    const handleInteractionWatchdog = () => {
      if (!isFullscreenActive()) {
        requestFullscreenIfPossible();
      }
    };

    // Listen on parent wrapper
    window.addEventListener('pointerdown', handleInteractionWatchdog, true);
    window.addEventListener('click', handleInteractionWatchdog, true);
    window.addEventListener('touchstart', handleInteractionWatchdog, true);

    // Listen for postMessage sent directly from inside the iframe app
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'WRAPPER_USER_INTERACTION') {
        handleInteractionWatchdog();
      }
    });
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
</html>
