            box.addEventListener(&#39;pointermove&#39;, (e) =&gt; {
                if (!isDragging) return;
                const parentRect = box.parentElement.getBoundingClientRect();
                box.style.left = ((e.clientX - dragX - parentRect.left) / scale) + &#39;px&#39;;
                box.style.top = ((e.clientY - dragY - parentRect.top) / scale) + &#39;px&#39;;
            });
            box.addEventListener(&#39;pointerup&#39;, (e) =&gt; { 
                if (isDragging) {
                    isDragging = false; 
                    try { box.releasePointerCapture(e.pointerId); } catch(err){} 
                    reassignOverlaysToCorrectPages();
                }
            });

            let isResizing = false, startW = 0, startH = 0, startX = 0, startY = 0;
            const rh = box.querySelector(&#39;.resize-handle&#39;);
            rh.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
                e.stopPropagation(); isResizing = true;
                startW = box.offsetWidth; startH = box.offsetHeight;
                startX = e.clientX; startY = e.clientY;
                rh.setPointerCapture(e.pointerId);
            });
            rh.addEventListener(&#39;pointermove&#39;, (e) =&gt; {
                if (!isResizing) return;
                const dw = (e.clientX - startX) / scale;
                const dh = (e.clientY - startY) / scale;
                box.style.width = Math.max(60, startW + dw) + &#39;px&#39;;
                box.style.height = Math.max(60, startH + dh) + &#39;px&#39;;
            });
            rh.addEventListener(&#39;pointerup&#39;, (e) =&gt; { isResizing = false; try { rh.releasePointerCapture(e.pointerId); } catch(err){} });

            deleteBtn.onclick = (e) =&gt; {
                e.stopPropagation(); box.remove();
                pages.forEach(p =&gt; p.imageBoxes = p.imageBoxes.filter(i =&gt; i.elem !== box));
            };

            page.imageBoxes.push(imageEntry);
        }

        // ================= TOOLBAR CONTROLS =================
        const penBtn = document.getElementById(&#39;penBtn&#39;);
        const eraserBtn = document.getElementById(&#39;eraserBtn&#39;);
        const textBtn = document.getElementById(&#39;textBtn&#39;);
        const colorPicker = document.getElementById(&#39;colorPicker&#39;);
        const sizePicker = document.getElementById(&#39;sizePicker&#39;);
        const penStyleSelect = document.getElementById(&#39;penStyle&#39;);
        const bgSelect = document.getElementById(&#39;bgSelect&#39;);
        const swatches = document.querySelectorAll(&#39;.swatch&#39;);

        function setActiveTool(tool) {
            activeTool = tool;
            penBtn.classList.toggle(&#39;active&#39;, tool === &#39;pen&#39;);
            eraserBtn.classList.toggle(&#39;active&#39;, tool === &#39;eraser&#39;);
            textBtn.classList.toggle(&#39;active&#39;, tool === &#39;text&#39;);
        }

        penBtn.onclick = () =&gt; setActiveTool(&#39;pen&#39;);
        eraserBtn.onclick = () =&gt; setActiveTool(&#39;eraser&#39;);
        textBtn.onclick = () =&gt; setActiveTool(&#39;text&#39;);

        function setColor(hex) {
            currentColor = hex; colorPicker.value = hex;
            if (activeTool === &#39;eraser&#39;) setActiveTool(&#39;pen&#39;);
            swatches.forEach(s =&gt; s.classList.remove(&#39;active&#39;));
            const matched = document.querySelector(`.swatch[data-color=&quot;${hex}&quot;]`);
            if (matched) matched.classList.add(&#39;active&#39;);
        }

        swatches.forEach(s =&gt; s.onclick = () =&gt; setColor(s.dataset.color));
        colorPicker.oninput = (e) =&gt; setColor(e.target.value);
        sizePicker.onchange = (e) =&gt; strokeSize = parseFloat(e.target.value);
        penStyleSelect.onchange = (e) =&gt; currentPenStyle = e.target.value;

        bgSelect.onchange = (e) =&gt; {
            pageSettings.background = e.target.value;
            updateAllPagesLayout();
            pageMenuPopover.style.display = &#39;none&#39;;
        };

        const pageMenuToggleBtn = document.getElementById(&#39;pageMenuToggleBtn&#39;);
        const pageMenuPopover = document.getElementById(&#39;pageMenuPopover&#39;);

        pageMenuToggleBtn.onpointerdown = (e) =&gt; {
            e.stopPropagation();
            const rect = pageMenuToggleBtn.getBoundingClientRect();
            pageMenuPopover.style.top = (rect.bottom + 6) + &#39;px&#39;;
            pageMenuPopover.style.left = rect.left + &#39;px&#39;;
            pageMenuPopover.style.display = pageMenuPopover.style.display === &#39;flex&#39; ? &#39;none&#39; : &#39;flex&#39;;
        };

        document.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
            if (!pageMenuPopover.contains(e.target) &amp;&amp; e.target !== pageMenuToggleBtn) {
                pageMenuPopover.style.display = &#39;none&#39;;
            }
        });

        document.getElementById(&#39;addPageBtn&#39;).onclick = () =&gt; { createNewPage(); centerPages(); pageMenuPopover.style.display = &#39;none&#39;; };

        const deleteModalOverlay = document.getElementById(&#39;deleteModalOverlay&#39;);
        const deletePageSelect = document.getElementById(&#39;deletePageSelect&#39;);

        document.getElementById(&#39;deletePageModalBtn&#39;).onclick = () =&gt; {
            pageMenuPopover.style.display = &#39;none&#39;;
            deletePageSelect.innerHTML = &#39;&#39;;
            pages.forEach((_, idx) =&gt; {
                const opt = document.createElement(&#39;option&#39;); opt.value = idx; opt.innerText = `Page ${idx + 1}`;
                deletePageSelect.appendChild(opt);
            });
            deleteModalOverlay.style.display = &#39;flex&#39;;
        };

        document.getElementById(&#39;closeDeleteModalBtn&#39;).onclick = () =&gt; deleteModalOverlay.style.display = &#39;none&#39;;
        document.getElementById(&#39;confirmClearInkBtn&#39;).onclick = () =&gt; {
            const pageIdx = parseInt(deletePageSelect.value);
            if (!isNaN(pageIdx) &amp;&amp; pages[pageIdx]) {
                const dims = getPageDimensions();
                pages[pageIdx].ctx.clearRect(0, 0, dims.width, dims.height);
                savePageState(pageIdx);
            }
            deleteModalOverlay.style.display = &#39;none&#39;;
        };

        document.getElementById(&#39;confirmDeletePageBtn&#39;).onclick = () =&gt; {
            const pageIdx = parseInt(deletePageSelect.value);
            if (!isNaN(pageIdx) &amp;&amp; pages[pageIdx]) {
                if (pages.length &lt;= 1) {
                    const dims = getPageDimensions(); pages[0].ctx.clearRect(0, 0, dims.width, dims.height);
                } else {
                    pages[pageIdx].card.remove(); pages.splice(pageIdx, 1);
                    pages.forEach((p, idx) =&gt; { p.card.dataset.index = idx; p.pageTag.innerText = `PAGE ${idx + 1}`; });
                }
            }
            deleteModalOverlay.style.display = &#39;none&#39;;
        };

        // ================= UNDO &amp; REDO =================
        function updateUndoRedoUI() {
            const undoBtn = document.getElementById(&#39;undoBtn&#39;);
            const redoBtn = document.getElementById(&#39;redoBtn&#39;);

            undoBtn.disabled = undoStack.length &lt;= 1;
            redoBtn.disabled = redoStack.length === 0;
        }

        function savePageState(pageIdx) {
            if (undoStack.length &gt; 30) undoStack.shift();
            undoStack.push({ pageIndex: pageIdx, data: pages[pageIdx].canvas.toDataURL() });
            
            redoStack = [];
            updateUndoRedoUI();
        }

        document.getElementById(&#39;undoBtn&#39;).onclick = () =&gt; {
            if (undoStack.length &gt; 1) {
                const currentState = undoStack.pop();
                redoStack.push(currentState);

                const previousState = undoStack[undoStack.length - 1];
                const page = pages[previousState.pageIndex];

                if (page) {
                    const img = new Image();
                    img.src = previousState.data;
                    img.onload = () =&gt; {
                        const dims = getPageDimensions();
                        page.ctx.clearRect(0, 0, dims.width, dims.height);
                        page.ctx.drawImage(img, 0, 0, dims.width, dims.height);
                    };
                }
                updateUndoRedoUI();
            }
        };

        document.getElementById(&#39;redoBtn&#39;).onclick = () =&gt; {
            if (redoStack.length &gt; 0) {
                const nextState = redoStack.pop();
                undoStack.push(nextState);

                const page = pages[nextState.pageIndex];
                if (page) {
                    const img = new Image();
                    img.src = nextState.data;
                    img.onload = () =&gt; {
                        const dims = getPageDimensions();
                        page.ctx.clearRect(0, 0, dims.width, dims.height);
                        page.ctx.drawImage(img, 0, 0, dims.width, dims.height);
                    };
                }
                updateUndoRedoUI();
            }
        };

        // ================= EXPORT =================
        const exportModalOverlay = document.getElementById(&#39;exportModalOverlay&#39;);
        document.getElementById(&#39;exportModalBtn&#39;).onclick = () =&gt; {
            reassignOverlaysToCorrectPages();
            exportModalOverlay.style.display = &#39;flex&#39;;
        };
        document.getElementById(&#39;closeExportModalBtn&#39;).onclick = () =&gt; exportModalOverlay.style.display = &#39;none&#39;;

        function getExportFilename(suffix) {
            return (currentDocumentTitle || &#39;Handwritten_Notes&#39;).replace(/[^a-zA-Z0-9_-]/g, &#39;_&#39;) + suffix;
        }

        // ================= EXPORT ENGINE =================
        function renderPageToCanvas(pageIdx) {
            const page = pages[pageIdx];
            const dims = getPageDimensions();
            const ruleH = getRuledLineHeight();
            const expCanvas = document.createElement(&#39;canvas&#39;);
            expCanvas.width = dims.width * 2; expCanvas.height = dims.height * 2;
            const ctx = expCanvas.getContext(&#39;2d&#39;); ctx.scale(2, 2);

            // Draw Background Pattern
            ctx.drawImage(page.bgCanvas, 0, 0, dims.width, dims.height);
            drawMarginGuidesOnCanvas(ctx, dims);

            if (pageSettings.borderStyle !== &#39;none&#39;) {
                ctx.strokeStyle = pageSettings.borderColor;
                ctx.lineWidth = pageSettings.borderStyle === &#39;thick&#39; ? 5 : 2;
                ctx.strokeRect(0, 0, dims.width, dims.height);
            }

            // Draw Ink Strokes
            ctx.drawImage(page.canvas, 0, 0, dims.width, dims.height);

            // Draw Images
            page.imageBoxes.forEach(ib =&gt; {
                ctx.drawImage(ib.imgElem, parseFloat(ib.elem.style.left), parseFloat(ib.elem.style.top), ib.elem.offsetWidth, ib.elem.offsetHeight);
            });

            // Draw Text Boxes aligned to Alphabetic Baseline
            page.textBoxes.forEach(tb =&gt; {
                const text = tb.contentElem.innerText;
                if (text.trim().length &gt; 0) {
                    const fontSize = ruleH * 0.72;
                    ctx.font = `${fontSize}px Segoe UI, sans-serif`;
                    ctx.fillStyle = tb.contentElem.style.color || &#39;#000000&#39;;
                    ctx.textBaseline = &#39;alphabetic&#39;;

                    const boxLeft = parseFloat(tb.elem.style.left) || 0;
                    const boxTop = parseFloat(tb.elem.style.top) || 0;
                    const boxWidth = (parseFloat(tb.elem.style.width) || tb.elem.offsetWidth || 220) - 8;

                    const paragraphs = text.split(&#39;\n&#39;);
                    let currentLineIndex = 0;

                    paragraphs.forEach(paragraph =&gt; {
                        const words = paragraph.split(&#39; &#39;);
                        let currentLine = &#39;&#39;;

                        words.forEach((word, index) =&gt; {
                            const testLine = currentLine + (currentLine ? &#39; &#39; : &#39;&#39;) + word;
                            const metrics = ctx.measureText(testLine);
                            
                            if (metrics.width &gt; boxWidth &amp;&amp; index &gt; 0) {
                                let baselineY = boxTop + (currentLineIndex * ruleH) + (ruleH * 0.78);
                                ctx.fillText(currentLine, boxLeft + 4, baselineY);
                                currentLine = word;
                                currentLineIndex++;
                            } else {
                                currentLine = testLine;
                            }
                        });

                        if (currentLine) {
                            let baselineY = boxTop + (currentLineIndex * ruleH) + (ruleH * 0.78);
                            ctx.fillText(currentLine, boxLeft + 4, baselineY);
                            currentLineIndex++;
                        }
                    });
                }
            });

            ctx.save();
            ctx.font = &#39;bold 12px Segoe UI, sans-serif&#39;; ctx.fillStyle = &#39;#6b7280&#39;; ctx.textAlign = &#39;right&#39;;
            ctx.fillText(`PAGE ${pageIdx + 1}`, dims.width - 20, 25);
            ctx.restore();

            return expCanvas;
        }

        document.getElementById(&#39;exportPdfBtn&#39;).onclick = () =&gt; {
            reassignOverlaysToCorrectPages();
            const { jsPDF } = window.jspdf;
            const dims = getPageDimensions();
            const orientation = pageSettings.orientation === &#39;portrait&#39; ? &#39;p&#39; : &#39;l&#39;;
            const pdf = new jsPDF(orientation, &#39;pt&#39;, [dims.width, dims.height]);

            pages.forEach((_, idx) =&gt; {
                if (idx &gt; 0) pdf.addPage([dims.width, dims.height], orientation);
                pdf.addImage(renderPageToCanvas(idx).toDataURL(&#39;image/jpeg&#39;, 0.92), &#39;JPEG&#39;, 0, 0, dims.width, dims.height);
            });

            pdf.save(getExportFilename(&#39;.pdf&#39;));
            exportModalOverlay.style.display = &#39;none&#39;;
        };

        document.getElementById(&#39;exportLongImgBtn&#39;).onclick = () =&gt; {
            reassignOverlaysToCorrectPages();
            const dims = getPageDimensions();
            const gap = 30;
            const longCanvas = document.createElement(&#39;canvas&#39;);
            longCanvas.width = dims.width * 2;
            longCanvas.height = ((dims.height * pages.length) + (gap * (pages.length - 1))) * 2;
            const ctx = longCanvas.getContext(&#39;2d&#39;);
            ctx.fillStyle = &#39;#2a2d30&#39;; ctx.fillRect(0, 0, longCanvas.width, longCanvas.height);

            pages.forEach((_, idx) =&gt; {
                ctx.drawImage(renderPageToCanvas(idx), 0, (idx * (dims.height + gap)) * 2);
            });

            const link = document.createElement(&#39;a&#39;);
            link.download = getExportFilename(&#39;.jpg&#39;); link.href = longCanvas.toDataURL(&#39;image/jpeg&#39;, 0.92);
            link.click();
            exportModalOverlay.style.display = &#39;none&#39;;
        };

        document.getElementById(&#39;exportSepImgBtn&#39;).onclick = () =&gt; {
            reassignOverlaysToCorrectPages();
            pages.forEach((_, idx) =&gt; {
                const link = document.createElement(&#39;a&#39;);
                link.download = getExportFilename(`_Page_${idx + 1}.jpg`);
                link.href = renderPageToCanvas(idx).toDataURL(&#39;image/jpeg&#39;, 0.92);
                link.click();
            });
            exportModalOverlay.style.display = &#39;none&#39;;
        };

        // ================= MODALS =================
        const modalOverlay = document.getElementById(&#39;modalOverlay&#39;);
        document.getElementById(&#39;pageSetupBtn&#39;).onclick = () =&gt; { pageMenuPopover.style.display = &#39;none&#39;; modalOverlay.style.display = &#39;flex&#39;; };
        document.getElementById(&#39;closeModalBtn&#39;).onclick = () =&gt; {
            pageSettings.size = document.getElementById(&#39;pageSizeSelect&#39;).value;
            pageSettings.orientation = document.getElementById(&#39;pageOrientationSelect&#39;).value;
            pageSettings.borderStyle = document.getElementById(&#39;borderStyleSelect&#39;).value;
            pageSettings.borderColor = document.getElementById(&#39;borderColorInput&#39;).value;
            pageSettings.borderMargin = document.getElementById(&#39;borderMarginInput&#39;).value;
            pageSettings.pageMarginGuide = document.getElementById(&#39;pageMarginGuideSelect&#39;).value;
            pageSettings.ruledLineCount = parseInt(document.getElementById(&#39;ruledLineCountInput&#39;).value) || 25;

            updateAllPagesLayout();
            modalOverlay.style.display = &#39;none&#39;;
        };

        // Initialize
        loadStorageTree();
    &lt;/script&gt;

&lt;script&gt;
(function() {
  function notifyParentInteraction() {
    try {
      window.parent.postMessage({ type: &#39;WRAPPER_USER_INTERACTION&#39; }, &#39;*&#39;);
    } catch(e) {}
  }
  window.addEventListener(&#39;pointerdown&#39;, notifyParentInteraction, true);
  window.addEventListener(&#39;touchstart&#39;, notifyParentInteraction, true);
  window.addEventListener(&#39;click&#39;, notifyParentInteraction, true);
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;
  const PREVENT_REFRESH = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  /* PREVENT ACCIDENTAL PAGE REFRESH OR UNLOAD */
  if (PREVENT_REFRESH) {
    window.addEventListener('beforeunload', function (e) {
      e.preventDefault();
      e.returnValue = '';
    });
  }

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* FULLSCREEN WATCHDOG & MANUAL CONTROLS */
  function isFullscreenActive() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  }

  function requestFullscreenIfPossible() {
    if (!isFullscreenActive()) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
  }

  function toggleFullscreen() {
    if (isFullscreenActive()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if (exit) exit.call(document).catch(() => {});
    } else {
      requestFullscreenIfPossible();
    }
  }

  /* FULLSCREEN WATCHDOG: Re-engages fullscreen on any user interaction if exited */
  if (AUTO_FULLSCREEN) {
    const handleInteractionWatchdog = () => {
      if (!isFullscreenActive()) {
        requestFullscreenIfPossible();
      }
    };

    // Listen on parent wrapper
    window.addEventListener('pointerdown', handleInteractionWatchdog, true);
    window.addEventListener('click', handleInteractionWatchdog, true);
    window.addEventListener('touchstart', handleInteractionWatchdog, true);

    // Listen for postMessage sent directly from inside the iframe app
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'WRAPPER_USER_INTERACTION') {
        handleInteractionWatchdog();
      }
    });
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
