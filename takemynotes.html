    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

    width: 1280px;
    height: 720px;

    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform-style: flat;

    width: 100%; height: 100%; border: none; display: block;
  }

  .nav-overlay-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99990;

    box-shadow: 0 8px 24px rgba(0,0,0,0.6);

  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;

    cursor: pointer; user-select: none;

    transform: scale(0.92);

  }

    background: #3b82f6; border-color: #65c9ff; color: #fff;

    &lt;div id=&quot;deleteModalOverlay&quot; class=&quot;modal-overlay&quot;&gt;

    &lt;div id=&quot;exportModalOverlay&quot; class=&quot;modal-overlay&quot;&gt;
        &lt;div class=&quot;modal&quot;&gt;
            &lt;h3&gt;Export Note Options&lt;/h3&gt;
            &lt;div class=&quot;export-options-list modal-body-scroll&quot;&gt;
                &lt;div class=&quot;export-option-card&quot; id=&quot;exportPdfBtn&quot;&gt;
                    &lt;div style=&quot;font-size: 24px;&quot;&gt;📄&lt;/div&gt;
                    &lt;div&gt;
                        &lt;h4&gt;PDF Document&lt;/h4&gt;
                        &lt;p&gt;Export note with active Play Store hyperlink&lt;/p&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;export-option-card&quot; id=&quot;exportLongImgBtn&quot;&gt;
                    &lt;div style=&quot;font-size: 24px;&quot;&gt;🖼&lt;/div&gt;
                    &lt;div&gt;
                        &lt;h4&gt;Single Long Image (JPG)&lt;/h4&gt;
                        &lt;p&gt;Export vertical stitched image with branding&lt;/p&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;export-option-card&quot; id=&quot;exportIndividualImgsBtn&quot;&gt;
                    &lt;div style=&quot;font-size: 24px;&quot;&gt;🏞️&lt;/div&gt;
                    &lt;div&gt;
                        &lt;h4&gt;All Pages as Individual Images (JPG)&lt;/h4&gt;
                        &lt;p&gt;Export each page separately with branding&lt;/p&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;modal-actions&quot;&gt;
                &lt;button id=&quot;closeExportModalBtn&quot;&gt;Cancel&lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;div id=&quot;toast&quot;&gt;Saved Successfully!&lt;/div&gt;

    &lt;script&gt;
        if (navigator.storage &amp;&amp; navigator.storagepersist) {
            navigator.storage.persist();
        }

        localforage.config({
            name: &#39;ProHandwritingNotesStudioDB&#39;,
            storeName: &#39;app_notes_store&#39;
        });

        const PLAY_STORE_URL = &quot;https://play.google.com/store/apps/details?id=com.notekeep.app&quot;;

        // ================= SYSTEM DEFAULT BANNER SVG =================
        const DEFAULT_BANNER_SVG = &#39;data:image/svg+xml;utf8,&#39; + encodeURIComponent(`
        &lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;850&quot; height=&quot;220&quot; viewBox=&quot;0 0 850 220&quot;&gt;
          &lt;defs&gt;
            &lt;linearGradient id=&quot;bgGrad&quot; x1=&quot;0%&quot; y1=&quot;0%&quot; x2=&quot;100%&quot; y2=&quot;100%&quot;&gt;
              &lt;stop offset=&quot;0%&quot; stop-color=&quot;#1e1b4b&quot; /&gt;
              &lt;stop offset=&quot;40%&quot; stop-color=&quot;#312e81&quot; /&gt;
              &lt;stop offset=&quot;80%&quot; stop-color=&quot;#1e40af&quot; /&gt;
              &lt;stop offset=&quot;100%&quot; stop-color=&quot;#0284c7&quot; /&gt;
            &lt;/linearGradient&gt;
            &lt;radialGradient id=&quot;glowCircle&quot; cx=&quot;85%&quot; cy=&quot;25%&quot; r=&quot;65%&quot;&gt;
              &lt;stop offset=&quot;0%&quot; stop-color=&quot;#38bdf8&quot; stop-opacity=&quot;0.5&quot;/&gt;
              &lt;stop offset=&quot;100%&quot; stop-color=&quot;#312e81&quot; stop-opacity=&quot;0&quot;/&gt;
            &lt;/radialGradient&gt;
          &lt;/defs&gt;
          &lt;rect width=&quot;850&quot; height=&quot;220&quot; fill=&quot;url(#bgGrad)&quot; /&gt;
          &lt;rect width=&quot;850&quot; height=&quot;220&quot; fill=&quot;url(#glowCircle)&quot; /&gt;
          &lt;circle cx=&quot;750&quot; cy=&quot;50&quot; r=&quot;140&quot; fill=&quot;#ffffff&quot; opacity=&quot;0.06&quot; /&gt;
          &lt;circle cx=&quot;120&quot; cy=&quot;190&quot; r=&quot;160&quot; fill=&quot;#ffffff&quot; opacity=&quot;0.04&quot; /&gt;
          &lt;path d=&quot;M0 160 Q 220 110 440 160 T 850 130 L 850 220 L 0 220 Z&quot; fill=&quot;#ffffff&quot; opacity=&quot;0.07&quot; /&gt;
          &lt;path d=&quot;M0 190 Q 280 140 520 180 T 850 160 L 850 220 L 0 220 Z&quot; fill=&quot;#38bdf8&quot; opacity=&quot;0.12&quot; /&gt;
        &lt;/svg&gt;
        `);

        // ================= STATE &amp; STORAGE ENGINE =================
        const PAGE_SIZES = {
            A4: { width: 794, height: 1123 },
            LETTER: { width: 816, height: 1056 },
            A3: { width: 1123, height: 1587 }
        };

        const RENDER_SCALE = Math.max(window.devicePixelRatio || 1, 2.5);

        let appState = {
            currentFolderId: &#39;root&#39;,
            folders: [],
            notes: [],
            presets: [],
            backupNickname: null,
            filterFavorites: false
        };

        let currentNoteId = null;
        let currentDocumentTitle = null;
        let currentBannerImage = null;
        let noteTypeToCreate = &#39;canvas&#39;;
        let autoSaveIntervalTimer = null;

        let activeContextItem = null; // { type: &#39;folder&#39;|&#39;note&#39;, item: Object }
        let pendingLockedItem = null; // item to unlock after password verification
        let selectedPresetToDownload = null;

        let pageSettings = {
            size: &#39;A4&#39;,
            orientation: &#39;portrait&#39;,
            borderStyle: &#39;none&#39;,
            borderColor: &#39;#333333&#39;,
            borderMargin: 0,
            pageMarginGuide: &#39;none&#39;,
            ruledLineCount: 25,
            background: &#39;bg-blank&#39;,
            bgColor: &#39;#ffffff&#39;,
            showPageNumbers: true,
            bgImageDataUrl: null
        };

        let activeTool = &#39;pen&#39;;
        let currentColor = &#39;#000000&#39;;
        let useGradient = false;
        let gradientPrimary = &#39;#ec4899&#39;;
        let gradientSecondary = &#39;#3b82f6&#39;;
        let strokeSize = 4;
        let lastEraserSize = 10;
        let currentPenStyle = &#39;fountain&#39;;

        const pagesContainer = document.getElementById(&#39;pagesContainer&#39;);
        const viewport = document.getElementById(&#39;viewport&#39;);
        let pages = [];

        let currentStrokePoints = [];
        let preStrokeSnapshot = null;

        let scale = 0.8;
        let panX = 0, panY = 75;
        let pointers = [];
        let initialZoomDist = null, initialScale = scale;
        let initialPanX = panX, initialPanY = panY, initialCenter = { x: 0, y: 0 };
        let isDrawing = false, activePageIndex = null, hasZoomedOrPanned = false;

        let isPanningCanvas = false;
        let lastPanPos = { x: 0, y: 0 };

        let isLassoing = false;
        let lassoStartPos = { x: 0, y: 0 };
        let currentLassoRect = null; 
        let currentLassoTargetImage = null; 
        const lassoOverlayBox = document.getElementById(&#39;lassoOverlayBox&#39;);
        const lassoActionMenu = document.getElementById(&#39;lassoActionMenu&#39;);

        function showToast(msg) {
            const toast = document.getElementById(&#39;toast&#39;);
            toast.innerText = msg;
            toast.classList.add(&#39;show&#39;);
            setTimeout(() =&gt; toast.classList.remove(&#39;show&#39;), 2500);
        }

        function formatBytes(bytes, decimals = 1) {
            if (!bytes || bytes === 0) return &#39;0 KB&#39;;
            const k = 1024;
            const dm = decimals &lt; 0 ? 0 : decimals;
            const sizes = [&#39;Bytes&#39;, &#39;KB&#39;, &#39;MB&#39;, &#39;GB&#39;, &#39;TB&#39;];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            if (i === 0) return bytes + &#39; Bytes&#39;;
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + &#39; &#39; + sizes[i];
        }

        function calculateNoteBytes(note) {
            try {
                return new Blob([JSON.stringify(note)]).size;
            } catch(e) {
                return 0;
            }
        }

        async function loadStorageTree() {
            try {
                const data = await localforage.getItem(&#39;notes_studio_app_state&#39;);
                if (data) {
                    appState = Object.assign({
                        currentFolderId: &#39;root&#39;,
                        folders: [],
                        notes: [],
                        presets: [],
                        backupNickname: null,
                        filterFavorites: false
                    }, data);
                }
            } catch(e) {
                console.error(&quot;Storage load error:&quot;, e);
            }
            renderDashboard();
            detectAndLoadDeviceFonts();
        }

        async function saveStorageTree() {
            try {
                await localforage.setItem(&#39;notes_studio_app_state&#39;, appState);
            } catch(e) {
                console.error(&quot;Storage save error:&quot;, e);
            }
        }

        async function detectAndLoadDeviceFonts() {
            const optGroup = document.getElementById(&#39;deviceFontsOptGroup&#39;);
            if (!optGroup) return;

            if (&#39;queryLocalFonts&#39; in window) {
                try {
                    const availableFonts = await window.queryLocalFonts();
                    const uniqueFontFamilies = new Set();
                    availableFonts.forEach(font =&gt; uniqueFontFamilies.add(font.family));

                    optGroup.innerHTML = &#39;&#39;;
                    Array.from(uniqueFontFamilies).sort().forEach(fontName =&gt; {
                        const opt = document.createElement(&#39;option&#39;);
                        opt.value = fontName;
                        opt.innerText = fontName;
                        optGroup.appendChild(opt);
                    });
                } catch (err) {
                    optGroup.innerHTML = &#39;&lt;option disabled&gt;Permission denied or local fonts unavailable&lt;/option&gt;&#39;;
                }
            } else {
                optGroup.innerHTML = &#39;&lt;option disabled&gt;Local font API not supported on this browser&lt;/option&gt;&#39;;
            }
        }

        function reassignElementToPage(elem, itemType) {
            const elemRect = elem.getBoundingClientRect();
            const centerPointY = elemRect.top + elemRect.height / 2;

            let targetPageIndex = 0;
            let minDistance = Infinity;

            pages.forEach((p, idx) =&gt; {
                const pRect = p.card.getBoundingClientRect();
                const pCenterY = pRect.top + pRect.height / 2;
                const dist = Math.abs(centerPointY - pCenterY);
                if (dist &lt; minDistance) {
                    minDistance = dist;
                    targetPageIndex = idx;
                }
            });

            const targetPage = pages[targetPageIndex];
            const targetCard = targetPage.card;

            let currentOwnerIndex = pages.findIndex(p =&gt; p.card === elem.parentElement);

            if (currentOwnerIndex !== -1 &amp;&amp; currentOwnerIndex !== targetPageIndex) {
                const oldPage = pages[currentOwnerIndex];

                if (itemType === &#39;image&#39;) {
                    const entryIdx = oldPage.imageBoxes.findIndex(ib =&gt; ib.elem === elem);
                    if (entryIdx !== -1) {
                        const entry = oldPage.imageBoxes.splice(entryIdx, 1)[0];
                        targetPage.imageBoxes.push(entry);
                    }
                } else if (itemType === &#39;text&#39;) {
                    const entryIdx = oldPage.textBoxes.findIndex(tb =&gt; tb.elem === elem);
                    if (entryIdx !== -1) {
                        const entry = oldPage.textBoxes.splice(entryIdx, 1)[0];
                        targetPage.textBoxes.push(entry);
                    }
                }

                targetCard.appendChild(elem);

                const tRect = targetCard.getBoundingClientRect();
                const relLeft = (elemRect.left - tRect.left) / scale;
                const relTop = (elemRect.top - tRect.top) / scale;

                elem.style.left = relLeft + &#39;px&#39;;
                elem.style.top = relTop + &#39;px&#39;;
            }
        }

        // ================= DASHBOARD &amp; FOLDER NAVIGATION =================
        const dashboardView = document.getElementById(&#39;dashboardView&#39;);
        const studioView = document.getElementById(&#39;studioView&#39;);
        const textStudioView = document.getElementById(&#39;textStudioView&#39;);
        const folderContentGrid = document.getElementById(&#39;folderContentGrid&#39;);
        const breadcrumbBar = document.getElementById(&#39;breadcrumbBar&#39;);
        const favFilterBtn = document.getElementById(&#39;favFilterBtn&#39;);

        favFilterBtn.onclick = () =&gt; {
            appState.filterFavorites = !appState.filterFavorites;
            favFilterBtn.classList.toggle(&#39;active&#39;, appState.filterFavorites);
            renderDashboard();
        };

        function renderDashboard() {
            folderContentGrid.innerHTML = &#39;&#39;;
            breadcrumbBar.innerHTML = &#39;&#39;;

            let path = getFolderPath(appState.currentFolderId);
            path.forEach((f, idx) =&gt; {
                const item = document.createElement(&#39;span&#39;);
                item.className = &#39;breadcrumb-item&#39;;
                item.innerText = f.name;
                item.onclick = () =&gt; {
                    appState.currentFolderId = f.id;
                    renderDashboard();
                };
                breadcrumbBar.appendChild(item);

                if (idx &lt; path.length - 1) {
                    const sep = document.createElement(&#39;span&#39;);
                    sep.className = &#39;breadcrumb-separator&#39;;
                    sep.innerText = &#39; / &#39;;
                    breadcrumbBar.appendChild(sep);
                }
            });

            let currentFolders = appState.folders.filter(f =&gt; f.parentId === appState.currentFolderId);
            let currentNotes = appState.notes.filter(n =&gt; n.folderId === appState.currentFolderId);

            if (appState.filterFavorites) {
                currentFolders = currentFolders.filter(f =&gt; f.isFavorite);
                currentNotes = currentNotes.filter(n =&gt; n.isFavorite);
            }

            currentFolders.forEach(f =&gt; {
                const card = document.createElement(&#39;div&#39;);
                card.className = &#39;item-card&#39;;
                card.innerHTML = `
                    &lt;div class=&quot;item-card-top-bar&quot;&gt;
                        &lt;span class=&quot;card-fav-star ${f.isFavorite ? &#39;active&#39; : &#39;&#39;}&quot; title=&quot;Favorite&quot;&gt;★&lt;/span&gt;
                        &lt;div&gt;
                            ${f.isLocked ? &#39;&lt;span class=&quot;card-lock-badge&quot;&gt;🔒&lt;/span&gt;&#39; : &#39;&#39;}
                            &lt;button class=&quot;card-menu-btn&quot; title=&quot;Options&quot;&gt;⋮&lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;item-icon&quot;&gt;📁&lt;/div&gt;
                    &lt;div class=&quot;item-title&quot;&gt;${f.name}&lt;/div&gt;
                    &lt;div class=&quot;item-meta&quot;&gt;Folder&lt;/div&gt;
                `;

                card.querySelector(&#39;.card-fav-star&#39;).onclick = (e) =&gt; {
                    e.stopPropagation();
                    f.isFavorite = !f.isFavorite;
                    saveStorageTree();
                    renderDashboard();
                };

                card.querySelector(&#39;.card-menu-btn&#39;).onclick = (e) =&gt; {
                    e.stopPropagation();
                    showCardContextMenu(e.clientX, e.clientY, &#39;folder&#39;, f);
                };

                card.onclick = () =&gt; handleItemOpen(&#39;folder&#39;, f);
                folderContentGrid.appendChild(card);
            });

            currentNotes.forEach(n =&gt; {
                const sizeBytes = calculateNoteBytes(n);
                const formattedSize = formatBytes(sizeBytes);

                const card = document.createElement(&#39;div&#39;);
                card.className = &#39;item-card&#39;;

                let iconType = n.type === &#39;text&#39; ? &#39;🔤&#39; : &#39;📝&#39;;
                let thumbHtml = `&lt;div class=&quot;item-icon&quot;&gt;${iconType}&lt;/div&gt;`;
                if (n.thumbnail) {
                    thumbHtml = `&lt;img class=&quot;item-preview-thumb&quot; src=&quot;${n.thumbnail}&quot; alt=&quot;Preview&quot;&gt;`;
                } else if (n.pagesData &amp;&amp; n.pagesData[0] &amp;&amp; n.pagesData[0].inkData) {
                    thumbHtml = `&lt;img class=&quot;item-preview-thumb&quot; src=&quot;${n.pagesData[0].inkData}&quot; alt=&quot;Preview&quot;&gt;`;
                }

                card.innerHTML = `
                    &lt;div class=&quot;item-card-top-bar&quot;&gt;
                        &lt;span class=&quot;card-fav-star ${n.isFavorite ? &#39;active&#39; : &#39;&#39;}&quot; title=&quot;Favorite&quot;&gt;★&lt;/span&gt;
                        &lt;div&gt;
                            ${n.isLocked ? &#39;&lt;span class=&quot;card-lock-badge&quot;&gt;🔒&lt;/span&gt;&#39; : &#39;&#39;}
                            &lt;button class=&quot;card-menu-btn&quot; title=&quot;Options&quot;&gt;⋮&lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                    ${thumbHtml}
                    &lt;div class=&quot;item-title&quot;&gt;${n.title}&lt;/div&gt;
                    &lt;div class=&quot;item-meta&quot;&gt;${n.type === &#39;text&#39; ? &#39;Rich Text Note&#39; : (n.pageCount || 1) + &#39; Page(s)&#39;}&lt;/div&gt;
                    &lt;div class=&quot;item-size-badge&quot;&gt;📦 ${formattedSize}&lt;/div&gt;
                `;

                card.querySelector(&#39;.card-fav-star&#39;).onclick = (e) =&gt; {
                    e.stopPropagation();
                    n.isFavorite = !n.isFavorite;
                    saveStorageTree();
                    renderDashboard();
                };

                card.querySelector(&#39;.card-menu-btn&#39;).onclick = (e) =&gt; {
                    e.stopPropagation();
                    showCardContextMenu(e.clientX, e.clientY, &#39;note&#39;, n);
                };

                card.onclick = () =&gt; handleItemOpen(&#39;note&#39;, n);
                folderContentGrid.appendChild(card);
            });

            let curr = appState.folders.find(f =&gt; f.id === folderId);
            while (curr) {
                stack.unshift(curr);
                curr = appState.folders.find(f =&gt; f.id === curr.parentId);
            }
            return path.concat(stack);
        }

            for (let i = 0; i &lt; count; i++) {

                    if (pData.inkData) {
                        const img = new Image();

                            pageObj.baseLayerCanvas.width = pageObj.canvas.width;

                            pageObj.baseLayerCtx.imageSmoothingEnabled = false;
                            pageObj.baseLayerCtx.drawImage(img, 0, 0, pageObj.canvas.width, pageObj.canvas.height);

                            pageObj.ctx.save();
                            pageObj.ctx.setTransform(1, 0, 0, 1, 0, 0);
                            pageObj.ctx.imageSmoothingEnabled = false;
                            pageObj.ctx.clearRect(0, 0, pageObj.canvas.width, pageObj.canvas.height);
                            pageObj.ctx.drawImage(pageObj.baseLayerCanvas, 0, 0, pageObj.canvas.width, pageObj.canvas.height);
                            pageObj.ctx.restore();

                            img.onload = () =&gt; insertImageToPage(i, img, sImg.src, sImg);

        // ================= SESSION-BASED UNDO / REDO ENGINE =================
        // History lives only in memory and is wiped every time a note is opened or closed,
        // so Undo/Redo can only ever touch changes made in the CURRENT open session.
        // Everything saved from earlier sessions is baked into the note and stays untouched.
        const sessionHistory = { undo: [], redo: [], bytes: 0, maxEntries: 100, maxBytes: 250 * 1024 * 1024 };
        let pendingLassoColor = null;
        const undoBtn = document.getElementById(&#39;undoBtn&#39;);
        const redoBtn = document.getElementById(&#39;redoBtn&#39;);

        function updateUndoRedoButtons() {
            if (!undoBtn || !redoBtn) return;
            undoBtn.disabled = sessionHistory.undo.length === 0;
            redoBtn.disabled = sessionHistory.redo.length === 0;
            undoBtn.title = `Undo (this session only) - ${sessionHistory.undo.length} step(s)`;
            redoBtn.title = `Redo (this session only) - ${sessionHistory.redo.length} step(s)`;
        }

        function clearSessionHistory() {
            sessionHistory.undo = [];
            sessionHistory.redo = [];
            sessionHistory.bytes = 0;
            pendingLassoColor = null;
            updateUndoRedoButtons();
        }

        function trimSessionHistory() {
            while (sessionHistory.undo.length &gt; 1 &amp;&amp;
                  (sessionHistory.undo.length &gt; sessionHistory.maxEntries || sessionHistory.bytes &gt; sessionHistory.maxBytes)) {
                const old = sessionHistory.undo.shift();
                sessionHistory.bytes -= (old.bytes || 0);
            }
        }

        function commitHistoryEntry(entry) {
            entry.bytes = entry.bytes || 0;
            sessionHistory.undo.push(entry);
            sessionHistory.bytes += entry.bytes;
            sessionHistory.redo = [];
            trimSessionHistory();
            updateUndoRedoButtons();
        }

        function pushHistory(entry) {
            flushPendingLassoColor();
            commitHistoryEntry(entry);
        }

        // ----- pixel patch helpers (only the changed rectangle is stored, never the whole page) -----
        function clampPatchRect(r, W, H) {
            const x0 = Math.max(0, Math.floor(r.x));
            const y0 = Math.max(0, Math.floor(r.y));
            const x1 = Math.min(W, Math.ceil(r.x + r.w));
            const y1 = Math.min(H, Math.ceil(r.y + r.h));
            if (x1 - x0 &lt;= 0 || y1 - y0 &lt;= 0) return null;
            return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
        }

        function capturePatch(ctx, canvas, rect) {
            const r = clampPatchRect(rect, canvas.width, canvas.height);
            if (!r) return null;
            try {
                return { x: r.x, y: r.y, w: r.w, h: r.h, data: ctx.getImageData(r.x, r.y, r.w, r.h) };
            } catch (e) { return null; }
        }

        function cropImageData(src, rect) {
            const r = clampPatchRect(rect, src.width, src.height);
            if (!r) return null;
            const out = new ImageData(r.w, r.h);
            for (let row = 0; row &lt; r.h; row++) {
                const s = ((r.y + row) * src.width + r.x) * 4;
                out.data.set(src.data.subarray(s, s + r.w * 4), row * r.w * 4);
            }
            return { x: r.x, y: r.y, w: r.w, h: r.h, data: out };

        function applyPatch(ctx, patch) {

        function clearPatchRegion(ctx, patch) {
            if (!patch) return;

                undo() { applyPatch(page.ctx, pre); },
                redo() { if (clearOnRedo) clearPatchRegion(page.ctx, pre); else applyPatch(page.ctx, post); }

        function commitStrokeToHistory() {

            const pad = (activeTool === &#39;eraser&#39; ? lastEraserSize * 2.5 : strokeSize * 5) + 40;
            const r = strokeRegion(currentStrokePoints, pad);

        // ----- box / page helpers (DOM nodes are re-attached, so all their listeners keep working) -----

        function relocateBox(elem, kind, toPage, left, top) {
            if (!toPage || !pages.includes(toPage)) return;
            const key = kind === &#39;image&#39; ? &#39;imageBoxes&#39; : &#39;textBoxes&#39;;
            let entry = null;
            pages.forEach(p =&gt; {
                const i = p[key].findIndex(x =&gt; x.elem === elem);
                if (i !== -1) entry = p[key].splice(i, 1)[0];

            if (!entry) return;
            toPage[key].push(entry);
            toPage.card.appendChild(elem);

            elem.style.top = top + &#39;px&#39;;

        function renumberPages() {
            pages.forEach((p, idx) =&gt; {
                p.card.dataset.index = idx;

        }

        function detachPageObj(pageObj) {
            const idx = pages.indexOf(pageObj);
            if (idx === -1 || pages.length &lt;= 1) return;
            pageObj.card.remove();
            pages.splice(idx, 1);
            renumberPages();
        }

        function reattachPageObj(pageObj, idx) {
            if (pages.includes(pageObj)) return;
            const at = Math.min(idx, pages.length);

            pagesContainer.insertBefore(pageObj.card, ref);
            pages.splice(at, 0, pageObj);
            renumberPages();

        function recordImageAdded(pageIdx) {
            const page = pages[pageIdx];

            const entry = page.imageBoxes[page.imageBoxes.length - 1];
            if (!entry) return;
            pushHistory({
                undo() {
                    entry.elem.remove();

        // ----- undo / redo actions -----
        function performUndo() {

                sessionHistory.bytes -= (entry.bytes || 0);
                if (entry.page &amp;&amp; !pages.includes(entry.page)) continue;
                try { entry.undo(); } catch (err) { console.error(&#39;Undo failed:&#39;, err); }
                sessionHistory.redo.push(entry);

        function performRedo() {
            if (isDrawing || isLassoing) return;

                if (entry.page &amp;&amp; !pages.includes(entry.page)) continue;
                try { entry.redo(); } catch (err) { console.error(&#39;Redo failed:&#39;, err); }

        undoBtn.onclick = performUndo;

        document.addEventListener(&#39;keydown&#39;, (e) =&gt; {

        function createNewPage(isOpeningSession = false) {

            card.appendChild(pageTag);

            brandingBar.className = &#39;page-branding-bar&#39;;

                &lt;div class=&quot;brand-title-badge&quot;&gt;📝 NoteKeep&lt;/div&gt;
                &lt;a class=&quot;brand-download-link&quot; href=&quot;${PLAY_STORE_URL}&quot; target=&quot;_blank&quot; title=&quot;Download NoteKeep App from Play Store&quot;&gt;⬇️ Get App&lt;/a&gt;
            `;
            card.appendChild(brandingBar);

            const marginOverlay = document.createElement(&#39;div&#39;);
            marginOverlay.className = &#39;margin-overlay&#39;;
            card.appendChild(marginOverlay);

            const bgCanvas = document.createElement(&#39;canvas&#39;);
            bgCanvas.className = &#39;bg-canvas&#39;;
            card.appendChild(bgCanvas);

            const inkCanvas = document.createElement(&#39;canvas&#39;);
            inkCanvas.className = &#39;ink-canvas&#39;;
            card.appendChild(inkCanvas);

            pagesContainer.appendChild(card);

            const baseLayerCanvas = document.createElement(&#39;canvas&#39;);

            const pageObj = {
                card: card,
                pageTag: pageTag,
                marginOverlay: marginOverlay,
                bgCanvas: bgCanvas,
                bgCtx: bgCanvas.getContext(&#39;2d&#39;),
                canvas: inkCanvas,

                baseLayerCanvas: baseLayerCanvas,

        }

        function getPageDimensions() {
            const base = PAGE_SIZES[pageSettings.size];
            return pageSettings.orientation === &#39;portrait&#39;
                ? { width: base.width, height: base.height }
                : { width: base.height, height: base.width };
        }

        function getRuledLineHeight() {
            const dims = getPageDimensions();
            const lineCount = parseInt(pageSettings.ruledLineCount) || 25;
            const totalSlots = lineCount + 4;
            return dims.height / totalSlots;
        }

        function applyLayoutToPage(index) {
            const page = pages[index];
            const dims = getPageDimensions();

            page.card.style.width = dims.width + &#39;px&#39;;
            page.card.style.height = dims.height + &#39;px&#39;;

            page.bgCanvas.width = dims.width * RENDER_SCALE;
            page.bgCanvas.height = dims.height * RENDER_SCALE;
            page.bgCanvas.style.width = dims.width + &#39;px&#39;;
            page.bgCanvas.style.height = dims.height + &#39;px&#39;;
            page.bgCtx.scale(RENDER_SCALE, RENDER_SCALE);

            page.canvas.width = dims.width * RENDER_SCALE;
            page.canvas.height = dims.height * RENDER_SCALE;
            page.canvas.style.width = dims.width + &#39;px&#39;;
            page.canvas.style.height = dims.height + &#39;px&#39;;
            page.ctx.scale(RENDER_SCALE, RENDER_SCALE);

            page.baseLayerCanvas.width = dims.width * RENDER_SCALE;
            page.baseLayerCanvas.height = dims.height * RENDER_SCALE;

            const offset = parseInt(pageSettings.borderMargin) || 0;
            const color = pageSettings.borderColor;
            page.card.style.padding = offset + &#39;px&#39;;

            page.pageTag.style.display = pageSettings.showPageNumbers !== false ? &#39;block&#39; : &#39;none&#39;;

            switch(pageSettings.borderStyle) {
                case &#39;thin&#39;: page.card.style.border = `2px solid ${color}`; break;
                case &#39;thick&#39;: page.card.style.border = `5px solid ${color}`; break;
                case &#39;double&#39;: page.card.style.border = `7px double ${color}`; break;
                case &#39;dashed&#39;: page.card.style.border = `3px dashed ${color}`; break;
                default: page.card.style.border = &#39;none&#39;; break;
            }

            renderBackgroundPattern(page.bgCtx, dims.width, dims.height);
            renderMarginGuideOverlay(page.marginOverlay, dims);

            const ruleH = getRuledLineHeight();
            page.textBoxes.forEach(tb =&gt; {
                tb.contentElem.style.fontSize = (ruleH * 0.72) + &#39;px&#39;;
                tb.contentElem.style.lineHeight = ruleH + &#39;px&#39;;
                tb.contentElem.style.minHeight = ruleH + &#39;px&#39;;
            });
        }

        function getFirstRuledLineY(height) {
            const lineCount = parseInt(pageSettings.ruledLineCount) || 25;
            const totalSlots = lineCount + 4;
            return 2 * (height / totalSlots);
        }

        function renderBackgroundPattern(ctx, width, height) {
            ctx.fillStyle = pageSettings.bgColor || &#39;#ffffff&#39;;
            ctx.fillRect(0, 0, width, height);

            if (pageSettings.bgImageDataUrl) {
                const img = new Image();
                img.src = pageSettings.bgImageDataUrl;
                img.onload = () =&gt; {
                    ctx.drawImage(img, 0, 0, width, height);

            const pattern = pageSettings.background;
            ctx.strokeStyle = &#39;#e5e5e5&#39;;
            ctx.lineWidth = 1;
            ctx.beginPath();

            if (pattern === &#39;bg-ruled&#39;) {
                const lineCount = parseInt(pageSettings.ruledLineCount) || 25;
                const totalSlots = lineCount + 4;
                const stepY = height / totalSlots;
                ctx.strokeStyle = &#39;#a2bfe0&#39;;
                for (let k = 2; k &lt;= totalSlots - 2; k++) {

                for (let y = 25; y &lt; height; y += 25) { ctx.moveTo(0, y); ctx.lineTo(width, y); }

                ctx.fillStyle = &#39;#aaaaaa&#39;;

                }
            }
            ctx.stroke();
        }

        function renderMarginGuideOverlay(overlayElem, dims) {
            overlayElem.innerHTML = &#39;&#39;;
            const type = pageSettings.pageMarginGuide;
            if (type === &#39;none&#39;) return;

            const svg = document.createElementNS(&#39;http://www.w3.org/2000/svg&#39;, &#39;svg&#39;);
            svg.setAttribute(&#39;width&#39;, &#39;100%&#39;); svg.setAttribute(&#39;height&#39;, &#39;100%&#39;);

                const redLine = document.createElementNS(&#39;http://www.w3.org/2000/svg&#39;, &#39;line&#39;);
                redLine.setAttribute(&#39;x1&#39;, &#39;70&#39;); redLine.setAttribute(&#39;y1&#39;, &#39;0&#39;);
                redLine.setAttribute(&#39;x2&#39;, &#39;70&#39;); redLine.setAttribute(&#39;y2&#39;, dims.height);
                redLine.setAttribute(&#39;stroke&#39;, &#39;#ef4444&#39;); redLine.setAttribute(&#39;stroke-width&#39;, &#39;2&#39;);
                svg.appendChild(redLine);
            }

            if (type === &#39;header&#39;) {
                const headerY = pageSettings.background === &#39;bg-ruled&#39; ? getFirstRuledLineY(dims.height) : 80;
                const headerLine = document.createElementNS(&#39;http://www.w3.org/2000/svg&#39;, &#39;line&#39;);
                headerLine.setAttribute(&#39;x1&#39;, &#39;0&#39;); headerLine.setAttribute(&#39;y1&#39;, headerY);
                headerLine.setAttribute(&#39;x2&#39;, dims.width); headerLine.setAttribute(&#39;y2&#39;, headerY);
                headerLine.setAttribute(&#39;stroke&#39;, &#39;#93c5fd&#39;); headerLine.setAttribute(&#39;stroke-width&#39;, &#39;2&#39;);
                svg.appendChild(headerLine);

                const rect = document.createElementNS(&#39;http://www.w3.org/2000/svg&#39;, &#39;rect&#39;);
                rect.setAttribute(&#39;x&#39;, &#39;40&#39;); rect.setAttribute(&#39;y&#39;, &#39;40&#39;);
                rect.setAttribute(&#39;width&#39;, dims.width - 80); rect.setAttribute(&#39;height&#39;, dims.height - 80);
                rect.setAttribute(&#39;fill&#39;, &#39;none&#39;); rect.setAttribute(&#39;stroke&#39;, &#39;#ef4444&#39;);
                rect.setAttribute(&#39;stroke-width&#39;, &#39;1.5&#39;); rect.setAttribute(&#39;stroke-dasharray&#39;, &#39;4 4&#39;);

        function drawMarginGuidesOnCanvas(ctx, dims) {
            const type = pageSettings.pageMarginGuide;
            if (type === &#39;none&#39;) return;

            ctx.save();
            if (type === &#39;notebook&#39; || type === &#39;header&#39;) {
                ctx.strokeStyle = &#39;#ef4444&#39;; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(70, 0); ctx.lineTo(70, dims.height); ctx.stroke();

            if (type === &#39;header&#39;) {
                const headerY = pageSettings.background === &#39;bg-ruled&#39; ? getFirstRuledLineY(dims.height) : 80;

        }

        function updateAllPagesLayout() {
            const sizeSignatureBefore = pages.map(p =&gt; p.canvas.width + &#39;x&#39; + p.canvas.height).join(&#39;|&#39;);
            pages.forEach((_, idx) =&gt; {

                tempCanvas.width = pages[idx].canvas.width;
                tempCanvas.height = pages[idx].canvas.height;

            if (sizeSignatureBefore !== sizeSignatureAfter) clearSessionHistory();
            centerPages();
        }

        function getStrokeStyle(ctx, p1, p2) {
            if (useGradient) {
                const grad = ctx.createLinearGradient(p1.x, p1.y, p2 ? p2.x : p1.x + 50, p2 ? p2.y : p1.y + 50);
                grad.addColorStop(0, gradientPrimary);
                grad.addColorStop(1, gradientSecondary);
                return grad;
            }
            return currentColor;
        }

        function configurePenStyle(ctx, style, color, width, p1, p2) {
            ctx.shadowBlur = 0; ctx.shadowColor = &#39;transparent&#39;;
            if (activeTool === &#39;eraser&#39;) {

                ctx.strokeStyle = &#39;#000000&#39;;

                ctx.globalAlpha = 1.0;

            ctx.strokeStyle = getStrokeStyle(ctx, p1 || {x:0,y:0}, p2); ctx.lineCap = &#39;round&#39;; ctx.lineJoin = &#39;round&#39;;

                case &#39;fineliner&#39;: ctx.lineWidth = width * 0.8; ctx.globalAlpha = 1.0; break;
                case &#39;ballpoint&#39;: ctx.lineWidth = width * 0.95; ctx.globalAlpha = 0.9; break;
                case &#39;fountain&#39;: ctx.lineWidth = width * 1.0; ctx.globalAlpha = 1.0; break;
                case &#39;sharptaper&#39;: ctx.lineWidth = width * 1.0; ctx.globalAlpha = 1.0; break;
                case &#39;calligraphy&#39;: ctx.lineWidth = width * 2.2; ctx.lineCap = &#39;square&#39;; ctx.globalAlpha = 0.95; break;
                case &#39;brush&#39;: ctx.lineWidth = width * 1.8; ctx.globalAlpha = 0.88; break;
                case &#39;marker&#39;: ctx.lineWidth = width * 3.0; ctx.lineCap = &#39;butt&#39;; ctx.globalAlpha = 0.92; break;
                case &#39;pencil&#39;: ctx.lineWidth = width * 0.75; ctx.globalAlpha = 0.55; break;
                case &#39;neon&#39;: ctx.lineWidth = width * 1.2; ctx.globalAlpha = 1.0; ctx.shadowColor = useGradient ? gradientPrimary : color; ctx.shadowBlur = 12; break;
                case &#39;charcoal&#39;: ctx.lineWidth = width * 2.0; ctx.globalAlpha = 0.65; break;
                case &#39;highlighter&#39;:
                    ctx.globalCompositeOperation = &#39;destination-over&#39;;
                    ctx.lineWidth = width * 4.5;
                    ctx.lineCap = &#39;square&#39;; ctx.lineJoin = &#39;miter&#39;; ctx.globalAlpha = 0.45;

            }

        function catmullRomSpline(p0, p1, p2, p3, t) {
            const v0 = (p2.x - p0.x) * 0.5, v1 = (p3.x - p1.x) * 0.5;
            const t2 = t * t, t3 = t2 * t;
            const x = (2 * p1.x - 2 * p2.x + v0 + v1) * t3 + (-3 * p1.x + 3 * p2.x - 2 * v0 - v1) * t2 + v0 * t + p1.x;

            const wy0 = (p2.y - p0.y) * 0.5, wy1 = (p3.y - p1.y) * 0.5;
            const y = (2 * p1.y - 2 * p2.y + wy0 + wy1) * t3 + (-3 * p1.y + 3 * p2.y - 2 * wy0 - wy1) * t2 + wy0 * t + p1.y;

            return { x, y };
        }

        function renderSharpTaperStroke(ctx, points, customSize = strokeSize) {
            const baseW = customSize * 1.2;

            if (points.length === 1) {
                ctx.fillStyle = getStrokeStyle(ctx, points[0]);
                ctx.beginPath();
                ctx.arc(points[0].x, points[0].y, 0.5, 0, Math.PI * 2);
                ctx.fill();

            }

            let pts = points;
            if (pts.length &gt;= 2) {
                let smoothPts = [pts[0]];
                let extendedPts = [pts[0], ...pts, pts[pts.length - 1]];

                for (let i = 1; i &lt; extendedPts.length - 2; i++) {
                    let p0 = extendedPts[i - 1];
                    let p1 = extendedPts[i];
                    let p2 = extendedPts[i + 1];
                    let p3 = extendedPts[i + 2];
                    
                    let dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    let steps = Math.max(3, Math.ceil(dist / 2));

                    for (let k = 1; k &lt;= steps; k++) {
                        smoothPts.push(catmullRomSpline(p0, p1, p2, p3, k / steps));
                    }
                }
                pts = smoothPts;
            }

            let totalDist = 0;
            let cumDists = [0];
            for (let i = 1; i &lt; pts.length; i++) {
                totalDist += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
                cumDists.push(totalDist);
            }

            if (totalDist === 0) return;

            let leftSide = [];
            let rightSide = [];

            for (let i = 0; i &lt; pts.length; i++) {
                let progress = cumDists[i] / totalDist;
                let taperFactor = Math.sin(progress * Math.PI);
                let currentWidth = baseW * Math.pow(taperFactor, 0.8);

                let dx, dy;
                if (i === 0) {
                    dx = pts[1].x - pts[0].x;
                    dy = pts[1].y - pts[0].y;
                } else if (i === pts.length - 1) {
                    dx = pts[i].x - pts[i - 1].x;
                    dy = pts[i].y - pts[i - 1].y;
                } else {
                    dx = pts[i + 1].x - pts[i - 1].x;
                    dy = pts[i + 1].y - pts[i - 1].y;
                }

                let len = Math.hypot(dx, dy) || 1;
                let nx = -dy / len;
                let ny = dx / len;

                let r = currentWidth / 2;

                leftSide.push({
                    x: pts[i].x + nx * r,
                    y: pts[i].y + ny * r
                });
                rightSide.push({
                    x: pts[i].x - nx * r,
                    y: pts[i].y - ny * r
                });
            }

            ctx.fillStyle = getStrokeStyle(ctx, pts[0], pts[pts.length - 1]);
            ctx.beginPath();
            ctx.moveTo(leftSide[0].x, leftSide[0].y);

            for (let i = 1; i &lt; leftSide.length - 1; i++) {
                let xc = (leftSide[i].x + leftSide[i + 1].x) / 2;
                let yc = (leftSide[i].y + leftSide[i + 1].y) / 2;
                ctx.quadraticCurveTo(leftSide[i].x, leftSide[i].y, xc, yc);
            }
            if (leftSide.length &gt; 1) {
                let lastL = leftSide[leftSide.length - 1];
                ctx.lineTo(lastL.x, lastL.y);
            }

            for (let i = rightSide.length - 1; i &gt; 0; i--) {
                let xc = (rightSide[i].x + rightSide[i - 1].x) / 2;
                let yc = (rightSide[i].y + rightSide[i - 1].y) / 2;
                ctx.quadraticCurveTo(rightSide[i].x, rightSide[i].y, xc, yc);
            }
            ctx.lineTo(rightSide[0].x, rightSide[0].y);

            ctx.closePath();
            ctx.fill();
        }

        function renderSmoothStroke(ctx, points, customSize = strokeSize) {
            if (!points || points.length === 0) return;

            if (currentPenStyle === &#39;sharptaper&#39; &amp;&amp; activeTool !== &#39;eraser&#39;) {
                ctx.globalCompositeOperation = &#39;source-over&#39;;
                ctx.globalAlpha = 1.0;
                renderSharpTaperStroke(ctx, points, customSize);
                return;
            }

            if (currentPenStyle === &#39;fountain&#39; &amp;&amp; activeTool !== &#39;eraser&#39;) {
                ctx.globalCompositeOperation = &#39;source-over&#39;;
                const style = getStrokeStyle(ctx, points[0], points[points.length - 1]);
                ctx.strokeStyle = style;
                ctx.fillStyle = style;
                ctx.lineCap = &#39;round&#39;;
                ctx.lineJoin = &#39;round&#39;;
                ctx.globalAlpha = 1.0;

                const baseW = customSize * 1.0;

                if (points.length === 1) {
                    ctx.beginPath();
                    ctx.arc(points[0].x, points[0].y, baseW / 2, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                let totalLength = 0;
                const dists = [0];
                for (let i = 1; i &lt; points.length; i++) {
                    const d = Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
                    totalLength += d;
                    dists.push(totalLength);
                }

                for (let i = 1; i &lt; points.length; i++) {
                    const p1 = points[i - 1];
                    const p2 = points[i];

                    const progress1 = totalLength &gt; 0 ? dists[i - 1] / totalLength : 0;
                    const progress2 = totalLength &gt; 0 ? dists[i] / totalLength : 1;

                    const minW = baseW * 1.0;
                    const maxW = baseW * 2.5;
                    const w1 = minW + (maxW - minW) * progress1;
                    const w2 = minW + (maxW - minW) * progress2;

                    const currentW = (w1 + w2) / 2;
                    ctx.lineWidth = Math.max(0.2, currentW);
                    ctx.beginPath();

                    if (points.length === 2) {
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                    } else if (i === 1) {
                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(midX, midY);
                    } else if (i === points.length - 1) {
                        const prevMidX = (points[i - 2].x + p1.x) / 2;
                        const prevMidY = (points[i - 2].y + p1.y) / 2;
                        ctx.moveTo(prevMidX, prevMidY);
                        ctx.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y);
                    } else {
                        const prevMidX = (points[i - 2].x + p1.x) / 2;
                        const prevMidY = (points[i - 2].y + p1.y) / 2;
                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;
                        ctx.moveTo(prevMidX, prevMidY);
                        ctx.quadraticCurveTo(p1.x, p1.y, midX, midY);
                    }
                    ctx.stroke();
                }
                return;
            }

            configurePenStyle(ctx, currentPenStyle, currentColor, customSize, points[0], points[points.length - 1]);

            if (points.length === 1) {
                ctx.beginPath();
                ctx.arc(points[0].x, points[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
                ctx.fillStyle = ctx.strokeStyle; 
                ctx.fill();
                return;
            }

            if (points.length === 2) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.stroke();
                return;
            }

            ctx.beginPath();
            const firstMidX = (points[0].x + points[1].x) / 2;
            const firstMidY = (points[0].y + points[1].y) / 2;
            ctx.moveTo(points[0].x, points[0].y);
            ctx.lineTo(firstMidX, firstMidY);

            for (let i = 1; i &lt; points.length - 1; i++) {
                const xc = (points[i].x + points[i + 1].x) / 2;
                const yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }

            const lastIdx = points.length - 1;
            ctx.lineTo(points[lastIdx].x, points[lastIdx].y);
            ctx.stroke();
        }

        function getCanvasCoords(clientX, clientY, canvas) {
            const rect = canvas.getBoundingClientRect();
            return { x: (clientX - rect.left) / scale, y: (clientY - rect.top) / scale, time: Date.now() };
        }

        window.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
            if (!studioView.contains(e.target)) return;
            if (e.target.closest(&#39;#toolbar&#39;) || e.target.closest(&#39;.popover-menu&#39;) || e.target.closest(&#39;#lassoActionMenu&#39;) || e.target.closest(&#39;.modal-overlay&#39;) || e.target.closest(&#39;.page-branding-bar&#39;)) return;

            const pIdx = pointers.findIndex(p =&gt; p.pointerId === e.pointerId);
            if (pIdx === -1) pointers.push(e);
            else pointers[pIdx] = e;

            if (pointers.length === 1) {
                const card = e.target.closest(&#39;.page-card&#39;);
                const isImageInteract = e.target.closest(&#39;.image-box&#39;);

                if (!card || ((activeTool === &#39;editImage&#39; || activeTool === &#39;writeInsideImage&#39;) &amp;&amp; !isImageInteract)) {
                    clearLassoBox();
                    isPanningCanvas = true;
                    lastPanPos = { x: e.clientX, y: e.clientY };
                    return;
                }

                if (activeTool === &#39;editImage&#39; || activeTool === &#39;writeInsideImage&#39;) return;

                if (card) {
                    activePageIndex = parseInt(card.dataset.index);
                    const page = pages[activePageIndex];

                    if (activeTool === &#39;lasso&#39;) {
                        clearLassoBox();
                        isLassoing = true;
                        const coords = getCanvasCoords(e.clientX, e.clientY, page.canvas);
                        lassoStartPos = coords;
                        currentLassoRect = { pageIdx: activePageIndex, x: coords.x, y: coords.y, width: 0, height: 0 };
                        return;
                    }

                    if (activeTool === &#39;text&#39;) {
                        clearLassoBox();
                        const coords = getCanvasCoords(e.clientX, e.clientY, page.canvas);
                        const newTextEntry = createTextBox(activePageIndex, coords.x, coords.y);
                        if (newTextEntry) {
                            const ownerPg = pages[activePageIndex];
                            pushHistory({
                                undo() {
                                    newTextEntry.elem.remove();
                                    pages.forEach(p =&gt; p.textBoxes = p.textBoxes.filter(t =&gt; t !== newTextEntry));
                                },
                                redo() {
                                    if (!pages.includes(ownerPg)) return;
                                    ownerPg.card.appendChild(newTextEntry.elem);
                                    ownerPg.textBoxes.push(newTextEntry);
                                }
                            });
                        }
                        return;
                    }

                    clearLassoBox();
                    isDrawing = true;
                    hasZoomedOrPanned = false;
                    preStrokeSnapshot = page.ctx.getImageData(0, 0, page.canvas.width, page.canvas.height);

                    const coords = getCanvasCoords(e.clientX, e.clientY, page.canvas);
                    currentStrokePoints = [coords];
                    renderSmoothStroke(page.ctx, currentStrokePoints);
                }
            } 
            else if (pointers.length === 2) {
                isDrawing = false;
                isLassoing = false;
                isPanningCanvas = false;
                hasZoomedOrPanned = true;
                currentStrokePoints = [];

                if (activePageIndex !== null &amp;&amp; preStrokeSnapshot) {
                    pages[activePageIndex].ctx.putImageData(preStrokeSnapshot, 0, 0);
                }
                preStrokeSnapshot = null;

                initialZoomDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
                initialScale = scale;
                initialPanX = panX; initialPanY = panY;
                initialCenter = { x: (pointers[0].clientX + pointers[1].clientX) / 2, y: (pointers[0].clientY + pointers[1].clientY) / 2 };
            }
        });

        window.addEventListener(&#39;pointermove&#39;, (e) =&gt; {
            const index = pointers.findIndex(p =&gt; p.pointerId === e.pointerId);
            if (index !== -1) pointers[index] = e;

            if (pointers.length === 1 &amp;&amp; isPanningCanvas) {
                hasZoomedOrPanned = true;
                const dx = e.clientX - lastPanPos.x;
                const dy = e.clientY - lastPanPos.y;
                panX += dx;
                panY += dy;
                lastPanPos = { x: e.clientX, y: e.clientY };
                updateTransform();
                return;
            }

            if (pointers.length === 1 &amp;&amp; isLassoing &amp;&amp; activePageIndex !== null) {
                const page = pages[activePageIndex];
                const coords = getCanvasCoords(e.clientX, e.clientY, page.canvas);
                
                const minX = Math.min(lassoStartPos.x, coords.x);
                const minY = Math.min(lassoStartPos.y, coords.y);
                const width = Math.abs(coords.x - lassoStartPos.x);
                const height = Math.abs(coords.y - lassoStartPos.y);

                currentLassoRect = { pageIdx: activePageIndex, x: minX, y: minY, width, height };
                updateLassoOverlayPosition();
            }
            else if (pointers.length === 1 &amp;&amp; isDrawing &amp;&amp; !hasZoomedOrPanned &amp;&amp; activePageIndex !== null) {
                const page = pages[activePageIndex];
                const coords = getCanvasCoords(e.clientX, e.clientY, page.canvas);
                currentStrokePoints.push(coords);

                if (preStrokeSnapshot) {
                    page.ctx.putImageData(preStrokeSnapshot, 0, 0);
                }
                renderSmoothStroke(page.ctx, currentStrokePoints);

            } else if (pointers.length === 2) {
                hasZoomedOrPanned = true;
                const currentCenter = { x: (pointers[0].clientX + pointers[1].clientX) / 2, y: (pointers[0].clientY + pointers[1].clientY) / 2 };
                const currentDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);

                const newScale = Math.min(Math.max(initialScale * (currentDist / initialZoomDist), 0.2), 4.5);
                scale = newScale;
                panX = currentCenter.x - ((initialCenter.x - initialPanX) * (newScale / initialScale));
                panY = currentCenter.y - ((initialCenter.y - initialPanY) * (newScale / initialScale));

                updateTransform();
            }
        });

        function handlePointerUp(e) {
            pointers = pointers.filter(p =&gt; p.pointerId !== e.pointerId);
            if (pointers.length &lt; 2) initialZoomDist = null;

            if (pointers.length === 0) {
                if (isPanningCanvas) {
                    isPanningCanvas = false;
                }
                else if (isLassoing) {
                    isLassoing = false;
                    if (currentLassoRect &amp;&amp; (currentLassoRect.width &lt; 10 || currentLassoRect.height &lt; 10)) {
                        clearLassoBox();
                    } else {
                        showLassoActionMenu();
                    }
                }
                if (isDrawing &amp;&amp; activePageIndex !== null &amp;&amp; preStrokeSnapshot &amp;&amp; currentStrokePoints.length &gt; 0) {
                    commitStrokeToHistory();
                }
                isDrawing = false;
                hasZoomedOrPanned = false;
                currentStrokePoints = [];
                activePageIndex = null;
                preStrokeSnapshot = null;
            }
        }

        window.addEventListener(&#39;pointerup&#39;, handlePointerUp);
        window.addEventListener(&#39;pointercancel&#39;, handlePointerUp);

        viewport.addEventListener(&#39;wheel&#39;, (e) =&gt; {
            e.preventDefault();
            hasZoomedOrPanned = true;
            if (e.ctrlKey) {
                const newScale = Math.min(Math.max(scale * (e.deltaY &lt; 0 ? 1.08 : 0.92), 0.2), 4.5);
                panX = e.clientX - (e.clientX - panX) * (newScale / scale);
                panY = e.clientY - (e.clientY - panY) * (newScale / scale);
                scale = newScale;
            } else {
                panX -= e.deltaX; panY -= e.deltaY;
            }
            updateTransform();
        }, { passive: false });

        // ================= LASSO SELECTION ENGINE =================
        function clearLassoBox() {
            flushPendingLassoColor();
            currentLassoRect = null;
            currentLassoTargetImage = null;
            lassoOverlayBox.style.display = &#39;none&#39;;
            lassoActionMenu.style.display = &#39;none&#39;;
        }

        function updateLassoOverlayPosition() {
            if (!currentLassoRect) return;
            const page = pages[currentLassoRect.pageIdx];
            if (!page) return;

            const cardRect = page.card.getBoundingClientRect();
            
            const screenLeft = cardRect.left + (currentLassoRect.x * scale);
            const screenTop = cardRect.top + (currentLassoRect.y * scale);
            const screenW = currentLassoRect.width * scale;
            const screenH = currentLassoRect.height * scale;

            lassoOverlayBox.style.left = screenLeft + &#39;px&#39;;
            lassoOverlayBox.style.top = screenTop + &#39;px&#39;;
            lassoOverlayBox.style.width = screenW + &#39;px&#39;;
            lassoOverlayBox.style.height = screenH + &#39;px&#39;;
            lassoOverlayBox.style.display = &#39;block&#39;;
        }

        function showLassoActionMenu() {
            if (!currentLassoRect) return;
            updateLassoOverlayPosition();

            const boxLeft = parseFloat(lassoOverlayBox.style.left);
            const boxTop = parseFloat(lassoOverlayBox.style.top);

            lassoActionMenu.style.left = boxLeft + &#39;px&#39;;
            lassoActionMenu.style.top = Math.max(10, boxTop - 45) + &#39;px&#39;;
            lassoActionMenu.style.display = &#39;flex&#39;;
        }

        function hexToRgb(hex) {
            let c = hex.replace(&#39;#&#39;, &#39;&#39;);
            if (c.length === 3) c = c.split(&#39;&#39;).map(x =&gt; x + x).join(&#39;&#39;);
            const num = parseInt(c, 16);
            return { r: (num &gt;&gt; 16) &amp; 255, g: (num &gt;&gt; 8) &amp; 255, b: num &amp; 255 };
        }

        document.getElementById(&#39;lassoColorPicker&#39;).oninput = (e) =&gt; {
            if (!currentLassoRect) return;
            const page = pages[currentLassoRect.pageIdx];
            const targetColor = hexToRgb(e.target.value);

            if (!pendingLassoColor) {
                const region = { x: currentLassoRect.x * RENDER_SCALE, y: currentLassoRect.y * RENDER_SCALE,
                                 w: currentLassoRect.width * RENDER_SCALE, h: currentLassoRect.height * RENDER_SCALE };
                pendingLassoColor = { page: page, region: region, pre: capturePatch(page.ctx, page.canvas, region) };
            }

            const rx = currentLassoRect.x * RENDER_SCALE;
            const ry = currentLassoRect.y * RENDER_SCALE;
            const rw = currentLassoRect.width * RENDER_SCALE;
            const rh = currentLassoRect.height * RENDER_SCALE;

            const imgData = page.ctx.getImageData(rx, ry, rw, rh);
            const data = imgData.data;

            for (let i = 0; i &lt; data.length; i += 4) {
                if (data[i + 3] &gt; 20) {
                    data[i] = targetColor.r;
                    data[i + 1] = targetColor.g;
                    data[i + 2] = targetColor.b;
                }
            }
            page.ctx.putImageData(imgData, rx, ry);
        };

        function scaleLassoContent(scaleFactor) {
            if (!currentLassoRect) return;
            flushPendingLassoColor();
            const page = pages[currentLassoRect.pageIdx];
            const targetImg = currentLassoTargetImage;

            if (targetImg) {
                const el = targetImg.elem;
                const before = { w: el.style.width, h: el.style.height };
                scaleLassoContentCore(scaleFactor);
                const after = { w: el.style.width, h: el.style.height };
                pushHistory({
                    undo() { el.style.width = before.w; el.style.height = before.h; },
                    redo() { el.style.width = after.w; el.style.height = after.h; }
                });
                return;
            }

            const f = Math.max(1, scaleFactor);
            const region = { x: currentLassoRect.x * RENDER_SCALE, y: currentLassoRect.y * RENDER_SCALE,
                             w: currentLassoRect.width * RENDER_SCALE * f, h: currentLassoRect.height * RENDER_SCALE * f };
            const pre = capturePatch(page.ctx, page.canvas, region);
            const tbBefore = page.textBoxes.map(tb =&gt; ({ tb: tb, w: tb.elem.style.width }));

            scaleLassoContentCore(scaleFactor);

            const post = capturePatch(page.ctx, page.canvas, region);
            const tbAfter = tbBefore.map(o =&gt; ({ tb: o.tb, w: o.tb.elem.style.width }));
            if (pre &amp;&amp; post) {
                const entry = inkEntry(page, pre, post, false);
                const baseUndo = entry.undo, baseRedo = entry.redo;
                entry.undo = () =&gt; { baseUndo(); tbBefore.forEach(o =&gt; o.tb.elem.style.width = o.w); };
                entry.redo = () =&gt; { baseRedo(); tbAfter.forEach(o =&gt; o.tb.elem.style.width = o.w); };
                pushHistory(entry);
            }
        }

        function scaleLassoContentCore(scaleFactor) {
            if (!currentLassoRect) return;
            const page = pages[currentLassoRect.pageIdx];

            if (currentLassoTargetImage) {
                let currentW = parseFloat(currentLassoTargetImage.elem.style.width) || currentLassoRect.width;
                let currentH = parseFloat(currentLassoTargetImage.elem.style.height) || currentLassoRect.height;

                let newW = currentW * scaleFactor;
                let newH = currentH * scaleFactor;

                currentLassoTargetImage.elem.style.width = newW + &#39;px&#39;;
                currentLassoTargetImage.elem.style.height = newH + &#39;px&#39;;

                currentLassoRect.width = newW;
                currentLassoRect.height = newH;

                updateLassoOverlayPosition();
                showLassoActionMenu();
                return;
            }

            const rx = currentLassoRect.x * RENDER_SCALE;
            const ry = currentLassoRect.y * RENDER_SCALE;
            const rw = currentLassoRect.width * RENDER_SCALE;
            const rh = currentLassoRect.height * RENDER_SCALE;

            if (rw &lt;= 0 || rh &lt;= 0) return;

            const tempCanvas = document.createElement(&#39;canvas&#39;);
            tempCanvas.width = rw; tempCanvas.height = rh;
            const tempCtx = tempCanvas.getContext(&#39;2d&#39;);
            tempCtx.putImageData(page.ctx.getImageData(rx, ry, rw, rh), 0, 0);

            page.ctx.clearRect(rx, ry, rw, rh);

            const newW = rw * scaleFactor;
            const newH = rh * scaleFactor;

            page.ctx.save();
            page.ctx.drawImage(tempCanvas, 0, 0, rw, rh, rx, ry, newW, newH);
            page.ctx.restore();

            currentLassoRect.width *= scaleFactor;
            currentLassoRect.height *= scaleFactor;

            page.textBoxes.forEach(tb =&gt; {
                const tbLeft = parseFloat(tb.elem.style.left) || 0;
                const tbTop = parseFloat(tb.elem.style.top) || 0;
                if (tbLeft &gt;= currentLassoRect.x &amp;&amp; tbLeft &lt;= currentLassoRect.x + currentLassoRect.width &amp;&amp;
                    tbTop &gt;= currentLassoRect.y &amp;&amp; tbTop &lt;= currentLassoRect.y + currentLassoRect.height) {
                    let curW = parseFloat(tb.elem.style.width) || tb.elem.offsetWidth;
                    tb.elem.style.width = (curW * scaleFactor) + &#39;px&#39;;
                }
            });

            updateLassoOverlayPosition();
            showLassoActionMenu();
        }

        document.getElementById(&#39;lassoScaleUpBtn&#39;).onclick = () =&gt; scaleLassoContent(1.15);
        document.getElementById(&#39;lassoScaleDownBtn&#39;).onclick = () =&gt; scaleLassoContent(0.85);

        document.getElementById(&#39;lassoDeleteBtn&#39;).onclick = () =&gt; {
            if (!currentLassoRect) return;
            flushPendingLassoColor();
            const page = pages[currentLassoRect.pageIdx];

            if (currentLassoTargetImage) {
                const imgEntry = currentLassoTargetImage;
                const ownerPg = ownerPageOf(imgEntry.elem) || page;
                imgEntry.elem.remove();
                page.imageBoxes = page.imageBoxes.filter(i =&gt; i.elem !== imgEntry.elem);
                pages.forEach(p =&gt; p.imageBoxes = p.imageBoxes.filter(i =&gt; i !== imgEntry));
                pushHistory({
                    undo() { ownerPg.card.appendChild(imgEntry.elem); ownerPg.imageBoxes.push(imgEntry); },
                    redo() {
                        imgEntry.elem.remove();
                        pages.forEach(p =&gt; p.imageBoxes = p.imageBoxes.filter(i =&gt; i !== imgEntry));
                    }
                });
            } else {
                const rx = currentLassoRect.x * RENDER_SCALE;
                const ry = currentLassoRect.y * RENDER_SCALE;
                const rw = currentLassoRect.width * RENDER_SCALE;
                const rh = currentLassoRect.height * RENDER_SCALE;
                const pre = capturePatch(page.ctx, page.canvas, { x: rx, y: ry, w: rw, h: rh });
                page.ctx.clearRect(rx, ry, rw, rh);
                if (pre) pushHistory(inkEntry(page, pre, null, true));
            }

            clearLassoBox();
        };

        function extractTransparentLassoImage() {
            if (!currentLassoRect) return null;
            const page = pages[currentLassoRect.pageIdx];

            const rx = currentLassoRect.x * RENDER_SCALE;
            const ry = currentLassoRect.y * RENDER_SCALE;
            const rw = currentLassoRect.width * RENDER_SCALE;
            const rh = currentLassoRect.height * RENDER_SCALE;

            if (rw &lt;= 0 || rh &lt;= 0) return null;

            const cropCanvas = document.createElement(&#39;canvas&#39;);
            cropCanvas.width = rw; cropCanvas.height = rh;
            const cropCtx = cropCanvas.getContext(&#39;2d&#39;);

            cropCtx.drawImage(page.canvas, rx, ry, rw, rh, 0, 0, rw, rh);

            const imgData = cropCtx.getImageData(0, 0, rw, rh);
            const data = imgData.data;

            for (let i = 0; i &lt; data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                if (r &gt; 235 &amp;&amp; g &gt; 235 &amp;&amp; b &gt; 235) {
                    data[i + 3] = 0;
                }
            }
            cropCtx.putImageData(imgData, 0, 0);
            return cropCanvas.toDataURL(&#39;image/png&#39;);
        }

        document.getElementById(&#39;lassoRemoveBgBtn&#39;).onclick = () =&gt; {
            if (!currentLassoRect) return;
            const dataUrl = extractTransparentLassoImage();
            if (!dataUrl) return;

            const pageIdx = currentLassoRect.pageIdx;
            const targetX = currentLassoRect.x;
            const targetY = currentLassoRect.y;
            const savedRect = Object.assign({}, currentLassoRect);

            const page = pages[pageIdx];
            flushPendingLassoColor();
            const removeBgPre = capturePatch(page.ctx, page.canvas, { x: savedRect.x * RENDER_SCALE, y: savedRect.y * RENDER_SCALE, w: savedRect.width * RENDER_SCALE, h: savedRect.height * RENDER_SCALE });
            page.ctx.clearRect(savedRect.x * RENDER_SCALE, savedRect.y * RENDER_SCALE, savedRect.width * RENDER_SCALE, savedRect.height * RENDER_SCALE);

            const img = new Image();
            img.onload = () =&gt; {
                insertImageToPage(pageIdx, img, dataUrl, {
                    left: targetX,
                    top: targetY,
                    width: savedRect.width,
                    height: savedRect.height
                });

                currentLassoTargetImage = page.imageBoxes[page.imageBoxes.length - 1];
                currentLassoRect = savedRect;

                const bgImgEntry = currentLassoTargetImage;
                if (bgImgEntry) {
                    pushHistory({
                        page: page,
                        bytes: removeBgPre ? removeBgPre.w * removeBgPre.h * 4 : 0,
                        undo() {
                            bgImgEntry.elem.remove();
                            pages.forEach(p =&gt; p.imageBoxes = p.imageBoxes.filter(i =&gt; i !== bgImgEntry));
                            applyPatch(page.ctx, removeBgPre);
                        },
                        redo() {
                            clearPatchRegion(page.ctx, removeBgPre);
                            page.card.appendChild(bgImgEntry.elem);
                            page.imageBoxes.push(bgImgEntry);
                        }
                    });
                }

                updateLassoOverlayPosition();
                showLassoActionMenu();
                showToast(&quot;Background Removed! Selection retained.&quot;);
            };
            img.src = dataUrl;
        };

        document.getElementById(&#39;lassoSavePresetBtn&#39;).onclick = async () =&gt; {
            const dataUrl = extractTransparentLassoImage();
            if (!dataUrl) return;

            const name = prompt(&quot;Enter a name for this diagram preset:&quot;, &quot;Diagram &quot; + (appState.presets.length + 1));

        // ================= PRESET GALLERY ENGINE &amp; PNG DOWNLOAD =================
        const savedPresetsModal = document.getElementById(&#39;savedPresetsModal&#39;);

        function renderPresetsGallery() {

                presetGrid.innerHTML = `

                    &lt;div class=&quot;preset-actions&quot;&gt;

                `;

                card.onclick = (e) =&gt; {

                card.querySelector(&#39;.preset-del-btn&#39;).onclick = async (e) =&gt; {

                        renderPresetsGallery();
