<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100dvh; margin: 0; padding: 0;
    overflow: hidden; background: #070b14;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  #viewportContainer {
    position: fixed; inset: 0; width: 100%; height: 100dvh;
    overflow: hidden; background: #070b14;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  #appStage {
    width: 1280px;
    height: 720px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform-style: flat;
  }

  #appStage iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  /* FLOATING MOBILE NAVIGATION, PAN & ZOOM BAR */
  .nav-overlay-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99990;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;
    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(20px) saturate(180%);

    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }

    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;

  }
  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;

    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {

  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>
</head>

    &lt;script&gt;
        // Request persistent storage from Webview/browser
        if (navigator.storage &amp;&amp; navigator.storage.persist) {
            navigator.storage.persist();
        }

        // Configure IndexedDB via localForage
        localforage.config({
            name: &#39;ProHandwritingNotesStudioDB&#39;,
            storeName: &#39;app_notes_store&#39;
        });

        // ================= STATE &amp; STORAGE ENGINE =================
        const PAGE_SIZES = {
            A4: { width: 794, height: 1123 },
            LETTER: { width: 816, height: 1056 },
            A3: { width: 1123, height: 1587 }
        };

        const RENDER_SCALE = Math.max(window.devicePixelRatio || 1, 2.5);

        let appState = {
            currentFolderId: &#39;root&#39;,
            folders: [],
            notes: []
        };

        let currentNoteId = null;
        let currentDocumentTitle = null;
        let autoSaveIntervalTimer = null;

        let pageSettings = {
            size: &#39;A4&#39;,
            orientation: &#39;portrait&#39;,
            borderStyle: &#39;none&#39;,
            borderColor: &#39;#333333&#39;,
            borderMargin: 0,
            pageMarginGuide: &#39;none&#39;,
            ruledLineCount: 25,
            background: &#39;bg-blank&#39;
        };

        let activeTool = &#39;pen&#39;;
        let currentColor = &#39;#000000&#39;;
        let strokeSize = 4;
        let currentPenStyle = &#39;fountain&#39;;

        const pagesContainer = document.getElementById(&#39;pagesContainer&#39;);
        const viewport = document.getElementById(&#39;viewport&#39;);
        let pages = [];
        
        // Undo and Redo Stack Management
        let undoStack = [];
        let redoStack = [];

        let currentStrokePoints = [];
        let preStrokeSnapshot = null;

        let scale = 0.8;
        let panX = 0, panY = 75;
        let pointers = [];
        let initialZoomDist = null, initialScale = scale;
        let initialPanX = panX, initialPanY = panY, initialCenter = { x: 0, y: 0 };
        let isDrawing = false, activePageIndex = null, hasZoomedOrPanned = false;

        function showToast(msg) {
            const toast = document.getElementById(&#39;toast&#39;);
            toast.innerText = msg;
            toast.classList.add(&#39;show&#39;);
            setTimeout(() =&gt; toast.classList.remove(&#39;show&#39;), 2500);
        }

        // Helper to format raw byte count into human-readable unit string (KB, MB, GB)
        function formatBytes(bytes, decimals = 1) {
            if (!bytes || bytes === 0) return &#39;0 KB&#39;;
            const k = 1024;
            const dm = decimals &lt; 0 ? 0 : decimals;
            const sizes = [&#39;Bytes&#39;, &#39;KB&#39;, &#39;MB&#39;, &#39;GB&#39;, &#39;TB&#39;];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            if (i === 0) return bytes + &#39; Bytes&#39;;
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + &#39; &#39; + sizes[i];
        }

        function calculateNoteBytes(note) {
            try {
                return new Blob([JSON.stringify(note)]).size;
            } catch(e) {
                return 0;
            }
        }

        async function loadStorageTree() {
            try {
                const data = await localforage.getItem(&#39;notes_studio_app_state&#39;);
                if (data) {
                    appState = data;
                }
            } catch(e) {
                console.error(&quot;Storage load error:&quot;, e);
            }
            renderDashboard();
        }

        async function saveStorageTree() {
            try {
                await localforage.setItem(&#39;notes_studio_app_state&#39;, appState);
            } catch(e) {
                console.error(&quot;Storage save error:&quot;, e);
            }
        }

        // Helper to re-evaluate and assign absolute cross-page image/text locations
        function reassignOverlaysToCorrectPages() {
            const dims = getPageDimensions();
            let allImages = [];
            let allTexts = [];

            // Gather all image and text instances from pages
            pages.forEach(p =&gt; {
                allImages.push(...p.imageBoxes);
                allTexts.push(...p.textBoxes);
                p.imageBoxes = [];
                p.textBoxes = [];
            });

            // Re-assign images based on bounding center coordinates
            allImages.forEach(ib =&gt; {
                const rect = ib.elem.getBoundingClientRect();
                const centerPointX = rect.left + rect.width / 2;
                const centerPointY = rect.top + rect.height / 2;

                let targetPageIndex = 0;
                let minDistance = Infinity;

                pages.forEach((p, idx) =&gt; {
                    const pRect = p.card.getBoundingClientRect();
                    const pCenterY = pRect.top + pRect.height / 2;
                    const dist = Math.abs(centerPointY - pCenterY);
                    if (dist &lt; minDistance) {
                        minDistance = dist;
                        targetPageIndex = idx;
                    }
                });

                const targetCard = pages[targetPageIndex].card;
                if (ib.elem.parentElement !== targetCard) {
                    targetCard.appendChild(ib.elem);
                }

                // Convert position relative to target page origin
                const tRect = targetCard.getBoundingClientRect();
                const relLeft = (rect.left - tRect.left) / scale;
                const relTop = (rect.top - tRect.top) / scale;

                ib.elem.style.left = relLeft + &#39;px&#39;;
                ib.elem.style.top = relTop + &#39;px&#39;;

                pages[targetPageIndex].imageBoxes.push(ib);
            });

            // Re-assign text boxes based on bounding center coordinates
            allTexts.forEach(tb =&gt; {
                const rect = tb.elem.getBoundingClientRect();
                const centerPointY = rect.top + rect.height / 2;

                let targetPageIndex = 0;
                let minDistance = Infinity;

                pages.forEach((p, idx) =&gt; {
                    const pRect = p.card.getBoundingClientRect();
                    const pCenterY = pRect.top + pRect.height / 2;
                    const dist = Math.abs(centerPointY - pCenterY);
                    if (dist &lt; minDistance) {
                        minDistance = dist;
                        targetPageIndex = idx;
                    }
                });

                const targetCard = pages[targetPageIndex].card;
                if (tb.elem.parentElement !== targetCard) {
                    targetCard.appendChild(tb.elem);
                }

                const tRect = targetCard.getBoundingClientRect();
                const relLeft = (rect.left - tRect.left) / scale;
                const relTop = (rect.top - tRect.top) / scale;

                tb.elem.style.left = relLeft + &#39;px&#39;;
                tb.elem.style.top = relTop + &#39;px&#39;;

                pages[targetPageIndex].textBoxes.push(tb);
            });
        }

        // ================= DASHBOARD &amp; FOLDER NAVIGATION =================
        const dashboardView = document.getElementById(&#39;dashboardView&#39;);
        const studioView = document.getElementById(&#39;studioView&#39;);
        const folderContentGrid = document.getElementById(&#39;folderContentGrid&#39;);
        const breadcrumbBar = document.getElementById(&#39;breadcrumbBar&#39;);

        function renderDashboard() {
            folderContentGrid.innerHTML = &#39;&#39;;
            breadcrumbBar.innerHTML = &#39;&#39;;

            let path = getFolderPath(appState.currentFolderId);
            path.forEach((f, idx) =&gt; {
                const item = document.createElement(&#39;span&#39;);
                item.className = &#39;breadcrumb-item&#39;;
                item.innerText = f.name;
                item.onclick = () =&gt; {
                    appState.currentFolderId = f.id;
                    renderDashboard();
                };
                breadcrumbBar.appendChild(item);

                if (idx &lt; path.length - 1) {
                    const sep = document.createElement(&#39;span&#39;);
                    sep.className = &#39;breadcrumb-separator&#39;;
                    sep.innerText = &#39; / &#39;;
                    breadcrumbBar.appendChild(sep);
                }
            });

            const currentFolders = appState.folders.filter(f =&gt; f.parentId === appState.currentFolderId);
            const currentNotes = appState.notes.filter(n =&gt; n.folderId === appState.currentFolderId);

            currentFolders.forEach(f =&gt; {
                const card = document.createElement(&#39;div&#39;);
                card.className = &#39;item-card&#39;;
                card.innerHTML = `
                    &lt;div class=&quot;item-icon&quot;&gt;📁&lt;/div&gt;
                    &lt;div class=&quot;item-title&quot;&gt;${f.name}&lt;/div&gt;
                    &lt;div class=&quot;item-meta&quot;&gt;Folder&lt;/div&gt;
                    &lt;button class=&quot;item-del-btn&quot; title=&quot;Delete Folder&quot;&gt;✕&lt;/button&gt;
                `;
                card.onclick = (e) =&gt; {
                    if (e.target.classList.contains(&#39;item-del-btn&#39;)) return;
                    appState.currentFolderId = f.id;
                    renderDashboard();
                };

                card.querySelector(&#39;.item-del-btn&#39;).onclick = (e) =&gt; {
                    e.stopPropagation();
                    if (confirm(`Delete folder &quot;${f.name}&quot; and its contents?`)) {
                        deleteFolderRecursive(f.id);
                        saveStorageTree();
                        renderDashboard();
                    }
                };

                folderContentGrid.appendChild(card);
            });

            currentNotes.forEach(n =&gt; {
                const sizeBytes = calculateNoteBytes(n);
                const formattedSize = formatBytes(sizeBytes);

                const card = document.createElement(&#39;div&#39;);
                card.className = &#39;item-card&#39;;
                card.innerHTML = `
                    &lt;div class=&quot;item-icon&quot;&gt;📝&lt;/div&gt;
                    &lt;div class=&quot;item-title&quot;&gt;${n.title}&lt;/div&gt;
                    &lt;div class=&quot;item-meta&quot;&gt;${n.pageCount || 1} Page(s)&lt;/div&gt;
                    &lt;div class=&quot;item-size-badge&quot;&gt;📦 ${formattedSize}&lt;/div&gt;
                    &lt;button class=&quot;item-del-btn&quot; title=&quot;Delete Note&quot;&gt;✕&lt;/button&gt;
                `;
                card.onclick = (e) =&gt; {
                    if (e.target.classList.contains(&#39;item-del-btn&#39;)) return;
                    openNoteStudio(n.id);
                };

                card.querySelector(&#39;.item-del-btn&#39;).onclick = (e) =&gt; {
                    e.stopPropagation();
                    if (confirm(`Delete note &quot;${n.title}&quot;?`)) {
                        appState.notes = appState.notes.filter(x =&gt; x.id !== n.id);
                        saveStorageTree();
                        renderDashboard();
                    }
                };

                folderContentGrid.appendChild(card);
            });

            if (currentFolders.length === 0 &amp;&amp; currentNotes.length === 0) {
                folderContentGrid.innerHTML = `
                    &lt;div style=&quot;grid-column: 1/-1; text-align:center; padding: 40px; color: #6b7280; font-size:13px;&quot;&gt;
                        This folder is empty. Click &lt;b&gt;&quot;➕ Create&quot;&lt;/b&gt; below to add a folder or note!
                    &lt;/div&gt;
                `;
            }
        }

        function getFolderPath(folderId) {
            let path = [{ id: &#39;root&#39;, name: &#39;🏠 Home&#39; }];
            if (folderId === &#39;root&#39;) return path;

            let stack = [];
            let curr = appState.folders.find(f =&gt; f.id === folderId);
            while (curr) {
                stack.unshift(curr);
                curr = appState.folders.find(f =&gt; f.id === curr.parentId);
            }
            return path.concat(stack);
        }

        function deleteFolderRecursive(folderId) {
            const subFolders = appState.folders.filter(f =&gt; f.parentId === folderId);
            subFolders.forEach(sf =&gt; deleteFolderRecursive(sf.id));

            appState.notes = appState.notes.filter(n =&gt; n.folderId !== folderId);
            appState.folders = appState.folders.filter(f =&gt; f.id !== folderId);
        }

        const fabBtn = document.getElementById(&#39;fabBtn&#39;);
        const fabPopover = document.getElementById(&#39;fabPopover&#39;);

        fabBtn.onclick = (e) =&gt; {
            e.stopPropagation();
            fabPopover.style.display = fabPopover.style.display === &#39;flex&#39; ? &#39;none&#39; : &#39;flex&#39;;
        };

        document.onclick = (e) =&gt; {
            if (!fabPopover.contains(e.target) &amp;&amp; e.target !== fabBtn) {
                fabPopover.style.display = &#39;none&#39;;
            }
        };

        const createFolderModal = document.getElementById(&#39;createFolderModal&#39;);
        const folderNameInput = document.getElementById(&#39;folderNameInput&#39;);

        document.getElementById(&#39;fabNewFolderBtn&#39;).onclick = () =&gt; {
            fabPopover.style.display = &#39;none&#39;;
            folderNameInput.value = &#39;&#39;;
            createFolderModal.style.display = &#39;flex&#39;;
            setTimeout(() =&gt; folderNameInput.focus(), 100);
        };

        document.getElementById(&#39;cancelFolderBtn&#39;).onclick = () =&gt; createFolderModal.style.display = &#39;none&#39;;
        document.getElementById(&#39;saveFolderBtn&#39;).onclick = () =&gt; {
            const name = folderNameInput.value.trim() || &#39;New Folder&#39;;
            const newFolder = {
                id: &#39;folder_&#39; + Date.now(),
                name: name,
                parentId: appState.currentFolderId
            };
            appState.folders.push(newFolder);
            saveStorageTree();
            createFolderModal.style.display = &#39;none&#39;;
            renderDashboard();
        };

        const createNoteModal = document.getElementById(&#39;createNoteModal&#39;);
        const noteTitleInput = document.getElementById(&#39;noteTitleInput&#39;);

        document.getElementById(&#39;fabNewNoteBtn&#39;).onclick = () =&gt; {
            fabPopover.style.display = &#39;none&#39;;
            noteTitleInput.value = &#39;&#39;;
            createNoteModal.style.display = &#39;flex&#39;;
            setTimeout(() =&gt; noteTitleInput.focus(), 100);
        };

        document.getElementById(&#39;cancelNoteBtn&#39;).onclick = () =&gt; createNoteModal.style.display = &#39;none&#39;;
        document.getElementById(&#39;saveNoteBtn&#39;).onclick = () =&gt; {
            let title = noteTitleInput.value.trim();
            if (!title) {
                title = &#39;Untitled Note - &#39; + new Date().toLocaleDateString();
            }

            let targetFolderId = appState.currentFolderId;

            if (targetFolderId === &#39;root&#39;) {
                let defaultFolder = appState.folders.find(f =&gt; f.name === &#39;General Notes&#39; &amp;&amp; f.parentId === &#39;root&#39;);
                if (!defaultFolder) {
                    defaultFolder = {
                        id: &#39;folder_default_&#39; + Date.now(),
                        name: &#39;General Notes&#39;,
                        parentId: &#39;root&#39;
                    };
                    appState.folders.push(defaultFolder);
                }
                targetFolderId = defaultFolder.id;
            }

            const newNote = {
                id: &#39;note_&#39; + Date.now(),
                title: title,
                folderId: targetFolderId,
                pageSettings: Object.assign({}, pageSettings),
                pageCount: 1,
                pagesData: []
            };

            appState.notes.push(newNote);
            saveStorageTree();
            createNoteModal.style.display = &#39;none&#39;;

            openNoteStudio(newNote.id);
        };

        // ================= STUDIO WORKSPACE ENGINE =================
        function openNoteStudio(noteId) {
            currentNoteId = noteId;
            const note = appState.notes.find(n =&gt; n.id === noteId);
            if (!note) return;

            currentDocumentTitle = note.title;
            document.getElementById(&#39;docTitleBadge&#39;).innerText = note.title;

            if (note.pageSettings) {
                pageSettings = Object.assign({}, note.pageSettings);
                document.getElementById(&#39;pageSizeSelect&#39;).value = pageSettings.size;
                document.getElementById(&#39;pageOrientationSelect&#39;).value = pageSettings.orientation;
                document.getElementById(&#39;borderStyleSelect&#39;).value = pageSettings.borderStyle;
                document.getElementById(&#39;borderColorInput&#39;).value = pageSettings.borderColor;
                document.getElementById(&#39;borderMarginInput&#39;).value = pageSettings.borderMargin;
                document.getElementById(&#39;pageMarginGuideSelect&#39;).value = pageSettings.pageMarginGuide;
                document.getElementById(&#39;ruledLineCountInput&#39;).value = pageSettings.ruledLineCount;
                document.getElementById(&#39;bgSelect&#39;).value = pageSettings.background;
            }

            pagesContainer.innerHTML = &#39;&#39;;
            pages = [];
            undoStack = [];
            redoStack = [];
            updateUndoRedoUI();

            const count = note.pageCount || 1;
            for (let i = 0; i &lt; count; i++) {
                createNewPage();
                const pData = note.pagesData ? note.pagesData[i] : null;
                if (pData) {
                    if (pData.inkData) {
                        const img = new Image();
                        const pageCanvas = pages[i].canvas;
                        const pageCtx = pages[i].ctx;
                        img.src = pData.inkData;
                        img.onload = () =&gt; {
                            const dims = getPageDimensions();
                            pageCtx.drawImage(img, 0, 0, dims.width, dims.height);
                        };
                    }
                    if (pData.imageBoxes) {
                        pData.imageBoxes.forEach(sImg =&gt; {
                            const img = new Image();
                            img.onload = () =&gt; insertImageToPage(i, img, sImg.src, sImg);
                            img.src = sImg.src;
                        });
                    }
                    if (pData.textBoxes) {
                        pData.textBoxes.forEach(sTb =&gt; createTextBox(i, sTb.left, sTb.top, sTb.content, sTb.color, sTb.width));
                    }
                }
            }

            dashboardView.style.display = &#39;none&#39;;
            studioView.style.display = &#39;block&#39;;
            centerPages();
            updateDocSizeBadge();

            startAutoSaveTimer();
        }

        function updateDocSizeBadge() {
            if (!currentNoteId) return;
            const note = appState.notes.find(n =&gt; n.id === currentNoteId);
            if (note) {
                const bytes = calculateNoteBytes(note);
                document.getElementById(&#39;docSizeBadge&#39;).innerText = formatBytes(bytes);
            }
        }

        async function executeNoteSave(isSilent = false) {
            if (!currentNoteId) return;

            const note = appState.notes.find(n =&gt; n.id === currentNoteId);
            if (!note) return;

            // Re-sync all image/text elements to proper pages before serialization
            reassignOverlaysToCorrectPages();

            note.title = currentDocumentTitle;
            note.pageSettings = Object.assign({}, pageSettings);
            note.pageCount = pages.length;
            note.pagesData = pages.map(p =&gt; ({
                inkData: p.canvas.toDataURL(),
                imageBoxes: p.imageBoxes.map(ib =&gt; ({
                    src: ib.imgElem.src,
                    left: parseFloat(ib.elem.style.left) || 60,
                    top: parseFloat(ib.elem.style.top) || 60,
                    width: ib.elem.offsetWidth,
                    height: ib.elem.offsetHeight
                })),
                textBoxes: p.textBoxes.map(tb =&gt; ({
                    left: parseFloat(tb.elem.style.left) || 60,
                    top: parseFloat(tb.elem.style.top) || 60,
                    width: parseFloat(tb.elem.style.width) || 220,
                    content: tb.contentElem.innerText,
                    color: tb.contentElem.style.color || currentColor
                }))
            }));

            await saveStorageTree();
            updateDocSizeBadge();

            if (!isSilent) {
                showToast(`Saved to &quot;${currentDocumentTitle}&quot;`);
            }
        }

        function startAutoSaveTimer() {
            stopAutoSaveTimer();
            autoSaveIntervalTimer = setInterval(() =&gt; {
                executeNoteSave(true);
                showToast(`Auto-saved at ${new Date().toLocaleTimeString([], {hour: &#39;2-digit&#39;, minute:&#39;2-digit&#39;})}`);
            }, 60000);
        }

        function stopAutoSaveTimer() {
            if (autoSaveIntervalTimer) {
                clearInterval(autoSaveIntervalTimer);
                autoSaveIntervalTimer = null;
            }
        }

        document.getElementById(&#39;backToDashBtn&#39;).onclick = async () =&gt; {
            await executeNoteSave(true);
            stopAutoSaveTimer();
            studioView.style.display = &#39;none&#39;;
            dashboardView.style.display = &#39;flex&#39;;
            renderDashboard();
        };

        document.getElementById(&#39;quickSaveBtn&#39;).onclick = () =&gt; executeNoteSave(false);

        const docTitleBadge = document.getElementById(&#39;docTitleBadge&#39;);
        docTitleBadge.onclick = () =&gt; {
            const newTitle = prompt(&quot;Enter new document title:&quot;, currentDocumentTitle);
            if (newTitle &amp;&amp; newTitle.trim()) {
                currentDocumentTitle = newTitle.trim();
                docTitleBadge.innerText = currentDocumentTitle;
                executeNoteSave(false);
            }
        };

        // ================= CANVAS DRAWING &amp; GESTURE =================
        function updateTransform() {
            pagesContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function centerPages() {
            const dims = getPageDimensions();
            const windowW = window.innerWidth;
            if (windowW &lt; dims.width * 0.85) {
                scale = (windowW - 24) / dims.width;
            } else {
                scale = 0.8;
            }
            panX = (windowW - dims.width * scale) / 2;
            panY = 75;
            updateTransform();
        }

        window.addEventListener(&#39;resize&#39;, () =&gt; { if (!hasZoomedOrPanned) centerPages(); });
        document.getElementById(&#39;recenterBtn&#39;).onclick = () =&gt; { hasZoomedOrPanned = false; centerPages(); };

        function createNewPage() {
            const pageIndex = pages.length;
            const card = document.createElement(&#39;div&#39;);
            card.className = `page-card`;
            card.dataset.index = pageIndex;

            const pageTag = document.createElement(&#39;div&#39;);
            pageTag.className = &#39;page-number-tag&#39;;
            pageTag.innerText = `PAGE ${pageIndex + 1}`;
            card.appendChild(pageTag);

            const marginOverlay = document.createElement(&#39;div&#39;);
            marginOverlay.className = &#39;margin-overlay&#39;;
            card.appendChild(marginOverlay);

            const bgCanvas = document.createElement(&#39;canvas&#39;);
            bgCanvas.className = &#39;bg-canvas&#39;;
            card.appendChild(bgCanvas);

            const inkCanvas = document.createElement(&#39;canvas&#39;);
            inkCanvas.className = &#39;ink-canvas&#39;;
            card.appendChild(inkCanvas);

            pagesContainer.appendChild(card);

            const pageObj = {
                card: card,
                pageTag: pageTag,
                marginOverlay: marginOverlay,
                bgCanvas: bgCanvas,
                bgCtx: bgCanvas.getContext(&#39;2d&#39;),
                canvas: inkCanvas,
                ctx: inkCanvas.getContext(&#39;2d&#39;, { willReadFrequently: true }),
                textBoxes: [],
                imageBoxes: []
            };

            pages.push(pageObj);
            applyLayoutToPage(pageIndex);
            savePageState(pageIndex);
        }

        function getPageDimensions() {
            const base = PAGE_SIZES[pageSettings.size];
            return pageSettings.orientation === &#39;portrait&#39;
                ? { width: base.width, height: base.height }
                : { width: base.height, height: base.width };
        }

        function getRuledLineHeight() {
            const dims = getPageDimensions();
            const lineCount = parseInt(pageSettings.ruledLineCount) || 25;
            const totalSlots = lineCount + 4;
            return dims.height / totalSlots;
        }

        function applyLayoutToPage(index) {
            const page = pages[index];
            const dims = getPageDimensions();

            page.card.style.width = dims.width + &#39;px&#39;;
            page.card.style.height = dims.height + &#39;px&#39;;

            page.bgCanvas.width = dims.width * RENDER_SCALE;
            page.bgCanvas.height = dims.height * RENDER_SCALE;
            page.bgCanvas.style.width = dims.width + &#39;px&#39;;
            page.bgCanvas.style.height = dims.height + &#39;px&#39;;
            page.bgCtx.scale(RENDER_SCALE, RENDER_SCALE);

            page.canvas.width = dims.width * RENDER_SCALE;
            page.canvas.height = dims.height * RENDER_SCALE;
            page.canvas.style.width = dims.width + &#39;px&#39;;
            page.canvas.style.height = dims.height + &#39;px&#39;;
            page.ctx.scale(RENDER_SCALE, RENDER_SCALE);

            const offset = parseInt(pageSettings.borderMargin) || 0;
            const color = pageSettings.borderColor;
            page.card.style.padding = offset + &#39;px&#39;;

            switch(pageSettings.borderStyle) {
                case &#39;thin&#39;: page.card.style.border = `2px solid ${color}`; break;
                case &#39;thick&#39;: page.card.style.border = `5px solid ${color}`; break;
                case &#39;double&#39;: page.card.style.border = `7px double ${color}`; break;
                case &#39;dashed&#39;: page.card.style.border = `3px dashed ${color}`; break;
                default: page.card.style.border = &#39;none&#39;; break;
            }

            renderBackgroundPattern(page.bgCtx, dims.width, dims.height);
            renderMarginGuideOverlay(page.marginOverlay, dims);

            const ruleH = getRuledLineHeight();
            page.textBoxes.forEach(tb =&gt; {
                tb.contentElem.style.fontSize = (ruleH * 0.72) + &#39;px&#39;;
                tb.contentElem.style.lineHeight = ruleH + &#39;px&#39;;
                tb.contentElem.style.minHeight = ruleH + &#39;px&#39;;
            });
        }

        function getFirstRuledLineY(height) {
            const lineCount = parseInt(pageSettings.ruledLineCount) || 25;
            const totalSlots = lineCount + 4;
            return 2 * (height / totalSlots);
        }

        function renderBackgroundPattern(ctx, width, height) {
            ctx.fillStyle = &#39;#ffffff&#39;;
            ctx.fillRect(0, 0, width, height);

            const pattern = pageSettings.background;
            ctx.strokeStyle = &#39;#e5e5e5&#39;;
            ctx.lineWidth = 1;
            ctx.beginPath();

            if (pattern === &#39;bg-ruled&#39;) {
                const lineCount = parseInt(pageSettings.ruledLineCount) || 25;
                const totalSlots = lineCount + 4;
                const stepY = height / totalSlots;
                ctx.strokeStyle = &#39;#a2bfe0&#39;;
                for (let k = 2; k &lt;= totalSlots - 2; k++) {
                    ctx.moveTo(0, k * stepY); ctx.lineTo(width, k * stepY);
                }
            } else if (pattern === &#39;bg-grid&#39;) {
                for (let x = 25; x &lt; width; x += 25) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
                for (let y = 25; y &lt; height; y += 25) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
            } else if (pattern === &#39;bg-dotted&#39;) {
                ctx.fillStyle = &#39;#aaaaaa&#39;;
                for (let x = 25; x &lt; width; x += 25) {
                    for (let y = 25; y &lt; height; y += 25) { ctx.fillRect(x, y, 1.5, 1.5); }
                }
            }
            ctx.stroke();
        }

        function renderMarginGuideOverlay(overlayElem, dims) {
            overlayElem.innerHTML = &#39;&#39;;
            const type = pageSettings.pageMarginGuide;
            if (type === &#39;none&#39;) return;

            const svg = document.createElementNS(&#39;http://www.w3.org/2000/svg&#39;, &#39;svg&#39;);
            svg.setAttribute(&#39;width&#39;, &#39;100%&#39;); svg.setAttribute(&#39;height&#39;, &#39;100%&#39;);
            svg.style.position = &#39;absolute&#39;;

            if (type === &#39;notebook&#39; || type === &#39;header&#39;) {
                const redLine = document.createElementNS(&#39;http://www.w3.org/2000/svg&#39;, &#39;line&#39;);
                redLine.setAttribute(&#39;x1&#39;, &#39;70&#39;); redLine.setAttribute(&#39;y1&#39;, &#39;0&#39;);
                redLine.setAttribute(&#39;x2&#39;, &#39;70&#39;); redLine.setAttribute(&#39;y2&#39;, dims.height);
                redLine.setAttribute(&#39;stroke&#39;, &#39;#ef4444&#39;); redLine.setAttribute(&#39;stroke-width&#39;, &#39;2&#39;);
                svg.appendChild(redLine);
            }

            if (type === &#39;header&#39;) {
                const headerY = pageSettings.background === &#39;bg-ruled&#39; ? getFirstRuledLineY(dims.height) : 80;
                const headerLine = document.createElementNS(&#39;http://www.w3.org/2000/svg&#39;, &#39;line&#39;);
                headerLine.setAttribute(&#39;x1&#39;, &#39;0&#39;); headerLine.setAttribute(&#39;y1&#39;, headerY);
                headerLine.setAttribute(&#39;x2&#39;, dims.width); headerLine.setAttribute(&#39;y2&#39;, headerY);
                headerLine.setAttribute(&#39;stroke&#39;, &#39;#93c5fd&#39;); headerLine.setAttribute(&#39;stroke-width&#39;, &#39;2&#39;);
                svg.appendChild(headerLine);
            }

            if (type === &#39;box&#39;) {
                const rect = document.createElementNS(&#39;http://www.w3.org/2000/svg&#39;, &#39;rect&#39;);
                rect.setAttribute(&#39;x&#39;, &#39;40&#39;); rect.setAttribute(&#39;y&#39;, &#39;40&#39;);
                rect.setAttribute(&#39;width&#39;, dims.width - 80); rect.setAttribute(&#39;height&#39;, dims.height - 80);
                rect.setAttribute(&#39;fill&#39;, &#39;none&#39;); rect.setAttribute(&#39;stroke&#39;, &#39;#ef4444&#39;);
                rect.setAttribute(&#39;stroke-width&#39;, &#39;1.5&#39;); rect.setAttribute(&#39;stroke-dasharray&#39;, &#39;4 4&#39;);
                svg.appendChild(rect);
            }

            overlayElem.appendChild(svg);
        }

        function drawMarginGuidesOnCanvas(ctx, dims) {
            const type = pageSettings.pageMarginGuide;
            if (type === &#39;none&#39;) return;

            ctx.save();
            if (type === &#39;notebook&#39; || type === &#39;header&#39;) {
                ctx.strokeStyle = &#39;#ef4444&#39;; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(70, 0); ctx.lineTo(70, dims.height); ctx.stroke();
            }
            if (type === &#39;header&#39;) {
                const headerY = pageSettings.background === &#39;bg-ruled&#39; ? getFirstRuledLineY(dims.height) : 80;
                ctx.strokeStyle = &#39;#93c5fd&#39;; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, headerY); ctx.lineTo(dims.width, headerY); ctx.stroke();
            }
            if (type === &#39;box&#39;) {
                ctx.strokeStyle = &#39;#ef4444&#39;; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
                ctx.strokeRect(40, 40, dims.width - 80, dims.height - 80);
            }
            ctx.restore();
        }

        function updateAllPagesLayout() {
            pages.forEach((_, idx) =&gt; {
                const tempCanvas = document.createElement(&#39;canvas&#39;);
                tempCanvas.width = pages[idx].canvas.width;
                tempCanvas.height = pages[idx].canvas.height;
                tempCanvas.getContext(&#39;2d&#39;).drawImage(pages[idx].canvas, 0, 0);

                applyLayoutToPage(idx);
                pages[idx].ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width / RENDER_SCALE, tempCanvas.height / RENDER_SCALE);
            });
            centerPages();
        }

        function configurePenStyle(ctx, style, color, width) {
            ctx.shadowBlur = 0; ctx.shadowColor = &#39;transparent&#39;;
            if (activeTool === &#39;eraser&#39;) {
                ctx.globalCompositeOperation = &#39;destination-out&#39;;
                ctx.strokeStyle = &#39;#000000&#39;; ctx.lineWidth = width * 2.5;
                ctx.globalAlpha = 1.0; ctx.lineCap = &#39;round&#39;; ctx.lineJoin = &#39;round&#39;;
                return;
            }
            if (style === &#39;highlighter&#39;) {
                ctx.globalCompositeOperation = &#39;destination-over&#39;;
                ctx.strokeStyle = color; ctx.lineWidth = width * 4.5;
                ctx.lineCap = &#39;square&#39;; ctx.lineJoin = &#39;miter&#39;; ctx.globalAlpha = 0.45;
                return;
            }
            ctx.globalCompositeOperation = &#39;source-over&#39;;
            ctx.strokeStyle = color; ctx.lineCap = &#39;round&#39;; ctx.lineJoin = &#39;round&#39;;

            switch(style) {
                case &#39;fineliner&#39;: ctx.lineWidth = width * 0.8; ctx.globalAlpha = 1.0; break;
                case &#39;ballpoint&#39;: ctx.lineWidth = width * 0.95; ctx.globalAlpha = 0.9; break;
                case &#39;fountain&#39;: ctx.lineWidth = width * 1.0; ctx.globalAlpha = 1.0; break;
                case &#39;sharptaper&#39;: ctx.lineWidth = width * 1.0; ctx.globalAlpha = 1.0; break;
                case &#39;calligraphy&#39;: ctx.lineWidth = width * 2.2; ctx.lineCap = &#39;square&#39;; ctx.globalAlpha = 0.95; break;
                case &#39;brush&#39;: ctx.lineWidth = width * 1.8; ctx.globalAlpha = 0.88; break;
                case &#39;marker&#39;: ctx.lineWidth = width * 3.0; ctx.lineCap = &#39;butt&#39;; ctx.globalAlpha = 0.92; break;
                case &#39;pencil&#39;: ctx.lineWidth = width * 0.75; ctx.globalAlpha = 0.55; break;
                case &#39;neon&#39;: ctx.lineWidth = width * 1.2; ctx.globalAlpha = 1.0; ctx.shadowColor = color; ctx.shadowBlur = 12; break;
                case &#39;charcoal&#39;: ctx.lineWidth = width * 2.0; ctx.globalAlpha = 0.65; break;

        }

        // Catmull-Rom Spline Interpolation for Curved Smoothness even at High Speeds
        function catmullRomSpline(p0, p1, p2, p3, t) {
            const v0 = (p2.x - p0.x) * 0.5, v1 = (p3.x - p1.x) * 0.5;
            const t2 = t * t, t3 = t2 * t;
            const x = (2 * p1.x - 2 * p2.x + v0 + v1) * t3 + (-3 * p1.x + 3 * p2.x - 2 * v0 - v1) * t2 + v0 * t + p1.x;

            const wy0 = (p2.y - p0.y) * 0.5, wy1 = (p3.y - p1.y) * 0.5;
            const y = (2 * p1.y - 2 * p2.y + wy0 + wy1) * t3 + (-3 * p1.y + 3 * p2.y - 2 * wy0 - wy1) * t2 + wy0 * t + p1.y;

            return { x, y };
        }

        // Seamless Curved Contour Generator for Ultra-Smooth Sharp Taper Pen at High Speeds
        function renderSharpTaperStroke(ctx, points) {
            const baseW = strokeSize * 1.2;

            if (points.length === 1) {
                ctx.fillStyle = currentColor;
                ctx.beginPath();
                ctx.arc(points[0].x, points[0].y, 0.5, 0, Math.PI * 2);
                ctx.fill();
                return;
            }

            // Smooth input points using Catmull-Rom Spline interpolation
            let pts = points;
            if (pts.length &gt;= 2) {
                let smoothPts = [pts[0]];
                let extendedPts = [pts[0], ...pts, pts[pts.length - 1]];

                for (let i = 1; i &lt; extendedPts.length - 2; i++) {
                    let p0 = extendedPts[i - 1];
                    let p1 = extendedPts[i];
                    let p2 = extendedPts[i + 1];
                    let p3 = extendedPts[i + 2];
                    
                    let dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    let steps = Math.max(3, Math.ceil(dist / 2));

                    for (let k = 1; k &lt;= steps; k++) {
                        smoothPts.push(catmullRomSpline(p0, p1, p2, p3, k / steps));
                    }
                }
                pts = smoothPts;
            }

            // Calculate cumulative length
            let totalDist = 0;
            let cumDists = [0];
            for (let i = 1; i &lt; pts.length; i++) {
                totalDist += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
                cumDists.push(totalDist);
            }

            if (totalDist === 0) return;

            let leftSide = [];
            let rightSide = [];

            for (let i = 0; i &lt; pts.length; i++) {
                let progress = cumDists[i] / totalDist;
                
                // Continuous Sine Envelope tapering
                let taperFactor = Math.sin(progress * Math.PI);
                let currentWidth = baseW * Math.pow(taperFactor, 0.8);

                let dx, dy;
                if (i === 0) {
                    dx = pts[1].x - pts[0].x;
                    dy = pts[1].y - pts[0].y;
                } else if (i === pts.length - 1) {
                    dx = pts[i].x - pts[i - 1].x;
                    dy = pts[i].y - pts[i - 1].y;
                } else {
                    dx = pts[i + 1].x - pts[i - 1].x;
                    dy = pts[i + 1].y - pts[i - 1].y;
                }

                let len = Math.hypot(dx, dy) || 1;
                let nx = -dy / len;
                let ny = dx / len;

                let r = currentWidth / 2;

                leftSide.push({
                    x: pts[i].x + nx * r,
                    y: pts[i].y + ny * r
                });
                rightSide.push({
                    x: pts[i].x - nx * r,
                    y: pts[i].y - ny * r
                });
            }

            // Draw fluid curved stroke boundary using quadratic curves
            ctx.fillStyle = currentColor;
            ctx.beginPath();
            ctx.moveTo(leftSide[0].x, leftSide[0].y);

            // Left side curve interpolation
            for (let i = 1; i &lt; leftSide.length - 1; i++) {
                let xc = (leftSide[i].x + leftSide[i + 1].x) / 2;
                let yc = (leftSide[i].y + leftSide[i + 1].y) / 2;
                ctx.quadraticCurveTo(leftSide[i].x, leftSide[i].y, xc, yc);
            }
            if (leftSide.length &gt; 1) {
                let lastL = leftSide[leftSide.length - 1];
                ctx.lineTo(lastL.x, lastL.y);
            }

            // Right side curve interpolation
            for (let i = rightSide.length - 1; i &gt; 0; i--) {
                let xc = (rightSide[i].x + rightSide[i - 1].x) / 2;
                let yc = (rightSide[i].y + rightSide[i - 1].y) / 2;
                ctx.quadraticCurveTo(rightSide[i].x, rightSide[i].y, xc, yc);
            }
            ctx.lineTo(rightSide[0].x, rightSide[0].y);

            ctx.closePath();
            ctx.fill();
        }

        function renderSmoothStroke(ctx, points) {
            if (!points || points.length === 0) return;

            if (currentPenStyle === &#39;sharptaper&#39; &amp;&amp; activeTool !== &#39;eraser&#39;) {
                ctx.globalCompositeOperation = &#39;source-over&#39;;
                ctx.globalAlpha = 1.0;
                renderSharpTaperStroke(ctx, points);
                return;
            }

            if (currentPenStyle === &#39;fountain&#39; &amp;&amp; activeTool !== &#39;eraser&#39;) {
                ctx.globalCompositeOperation = &#39;source-over&#39;;
                ctx.strokeStyle = currentColor;
                ctx.fillStyle = currentColor;
                ctx.lineCap = &#39;round&#39;;
                ctx.lineJoin = &#39;round&#39;;
                ctx.globalAlpha = 1.0;

                const baseW = strokeSize * 1.0;

                if (points.length === 1) {
                    ctx.beginPath();
                    ctx.arc(points[0].x, points[0].y, baseW / 2, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                let totalLength = 0;
                const dists = [0];
                for (let i = 1; i &lt; points.length; i++) {
                    const d = Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
                    totalLength += d;
                    dists.push(totalLength);
                }

                for (let i = 1; i &lt; points.length; i++) {
                    const p1 = points[i - 1];
                    const p2 = points[i];

                    const progress1 = totalLength &gt; 0 ? dists[i - 1] / totalLength : 0;
                    const progress2 = totalLength &gt; 0 ? dists[i] / totalLength : 1;

                    const minW = baseW * 1.0;
                    const maxW = baseW * 2.5;
                    const w1 = minW + (maxW - minW) * progress1;
                    const w2 = minW + (maxW - minW) * progress2;

                    const currentW = (w1 + w2) / 2;
                    ctx.lineWidth = Math.max(0.2, currentW);
                    ctx.beginPath();

                    if (points.length === 2) {
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                    } else if (i === 1) {
                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(midX, midY);
                    } else if (i === points.length - 1) {
                        const prevMidX = (points[i - 2].x + p1.x) / 2;
                        const prevMidY = (points[i - 2].y + p1.y) / 2;
                        ctx.moveTo(prevMidX, prevMidY);
                        ctx.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y);
                    } else {
                        const prevMidX = (points[i - 2].x + p1.x) / 2;
                        const prevMidY = (points[i - 2].y + p1.y) / 2;
                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;
                        ctx.moveTo(prevMidX, prevMidY);
                        ctx.quadraticCurveTo(p1.x, p1.y, midX, midY);
                    }

                }

            }

            configurePenStyle(ctx, currentPenStyle, currentColor, strokeSize);

            if (points.length === 1) {
                ctx.beginPath();
                ctx.arc(points[0].x, points[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);

            if (points.length === 2) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.stroke();
                return;
            }

            ctx.beginPath();
            const firstMidX = (points[0].x + points[1].x) / 2;
            const firstMidY = (points[0].y + points[1].y) / 2;
            ctx.moveTo(points[0].x, points[0].y);
            ctx.lineTo(firstMidX, firstMidY);

            for (let i = 1; i &lt; points.length - 1; i++) {
                const xc = (points[i].x + points[i + 1].x) / 2;
                const yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }

            const lastIdx = points.length - 1;
            ctx.lineTo(points[lastIdx].x, points[lastIdx].y);
            ctx.stroke();
        }

        function getCanvasCoords(clientX, clientY, canvas) {
            const rect = canvas.getBoundingClientRect();
            return { x: (clientX - rect.left) / scale, y: (clientY - rect.top) / scale, time: Date.now() };

        // Pointer Gestures
        viewport.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
            if (e.target.closest(&#39;.textbox-wrapper&#39;) || e.target.closest(&#39;.image-box&#39;) || e.target.closest(&#39;#toolbar&#39;) || e.target.closest(&#39;.popover-menu&#39;)) return;
            pointers.push(e);

            if (pointers.length === 1) {
                const card = e.target.closest(&#39;.page-card&#39;);
                if (!card) return;

                activePageIndex = parseInt(card.dataset.index);
                const page = pages[activePageIndex];

                if (activeTool === &#39;text&#39;) {
                    const coords = getCanvasCoords(e.clientX, e.clientY, page.canvas);
                    createTextBox(activePageIndex, coords.x, coords.y);
                    return;
                }

                isDrawing = true;
                hasZoomedOrPanned = false;
                preStrokeSnapshot = page.ctx.getImageData(0, 0, page.canvas.width, page.canvas.height);

                const coords = getCanvasCoords(e.clientX, e.clientY, page.canvas);
                currentStrokePoints = [coords];
                renderSmoothStroke(page.ctx, currentStrokePoints);

                hasZoomedOrPanned = true;
                currentStrokePoints = [];

                if (activePageIndex !== null &amp;&amp; preStrokeSnapshot) {
                    pages[activePageIndex].ctx.putImageData(preStrokeSnapshot, 0, 0);

                preStrokeSnapshot = null;

                initialZoomDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
                initialScale = scale;
                initialPanX = panX; initialPanY = panY;
                initialCenter = { x: (pointers[0].clientX + pointers[1].clientX) / 2, y: (pointers[0].clientY + pointers[1].clientY) / 2 };

        viewport.addEventListener(&#39;pointermove&#39;, (e) =&gt; {

                const coords = getCanvasCoords(e.clientX, e.clientY, page.canvas);

                const currentDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);

                const newScale = Math.min(Math.max(initialScale * (currentDist / initialZoomDist), 0.2), 4.5);
                scale = newScale;
                panX = currentCenter.x - ((initialCenter.x - initialPanX) * (newScale / initialScale));

        function handlePointerUp(e) {

        // ================= TRANSPARENT BOUNDED TEXT BOX SYSTEM WITH BASELINE ALIGNMENT =================
        function createTextBox(pageIdx, x, y, initialText = &#39;&#39;, initialColor = null, initialWidth = 220) {
            const page = pages[pageIdx];
            const dims = getPageDimensions();
            const ruleH = getRuledLineHeight();

            let safeX = Math.max(0, Math.min(x, dims.width - 60));
            let safeY = Math.max(0, Math.min(y, dims.height - 30));

            const wrapper = document.createElement(&#39;div&#39;);
            wrapper.className = &#39;textbox-wrapper&#39;;
            wrapper.style.left = safeX + &#39;px&#39;; 
            wrapper.style.top = safeY + &#39;px&#39;;
            
            let maxAvailableWidth = dims.width - safeX;
            let safeW = Math.min(initialWidth, maxAvailableWidth);
            wrapper.style.width = safeW + &#39;px&#39;;

            const deleteBtn = document.createElement(&#39;div&#39;);
            deleteBtn.className = &#39;textbox-delete-btn&#39;;
            deleteBtn.innerText = &#39;✕&#39;;

            const resizeHandle = document.createElement(&#39;div&#39;);
            resizeHandle.className = &#39;textbox-resize-handle&#39;;

            const content = document.createElement(&#39;div&#39;);
            content.className = &#39;textbox-content&#39;;
            content.contentEditable = &#39;false&#39;;
            content.innerText = initialText;
            content.style.color = initialColor || currentColor;
            content.style.fontSize = (ruleH * 0.72) + &#39;px&#39;;
            content.style.lineHeight = ruleH + &#39;px&#39;;
            content.style.minHeight = ruleH + &#39;px&#39;;

            wrapper.appendChild(deleteBtn);
            wrapper.appendChild(resizeHandle);
            wrapper.appendChild(content);
            page.card.appendChild(wrapper);

            if (!initialText) {
                enableEditing();
            }

            let isDragging = false, dragX = 0, dragY = 0;
            let isResizing = false, resizeStartX = 0, startWidth = 0;
            let lastTap = 0;

            function enableEditing() {
                wrapper.classList.add(&#39;editing&#39;);
                content.contentEditable = &#39;true&#39;;
                content.focus();
            }

            function disableEditing() {
                wrapper.classList.remove(&#39;editing&#39;);
                content.contentEditable = &#39;false&#39;;
            }

            wrapper.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
                if (e.target === deleteBtn || e.target === resizeHandle) return;
                if (content.isContentEditable) return;

                e.stopPropagation();
                const now = Date.now();

                if (now - lastTap &lt; 300) {
                    enableEditing();
                    lastTap = 0;
                    return;
                }
                lastTap = now;

                isDragging = true;
                dragX = e.clientX - wrapper.getBoundingClientRect().left;
                dragY = e.clientY - wrapper.getBoundingClientRect().top;

                if (!isDragging) return;

                let newX = (e.clientX - dragX - parentRect.left) / scale;
                let newY = (e.clientY - dragY - parentRect.top) / scale;

                if (!isResizing) return;

                let newWidth = startWidth + dw;

                let currentLeft = parseFloat(wrapper.style.left) || 0;
                let maxWidth = dims.width - currentLeft;
                let finalWidth = Math.max(80, Math.min(newWidth, maxWidth));

                wrapper.style.width = finalWidth + &#39;px&#39;;

            resizeHandle.addEventListener(&#39;pointerup&#39;, (e) =&gt; {
                isResizing = false;
                try { resizeHandle.releasePointerCapture(e.pointerId); } catch(err){}
            });

            content.addEventListener(&#39;blur&#39;, () =&gt; disableEditing());

            deleteBtn.onclick = (e) =&gt; {
                e.stopPropagation();

                pages.forEach(p =&gt; p.textBoxes = p.textBoxes.filter(t =&gt; t.elem !== wrapper));
            };

            page.textBoxes.push({ elem: wrapper, contentElem: content });
        }

        // ================= IMAGE INSERTION =================
        const imageInput = document.getElementById(&#39;imageInput&#39;);
        document.getElementById(&#39;imgBtn&#39;).onclick = () =&gt; imageInput.click();
        imageInput.onchange = (e) =&gt; {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) =&gt; {
                const img = new Image();
                const targetPage = activePageIndex !== null ? activePageIndex : Math.max(0, pages.length - 1);
                img.onload = () =&gt; insertImageToPage(targetPage, img, event.target.result);
                img.src = event.target.result;

            imageInput.value = &#39;&#39;;
        };

        function insertImageToPage(pageIdx, imgObj, src, savedState = null) {
            const page = pages[pageIdx];
            let initW = savedState ? savedState.width : Math.min(imgObj.width, 300);
            let initH = savedState ? savedState.height : (imgObj.height / imgObj.width) * initW;
            
            const existingCount = page.imageBoxes.length;
            let initTop = savedState ? savedState.top : 60 + (existingCount * 80);
            let initLeft = savedState ? savedState.left : 60;

            const box = document.createElement(&#39;div&#39;);
            box.className = &#39;image-box&#39;;
            box.style.left = initLeft + &#39;px&#39;; box.style.top = initTop + &#39;px&#39;;
            box.style.width = initW + &#39;px&#39;; box.style.height = initH + &#39;px&#39;;

            const deleteBtn = document.createElement(&#39;div&#39;);
            deleteBtn.className = &#39;image-delete-btn&#39;; deleteBtn.innerText = &#39;✕&#39;;

            const container = document.createElement(&#39;div&#39;);
            container.className = &#39;image-container&#39;;
            const img = document.createElement(&#39;img&#39;);
            img.src = src;

            container.appendChild(img);
            const resizeHandle = document.createElement(&#39;div&#39;);
            resizeHandle.className = &#39;resize-handle&#39;;

            box.appendChild(deleteBtn);
            box.appendChild(container); box.appendChild(resizeHandle);
            page.card.appendChild(box);

            const imageEntry = { elem: box, imgElem: img };

            let isDragging = false, dragX = 0, dragY = 0;
            box.addEventListener(&#39;pointerdown&#39;, (e) =&gt; {
                if (e.target === resizeHandle || e.target === deleteBtn) return;
                e.stopPropagation(); isDragging = true;

                dragY = e.clientY - box.getBoundingClientRect().top;
