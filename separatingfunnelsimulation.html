        const canvas = document.getElementById(&#39;labCanvas&#39;);
        const ctx = canvas.getContext(&#39;2d&#39;);
        const liquidSelect = document.getElementById(&#39;liquidSelect&#39;);
        const customGroup = document.getElementById(&#39;customGroup&#39;);
        const customName = document.getElementById(&#39;customName&#39;);
        const customRhoSlider = document.getElementById(&#39;customRhoSlider&#39;), customRhoVal = document.getElementById(&#39;customRhoVal&#39;);
        const pourVolSlider = document.getElementById(&#39;pourVolSlider&#39;), pourVolVal = document.getElementById(&#39;pourVolVal&#39;);
        const btnPour = document.getElementById(&#39;btnPour&#39;);
        const valveSlider = document.getElementById(&#39;valveSlider&#39;), valveVal = document.getElementById(&#39;valveVal&#39;);
        const btnStopperToggle = document.getElementById(&#39;btnStopperToggle&#39;);
        const btnShake = document.getElementById(&#39;btnShake&#39;);
        const btnClearFunnel = document.getElementById(&#39;btnClearFunnel&#39;);
        const btnResetBeakers = document.getElementById(&#39;btnResetBeakers&#39;);
        const layerList = document.getElementById(&#39;layerList&#39;);
        const sepPctVal = document.getElementById(&#39;sepPctVal&#39;);
        const vacuumAlert = document.getElementById(&#39;vacuumAlert&#39;);

        // Geometry Layout
        let geo = {
            fcX: 0,
            topY: 0,
            fH: 220,
            maxR: 75,
            stemLength: 100,
            stopcockY: 0,
            benchY: 0
        };

        function initBeakers() {
            let bw = 75, bh = 85;
            state.beakers = [
                { id: 1, x: geo.fcX - bw / 2, y: geo.benchY - bh, w: bw, h: bh, label: &quot;Beaker A&quot;, contents: [] },
                { id: 2, x: geo.fcX + 110, y: geo.benchY - bh, w: bw, h: bh, label: &quot;Beaker B&quot;, contents: [] },
                { id: 3, x: geo.fcX + 210, y: geo.benchY - bh, w: bw, h: bh, label: &quot;Beaker C&quot;, contents: [] }
            ];
        }

        function getFunnelRadius(yRel) {
            if (yRel &lt; 0 || yRel &gt; 1) return 0;

            if (yRel &lt; 0.08) {
                return 16;
            } else if (yRel &lt; 0.32) {
                let t = (yRel - 0.08) / 0.24;
                return 16 + Math.sin(t * Math.PI * 0.5) * (geo.maxR - 16);
            } else if (yRel &lt; 0.92) {
                let t = (yRel - 0.32) / 0.60;
                return geo.maxR - t * (geo.maxR - 12);
            } else {
                let t = (yRel - 0.92) / 0.08;
                return 12 - t * 6;
            }
        }

        function sortLiquidsByDensity() {
            state.liquids.sort((a, b) =&gt; a.rho - b.rho);
        }

        function triggerPour() {
            if (state.pouring.active) return;

            let key = liquidSelect.value;
            let lData;

            if (key === &quot;custom&quot;) {
                lData = {
                    name: customName.value || &quot;Custom Solvent&quot;,
                    rho: parseFloat(customRhoSlider.value),
                    color: &quot;rgba(255, 100, 200, 0.75)&quot;
                };
            } else {
                let p = LIQUID_PRESETS[key];
                lData = { name: p.name, rho: p.rho, color: p.color };
            }

            if (state.stopperSeated) {
                state.stopperSeated = false;
                updateStopperButton();
            }

            state.pouring = {
                active: true,
                progress: 0,
                liquid: lData,
                targetVol: parseFloat(pourVolSlider.value)
            };
        }

        function updatePhysics() {
            if (state.pouring.active) {
                state.pouring.progress += 0.015;
                let addedThisFrame = (state.pouring.targetVol / (1 / 0.015));
                
                let existing = state.liquids.find(l =&gt; l.name === state.pouring.liquid.name);
                if (existing) {
                    existing.vol += addedThisFrame;
                } else {
                    state.liquids.push({
                        name: state.pouring.liquid.name,
                        rho: state.pouring.liquid.rho,
                        color: state.pouring.liquid.color,
                        vol: addedThisFrame
                    });
                    sortLiquidsByDensity();
                }

                if (state.pouring.progress &gt;= 1.0) {
                    state.pouring.active = false;
                }
            }

            if (state.separationPct &lt; 1.0) {
                state.separationPct = Math.min(1.0, state.separationPct + 0.003);
                if (state.separationPct === 1.0) sortLiquidsByDensity();
            }

            if (state.shakeIntensity &gt; 0) {
                state.shakeIntensity *= 0.9;
                if (state.shakeIntensity &lt; 0.1) state.shakeIntensity = 0;
            }

            if (state.valvePct &gt; 0 &amp;&amp; state.liquids.length &gt; 0) {
                let canDrain = true;
                if (state.stopperSeated) {
                    state.vacuumPressure += 0.04;
                    if (state.vacuumPressure &gt; 1.0) {
                        canDrain = false;
                        vacuumAlert.style.display = &quot;flex&quot;;
                    }
                } else {
                    state.vacuumPressure = Math.max(0, state.vacuumPressure - 0.1);
                    vacuumAlert.style.display = &quot;none&quot;;
                }

                if (canDrain) {
                    let drainRate = (state.valvePct / 100) * 0.7;

                    let bottomLayer = state.liquids[state.liquids.length - 1];
                    let drainedAmount = Math.min(bottomLayer.vol, drainRate);
                    
                    bottomLayer.vol -= drainedAmount;

                    if (bottomLayer.vol &lt;= 0.01) {
                        state.liquids.pop();
                    }

                    let fcX = geo.fcX;
                    let beakerUnder = state.beakers.find(b =&gt; Math.abs((b.x + b.w / 2) - fcX) &lt; b.w / 2 + 10);
                    if (beakerUnder &amp;&amp; drainedAmount &gt; 0) {
                        let existing = beakerUnder.contents.find(c =&gt; c.name === bottomLayer.name);
                        if (existing) {
                            existing.vol += drainedAmount;
                        } else {
                            beakerUnder.contents.push({ name: bottomLayer.name, color: bottomLayer.color, vol: drainedAmount });
                        }
                    }
                }
            } else {
                if (!state.stopperSeated) vacuumAlert.style.display = &quot;none&quot;;
            }

            updateHUD();
        }

        function updateHUD() {
            sepPctVal.textContent = `${Math.round(state.separationPct * 100)}%`;

            if (state.liquids.length === 0) {
                layerList.innerHTML = `&lt;div style=&quot;font-size:0.75rem; color:#888;&quot;&gt;Funnel is empty. Select liquid above and click Pour!&lt;/div&gt;`;
                return;
            }

            let html = &quot;&quot;;
            state.liquids.forEach((l, idx) =&gt; {
                let posName = (idx === 0) ? &quot;Top&quot; : (idx === state.liquids.length - 1 ? &quot;Bottom&quot; : `Layer ${idx+1}`);
                html += `
                    &lt;div class=&quot;layer-row&quot;&gt;
                        &lt;div&gt;&lt;span class=&quot;layer-badge&quot; style=&quot;background:${l.color};&quot;&gt;&lt;/span&gt;&lt;b&gt;${posName}:&lt;/b&gt; ${l.name}&lt;/div&gt;
                        &lt;div&gt;${l.vol.toFixed(1)} mL | ρ=${l.rho}&lt;/div&gt;
                    &lt;/div&gt;
                `;
            });
            layerList.innerHTML = html;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (state.shakeIntensity &gt; 0) {
                ctx.translate((Math.random() - 0.5) * state.shakeIntensity, (Math.random() - 0.5) * state.shakeIntensity);
            }

            drawStand();
            drawFunnelGlassAndLiquids();
            drawStopcock();
            drawDrainStream();
            ctx.restore();

            drawBeakers();
            drawPouringBeakerAnimation();

            updatePhysics();
            requestAnimationFrame(draw);
        }

        function drawStand() {
            let fcX = geo.fcX;
            let benchY = geo.benchY;

            ctx.fillStyle = &quot;#141822&quot;; ctx.fillRect(0, benchY, canvas.width, canvas.height - benchY);
            ctx.strokeStyle = &quot;#262c3a&quot;; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, benchY); ctx.lineTo(canvas.width, benchY); ctx.stroke();

            ctx.fillStyle = &quot;#222733&quot;; ctx.strokeStyle = &quot;#444d61&quot;; ctx.lineWidth = 2;
            ctx.fillRect(fcX - 160, benchY - 14, 180, 14);
            ctx.strokeRect(fcX - 160, benchY - 14, 180, 14);

            let rodX = fcX - 140;
            ctx.fillStyle = &quot;#4a5568&quot;; ctx.fillRect(rodX - 4, geo.topY - 40, 8, benchY - 14 - (geo.topY - 40));

            let ringY = geo.topY + geo.fH * 0.35;
            ctx.fillStyle = &quot;#2d3748&quot;; ctx.fillRect(rodX, ringY - 6, fcX - rodX - geo.maxR * 0.8, 12);
            ctx.strokeStyle = &quot;#4a5568&quot;; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.ellipse(fcX, ringY, getFunnelRadius(0.35) + 4, 10, 0, 0, Math.PI * 2); ctx.stroke();

            if (!state.stopperSeated) {
                let stX = fcX - 110, stY = benchY - 8;
                ctx.fillStyle = &quot;rgba(200, 220, 240, 0.85)&quot;; ctx.strokeStyle = &quot;#ffffff&quot;; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(stX - 12, stY); ctx.lineTo(stX + 12, stY); ctx.lineTo(stX + 6, stY - 16); ctx.lineTo(stX - 6, stY - 16); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(stX, stY - 20, 10, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
        }

        function drawFunnelGlassAndLiquids() {
            let fcX = geo.fcX;
            let topY = geo.topY;
            let fH = geo.fH;
            let junctionY = topY + fH;

            let totVol = state.liquids.reduce((sum, l) =&gt; sum + l.vol, 0);

            if (totVol &gt; 0) {
                let maxCap = 380;
                let fillRatio = Math.min(1.0, totVol / maxCap);

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(fcX - 16, topY);
                for (let y = 0; y &lt;= fH; y += 3) {
                    let r = getFunnelRadius(y / fH);
                    ctx.lineTo(fcX - r + 1.5, topY + y);
                }
                ctx.lineTo(fcX - 4, junctionY + geo.stemLength);
                ctx.lineTo(fcX + 4, junctionY + geo.stemLength);
                for (let y = fH; y &gt;= 0; y -= 3) {
                    let r = getFunnelRadius(y / fH);
                    ctx.lineTo(fcX + r - 1.5, topY + y);
                }
                ctx.closePath();
                ctx.clip();

                let currentYLevel = junctionY;
                let heightPerVol = (fH * 0.9) / maxCap;

                for (let i = state.liquids.length - 1; i &gt;= 0; i--) {
                    let l = state.liquids[i];
                    let layerH = l.vol * heightPerVol;
                    let nextYLevel = currentYLevel - layerH;

                    ctx.fillStyle = l.color;
                    ctx.fillRect(fcX - geo.maxR - 20, nextYLevel, (geo.maxR + 20) * 2, currentYLevel - nextYLevel + 2);

                    ctx.strokeStyle = &quot;rgba(255,255,255,0.4)&quot;; ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    let rLevel = getFunnelRadius((nextYLevel - topY) / fH);
                    ctx.ellipse(fcX, nextYLevel, Math.max(2, rLevel), 3, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    currentYLevel = nextYLevel;
                }

                if (state.separationPct &lt; 0.99) {
                    ctx.fillStyle = `rgba(240, 240, 240, ${(1.0 - state.separationPct) * 0.7})`;
                    ctx.fillRect(fcX - geo.maxR - 20, topY, (geo.maxR + 20) * 2, fH + geo.stemLength);
                }

                ctx.restore();
            }

            ctx.strokeStyle = &quot;rgba(255, 255, 255, 0.65)&quot;;
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            ctx.moveTo(fcX - 16, topY - 12);
            ctx.lineTo(fcX - 16, topY);
            for (let y = 0; y &lt;= fH; y += 4) {
                let r = getFunnelRadius(y / fH);
                ctx.lineTo(fcX - r, topY + y);
            }
            ctx.lineTo(fcX - 5, junctionY + geo.stemLength);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(fcX + 16, topY - 12);
            ctx.lineTo(fcX + 16, topY);
            for (let y = 0; y &lt;= fH; y += 4) {
                let r = getFunnelRadius(y / fH);
                ctx.lineTo(fcX + r, topY + y);
            }
            ctx.lineTo(fcX + 5, junctionY + geo.stemLength);
            ctx.lineTo(fcX - 5, junctionY + geo.stemLength + 4);
            ctx.stroke();

            ctx.strokeStyle = &quot;rgba(255, 255, 255, 0.3)&quot;;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            for (let y = 15; y &lt;= fH - 15; y += 4) {
                let r = getFunnelRadius(y / fH) * 0.78;
                if (y === 15) ctx.moveTo(fcX - r, topY + y);
                else ctx.lineTo(fcX - r, topY + y);
            }
            ctx.stroke();

            ctx.strokeStyle = &quot;rgba(255, 255, 255, 0.85)&quot;;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(fcX, topY - 12, 16, 5, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(fcX, topY, 16, 5, 0, 0, Math.PI * 2); ctx.stroke();

            ctx.fillStyle = &quot;rgba(255, 255, 255, 0.15)&quot;;
            ctx.fillRect(fcX - 16, topY - 12, 32, 12);

            if (state.stopperSeated) {
                let stY = topY - 12;
                ctx.fillStyle = &quot;rgba(200, 220, 240, 0.85)&quot;;
                ctx.strokeStyle = &quot;#ffffff&quot;;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(fcX - 15, stY);
                ctx.lineTo(fcX + 15, stY);
                ctx.lineTo(fcX + 8, stY - 18);
                ctx.lineTo(fcX - 8, stY - 18);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                ctx.beginPath(); ctx.ellipse(fcX, stY - 24, 12, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
        }

        function drawStopcock() {
            let fcX = geo.fcX;
            let scY = geo.stopcockY;

            ctx.fillStyle = &quot;rgba(220, 235, 255, 0.75)&quot;;
            ctx.strokeStyle = &quot;#ffffff&quot;;
            ctx.lineWidth = 2;
            ctx.fillRect(fcX - 12, scY - 8, 24, 16);
            ctx.strokeRect(fcX - 12, scY - 8, 24, 16);

            ctx.save();
            ctx.translate(fcX, scY);
            let rotRad = (state.valvePct / 100) * (Math.PI / 2);
            ctx.rotate(rotRad);

            ctx.fillStyle = &quot;#ffb703&quot;; ctx.strokeStyle = &quot;#e0a000&quot;; ctx.lineWidth = 1.5;
            ctx.fillRect(-18, -4, 36, 8); ctx.strokeRect(-18, -4, 36, 8);
            ctx.fillStyle = &quot;#ff6b00&quot;;
            ctx.beginPath(); ctx.arc(-18, 0, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(18, 0, 6, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function drawDrainStream() {
            if (state.valvePct &gt; 0 &amp;&amp; state.vacuumPressure &lt;= 1.0 &amp;&amp; state.liquids.length &gt; 0) {
                let activeL = state.liquids[state.liquids.length - 1];
                if (!activeL || activeL.vol &lt;= 0) return;

                let fcX = geo.fcX;
                let startY = geo.topY + geo.fH + geo.stemLength;
                
                let beakerUnder = state.beakers.find(b =&gt; Math.abs((b.x + b.w / 2) - fcX) &lt; b.w / 2 + 10);
                let endY = beakerUnder ? (beakerUnder.y + beakerUnder.h - 10) : geo.benchY;

                ctx.strokeStyle = activeL.color;
                ctx.lineWidth = (state.valvePct / 100) * 4 + 1;
                ctx.beginPath(); ctx.moveTo(fcX, startY); ctx.lineTo(fcX, endY); ctx.stroke();
            }
        }

        function drawBeakers() {
            state.beakers.forEach(b =&gt; {
                ctx.save();
                ctx.fillStyle = &quot;rgba(255, 255, 255, 0.04)&quot;;
                ctx.strokeStyle = (state.activeDragBeaker === b) ? &quot;#00d2ff&quot; : &quot;rgba(255, 255, 255, 0.6)&quot;;
                ctx.lineWidth = (state.activeDragBeaker === b) ? 3 : 2;

                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(b.x, b.y + b.h - 4);
                ctx.quadraticCurveTo(b.x, b.y + b.h, b.x + 4, b.y + b.h);
                ctx.lineTo(b.x + b.w - 4, b.y + b.h);
                ctx.quadraticCurveTo(b.x + b.w, b.y + b.h, b.x + b.w, b.y + b.h - 4);
                ctx.lineTo(b.x + b.w, b.y);
                ctx.fill(); ctx.stroke();

                ctx.beginPath(); ctx.moveTo(b.x - 4, b.y); ctx.lineTo(b.x + b.w + 4, b.y); ctx.stroke();

                let totVol = b.contents.reduce((sum, c) =&gt; sum + c.vol, 0);
                if (totVol &gt; 0) {
                    let maxCap = 250;
                    let fillH = Math.min(b.h - 10, (totVol / maxCap) * (b.h - 15));
                    
                    ctx.save();
                    ctx.beginPath(); ctx.rect(b.x + 2, b.y + b.h - fillH, b.w - 4, fillH); ctx.clip();

                    let currentY = b.y + b.h;
                    b.contents.forEach(c =&gt; {
                        let layerH = (c.vol / totVol) * fillH;
                        ctx.fillStyle = c.color;
                        ctx.fillRect(b.x + 2, currentY - layerH, b.w - 4, layerH);
                        currentY -= layerH;
                    });

                    ctx.restore();
                }

                ctx.fillStyle = &quot;#94a3b8&quot;; ctx.font = &quot;11px sans-serif&quot;; ctx.textAlign = &quot;center&quot;;
                ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h + 15);
                ctx.restore();
            });
        }

        function drawPouringBeakerAnimation() {
            if (!state.pouring.active) return;

            let p = state.pouring.progress;
            let fcX = geo.fcX;
            let topY = geo.topY - 12;

            let tiltAngle = Math.sin(Math.min(p * 2, 1.0) * Math.PI * 0.5) * 1.1;
            let bkX = fcX + 70 - p * 20;
            let bkY = topY - 40;

            ctx.save();
            ctx.translate(bkX, bkY);
            ctx.rotate(-tiltAngle);

            ctx.fillStyle = &quot;rgba(255, 255, 255, 0.08)&quot;;
            ctx.strokeStyle = &quot;#ffffff&quot;;
            ctx.lineWidth = 2;
            ctx.fillRect(-25, -35, 50, 70);
            ctx.strokeRect(-25, -35, 50, 70);

            ctx.fillStyle = state.pouring.liquid.color;
            ctx.fillRect(-23, -10, 46, 43);

            ctx.restore();

            if (p &gt; 0.15 &amp;&amp; p &lt; 0.9) {
                let spoutX = bkX - Math.cos(-tiltAngle) * 25 + Math.sin(-tiltAngle) * 35;
                let spoutY = bkY - Math.sin(-tiltAngle) * 25 - Math.cos(-tiltAngle) * 35;

                ctx.strokeStyle = state.pouring.liquid.color;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(spoutX - 10, spoutY + 15);
                ctx.lineTo(fcX, topY + 15);
                ctx.stroke();

                ctx.fillStyle = state.pouring.liquid.color;
                ctx.beginPath();
                ctx.ellipse(fcX, topY + 20, 10 + Math.sin(Date.now()*0.02)*3, 3, 0, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- TOUCH &amp; MOUSE INTERACTIVITY ---
        function getPos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches &amp;&amp; e.touches.length &gt; 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleStart(m) {
            for (let i = state.beakers.length - 1; i &gt;= 0; i--) {
                let b = state.beakers[i];
                if (m.x &gt;= b.x - 10 &amp;&amp; m.x &lt;= b.x + b.w + 10 &amp;&amp; m.y &gt;= b.y - 10 &amp;&amp; m.y &lt;= b.y + b.h + 20) {
                    state.activeDragBeaker = b;
                    state.dragOffset = { x: m.x - b.x, y: m.y - b.y };
                    return true;
                }
            }
            return false;
        }

        function handleMove(m) {
            if (!state.activeDragBeaker) return;
            let b = state.activeDragBeaker;
            b.x = m.x - state.dragOffset.x;
            b.y = geo.benchY - b.h;
        }

        function handleEnd() {
            if (state.activeDragBeaker) {
                let b = state.activeDragBeaker;
                if (Math.abs((b.x + b.w / 2) - geo.fcX) &lt; 40) b.x = geo.fcX - b.w / 2;
                state.activeDragBeaker = null;
            }
        }

        // Mouse Events
        canvas.addEventListener(&#39;mousedown&#39;, e =&gt; handleStart(getPos(e)));
        canvas.addEventListener(&#39;mousemove&#39;, e =&gt; handleMove(getPos(e)));
        window.addEventListener(&#39;mouseup&#39;, handleEnd);

        // Touch Events
        canvas.addEventListener(&#39;touchstart&#39;, e =&gt; {
            if (handleStart(getPos(e))) {
                e.preventDefault();
            }
        }, { passive: false });

        canvas.addEventListener(&#39;touchmove&#39;, e =&gt; {
            if (state.activeDragBeaker) {
                handleMove(getPos(e));
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener(&#39;touchend&#39;, handleEnd);

        function updateStopperButton() {
            btnStopperToggle.textContent = state.stopperSeated ? &quot;🔒 Stopper: SEATED&quot; : &quot;🔓 Stopper: REMOVED&quot;;
            btnStopperToggle.className = state.stopperSeated ? &quot;btn-action&quot; : &quot;btn-warning&quot;;
        }

        // --- UI EVENT BINDINGS ---
        liquidSelect.addEventListener(&#39;change&#39;, e =&gt; {
            customGroup.style.display = (e.target.value === &quot;custom&quot;) ? &quot;flex&quot; : &quot;none&quot;;
        });

        customRhoSlider.addEventListener(&#39;input&#39;, e =&gt; customRhoVal.textContent = e.target.value + &quot; g/mL&quot;);
        pourVolSlider.addEventListener(&#39;input&#39;, e =&gt; pourVolVal.textContent = e.target.value + &quot; mL&quot;);

        btnPour.addEventListener(&#39;click&#39;, triggerPour);

        valveSlider.addEventListener(&#39;input&#39;, e =&gt; {
            state.valvePct = parseInt(e.target.value);
            valveVal.textContent = `${state.valvePct}% (${state.valvePct === 0 ? &#39;Closed&#39; : &#39;Flowing&#39;})`;
        });

        btnStopperToggle.addEventListener(&#39;click&#39;, () =&gt; {
            state.stopperSeated = !state.stopperSeated;
            updateStopperButton();
        });

        btnShake.addEventListener(&#39;click&#39;, () =&gt; {
            if (state.liquids.length &gt; 1) {
                state.separationPct = 0;
                state.shakeIntensity = 16;
            }
        });

        btnClearFunnel.addEventListener(&#39;click&#39;, () =&gt; {
            state.liquids = [];
            state.separationPct = 1.0;
        });

        btnResetBeakers.addEventListener(&#39;click&#39;, initBeakers);

        // --- RESIZE CANVAS RESPONSIBLY ---
        function resizeCanvas() {
            const container = document.getElementById(&#39;workspace&#39;);
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            geo.fcX = canvas.width * 0.38;
            geo.topY = Math.max(70, canvas.height * 0.15);
            geo.benchY = canvas.height - 40;
            geo.stopcockY = geo.topY + geo.fH + 45;

            initBeakers();
        }

        window.addEventListener(&#39;resize&#39;, resizeCanvas);

        // --- INITIALIZATION ---
        resizeCanvas();
        requestAnimationFrame(draw);

    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
</html>
