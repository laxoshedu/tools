<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<title>Discharge Tube Simulator LAND SCAPE new</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; margin: 0; padding: 0;
    overflow: hidden; background: #070b14;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  #viewportContainer {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    overflow: hidden; background: #070b14;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  #appStage {
    width: 1280px;
    height: 720px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    will-change: transform;
  }

  #appStage iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  /* FLOATING MOBILE NAVIGATION, PAN & ZOOM BAR */
  .nav-overlay-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99990;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;
    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

  /* UNHIDE TRIGGER BUTTON */
  .nav-toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99989;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #7bd1ff; font-size: 0.9rem;
    display: none; place-items: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .nav-toggle-btn.visible {
    display: grid !important;
  }

  /* HIGH-END PROFESSIONAL ROTATE OVERLAY */
  .rotate-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }
  .rotate-card {
    width: min(440px, 90vw); padding: 36px 28px; border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .rotate-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    background: rgba(123, 209, 255, 0.12); border: 1px solid rgba(123, 209, 255, 0.3);
    color: #7bd1ff; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .rotate-icon-wrap {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;
    animation: phoneRotate 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff, #a7b3d8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {
    margin: 0; color: #94a3b8; font-size: 0.92rem; line-height: 1.5; font-weight: 450;
  }
  .btn-rotate {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, #65c9ff, #3b82f6);
    color: #061225; font-weight: 800; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>
</head>

            &lt;div class=&quot;slider-ticks&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;10&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;span&gt;500&lt;/span&gt;&lt;span&gt;1000&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        
        &lt;div class=&quot;control-group&quot;&gt;
            &lt;label&gt;Magnetic Field Distance &lt;span id=&quot;mag-field-value&quot;&gt;Far&lt;/span&gt;&lt;/label&gt;
            &lt;input type=&quot;range&quot; id=&quot;mag-position&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot;&gt;
            &lt;div class=&quot;slider-ticks&quot;&gt;&lt;span&gt;Far&lt;/span&gt;&lt;span&gt;Near&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        
        &lt;div class=&quot;toggle-control&quot;&gt;
            &lt;label for=&quot;field-toggle&quot;&gt;Apply Magnetic Field&lt;/label&gt;
            &lt;label class=&quot;toggle-switch&quot;&gt;
                &lt;input type=&quot;checkbox&quot; id=&quot;field-toggle&quot;&gt;
                &lt;span class=&quot;toggle-slider&quot;&gt;&lt;/span&gt;
            &lt;/label&gt;
        &lt;/div&gt;

        &lt;div class=&quot;toggle-control&quot;&gt;
            &lt;label for=&quot;hide-electrons-toggle&quot;&gt;Hide Electrons (Particles)&lt;/label&gt;
            &lt;label class=&quot;toggle-switch&quot;&gt;
                &lt;input type=&quot;checkbox&quot; id=&quot;hide-electrons-toggle&quot;&gt;
                &lt;span class=&quot;toggle-slider&quot;&gt;&lt;/span&gt;
            &lt;/label&gt;
        &lt;/div&gt;
    &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
document.addEventListener(&#39;DOMContentLoaded&#39;, () =&gt; {
    const voltageSlider = document.getElementById(&#39;voltage-slider&#39;);
    const pressureSlider = document.getElementById(&#39;pressure-slider&#39;);
    const fieldToggle = document.getElementById(&#39;field-toggle&#39;);
    const hideElectronsToggle = document.getElementById(&#39;hide-electrons-toggle&#39;);
    const gasSelect = document.getElementById(&#39;gas-select&#39;);
    const magSlider = document.getElementById(&#39;mag-position&#39;);
    
    const magFieldValue = document.getElementById(&#39;mag-field-value&#39;);
    const voltageValue = document.getElementById(&#39;voltage-value&#39;);
    const pressureValue = document.getElementById(&#39;pressure-value&#39;);
    
    const canvas = document.getElementById(&#39;particle-canvas&#39;);
    const ctx = canvas.getContext(&#39;2d&#39;);
    const tube = document.querySelector(&#39;.discharge-tube&#39;);
    const anode = document.getElementById(&#39;anode&#39;);
    const fluorescentScreen = document.getElementById(&#39;fluorescent-screen&#39;);
    const positivePole = document.getElementById(&#39;positive-pole&#39;);
    const negativePole = document.getElementById(&#39;negative-pole&#39;);

    let particles = [];
    let simulationActive = false;

    // Gas glow color profiles
    const gasColors = {
        air: { r: 160, g: 96, b: 255, name: &#39;Air&#39; },
        neon: { r: 255, g: 69, b: 0, name: &#39;Neon&#39; },
        argon: { r: 138, g: 43, b: 226, name: &#39;Argon&#39; },
        helium: { r: 255, g: 192, b: 203, name: &#39;Helium&#39; },
        hydrogen: { r: 255, g: 20, b: 147, name: &#39;Hydrogen&#39; }
    };

    function resizeCanvas() {
        canvas.width = tube.clientWidth;
        canvas.height = tube.clientHeight;
        setupParticles();
    }
    window.addEventListener(&#39;resize&#39;, resizeCanvas);
    
    class Particle {
        constructor() {
            this.x = 45;
            this.y = canvas.height / 2;
            this.size = 7;
        }
        update(speed, deflectionStrength) {
            this.x += speed;
            if (fieldToggle.checked &amp;&amp; deflectionStrength &gt; 0) {
                const deflectPeak = -45 * deflectionStrength;
                const journey = (this.x - 45) / (canvas.width - 90);
                this.y = canvas.height / 2 + Math.sin(journey * Math.PI) * deflectPeak;
            } else {
                this.y = canvas.height / 2;
            }
        }
        draw() {
            ctx.fillStyle = &#39;rgba(110, 255, 0, 0.9)&#39;;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = &#39;bold 11px Arial&#39;;
            ctx.fillStyle = &#39;#111&#39;;
            ctx.textAlign = &#39;center&#39;;
            ctx.textBaseline = &#39;middle&#39;;
            ctx.fillText(&#39;-&#39;, this.x, this.y + 1);
        }
    }

    function setupParticles() {
        particles = [];
        const particleCount = 8;
        const spacing = (canvas.width - 90) / particleCount;
        for (let i = 0; i &lt; particleCount; i++) {
            const p = new Particle();
            p.x += i * spacing;
            particles.push(p);
        }
    }
    
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        simulationActive = parseInt(voltageSlider.value) &gt; 500 &amp;&amp; parseInt(pressureSlider.value) &lt; 10;
        const deflectionStrength = parseInt(magSlider.value) / 100;
        const hideElectrons = hideElectronsToggle.checked;

        if (simulationActive) {
            const voltage = parseInt(voltageSlider.value);
            const pressure = parseInt(pressureSlider.value);
            const voltageFactor = 0.5 + (voltage / 1000) * 8;
            const pressureFactor = Math.max(0, 1 - (pressure / 10));
            const speed = voltageFactor * pressureFactor;

            // Draw cathode ray trajectory line
            ctx.beginPath();
            ctx.moveTo(45, canvas.height / 2);
            if (fieldToggle.checked &amp;&amp; deflectionStrength &gt; 0) {
                const cpY = canvas.height / 2 - 45 * deflectionStrength;
                ctx.quadraticCurveTo(canvas.width / 2, cpY, canvas.width - 45, canvas.height / 2);
            } else {
                ctx.lineTo(canvas.width - 45, canvas.height / 2);
            }
            ctx.strokeStyle = &#39;rgba(110, 255, 0, 0.4)&#39;;
            ctx.lineWidth = 3;
            ctx.stroke();

            let screenIsHit = false;
            particles.forEach(p =&gt; {
                p.update(speed, deflectionStrength);
                
                // Check strike on the anode / fluorescent screen
                if (p.x &gt;= canvas.width - 65 &amp;&amp; Math.abs(p.y - canvas.height / 2) &lt; 35) {
                    screenIsHit = true;
                }
                if (p.x &gt; canvas.width - 40 || Math.abs(p.y - canvas.height / 2) &gt; canvas.height / 2 - 10) {
                    p.x = 45;
                    p.y = canvas.height / 2;
                }
                
                // Draw particles only if not hidden
                if (!hideElectrons) {
                    p.draw();
                }
            });
            
            if (screenIsHit) {
                anode.classList.add(&#39;anode-glow&#39;);
                fluorescentScreen.classList.add(&#39;screen-glow&#39;);
            } else {
                anode.classList.remove(&#39;anode-glow&#39;);
                fluorescentScreen.classList.remove(&#39;screen-glow&#39;);
            }
        } else {
            anode.classList.remove(&#39;anode-glow&#39;);
            fluorescentScreen.classList.remove(&#39;screen-glow&#39;);
        }
        
        requestAnimationFrame(animate);
    }

    function updateControls() {
        const voltage = parseInt(voltageSlider.value);
        const pressure = parseInt(pressureSlider.value);
        const magPos = parseInt(magSlider.value);
        const selectedGas = gasSelect.value;
        const color = gasColors[selectedGas];

        voltageValue.textContent = `${Math.round(voltage / 10)} kV`;
        pressureValue.textContent = `${pressure} Pa`;
        magFieldValue.textContent = magPos === 0 ? &#39;Far&#39; : (magPos &gt; 75 ? &#39;Very Close&#39; : &#39;Near&#39;);

        if (fieldToggle.checked) {
            positivePole.style.display = &#39;block&#39;;
            negativePole.style.display = &#39;block&#39;;
            const maxDist = 80;
            const distance = maxDist - (magPos / 100 * maxDist);
            positivePole.style.top = `-${distance}px`;
            negativePole.style.bottom = `-${distance}px`;
        } else {
            positivePole.style.display = &#39;none&#39;;
            negativePole.style.display = &#39;none&#39;;
        }
        
        // Gas discharge lighting effect
        const isGlowing = voltage &gt; 100 &amp;&amp; pressure &gt;= 10 &amp;&amp; pressure &lt;= 500;
        if (isGlowing) {
            const glowIntensity = (voltage / 1000) * 0.75;
            tube.style.boxShadow = `inset 0 0 35px 12px rgba(${color.r}, ${color.g}, ${color.b}, ${glowIntensity})`;
        } else {
            tube.style.boxShadow = &#39;none&#39;;
        }
    }

    [voltageSlider, pressureSlider, fieldToggle, magSlider, gasSelect, hideElectronsToggle].forEach(el =&gt; el.addEventListener(&#39;input&#39;, updateControls));
    
    resizeCanvas();
    updateControls();
    animate();
});
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 68.7;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;
      baseScale = Math.min(windowW / STAGE_W, windowH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => { checkOrientation(); resizeStage(); });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { checkOrientation(); resizeStage(); }, 200);
  });

  checkOrientation();
  resizeStage();
</script>
</body>
</html>
