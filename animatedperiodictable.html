<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Animated Periodic Table</title>

<!-- Tailwind CSS for quick, modern UI -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- GSAP for animations -->
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<!-- tinycolor2 for color tweaking -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tinycolor/1.4.2/tinycolor.min.js"></script>

<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    background:
      radial-gradient(900px 600px at 80% 5%, rgba(255,255,255,0.06), transparent 60%),
      linear-gradient(180deg, #0b0f16, #0b0f16);
    color: #e5e7eb;
  }
  .panel { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; }
  .chip { padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 12px; border: 1px solid rgba(255,255,255,0.1); }

  .table-wrap {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .ptable {
    display: grid;
    grid-template-columns: repeat(18, minmax(84px, 1fr));
    grid-auto-rows: 92px;
    gap: 8px;
    min-width: 1550px; /* keep it readable; scroll on small screens */
    padding: 10px;
  }
  .el {
    position: relative;
    border-radius: 12px;
    padding: 8px;
    user-select: none;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 160ms ease, box-shadow 160ms ease, background 200ms ease;
    border: 1px solid rgba(255,255,255,0.12);
    background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  }
  .el:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 14px 28px rgba(0,0,0,0.35);
  }
  .el::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: radial-gradient(600px 200px at 80% -20%, rgba(255,255,255,0.12), transparent 60%);
    pointer-events: none;
  }
  .el .num {
    position: absolute;
    top: 6px; left: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
  }
  .el .mass {
    position: absolute;
    top: 6px; right: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
  }
  .el .sym {
    position: absolute;
    left: 8px; right: 8px;
    top: 28px; bottom: 28px;
    display: grid; place-items: center;
    font-weight: 900;
    font-size: 30px;
    letter-spacing: 0.5px;
    text-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  .el .name {
    position: absolute;
    left: 8px; right: 8px; bottom: 8px;
    font-size: 12px; opacity: 0.95;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .label-cell {
    display: grid; place-items: center;
    border-radius: 12px;
    border: 1px dashed rgba(255,255,255,0.2);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
  }

  /* Search emphasis */
  .dimmed { opacity: 0.25; filter: grayscale(0.2); }
  .highlight { outline: 2px solid #22d3ee; outline-offset: 0; }

  /* Category legend bullets */
  .legend-dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 8px; border: 1px solid rgba(255,255,255,0.2); }
</style>
</head>

        <div>
          <div class="text-xl md:text-2xl font-extrabold">Animated Periodic Table</div>
          <div class="text-xs text-gray-400">Symbol • Name • Atomic number • Atomic mass</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input id="search" class="px-3 py-2 rounded-md bg-white/10 border border-white/15 text-sm w-56" placeholder="Search name, symbol, or number"/>
        <button id="resetAnim" class="px-3 py-2 rounded-md bg-white/10 border border-white/15 text-sm">Replay Anim</button>
      </div>
    </div>
  </header>

  <main class="px-4 md:px-6 pb-10 space-y-4">
    <section class="panel p-3 md:p-4">
      <div class="flex flex-wrap items-center gap-3">
        <span class="chip">Legend</span>
        <span><i class="legend-dot" style="background:#ef4444"></i>Alkali metal</span>
        <span><i class="legend-dot" style="background:#f59e0b"></i>Alkaline earth</span>
        <span><i class="legend-dot" style="background:#10b981"></i>Transition</span>
        <span><i class="legend-dot" style="background:#60a5fa"></i>Post‑transition</span>
        <span><i class="legend-dot" style="background:#a855f7"></i>Metalloid</span>
        <span><i class="legend-dot" style="background:#22d3ee"></i>Nonmetal</span>
        <span><i class="legend-dot" style="background:#f97316"></i>Halogen</span>
        <span><i class="legend-dot" style="background:#eab308"></i>Noble gas</span>
        <span><i class="legend-dot" style="background:#84cc16"></i>Lanthanide</span>
        <span><i class="legend-dot" style="background:#f43f5e"></i>Actinide</span>
      </div>
    </section>

    <section class="panel p-2">
      <div class="table-wrap">
        <div id="ptable" class="ptable"></div>
      </div>
    </section>
  </main>

  // Build the grid
  const grid = document.getElementById('ptable');

  function tileBackground(colorHex) {
    const c = tinycolor(colorHex);
    const a = c.clone().lighten(10).toRgbString();
    const b = c.clone().darken(8).toRgbString();
    const glass = 'rgba(255,255,255,0.06)';
    return `linear-gradient(135deg, ${a}, ${b}), linear-gradient(180deg, ${glass}, transparent)`;
  }

  function createElementTile(el) {
    const div = document.createElement('div');
    div.className = 'el';
    div.style.gridColumn = el.x;
    div.style.gridRow = el.y;
    const catColor = catColors[el.cat] || catColors.unknown;
    div.style.background = tileBackground(catColor);
    div.setAttribute('data-num', el.num);
    div.setAttribute('data-sym', el.sym.toLowerCase());
    div.setAttribute('data-name', el.name.toLowerCase());
    div.setAttribute('data-cat', el.cat);

    div.innerHTML = `
      <div class="num">${el.num}</div>
      <div class="mass">${el.mass}</div>
      <div class="sym">${el.sym}</div>
      <div class="name">${el.name}</div>
    `;

    // Subtle 3D tilt on mouse move
    let rect = null;
    div.addEventListener('mouseenter', () => { rect = div.getBoundingClientRect(); });
    div.addEventListener('mousemove', (e) => {
      if (!rect) rect = div.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;
      const dx = (e.clientX - cx) / rect.width;
      const dy = (e.clientY - cy) / rect.height;
      const rx = (-dy * 6).toFixed(2);
      const ry = (dx * 6).toFixed(2);
      div.style.transform = `translateY(-2px) scale(1.03) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    div.addEventListener('mouseleave', () => {
      div.style.transform = '';
    });

    // Click to briefly pulse
    div.addEventListener('click', () => {
      div.classList.add('highlight');
      setTimeout(() => div.classList.remove('highlight'), 400);
    });

    return div;
  }

  function createLabelCell(lab) {
    const d = document.createElement('div');
    d.className = 'label-cell';
    d.style.gridColumn = `${lab.x} / span ${lab.span}`;
    d.style.gridRow = lab.y;
    d.textContent = lab.text;
    return d;
  }

  function renderGrid() {
    grid.innerHTML = '';
    // Labels first so tiles overlay on hover
    rowLabels.forEach(l => grid.appendChild(createLabelCell(l)));
    // All elements
    elements.forEach(e => grid.appendChild(createElementTile(e)));
  }

  function animateIn() {
    const tiles = Array.from(document.querySelectorAll('.el'));
    gsap.set(tiles, { y: 12, opacity: 0, scale: 0.96 });
    gsap.to(tiles, {
      y: 0, opacity: 1, scale: 1,
      duration: 0.6,
      ease: 'power3.out',
      stagger: { each: 0.01, from: 'random' }
    });
  }

  // Search
  const search = document.getElementById('search');
  function applySearch(q) {
    const tiles = Array.from(document.querySelectorAll('.el'));
    if (!q) {
      tiles.forEach(t => { t.classList.remove('dimmed'); t.classList.remove('highlight'); });
      return;
    }
    const s = q.trim().toLowerCase();
    let firstHit = null;
    tiles.forEach(t => {
      const hit = t.dataset.sym.includes(s)
               || t.dataset.name.includes(s)
               || t.dataset.num === s;
      if (hit) {
        t.classList.remove('dimmed');
        t.classList.add('highlight');
        if (!firstHit) firstHit = t;
      } else {
        t.classList.remove('highlight');
        t.classList.add('dimmed');
      }
    });
    if (firstHit) {
      firstHit.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }
  search.addEventListener('input', (e) => applySearch(e.target.value));

  document.getElementById('resetAnim').addEventListener('click', () => animateIn());

  // Init
  renderGrid();
  animateIn();
</script>
</body>
</html>
