<!DOCTYPE html>

<head>

<title>ANIMATED PERIODIC TABLE V2</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100dvh; margin: 0; padding: 0;
    overflow: hidden; background: #070b14;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  #viewportContainer {
    position: fixed; inset: 0; width: 100%; height: 100dvh;
    overflow: hidden; background: #070b14;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  #appStage {
    width: 1920px;
    height: 1080px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform-style: flat;
  }

  #appStage iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  /* FLOATING MOBILE NAVIGATION, PAN & ZOOM BAR */
  .nav-overlay-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99990;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;
    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

  /* UNHIDE TRIGGER BUTTON */
  .nav-toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99989;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #7bd1ff; font-size: 0.9rem;
    display: none; place-items: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .nav-toggle-btn.visible {
    display: grid !important;
  }

  /* HIGH-END PROFESSIONAL ROTATE OVERLAY */
  .rotate-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }
  .rotate-card {
    width: min(440px, 90vw); padding: 36px 28px; border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .rotate-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    background: rgba(123, 209, 255, 0.12); border: 1px solid rgba(123, 209, 255, 0.3);
    color: #7bd1ff; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .rotate-icon-wrap {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;
    animation: phoneRotate 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff, #a7b3d8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {
    margin: 0; color: #94a3b8; font-size: 0.92rem; line-height: 1.5; font-weight: 450;
  }
  .btn-rotate {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, #65c9ff, #3b82f6);
    color: #061225; font-weight: 800; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>
</head>

  <div class="nav-divider"></div>
  <div class="nav-btn" onclick="toggleNavBar(true)" title="Hide Controls">✕</div>
</div>
<div class="nav-toggle-btn" id="navToggleBtn" onclick="toggleNavBar(false)" title="Show Controls">⚙️</div>

<!-- MAIN VIEWPORT STAGE -->
<div id="viewportContainer">

&lt;html lang=&quot;en&quot;&gt;

&lt;meta charset=&quot;utf-8&quot;/&gt;

&lt;title&gt;Animated Periodic Table &amp; Visualizer&lt;/title&gt;

&lt;style&gt;
  :root {
    color-scheme: dark;
    --bg-main: #070a10;
    --panel-bg: rgba(255, 255, 255, 0.07);
    --panel-border: rgba(255, 255, 255, 0.12);
    --accent-cyan: #00e5ff;
    --accent-amber: #ffb300;
    --text-main: #f3f4f6;
    --text-muted: #a1a1aa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background:
      radial-gradient(1000px 700px at 80% 5%, rgba(0, 229, 255, 0.08), transparent 70%),
      radial-gradient(800px 500px at 10% 90%, rgba(168, 85, 247, 0.08), transparent 70%),
      linear-gradient(180deg, var(--bg-main), var(--bg-main));
    color: var(--text-main);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif;
  }

  /* Header Navigation */
  header {
    padding: 1rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-icon {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.6rem;
    background: linear-gradient(135deg, #00e5ff, #7c3aed, #ff007f);
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.4);
  }

  .title { font-size: 1.5rem; font-weight: 900; tracking: -0.02em; }
  .subtitle { font-size: 0.75rem; color: var(--text-muted); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }

  .input-search {
    padding: 0.6rem 0.85rem;
    border-radius: 0.5rem;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--text-main);
    font-size: 0.875rem;
    outline: none;
    width: 15rem;
    transition: all 0.2s;
  }
  .input-search:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
  }

  .btn {
    padding: 0.6rem 0.95rem;
    border-radius: 0.5rem;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--text-main);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.22); transform: translateY(-1px); }
  .btn-active {
    background: rgba(0, 229, 255, 0.25) !important;
    border-color: var(--accent-cyan) !important;
    color: var(--accent-cyan) !important;
    box-shadow: 0 0 14px rgba(0, 229, 255, 0.4);
  }

  /* Main Container &amp; Panels */
  main { padding: 0 1.5rem 2.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 1rem;
    backdrop-filter: blur(12px);
  }

  /* Category Filter Bar */
  .legend-container {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
  }
  .chip {
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    font-weight: 700;
  }
  .legend-btn {
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-main);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .legend-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.2); }
  .legend-btn.active {
    outline: 2px solid var(--accent-cyan);
    background: rgba(0, 229, 255, 0.2);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; box-shadow: 0 0 6px currentColor; }

  /* Table Layout Grid */
  .table-wrap { overflow-x: auto; overflow-y: hidden; }
  .ptable {
    display: grid;
    grid-template-columns: repeat(18, minmax(84px, 1fr));
    grid-auto-rows: 92px;
    gap: 8px;
    min-width: 1550px;
    padding: 6px;
  }

  /* Element Tile Design */
  .el {
    position: relative;
    border-radius: 12px;
    padding: 8px;
    user-select: none;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 200ms ease, box-shadow 200ms ease, opacity 250ms ease, filter 250ms ease;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 18px rgba(0,0,0,0.4);
  }
  .el:hover {
    transform: translateY(-5px) scale(1.08) !important;
    box-shadow: 0 18px 36px rgba(0,0,0,0.7), 0 0 20px rgba(255,255,255,0.3) !important;
    z-index: 25;
  }
  .el::after {
    content: &quot;&quot;;
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: radial-gradient(600px 200px at 80% -20%, rgba(255,255,255,0.25), transparent 60%);
    pointer-events: none;
  }
  .el .num { position: absolute; top: 6px; left: 8px; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.9); }
  .el .mass { position: absolute; top: 6px; right: 8px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.85); }
  .el .sym {
    position: absolute;
    left: 8px; right: 8px; top: 24px; bottom: 24px;
    display: grid; place-items: center;
    font-weight: 900; font-size: 28px;
    letter-spacing: 0.5px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
  }
  .el .name {
    position: absolute; left: 8px; right: 8px; bottom: 6px;
    font-size: 11px; font-weight: 600; opacity: 0.95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Lewis Dot Layout */
  .lewis-grid {
    position: absolute;
    inset: 22px 10px 20px 10px;
    display: grid;
    grid-template-rows: 10px 1fr 10px;
    grid-template-columns: 10px 1fr 10px;
    align-items: center; justify-items: center;
  }
  .lewis-dot-spot { display: flex; gap: 3px; align-items: center; justify-content: center; }
  .lewis-dot { width: 5px; height: 5px; border-radius: 999px; background: var(--accent-cyan); box-shadow: 0 0 6px var(--accent-cyan); }

  .label-cell {
    display: grid; place-items: center;
    border-radius: 12px; border: 1px dashed rgba(255,255,255,0.25);
    color: #e2e8f0; font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  }

  /* Highlighting &amp; Bright Dimming Logic */
  .dimmed {
    opacity: 0.32 !important;
    filter: grayscale(40%) brightness(60%) !important;
    transform: scale(0.97) !important;
    box-shadow: none !important;
  }
  .highlight {
    outline: 2px solid var(--accent-cyan) !important;
    outline-offset: 1px;
    opacity: 1 !important;
    filter: none !important;
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.6) !important;
    z-index: 10;
  }

  /* Modal Popup Card */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .modal-backdrop.hidden { display: none; }
  .modal-card {
    position: relative; width: 100%; max-width: 1020px; max-height: 92vh;
    overflow-y: auto; background: #0d131f; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 1.25rem; box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 30px rgba(0, 229, 255, 0.15); padding: 1.5rem;
    display: flex; flex-direction: column; gap: 1.25rem;
  }
  .close-btn {
    position: absolute; top: 1rem; right: 1rem; width: 2.25rem; height: 2.25rem;
    border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
    color: #e2e8f0; font-size: 1rem; cursor: pointer; display: grid; place-items: center;
    transition: all 0.2s;
  }
  .close-btn:hover { background: rgba(255,255,255,0.25); color: #fff; transform: scale(1.08); }

  /* Modal Layout */
  .modal-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 1rem; }
  .badge-symbol { width: 5.25rem; height: 5.25rem; border-radius: 0.85rem; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 2rem; border: 1px solid rgba(255,255,255,0.3); }
  
  .visuals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
  .visual-card { background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.15); border-radius: 0.85rem; padding: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  
  .props-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.75rem; font-size: 0.75rem; }
  .prop-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 0.75rem; border-radius: 0.6rem; display: flex; flex-direction: column; gap: 0.25rem; }
  .prop-title { color: var(--accent-cyan); font-weight: 700; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.05em; }

  /* Entry Keyframe Animation */
  @keyframes tileEntry {
    from { opacity: 0; transform: translateY(15px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .animate-tile { animation: tileEntry 0.35s ease-out forwards; }
&lt;/style&gt;

  // Valence Electrons Calculation
  function getValenceElectrons(el) {
    if (el.num === 2) return 2;
    if (el.x === 1) return 1;
    if (el.x === 2) return 2;
    if (el.x &gt;= 13 &amp;&amp; el.x &lt;= 18) return el.x - 10;
    return 2;
  }

  // Dynamic Fallback Generator with imageUrl Space
  function getFallbackDetails(el) {
    const maxCapacity = [2, 8, 18, 32, 32, 18, 8];
    let rem = el.num;
    const shells = [];
    for (let cap of maxCapacity) {
      if (rem &lt;= 0) break;
      let count = Math.min(rem, cap);
      shells.push(count);
      rem -= count;
    }

    let block = &#39;s&#39;;
    if (el.x &gt;= 13 &amp;&amp; el.x &lt;= 18) block = &#39;p&#39;;
    else if (el.x &gt;= 3 &amp;&amp; el.x &lt;= 12) block = &#39;d&#39;;
    if (el.y &gt;= 8) block = &#39;f&#39;;

    const neutrons = Math.round(parseFloat(el.mass.replace(/[\[\]]/g, &#39;&#39;)) || el.num * 2) - el.num;

    return {
      name: el.name, symbol: el.sym, num: el.num, mass: `${el.mass} u`, group: `${el.x}`, period: `${el.y}`, block: block,
      category: el.cat, stateRT: el.y === 1 &amp;&amp; el.x === 18 ? &#39;Gas&#39; : &#39;Solid&#39;, colorAppearance: &#39;Silvery-grey / Metallic&#39;,
      // EDIT THIS PROPERTY TO ADD CUSTOM ELEMENT IMAGE URL FOR REMAINING ELEMENTS:
      imageUrl: &quot;&quot;,
      config: `Period ${el.y} Configuration`, shells: shells, valency: getValenceElectrons(el), oxidationStates: &#39;Variable&#39;,
      protons: el.num, neutrons: neutrons &gt; 0 ? neutrons : el.num, electrons: el.num, electronegativity: &#39;N/A&#39;, atomicRadius: &#39;N/A&#39;,
      ionizationEnergy: &#39;N/A&#39;, electronAffinity: &#39;N/A&#39;, density: &#39;N/A&#39;, mp: &#39;N/A&#39;, bp: &#39;N/A&#39;, crystalStructure: &#39;N/A&#39;,
      isotopes: &#39;Various isotopes&#39;, naturalOccurrence: &#39;Primordial or Synthetic&#39;, discovery: &#39;N/A&#39;, discoverer: &#39;Scientific Consensus&#39;,
      originOfName: &#39;Derived from historical or geographical origin&#39;, ptPosition: `Group ${el.x}, Period ${el.y}, ${block}-block`,
      orbitalDiagram: `[Core] Shells: ${shells.join(&#39;, &#39;)}`, bohrModel: `${el.num} protons, ${shells.length} electron shells`,
      lewisDot: `${el.sym} (${getValenceElectrons(el)} e⁻)`,
      summary: `${el.name} (${el.sym}) is a chemical element with atomic number ${el.num} and an atomic mass of ${el.mass}. It belongs to the ${el.cat} category.`
    };
  }

  // Row labels for Lanthanides/Actinides
  const rowLabels = [
    { text: &#39;Lanthanides&#39;, x:1, y:8, span:3 },

  ];

  // Helper: Convert Hex to RGB
  function hexToRgb(hex) {
    hex = hex.replace(&#39;#&#39;, &#39;&#39;);
    if (hex.length === 3) hex = hex.split(&#39;&#39;).map(c =&gt; c + c).join(&#39;&#39;);
    const num = parseInt(hex, 16);
    return { r: (num &gt;&gt; 16) &amp; 255, g: (num &gt;&gt; 8) &amp; 255, b: num &amp; 255 };
  }

  // Bright Tile Background Generator
  function tileBackground(colorHex) {
    const { r, g, b } = hexToRgb(colorHex);
    const light = `rgba(${Math.min(255, r + 40)}, ${Math.min(255, g + 40)}, ${Math.min(255, b + 40)}, 0.45)`;
    const dark = `rgba(${Math.max(0, r - 30)}, ${Math.max(0, g - 30)}, ${Math.max(0, b - 30)}, 0.55)`;
    return `linear-gradient(135deg, ${light}, ${dark}), linear-gradient(180deg, rgba(255,255,255,0.1), transparent)`;
  }

  // Application State
  let selectedCategory = &#39;all&#39;;
  let searchQuery = &#39;&#39;;
  let showLewisDots = false;

  const grid = document.getElementById(&#39;ptable&#39;);
  const searchInput = document.getElementById(&#39;search&#39;);
  const toggleLewisBtn = document.getElementById(&#39;toggleLewisBtn&#39;);

  // Render Lewis Dot Overlay
  function buildLewisHTML(el, valenceCount) {
    let top = 0, right = 0, bottom = 0, left = 0;
    for (let i = 1; i &lt;= valenceCount; i++) {
      if (i === 1) top++;
      else if (i === 2) right++;
      else if (i === 3) bottom++;
      else if (i === 4) left++;
      else if (i === 5) top++;
      else if (i === 6) right++;
      else if (i === 7) bottom++;
      else if (i === 8) left++;
    }

    const renderDots = (count) =&gt; {
      let html = &#39;&#39;;
      for (let i = 0; i &lt; count; i++) html += `&lt;span class=&quot;lewis-dot&quot;&gt;&lt;/span&gt;`;
      return html;
    };

    return `
      &lt;div class=&quot;lewis-grid&quot;&gt;
        &lt;div&gt;&lt;/div&gt;
        &lt;div class=&quot;lewis-dot-spot&quot;&gt;${renderDots(top)}&lt;/div&gt;
        &lt;div&gt;&lt;/div&gt;

        &lt;div class=&quot;lewis-dot-spot flex-col&quot;&gt;${renderDots(left)}&lt;/div&gt;
        &lt;div class=&quot;sym&quot; style=&quot;position:static;&quot;&gt;${el.sym}&lt;/div&gt;
        &lt;div class=&quot;lewis-dot-spot flex-col&quot;&gt;${renderDots(right)}&lt;/div&gt;

        &lt;div&gt;&lt;/div&gt;
        &lt;div class=&quot;lewis-dot-spot&quot;&gt;${renderDots(bottom)}&lt;/div&gt;
        &lt;div&gt;&lt;/div&gt;
      &lt;/div&gt;
    `;
  }

  // Render Grid
  function renderGrid() {
    grid.innerHTML = &#39;&#39;;
    
    rowLabels.forEach(lab =&gt; {
      const d = document.createElement(&#39;div&#39;);
      d.className = &#39;label-cell&#39;;
      d.style.gridColumn = `${lab.x} / span ${lab.span}`;
      d.style.gridRow = lab.y;
      d.textContent = lab.text;
      grid.appendChild(d);
    });

    elements.forEach((el, index) =&gt; {
      const div = document.createElement(&#39;div&#39;);
      div.className = &#39;el animate-tile&#39;;
      div.style.gridColumn = el.x;
      div.style.gridRow = el.y;
      div.style.animationDelay = `${index * 0.004}s`;
      
      const catColor = catColors[el.cat] || catColors.unknown;
      div.style.background = tileBackground(catColor);
      div.style.borderColor = catColor;
      div.setAttribute(&#39;data-num&#39;, el.num);
      div.setAttribute(&#39;data-sym&#39;, el.sym.toLowerCase());
      div.setAttribute(&#39;data-name&#39;, el.name.toLowerCase());
      div.setAttribute(&#39;data-cat&#39;, el.cat);

      const valence = getValenceElectrons(el);

      if (showLewisDots) {
        div.innerHTML = `
          &lt;div class=&quot;num&quot;&gt;${el.num}&lt;/div&gt;
          &lt;div class=&quot;mass&quot;&gt;${valence} e⁻&lt;/div&gt;
          ${buildLewisHTML(el, valence)}
          &lt;div class=&quot;name&quot;&gt;${el.name}&lt;/div&gt;
        `;
      } else {
        div.innerHTML = `
          &lt;div class=&quot;num&quot;&gt;${el.num}&lt;/div&gt;
          &lt;div class=&quot;mass&quot;&gt;${el.mass}&lt;/div&gt;
          &lt;div class=&quot;sym&quot;&gt;${el.sym}&lt;/div&gt;
          &lt;div class=&quot;name&quot;&gt;${el.name}&lt;/div&gt;
        `;
      }

      // 3D Tilt Effect
      let rect = null;
      div.addEventListener(&#39;mouseenter&#39;, () =&gt; { rect = div.getBoundingClientRect(); });
      div.addEventListener(&#39;mousemove&#39;, (e) =&gt; {
        if (!rect) rect = div.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = (e.clientX - cx) / rect.width;
        const dy = (e.clientY - cy) / rect.height;
        const rx = (-dy * 8).toFixed(2);
        const ry = (dx * 8).toFixed(2);
        div.style.transform = `translateY(-5px) scale(1.08) rotateX(${rx}deg) rotateY(${ry}deg)`;
      });
      div.addEventListener(&#39;mouseleave&#39;, () =&gt; { div.style.transform = &#39;&#39;; });

      div.addEventListener(&#39;click&#39;, () =&gt; { openElementModal(el); });

      grid.appendChild(div);
    });

    updateFilters();
  }

  // Adjusted Filter Highlighting Logic
  function updateFilters() {
    const tiles = Array.from(document.querySelectorAll(&#39;.el&#39;));
    const q = searchQuery.trim().toLowerCase();

    tiles.forEach(t =&gt; {
      const matchesCat = (selectedCategory === &#39;all&#39; || t.dataset.cat === selectedCategory);
      const matchesSearch = !q || (
        t.dataset.sym.includes(q) ||
        t.dataset.name.includes(q) ||
        t.dataset.num === q
      );

      if (matchesCat &amp;&amp; matchesSearch) {
        t.classList.remove(&#39;dimmed&#39;);
        if (q || selectedCategory !== &#39;all&#39;) {
          t.classList.add(&#39;highlight&#39;);
        } else {
          t.classList.remove(&#39;highlight&#39;);
        }
      } else {
        t.classList.remove(&#39;highlight&#39;);
        t.classList.add(&#39;dimmed&#39;);
      }
    });
  }

  // Toggle Lewis Dots Button Listener
  toggleLewisBtn.addEventListener(&#39;click&#39;, () =&gt; {
    showLewisDots = !showLewisDots;
    if (showLewisDots) toggleLewisBtn.classList.add(&#39;btn-active&#39;);
    else toggleLewisBtn.classList.remove(&#39;btn-active&#39;);
    renderGrid();
  });

  // Legend Category Click Handler
  document.getElementById(&#39;legendContainer&#39;).addEventListener(&#39;click&#39;, (e) =&gt; {
    const btn = e.target.closest(&#39;.legend-btn&#39;);
    if (!btn) return;
    document.querySelectorAll(&#39;.legend-btn&#39;).forEach(b =&gt; b.classList.remove(&#39;active&#39;));
    btn.classList.add(&#39;active&#39;);
    selectedCategory = btn.dataset.cat;
    updateFilters();
  });

  searchInput.addEventListener(&#39;input&#39;, (e) =&gt; {
    searchQuery = e.target.value;
    updateFilters();
  });

  document.getElementById(&#39;resetAnim&#39;).addEventListener(&#39;click&#39;, () =&gt; renderGrid());

  // HTML5 Canvas 2D Bohr Atom Animation
  let atomAnimId = null;

  function startAtomAnimation(shells, symbol, catColor) {
    const canvas = document.getElementById(&#39;atomCanvas&#39;);
    const ctx = canvas.getContext(&#39;2d&#39;);
    let angleOffsets = shells.map(() =&gt; Math.random() * Math.PI * 2);

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Nucleus
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI * 2);
      ctx.fillStyle = catColor;
      ctx.shadowColor = catColor;
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = &#39;#ffffff&#39;;
      ctx.font = &#39;bold 11px sans-serif&#39;;
      ctx.textAlign = &#39;center&#39;;
      ctx.textBaseline = &#39;middle&#39;;
      ctx.fillText(symbol, cx, cy);

      // Shells &amp; Orbiting Electrons
      const maxRadius = Math.min(cx, cy) - 18;
      const minRadius = 30;
      const step = shells.length &gt; 1 ? (maxRadius - minRadius) / (shells.length - 1) : 0;

      shells.forEach((count, sIdx) =&gt; {
        const r = shells.length === 1 ? 55 : minRadius + sIdx * step;
        
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = &#39;rgba(255, 255, 255, 0.25)&#39;;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        const speed = (sIdx % 2 === 0 ? 1 : -1) * (0.018 - sIdx * 0.0015);
        angleOffsets[sIdx] += speed;

        for (let i = 0; i &lt; count; i++) {
          const angle = angleOffsets[sIdx] + (i * 2 * Math.PI) / count;
          const ex = cx + r * Math.cos(angle);
          const ey = cy + r * Math.sin(angle);

          ctx.beginPath();
          ctx.arc(ex, ey, 4, 0, Math.PI * 2);
          ctx.fillStyle = &#39;#00e5ff&#39;;
          ctx.shadowColor = &#39;#00e5ff&#39;;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      atomAnimId = requestAnimationFrame(draw);
    }

    if (atomAnimId) cancelAnimationFrame(atomAnimId);
    draw();
  }

  // Open Element Modal Card
  function openElementModal(el) {
    const details = elementDetails[el.num] || getFallbackDetails(el);
    const catColor = catColors[el.cat] || catColors.unknown;

    // Header Values
    document.getElementById(&#39;modalNum&#39;).textContent = details.num;
    document.getElementById(&#39;modalSymbol&#39;).textContent = details.symbol;
    document.getElementById(&#39;modalName&#39;).textContent = details.name;
    document.getElementById(&#39;modalCategory&#39;).textContent = details.category;
    document.getElementById(&#39;modalMass&#39;).textContent = details.mass;
    document.getElementById(&#39;modalPhase&#39;).textContent = `State at RT: ${details.stateRT}`;

    const badge = document.getElementById(&#39;modalSymbolBadge&#39;);
    badge.style.background = tileBackground(catColor);
    badge.style.borderColor = catColor;

    // Reference Image Handling
    const imgEl = document.getElementById(&#39;modalElementImg&#39;);
    const fallbackEl = document.getElementById(&#39;modalImgFallback&#39;);

    if (details.imageUrl &amp;&amp; details.imageUrl.trim() !== &#39;&#39;) {
      fallbackEl.style.display = &#39;none&#39;;
      imgEl.style.display = &#39;block&#39;;
      imgEl.src = details.imageUrl;
      imgEl.onerror = () =&gt; {
        imgEl.style.display = &#39;none&#39;;
        fallbackEl.style.display = &#39;flex&#39;;
      };
    } else {
      imgEl.style.display = &#39;none&#39;;
      fallbackEl.style.display = &#39;flex&#39;;
    }

    document.getElementById(&#39;modalImgCaption&#39;).textContent = `${details.name} reference sample`;

    // Visual Quantum Models
    document.getElementById(&#39;modalConfig&#39;).textContent = details.config;
    document.getElementById(&#39;modalLewisDot&#39;).textContent = details.lewisDot;
    document.getElementById(&#39;modalOrbitalDiagram&#39;).textContent = details.orbitalDiagram;
    document.getElementById(&#39;modalShellsText&#39;).textContent = `Shell Distribution: [ ${details.shells.join(&#39;, &#39;)} ]`;
    document.getElementById(&#39;modalSummary&#39;).textContent = details.summary;

    // Render 34 Complete Properties Grid
    const propGrid = document.getElementById(&#39;modalPropertiesGrid&#39;);
    propGrid.className = &#39;props-grid&#39;;
    propGrid.innerHTML = `
      &lt;div class=&quot;prop-card&quot;&gt;
        &lt;div class=&quot;prop-title&quot;&gt;1. Position &amp; Identity&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Position:&lt;/span&gt; ${details.ptPosition}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Group / Period / Block:&lt;/span&gt; Group ${details.group}, Period ${details.period}, ${details.block}-block&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Appearance:&lt;/span&gt; ${details.colorAppearance}&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;prop-card&quot;&gt;
        &lt;div class=&quot;prop-title&quot;&gt;2. Subatomic Particles&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Protons:&lt;/span&gt; ${details.protons}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Neutrons (main isotope):&lt;/span&gt; ${details.neutrons}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Electrons:&lt;/span&gt; ${details.electrons}&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;prop-card&quot;&gt;
        &lt;div class=&quot;prop-title&quot;&gt;3. Physical Properties&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Density:&lt;/span&gt; ${details.density}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Melting Point:&lt;/span&gt; ${details.mp}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Boiling Point:&lt;/span&gt; ${details.bp}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Crystal Structure:&lt;/span&gt; ${details.crystalStructure}&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;prop-card&quot;&gt;
        &lt;div class=&quot;prop-title&quot;&gt;4. Chemical Properties&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Valency:&lt;/span&gt; ${details.valency}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Oxidation States:&lt;/span&gt; ${details.oxidationStates}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Electronegativity:&lt;/span&gt; ${details.electronegativity}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Atomic Radius:&lt;/span&gt; ${details.atomicRadius}&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;prop-card&quot;&gt;
        &lt;div class=&quot;prop-title&quot;&gt;5. Quantum Energies&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Ionization Energy:&lt;/span&gt; ${details.ionizationEnergy}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Electron Affinity:&lt;/span&gt; ${details.electronAffinity}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Shell Array:&lt;/span&gt; [${details.shells.join(&#39;, &#39;)}]&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;prop-card&quot;&gt;
        &lt;div class=&quot;prop-title&quot;&gt;6. History &amp; Origin&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Discovery Year:&lt;/span&gt; ${details.discovery}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Discoverer:&lt;/span&gt; ${details.discoverer}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Name Origin:&lt;/span&gt; ${details.originOfName}&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;prop-card&quot; style=&quot;grid-column: 1 / -1;&quot;&gt;
        &lt;div class=&quot;prop-title&quot;&gt;7. Isotopes &amp; Abundance&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Isotopes:&lt;/span&gt; ${details.isotopes}&lt;/div&gt;
        &lt;div&gt;&lt;span style=&quot;color:var(--text-muted)&quot;&gt;Natural Occurrence:&lt;/span&gt; ${details.naturalOccurrence}&lt;/div&gt;
      &lt;/div&gt;
    `;

    // Start 2D Canvas Animation
    startAtomAnimation(details.shells, details.symbol, catColor);

    // Show Modal
    const modal = document.getElementById(&#39;elementModal&#39;);
    modal.classList.remove(&#39;hidden&#39;);
  }

  function closeModal() {
    const modal = document.getElementById(&#39;elementModal&#39;);
    if (atomAnimId) cancelAnimationFrame(atomAnimId);
    modal.classList.add(&#39;hidden&#39;);
  }

  document.getElementById(&#39;closeModal&#39;).addEventListener(&#39;click&#39;, closeModal);
  document.getElementById(&#39;elementModal&#39;).addEventListener(&#39;click&#39;, (e) =&gt; {
    if (e.target.id === &#39;elementModal&#39;) closeModal();
  });
  window.addEventListener(&#39;keydown&#39;, (e) =&gt; {
    if (e.key === &#39;Escape&#39;) closeModal();
  });

  // Initialization
  renderGrid();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1920;
  const STAGE_H = 1080;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
