canvas.getContext(

);



/* =================================================
   SIMULATION VARIABLES
================================================= */

let temperature = 27;

let particleCount = 100;

let particleSize = 4;

let speedMultiplier = 1;

let moleculeType = &quot;mono&quot;;

let particles = [];

let running = false;

let paused = false;



/*
   Collision settings
*/

const RESTITUTION = 1.0;


/*
   Number of physics substeps.

   This greatly reduces the chance
   of particles passing through each
   other at high temperature.
*/

const SUBSTEPS = 3;



/* =================================================
   KELVIN
================================================= */

function getKelvin(){

    return Math.max(
        0.01,
        temperature + 273.15
    );

}



/* =================================================
   MOLECULAR MASS
================================================= */

function getMass(){

    if(
        moleculeType === &quot;heavy&quot;
    ){

        return 4;

    }


    if(
        moleculeType === &quot;diatomic&quot;
    ){

        return 2;

    }


    return 1;

}



/* =================================================
   SPEED FROM KINETIC THEORY
================================================= */

function getParticleSpeed(){

    /*
       v ∝ sqrt(T/M)

       300 K and mass 1
       are used as reference.
    */

    return (

        2.8 *

        Math.sqrt(
            getKelvin() /
            300
        ) *

        speedMultiplier *

        Math.sqrt(
            1 /
            getMass()
        )

    );

}

}



/* =================================================
   CREATE PARTICLES
================================================= */

function createParticles(){

    particles = [];


    const bounds =
        getBounds();


    const speed =
        getParticleSpeed();


    const radius =
        particleSize;


    for(
        let i=0;
        i&lt;particleCount;
        i++
    ){

        let x;

        let y;

        let safe = false;


        /*
           Try to create particles without
           placing them on top of one another.
        */

        for(
            let attempt=0;
            attempt&lt;100;
            attempt++
        ){

            x =
                bounds.left +
                radius +
                Math.random() *
                (
                    bounds.right -
                    bounds.left -
                    radius*2
                );


            y =
                bounds.top +
                radius +
                Math.random() *
                (
                    bounds.bottom -
                    bounds.top -
                    radius*2
                );


            safe = true;


            for(
                let j=0;
                j&lt;particles.length;
                j++
            ){

                const dx =
                    x -
                    particles[j].x;


                const dy =
                    y -
                    particles[j].y;


                const distance =
                    Math.sqrt(
                        dx*dx +
                        dy*dy
                    );


                if(
                    distance &lt;
                    radius*2.2
                ){

                    safe=false;

                    break;

                }

            }


            if(safe){

                break;

            }

        }


        /*
           Random direction
        */

        const angle =
            Math.random() *
            Math.PI *
            2;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            mass:
                getMass()

        });

    }

}



/* =================================================
   CHANGE SPEED WITHOUT CHANGING DIRECTION
================================================= */

function adjustParticleSpeeds(){

    const target =
        getParticleSpeed();


    particles.forEach(
        p =&gt; {

            const current =
                Math.sqrt(
                    p.vx*p.vx +
                    p.vy*p.vy
                );


            if(
                current &gt;
                0.0001
            ){

                p.vx =
                    p.vx /
                    current *
                    target;


                p.vy =
                    p.vy /
                    current *
                    target;

            }

            else{

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                p.vx =
                    Math.cos(angle) *
                    target;


                p.vy =
                    Math.sin(angle) *
                    target;

            }

        }
    );

}



/* =================================================
   WALL COLLISION
================================================= */

function wallCollision(
    p,
    bounds
){

    const radius =
        particleSize;


    /*
       Left wall
    */

    if(
        p.x -
        radius &lt;
        bounds.left
    ){

        p.x =
            bounds.left +
            radius;


        p.vx =
            Math.abs(
                p.vx
            );

    }


    /*
       Right wall
    */

    if(
        p.x +
        radius &gt;
        bounds.right
    ){

        p.x =
            bounds.right -
            radius;


        p.vx =
            -Math.abs(
                p.vx
            );

    }


    /*
       Top wall
    */

    if(
        p.y -
        radius &lt;
        bounds.top
    ){

        p.y =
            bounds.top +
            radius;


        p.vy =
            Math.abs(
                p.vy
            );

    }


    /*
       Bottom wall
    */

    if(
        p.y +
        radius &gt;
        bounds.bottom
    ){

        p.y =
            bounds.bottom -
            radius;


        p.vy =
            -Math.abs(
                p.vy
            );

    }

}



/* =================================================
   ELASTIC PARTICLE COLLISION
================================================= */

function resolveCollision(
    a,
    b
){

    /*
       Vector from A → B
    */

    let dx =
        b.x -
        a.x;


    let dy =
        b.y -
        a.y;


    let distance =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    const minimumDistance =
        particleSize * 2;


    /*
       Extremely rare case where two
       particles have exactly the same
       position.
    */

    if(
        distance === 0
    ){

        const angle =
            Math.random() *
            Math.PI *
            2;


        dx =
            Math.cos(angle);

        dy =
            Math.sin(angle);

        distance=1;

    }


    /*
       Collision only occurs when
       particles overlap.
    */

    if(
        distance &gt;=
        minimumDistance
    ){

        return;

    }


    /*
       Normal vector
    */

    const nx =
        dx /
        distance;


    const ny =
        dy /
        distance;


    /*
       Tangent vector
    */

    const tx =
        -ny;


    const ty =
        nx;


    /*
       Project velocities into
       normal and tangent directions.
    */

    const v1n =
        a.vx*nx +
        a.vy*ny;


    const v1t =
        a.vx*tx +
        a.vy*ty;


    const v2n =
        b.vx*nx +
        b.vy*ny;


    const v2t =
        b.vx*tx +
        b.vy*ty;


    /*
       Masses
    */

    const m1 =
        a.mass;


    const m2 =
        b.mass;


    /*
       1D elastic collision equation.

       This handles different masses
       correctly.
    */

    const newV1n =

        (
            v1n *
            (m1-m2)
            +
            2 *
            m2 *
            v2n
        )
        /
        (m1+m2);


    const newV2n =

        (
            v2n *
            (m2-m1)
            +
            2 *
            m1 *
            v1n
        )
        /
        (m1+m2);


    /*
       Convert normal + tangent
       components back to x/y.
    */

    a.vx =
        newV1n*nx +
        v1t*tx;


    a.vy =
        newV1n*ny +
        v1t*ty;


    b.vx =
        newV2n*nx +
        v2t*tx;


    b.vy =
        newV2n*ny +
        v2t*ty;



    /* =================================================
       IMPORTANT FIX

       Separate the particles.

       Without this, overlapping particles can
       collide repeatedly and appear to stick.
    ================================================= */

    const overlap =
        minimumDistance -
        distance;


    if(
        overlap &gt; 0
    ){

        /*
           Move each particle half the
           penetration distance.

           For different masses, the lighter
           particle moves more.
        */

        const totalMass =
            m1+m2;


        const moveA =
            overlap *
            (
                m2 /
                totalMass
            );


        const moveB =
            overlap *
            (
                m1 /
                totalMass
            );


        a.x -=
            nx *
            moveA;


        a.y -=
            ny *
            moveA;


        b.x +=
            nx *
            moveB;


        b.y +=
            ny *
            moveB;

    }

}



/* =================================================
   ALL PARTICLE COLLISIONS
================================================= */

function particleCollisions(){

    for(
        let i=0;
        i&lt;particles.length;
        i++
    ){

        for(
            let j=i+1;
            j&lt;particles.length;
            j++
        ){

            resolveCollision(
                particles[i],
                particles[j]
            );

        }

    }

}



/* =================================================
   UPDATE PHYSICS
================================================= */

function updateParticles(){

    if(
        !running ||
        paused
    ){

        return;

    }


    const bounds =
        getBounds();


    /*
       Multiple smaller physics steps.

       This makes collision detection
       much more stable.
    */

    for(
        let step=0;
        step&lt;SUBSTEPS;
        step++
    ){

        particles.forEach(
            p =&gt; {

                p.x +=
                    p.vx /
                    SUBSTEPS;


                p.y +=
                    p.vy /
                    SUBSTEPS;


                wallCollision(
                    p,
                    bounds
                );

            }
        );


        /*
           Resolve all molecule collisions
           after movement.
        */

        particleCollisions();


        /*
           Run collision detection again
           after separation.

           This helps when several molecules
           are close together.
        */

        particleCollisions();

    }

}



/* =================================================
   PARTICLE COLOR
================================================= */

function getParticleColor(){

    if(
        temperature &lt; 0
    ){

        return &quot;#35b9ff&quot;;

    }


    if(
        temperature &lt; 100
    ){

        return &quot;#ffd166&quot;;

    }


    return &quot;#ff7043&quot;;

}



/* =================================================
   DRAW CHAMBER
================================================= */

function drawChamber(){

    const bounds =
        getBounds();


    const width =
        bounds.right -
        bounds.left;


    const height =
        bounds.bottom -
        bounds.top;


    /*
       Chamber background
    */

    ctx.fillStyle =
        &quot;rgba(70,150,255,.06)&quot;;


    ctx.fillRect(
        bounds.left,
        bounds.top,
        width,
        height
    );


    /*
       Outer border
    */

    ctx.strokeStyle =
        &quot;#65c9ff&quot;;


    ctx.lineWidth=3;


    ctx.strokeRect(
        bounds.left,
        bounds.top,
        width,
        height
    );


    /*
       Header
    */

    ctx.font =
        &quot;bold 18px Arial&quot;;


    ctx.fillStyle =
        &quot;#ffffff&quot;;


    ctx.fillText(
        &quot;Gas Molecules&quot;,
        385,
        50
    );


    /*
       Bottom label
    */

    ctx.font =
        &quot;14px Arial&quot;;


    ctx.fillStyle =
        &quot;#bfcce0&quot;;


    ctx.fillText(
        &quot;Elastic molecular collisions&quot;,
        350,
        490
    );

}



/* =================================================
   DRAW PARTICLE
================================================= */

function drawParticle(p){

    const color =
        getParticleColor();


    /*
       MONATOMIC
    */

    if(
        moleculeType ===
        &quot;mono&quot;
    ){

        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            particleSize,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            color;


        ctx.shadowBlur=10;

        ctx.shadowColor =
            color;


        ctx.fill();


        ctx.shadowBlur=0;


        return;

    }



    /*
       DIATOMIC
    */

    if(
        moleculeType ===
        &quot;diatomic&quot;
    ){

        const speed =
            Math.sqrt(
                p.vx*p.vx +
                p.vy*p.vy
            );


        let ux=1;

        let uy=0;


        if(
            speed &gt; 0
        ){

            ux =
                p.vx /
                speed;


            uy =
                p.vy /
                speed;

        }


        const separation =
            particleSize*1.5;


        const ax =
            p.x -
            ux *
            separation;


        const ay =
            p.y -
            uy *
            separation;


        const bx =
            p.x +
            ux *
            separation;


        const by =
            p.y +
            uy *
            separation;


        /*
           Bond
        */

        ctx.beginPath();


        ctx.moveTo(
            ax,
            ay
        );


        ctx.lineTo(
            bx,
            by
        );


        ctx.strokeStyle =
            &quot;rgba(255,255,255,.65)&quot;;


        ctx.lineWidth=2;


        ctx.stroke();


        /*
           Atom A
        */

        ctx.beginPath();


        ctx.arc(
            ax,
            ay,
            particleSize,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            color;


        ctx.fill();


        /*
           Atom B
        */

        ctx.beginPath();


        ctx.arc(
            bx,
            by,
            particleSize,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            color;


        ctx.fill();

        return;

    }



    /*
       HEAVY GAS
    */

    ctx.beginPath();


    ctx.arc(
        p.x,
        p.y,
        particleSize+1,
        0,
        Math.PI*2
    );


    ctx.fillStyle =
        color;


    ctx.shadowBlur=10;


    ctx.shadowColor =
        color;


    ctx.fill();


    ctx.shadowBlur=0;

}



/* =================================================
   DRAW PARTICLES
================================================= */

function drawParticles(){

    particles.forEach(
        p =&gt; {

            drawParticle(p);

        }
    );

}



/* =================================================
   THERMOMETER
================================================= */

function drawThermometer(){

    const x=40;

    const y=120;

    const height=270;


    const min=-273;

    const max=500;


    const ratio =
        (
            temperature -
            min
        )
        /
        (
            max -
            min
        );


    const fill =
        Math.max(
            0,
            Math.min(
                1,
                ratio
            )
        );


    /*
       Tube
    */

    ctx.fillStyle =
        &quot;rgba(255,255,255,.12)&quot;;


    ctx.fillRect(
        x,
        y,
        18,
        height
    );


    /*
       Mercury colour
    */

    let color;


    if(
        temperature &lt; 0
    ){

        color =
            &quot;#35b9ff&quot;;

    }

    else if(
        temperature &lt; 100
    ){

        color =
            &quot;#ffd166&quot;;

    }

    else{

        color =
            &quot;#ff7043&quot;;

    }


    /*
       Mercury
    */

    ctx.fillStyle =
        color;


    ctx.fillRect(
        x,
        y+
        height -
        fill*height,
        18,
        fill*height
    );


    /*
       Bulb
    */

    ctx.beginPath();


    ctx.arc(
        x+9,
        y+height+15,
        17,
        0,
        Math.PI*2
    );


    ctx.fill();


    /*
       Temperature label
    */

    ctx.font =
        &quot;bold 14px Arial&quot;;


    ctx.fillText(
        temperature+
        &quot;°C&quot;,
        25,
        y-15
    );

}



/* =================================================
   DRAW EVERYTHING
================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawChamber();

    drawParticles();

    drawThermometer();

}



/* =================================================
   MOTION STATE
================================================= */

function getMotionState(){

    const T =
        getKelvin();


    if(
        T &lt; 50
    ){

        return &quot;Extremely Slow&quot;;

    }


    if(
        T &lt; 150
    ){

        return &quot;Slow&quot;;

    }


    if(
        T &lt; 300
    ){

        return &quot;Moderate&quot;;

    }


    if(
        T &lt; 450
    ){

        return &quot;Fast&quot;;

    }


    return &quot;Very Fast&quot;;

}



/* =================================================
   UPDATE UI
================================================= */

function updateInterface(){

    const T =
        getKelvin();


    const speedRatio =
        Math.sqrt(
            T/300
        );


    /*
       Slider values
    */

    document.getElementById(
        &quot;tempValue&quot;
    ).textContent =
        temperature;


    document.getElementById(
        &quot;particleValue&quot;
    ).textContent =
        particleCount;


    document.getElementById(
        &quot;sizeValue&quot;
    ).textContent =
        particleSize;


    document.getElementById(
        &quot;speedValue&quot;
    ).textContent =
        speedMultiplier.toFixed(1)+
        &quot;×&quot;;


    /*
       Statistics
    */

    document.getElementById(
        &quot;tempStat&quot;
    ).textContent =
        temperature+
        &quot; °C&quot;;


    document.getElementById(
        &quot;kelvinStat&quot;
    ).textContent =
        T.toFixed(2)+
        &quot; K&quot;;


    document.getElementById(
        &quot;speedStat&quot;
    ).textContent =
        speedRatio.toFixed(2)+
        &quot;×&quot;;


    /*
       KE ∝ T
    */

    document.getElementById(
        &quot;energyStat&quot;
    ).textContent =
        (
            T/300
        ).toFixed(2)+
        &quot;×&quot;;


    document.getElementById(
        &quot;particleStat&quot;
    ).textContent =
        particleCount;


    document.getElementById(
        &quot;motionStat&quot;
    ).textContent =
        getMotionState();


    updateExplanation();

}



/* =================================================
   EXPLANATION
================================================= */

function updateExplanation(){

    const T =
        getKelvin();


    const box =
        document.getElementById(
            &quot;explanation&quot;
        );


    if(
        T &lt;= 1
    ){

        box.innerHTML =

        &quot;&lt;strong&gt;Near Absolute Zero:&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;The temperature is extremely close to 0 K. &quot; +

        &quot;The molecular speed in this model becomes very small. &quot; +

        &quot;Absolute zero is −273.15 °C.&quot;;

    }


    else if(
        temperature &lt; 0
    ){

        box.innerHTML =

        &quot;&lt;strong&gt;Low Temperature:&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;The molecules have lower average kinetic energy &quot; +

        &quot;and therefore lower average speed.&quot;;

    }


    else if(
        temperature &lt; 100
    ){

        box.innerHTML =

        &quot;&lt;strong&gt;Moderate Temperature:&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;The molecules continue moving randomly. &quot; +

        &quot;Their average kinetic energy increases as the &quot; +

        &quot;absolute temperature increases.&quot;;

    }


    else{

        box.innerHTML =

        &quot;&lt;strong&gt;High Temperature:&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&quot; +

        &quot;The molecules move faster because their average &quot; +

        &quot;translational kinetic energy is higher.&quot;;

    }

}

   TEMPERATURE
================================================= */

document.getElementById(
    &quot;temperature&quot;
).oninput=function(){

   PARTICLE COUNT
================================================= */

document.getElementById(

).oninput=function(){

};



/* =================================================
   PARTICLE SIZE
================================================= */

document.getElementById(

).oninput=function(){

================================================= */

document.getElementById(

};



/* =================================================
   MOLECULE TYPE
================================================= */

document.getElementById(

).onchange=function(){

        this.value;


    /*
       Molecular mass changes,
       therefore molecular speed changes.
    */

    updateInterface();

};



/* =================================================
   START
================================================= */

function startSimulation(){

    createParticles();


    running=true;

    paused=false;


    document.getElementById(
        &quot;pauseBtn&quot;
    ).textContent =
        &quot;⏸ Pause&quot;;


    document.getElementById(
        &quot;status&quot;
    ).innerHTML =

    &quot;⚛️ &lt;strong&gt;Simulation running:&lt;/strong&gt; &quot; +

    &quot;Particles collide elastically and change direction according to collision rules.&quot;;

}



/* =================================================
   PAUSE
================================================= */

function pauseSimulation(){

    paused =
        !paused;


    document.getElementById(
        &quot;pauseBtn&quot;
    ).textContent =

        paused
        ?
        &quot;▶ Resume&quot;
        :
        &quot;⏸ Pause&quot;;


    if(
        paused
    ){

        document.getElementById(
            &quot;status&quot;
        ).innerHTML =

        &quot;⏸ &lt;strong&gt;Simulation paused.&lt;/strong&gt;&quot;;

    }

    else{

        document.getElementById(
            &quot;status&quot;
        ).innerHTML =

        &quot;▶ &lt;strong&gt;Simulation resumed.&lt;/strong&gt;&quot;;

    }

}



/* =================================================
   RESET
================================================= */

function resetSimulation(){

    temperature=27;

    particleCount=100;

    particleSize=4;

    speedMultiplier=1;

    moleculeType=&quot;mono&quot;;


    running=false;

    paused=false;


    document.getElementById(
        &quot;temperature&quot;
    ).value=27;


    document.getElementById(
        &quot;particleCount&quot;
    ).value=100;


    document.getElementById(
        &quot;particleSize&quot;
    ).value=4;


    document.getElementById(
        &quot;speedMultiplier&quot;
    ).value=1;


    document.getElementById(
        &quot;moleculeType&quot;
    ).value=&quot;mono&quot;;


    document.getElementById(
        &quot;pauseBtn&quot;
    ).textContent =
        &quot;⏸ Pause&quot;;


    document.getElementById(
        &quot;status&quot;
    ).textContent =

        &quot;Press Start Simulation to observe molecular motion.&quot;;


    createParticles();


    updateInterface();

}



/* =================================================
   ANIMATION LOOP
================================================= */

function animate(){

    updateParticles();

    draw();

    requestAnimationFrame(
        animate
    );

}



/* =================================================
   INITIALIZE
================================================= */

createParticles();

updateInterface();

animate();

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
</html>
