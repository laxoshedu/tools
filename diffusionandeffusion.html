  * { box-sizing: border-box; }
  html, body {

  }

  #viewportContainer {
    position: fixed; inset: 0; width: 100%; height: 100dvh;
    overflow: hidden; background: #070b14;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  #appStage {
    width: 1280px;
    height: 720px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform-style: flat;
  }

  #appStage iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  /* FLOATING MOBILE NAVIGATION, PAN & ZOOM BAR */
  .nav-overlay-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99990;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;
    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

  /* UNHIDE TRIGGER BUTTON */
  .nav-toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99989;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #7bd1ff; font-size: 0.9rem;
    display: none; place-items: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .nav-toggle-btn.visible {
    display: grid !important;
  }

  /* HIGH-END PROFESSIONAL ROTATE OVERLAY */
  .rotate-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }
  .rotate-card {
    width: min(440px, 90vw); padding: 36px 28px; border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .rotate-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    background: rgba(123, 209, 255, 0.12); border: 1px solid rgba(123, 209, 255, 0.3);
    color: #7bd1ff; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .rotate-icon-wrap {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;
    animation: phoneRotate 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff, #a7b3d8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {
    margin: 0; color: #94a3b8; font-size: 0.92rem; line-height: 1.5; font-weight: 450;
  }
  .btn-rotate {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, #65c9ff, #3b82f6);
    color: #061225; font-weight: 800; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>

/* =========================================================
   CANVAS
========================================================= */

const canvas=
document.getElementById(&quot;canvas&quot;);

const ctx=
canvas.getContext(&quot;2d&quot;);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let A=substances.Sugar;

let B=substances.Water;

let temperature=27;

let concentration=70;

let particleCount=140;

let process=&quot;diffusion&quot;;

let particles=[];

let running=false;

let paused=false;

let dissolvedCount=0;

let crystalParticles=0;


/* =========================================================
   BOUNDS
========================================================= */

function bounds(){

    return {

        left:55,

        right:1045,

        top:90,

        bottom:525,

        middle:550

    };

}


/* =========================================================
   KELVIN
========================================================= */

function kelvin(){

    return Math.max(
        0.01,
        temperature+273.15
    );

}


/* =========================================================
   TEMPERATURE FACTOR
========================================================= */

function temperatureFactor(){

    return Math.sqrt(
        kelvin()/300
    );

}


/* =========================================================
   PHASE FACTOR
========================================================= */

function phaseFactor(phase){

    if(phase===&quot;gas&quot;)
        return 1;

    if(phase===&quot;liquid&quot;)
        return .20;

    return .004;

}


/* =========================================================
   BASE SPEED
========================================================= */

function baseSpeed(p){

    return (

        2.8 *

        temperatureFactor() *

        Math.sqrt(
            28/
            Math.max(
                .1,
                p.mass
            )
        ) *

        phaseFactor(
            p.phase
        )

    );

}


/* =========================================================
   CREATE SIMULATION
========================================================= */

function createSimulation(){

    particles=[];

    dissolvedCount=0;

    crystalParticles=0;


    if(
        process===&quot;dissolution&quot;
    ){

        createDissolution();

    }
    else{

        createNormalSimulation();

    }

}


/* =========================================================
   NORMAL SIMULATION
========================================================= */

function createNormalSimulation(){

    const b=bounds();


    /*
       A ALWAYS LEFT
    */

    if(
        A.phase===&quot;solid&quot;
    ){

        createSolid(
            A,
            &quot;A&quot;,
            b.left+20,
            b.middle-15
        );

    }
    else{

        createMobile(
            A,
            &quot;A&quot;,
            concentration
        );

    }


    /*
       B ALWAYS RIGHT
    */

    if(
        B.phase===&quot;solid&quot;
    ){

        createSolid(
            B,
            &quot;B&quot;,
            b.middle+15,
            b.right-20
        );

    }
    else{

        createMobile(
            B,
            &quot;B&quot;,
            100-concentration
        );

    }


    /*
       Final safety check.
    */

    enforceInitialContainers();

}


/* =========================================================
   CREATE SOLID
========================================================= */

function createSolid(
    substance,
    type,
    startX,
    endX
){

    const b=bounds();

    /*
       Tight lattice.

       The particles are intentionally
       close together.
    */

    const spacing=9;

    const radius=5.5;


    const rows=
        Math.floor(
            (
                b.bottom-
                b.top-
                30
            )/
            spacing
        );


    const cols=
        Math.floor(
            (
                endX-
                startX
            )/
            spacing
        );


    for(
        let row=0;
        row&lt;rows;
        row++
    ){

        for(
            let col=0;
            col&lt;cols;
            col++
        ){

            const x=
                startX+
                5+
                col*
                spacing;


            const y=
                b.top+
                10+
                row*
                spacing;


            if(
                x+radius&gt;endX
            )
                continue;


            particles.push({

                x:x,

                y:y,

                baseX:x,

                baseY:y,

                vx:0,

                vy:0,

                radius:radius,

                phase:&quot;solid&quot;,

                type:type,

                mass:substance.mass,

                color:substance.color,

                lattice:true,

                substance:substance,

                vibration:
                    Math.random()*
                    Math.PI*2,

                active:true

            });


            crystalParticles++;

        }

    }

}


/* =========================================================
   CREATE MOBILE PARTICLES
   IMPORTANT FIX:
   A = LEFT
   B = RIGHT
========================================================= */

function createMobile(
    substance,
    type,
    percentage
){

    const b=bounds();


    const count=
        Math.max(
            1,
            Math.round(
                particleCount*
                percentage/
                100
            )
        );


    /*
       A ALWAYS LEFT
       B ALWAYS RIGHT
    */

    let minX;

    let maxX;


    if(
        type===&quot;A&quot;
    ){

        minX=
            b.left+
            20;

        maxX=
            b.middle-
            25;

    }
    else{

        minX=
            b.middle+
            25;

        maxX=
            b.right-
            20;

    }


    /*
       Extra safety.
    */

    if(
        maxX&lt;=minX
    ){

        maxX=minX+1;

    }


    for(
        let i=0;
        i&lt;count;
        i++
    ){

        /*
           Particle is created ONLY
           inside its assigned container.
        */

        const x=
            minX+
            Math.random()*
            (
                maxX-
                minX
            );


        const y=
            b.top+
            25+
            Math.random()*
            (
                b.bottom-
                b.top-
                50
            );


        const speed=
            baseSpeed({

                mass:
                    substance.mass,

                phase:
                    substance.phase

            });


        const angle=
            Math.random()*
            Math.PI*2;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            radius:
                substance.phase===&quot;gas&quot;
                ?
                4
                :
                5,

            phase:
                substance.phase,

            type:type,

            mass:
                substance.mass,

            color:
                substance.color,

            lattice:false,

            substance:substance,

            active:true,

            /*
               Remember original container.
            */

            container:
                type===&quot;A&quot;
                ?
                &quot;left&quot;
                :
                &quot;right&quot;

        });

    }

}


/* =========================================================
   INITIAL CONTAINER SAFETY
========================================================= */

function enforceInitialContainers(){

    const b=bounds();


    particles.forEach(
        p=&gt;{

            if(
                p.lattice
            )
                return;


            /*
               A = LEFT
            */

            if(
                p.container===&quot;left&quot;
            ){

                if(
                    p.x+
                    p.radius&gt;
                    b.middle-8
                ){

                    p.x=
                        b.middle-
                        8-
                        p.radius;

                }


                if(
                    p.x-
                    p.radius&lt;
                    b.left
                ){

                    p.x=
                        b.left+
                        p.radius;

                }

            }


            /*
               B = RIGHT
            */

            if(
                p.container===&quot;right&quot;
            ){

                if(
                    p.x-
                    p.radius&lt;
                    b.middle+8
                ){

                    p.x=
                        b.middle+
                        8+
                        p.radius;

                }


                if(
                    p.x+
                    p.radius&gt;
                    b.right
                ){

                    p.x=
                        b.right-
                        p.radius;

                }

            }

        }
    );

}


/* =========================================================
   DISSOLUTION
========================================================= */

function createDissolution(){

    /*
       Dissolution requires:

       A = solid
       B = liquid
    */

    if(
        A.phase!==&quot;solid&quot; ||
        B.phase!==&quot;liquid&quot;
    ){

        A=
            substances.Sugar;

        B=
            substances.Water;


        document.getElementById(
            &quot;substanceA&quot;
        ).value=
            &quot;Sugar&quot;;


        document.getElementById(
            &quot;substanceB&quot;
        ).value=
            &quot;Water&quot;;

    }


    const b=bounds();


    /*
       Liquid solvent fills the
       simulation chamber.
    */

    const solventCount=
        Math.round(
            particleCount*.75
        );


    for(
        let i=0;
        i&lt;solventCount;
        i++
    ){

        const x=
            b.left+
            18+
            Math.random()*
            (
                b.right-
                b.left-
                36
            );


        const y=
            b.top+
            18+
            Math.random()*
            (
                b.bottom-
                b.top-
                170
            );


        const speed=
            baseSpeed({

                mass:B.mass,

                phase:&quot;liquid&quot;

            });


        const angle=
            Math.random()*
            Math.PI*2;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            radius:4.5,

            phase:&quot;liquid&quot;,

            type:&quot;solvent&quot;,

            mass:B.mass,

            color:B.color,

            lattice:false,

            substance:B,

            active:true

        });

    }


    createDissolutionCrystal();

}


/* =========================================================
   DISSOLUTION CRYSTAL
========================================================= */

function createDissolutionCrystal(){

    const b=bounds();

    const spacing=9;

    const radius=5.5;


    const left=
        b.middle-170;

    const right=
        b.middle+170;

    const bottom=
        b.bottom-15;

    const top=
        b.bottom-130;


    for(
        let y=top;
        y&lt;=bottom;
        y+=spacing
    ){

        for(
            let x=left;
            x&lt;=right;
            x+=spacing
        ){

            particles.push({

                x:x,

                y:y,

                baseX:x,

                baseY:y,

                vx:0,

                vy:0,

                radius:radius,

                phase:&quot;solid&quot;,

                type:&quot;solute&quot;,

                mass:A.mass,

                color:A.color,

                lattice:true,

                substance:A,

                vibration:
                    Math.random()*
                    Math.PI*2,

                active:true

            });


            crystalParticles++;

        }

    }

}


/* =========================================================
   SOLID VIBRATION
========================================================= */

function updateSolidParticle(p){

    const amplitude=
        Math.max(
            .15,
            temperatureFactor()*
            1.8
        );


    p.vibration+=
        .035*
        temperatureFactor();


    p.x=
        p.baseX+
        Math.sin(
            p.vibration
        )*
        amplitude;


    p.y=
        p.baseY+
        Math.cos(
            p.vibration*
            1.19
        )*
        amplitude;

}


/* =========================================================
   WALL COLLISION
========================================================= */

function wallCollision(p){

    const b=bounds();


    if(
        p.x-p.radius&lt;
        b.left
    ){

        p.x=
            b.left+
            p.radius;

        p.vx=
            Math.abs(
                p.vx
            );

    }


    if(
        p.x+p.radius&gt;
        b.right
    ){

        p.x=
            b.right-
            p.radius;

        p.vx=
            -Math.abs(
                p.vx
            );

    }


    if(
        p.y-p.radius&lt;
        b.top
    ){

        p.y=
            b.top+
            p.radius;

        p.vy=
            Math.abs(
                p.vy
            );

    }


    if(
        p.y+p.radius&gt;
        b.bottom
    ){

        p.y=
            b.bottom-
            p.radius;

        p.vy=
            -Math.abs(
                p.vy
            );

    }

}


/* =========================================================
   SOLID BARRIER COLLISION
========================================================= */

function solidBarrierCollision(p){

    if(
        p.lattice
    )
        return;


    const solids=
        particles.filter(
            q=&gt;
                q.lattice &amp;&amp;
                q.active &amp;&amp;
                q.phase===&quot;solid&quot;
        );


    for(
        const s of solids
    ){

        const dx=
            p.x-s.x;

        const dy=
            p.y-s.y;


        const dist2=
            dx*dx+
            dy*dy;


        const collisionDistance=
            p.radius+
            s.radius+
            .8;


        if(
            dist2&lt;
            collisionDistance*
            collisionDistance
        ){

            let dist=
                Math.sqrt(
                    dist2
                );


            if(
                dist&lt;.001
            ){

                dist=.001;

            }


            const nx=
                dx/dist;

            const ny=
                dy/dist;


            const overlap=
                collisionDistance-
                dist;


            /*
               Push particle outside
               the solid.
            */

            p.x+=
                nx*
                overlap;

            p.y+=
                ny*
                overlap;


            /*
               Reflect velocity.
            */

            const dot=
                p.vx*nx+
                p.vy*ny;


            if(
                dot&lt;0
            ){

                p.vx-=
                    2*
                    dot*
                    nx;

                p.vy-=
                    2*
                    dot*
                    ny;

            }

        }

    }

}


/* =========================================================
   PARTICLE COLLISION
========================================================= */

function particleCollision(a,b){

    if(
        a.lattice ||
        b.lattice
    )
        return;


    let dx=
        b.x-a.x;

    let dy=
        b.y-a.y;


    let dist=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(
        dist&lt;.001
    ){

        dx=1;
        dy=0;
        dist=1;

    }


    const minDist=
        a.radius+
        b.radius;


    if(
        dist&gt;=minDist
    )
        return;


    const nx=
        dx/dist;

    const ny=
        dy/dist;


    const rvx=
        b.vx-a.vx;

    const rvy=
        b.vy-a.vy;


    const relative=
        rvx*nx+
        rvy*ny;


    if(
        relative&lt;0
    ){

        const impulse=
            (
                2*
                relative
            )/
            (
                a.mass+
                b.mass
            );


        a.vx+=
            impulse*
            b.mass*
            nx;

        a.vy+=
            impulse*
            b.mass*
            ny;


        b.vx-=
            impulse*
            a.mass*
            nx;

        b.vy-=
            impulse*
            a.mass*
            ny;

    }


    /*
       Important overlap correction.

       Prevents particles from
       sticking together.
    */

    const overlap=
        minDist-
        dist;


    if(
        overlap&gt;0
    ){

        const totalMass=
            a.mass+
            b.mass;


        const moveA=
            overlap*
            b.mass/
            totalMass;


        const moveB=
            overlap*
            a.mass/
            totalMass;


        a.x-=
            nx*
            moveA;

        a.y-=
            ny*
            moveA;


        b.x+=
            nx*
            moveB;

        b.y+=
            ny*
            moveB;

    }

}


/* =========================================================
   DIFFUSION
========================================================= */

function updateDiffusion(){

    const mobile=
        particles.filter(
            p=&gt;
                !p.lattice
        );


    const steps=
        mobile.some(
            p=&gt;
                p.phase===&quot;gas&quot;
        )
        ?
        3
        :
        2;


    for(
        let s=0;
        s&lt;steps;
        s++
    ){

        mobile.forEach(
            p=&gt;{

                p.x+=
                    p.vx/
                    steps;

                p.y+=
                    p.vy/
                    steps;


                wallCollision(p);

                solidBarrierCollision(p);

            }
        );


        for(
            let i=0;
            i&lt;mobile.length;
            i++
        ){

            for(
                let j=i+1;
                j&lt;mobile.length;
                j++
            ){

                particleCollision(
                    mobile[i],
                    mobile[j]
                );

            }

        }

    }


    particles.forEach(
        p=&gt;{

            if(
                p.lattice
            ){

                updateSolidParticle(p);

            }

        }
    );

}


/* =========================================================
   EFFUSION
========================================================= */

function updateEffusion(){

    const gasExists=
        particles.some(
            p=&gt;
                p.phase===&quot;gas&quot;
        );


    if(
        !gasExists
    )
        return;


    const b=bounds();

    const openingTop=270;

    const openingBottom=340;


    particles.forEach(
        p=&gt;{

            if(
                p.lattice
            ){

                updateSolidParticle(p);

                return;

            }


            p.x+=p.vx;

            p.y+=p.vy;


            wallCollision(p);


            /*
               Centre wall with opening.
            */

            if(
                p.x+p.radius&gt;
                b.middle &amp;&amp;
                p.y&lt;openingTop
            ){

                p.x=
                    b.middle-
                    p.radius;

                p.vx=
                    -Math.abs(
                        p.vx
                    );

            }


            if(
                p.x+p.radius&gt;
                b.middle &amp;&amp;
                p.y&gt;openingBottom
            ){

                p.x=
                    b.middle-
                    p.radius;

                p.vx=
                    -Math.abs(
                        p.vx
                    );

            }

        }
    );


    const mobile=
        particles.filter(
            p=&gt;
                !p.lattice
        );


    for(
        let i=0;
        i&lt;mobile.length;
        i++
    ){

        for(
            let j=i+1;
            j&lt;mobile.length;
            j++
        ){

            particleCollision(
                mobile[i],
                mobile[j]
            );

        }

    }

}


/* =========================================================
   DISSOLUTION
========================================================= */

function updateDissolution(){

    const mobile=
        particles.filter(
            p=&gt;
                !p.lattice
        );


    const crystal=
        particles.filter(
            p=&gt;
                p.lattice &amp;&amp;
                p.active
        );


    const heatFactor=
        Math.max(
            .05,
            temperatureFactor()
        );


    const dissolutionProbability=
        .0007*
        heatFactor;


    for(
        const p of crystal
    ){

        let blockedAbove=false;


        for(
            const q of crystal
        ){

            if(
                q===p
            )
                continue;


            if(
                Math.abs(
                    q.x-p.x
                )&lt;8 &amp;&amp;
                q.y&lt;p.y &amp;&amp;
                Math.abs(
                    q.y-p.y
                )&lt;11
            ){

                blockedAbove=true;

                break;

            }

        }


        let liquidNear=false;


        for(
            const q of mobile
        ){

            if(
                q.phase!==&quot;liquid&quot;
            )
                continue;


            const dx=
                q.x-p.x;

            const dy=
                q.y-p.y;


            if(
                dx*dx+
                dy*dy&lt;
                22*22
            ){

                liquidNear=true;

                break;

            }

        }


        if(
            !blockedAbove &amp;&amp;
            liquidNear &amp;&amp;
            Math.random()&lt;
            dissolutionProbability
        ){

            dissolveParticle(p);

        }

    }


    mobile.forEach(
        p=&gt;{

            p.x+=p.vx;

            p.y+=p.vy;


            wallCollision(p);

        }
    );


    mobile.forEach(
        p=&gt;
            solidBarrierCollision(p)
    );


    for(
        let i=0;
        i&lt;mobile.length;
        i++
    ){

        for(
            let j=i+1;
            j&lt;mobile.length;
            j++
        ){

            particleCollision(
                mobile[i],
                mobile[j]
            );

        }

    }


    particles.forEach(
        p=&gt;{

            if(
                p.lattice &amp;&amp;
                p.active
            ){

                updateSolidParticle(p);

            }

        }
    );


    if(
        crystalParticles===0
    ){

        document.getElementById(
            &quot;status&quot;
        ).innerHTML=
        &quot;⚖️ &lt;b&gt;Dissolution complete.&lt;/b&gt; The solute is dispersed throughout the liquid.&quot;;

    }
    else if(
        dissolvedCount&gt;0
    ){

        document.getElementById(
            &quot;status&quot;
        ).innerHTML=
        &quot;🍬 &lt;b&gt;Dissolution occurring.&lt;/b&gt; Solute molecules are leaving the crystal and dispersing through the liquid.&quot;;

    }

}


/* =========================================================
   DISSOLVE PARTICLE
========================================================= */

function dissolveParticle(p){

    p.lattice=false;

    p.phase=&quot;dissolved&quot;;

    p.type=&quot;dissolved&quot;;

    p.radius=3.7;

    p.color=&quot;#ffd25c&quot;;


    const angle=
        Math.random()*
        Math.PI*2;


    const speed=
        baseSpeed({

            mass:A.mass,

            phase:&quot;liquid&quot;

        })*
        1.4;


    p.vx=
        Math.cos(angle)*
        speed;

    p.vy=
        Math.sin(angle)*
        speed;


    dissolvedCount++;

    crystalParticles--;

}


/* =========================================================
   UPDATE PARTICLE SPEEDS
========================================================= */

function updateParticleSpeeds(){

    particles.forEach(
        p=&gt;{

            if(
                p.lattice
            )
                return;


            const phase=
                p.phase===&quot;dissolved&quot;
                ?
                &quot;liquid&quot;
                :
                p.phase;


            const speed=
                baseSpeed({

                    mass:p.mass,

                    phase:phase

                });


            const current=
                Math.sqrt(
                    p.vx*p.vx+
                    p.vy*p.vy
                );


            if(
                current&gt;.001
            ){

                p.vx=
                    p.vx/
                    current*
                    speed;

                p.vy=
                    p.vy/
                    current*
                    speed;

            }

        }
    );

}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(
        !running ||
        paused
    )
        return;


    if(
        process===&quot;diffusion&quot;
    ){

        updateDiffusion();

    }
    else if(
        process===&quot;effusion&quot;
    ){

        updateEffusion();

    }
    else if(
        process===&quot;dissolution&quot;
    ){

        updateDissolution();

    }

}


/* =========================================================
   DRAW CHAMBER
========================================================= */

function drawChamber(){

    const b=bounds();


    /*
       Chamber background
    */

    ctx.fillStyle=
        &quot;rgba(30,100,170,.035)&quot;;


    ctx.fillRect(
        b.left,
        b.top,
        b.right-b.left,
        b.bottom-b.top
    );


    /*
       DIFFUSION DIVIDER

       This divider remains visible
       initially so students can clearly
       identify the two containers.

       Particles can later diffuse across
       this interface.
    */

    if(
        process===&quot;diffusion&quot;
    ){

        ctx.strokeStyle=
            &quot;rgba(255,255,255,.22)&quot;;

        ctx.lineWidth=2;

        ctx.setLineDash(
            [8,8]
        );


        ctx.beginPath();

        ctx.moveTo(
            b.middle,
            b.top
        );

        ctx.lineTo(
            b.middle,
            b.bottom
        );

        ctx.stroke();

        ctx.setLineDash([]);

    }


    /*
       EFFUSION WALL
    */

    if(
        process===&quot;effusion&quot;
    ){

        const openingTop=270;

        const openingBottom=340;


        ctx.strokeStyle=
            &quot;#79d6ff&quot;;

        ctx.lineWidth=7;


        ctx.beginPath();

        ctx.moveTo(
            b.middle,
            b.top
        );

        ctx.lineTo(
            b.middle,
            openingTop
        );


        ctx.moveTo(
            b.middle,
            openingBottom
        );

        ctx.lineTo(
            b.middle,
            b.bottom
        );

        ctx.stroke();


        ctx.fillStyle=
            &quot;#ffc45d&quot;;


        ctx.fillRect(
            b.middle-3,
            openingTop,
            6,
            openingBottom-openingTop
        );


        ctx.fillStyle=
            &quot;#ffc45d&quot;;

        ctx.font=
            &quot;bold 13px Arial&quot;;


        ctx.fillText(
            &quot;SMALL OPENING&quot;,
            b.middle-57,
            openingTop-13
        );

    }


    /*
       Labels
    */

    ctx.font=
        &quot;bold 17px Arial&quot;;


    if(
        process===&quot;dissolution&quot;
    ){

        ctx.fillStyle=
            B.color;


        ctx.fillText(
            B.name+
            &quot; — SOLVENT&quot;,
            85,
            55
        );


        ctx.fillStyle=
            A.color;


        ctx.fillText(
            A.name+
            &quot; — SOLUTE&quot;,
            790,
            55
        );

    }
    else{

        ctx.fillStyle=
            A.color;


        ctx.fillText(
            &quot;A: &quot;+
            A.name+
            &quot; (&quot;+
            A.formula+
            &quot;)&quot;,
            80,
            55
        );


        ctx.fillStyle=
            B.color;


        ctx.fillText(
            &quot;B: &quot;+
            B.name+
            &quot; (&quot;+
            B.formula+
            &quot;)&quot;,
            770,
            55
        );

    }


    /*
       Container labels
    */

    if(
        process===&quot;diffusion&quot;
    ){

        ctx.font=
            &quot;12px Arial&quot;;


        ctx.fillStyle=
            &quot;rgba(255,255,255,.55)&quot;;


        ctx.fillText(
            &quot;CONTAINER A&quot;,
            75,
            110
        );


        ctx.fillText(
            &quot;CONTAINER B&quot;,
            935,
            110
        );

    }


    /*
       Border
    */

    ctx.strokeStyle=
        &quot;rgba(120,210,255,.75)&quot;;

    ctx.lineWidth=3;


    ctx.strokeRect(
        b.left,
        b.top,
        b.right-b.left,
        b.bottom-b.top
    );

}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

    particles.forEach(
        p=&gt;{

            if(
                !p.active
            )
                return;


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI*2
            );


            ctx.fillStyle=
                p.color;


            if(
                p.phase===&quot;gas&quot;
            ){

                ctx.shadowBlur=9;

            }
            else if(
                p.phase===&quot;dissolved&quot;
            ){

                ctx.shadowBlur=7;

            }
            else{

                ctx.shadowBlur=3;

            }


            ctx.shadowColor=
                p.color;


            ctx.fill();


            ctx.shadowBlur=0;

        }
    );

}

   DISSOLUTION VISUAL
========================================================= */

function drawDissolutionInfo(){

    if(
        process!==&quot;dissolution&quot;

    ctx.fillStyle=

    );

}

/* =========================================================
   STATE
========================================================= */

function getState(){

    if(
        process===&quot;dissolution&quot;
    ){

        if(
            dissolvedCount===0
        )
            return &quot;Not started&quot;;


        if(
            crystalParticles===0
        )
            return &quot;Complete&quot;;


        return &quot;Dissolving&quot;;

    }


    if(
        process===&quot;effusion&quot;
    ){

        return &quot;Effusion&quot;;

    }


    const b=bounds();


    let leftA=0;

    let rightA=0;

    let leftTotal=0;

    let rightTotal=0;


    particles.forEach(
        p=&gt;{

            if(
                p.lattice
            )
                return;


            if(
                p.x&lt;
                b.middle
            ){

                leftTotal++;


                if(
                    p.type===&quot;A&quot;
                )
                    leftA++;

            }
            else{

                rightTotal++;


                if(
                    p.type===&quot;A&quot;
                )
                    rightA++;

            }

        }
    );


    if(
        leftTotal===0 ||
        rightTotal===0
    ){

        return &quot;Separated&quot;;

    }


    const leftRatio=
        leftA/
        leftTotal;


    const rightRatio=
        rightA/
        rightTotal;


    const difference=
        Math.abs(
            leftRatio-
            rightRatio
        );


    if(
        difference&lt;.10
    )
        return &quot;Dynamic Equilibrium&quot;;


    if(
        difference&lt;.25
    )
        return &quot;Approaching Equilibrium&quot;;


    return &quot;Diffusing&quot;;

}

/* =========================================================
   MIX
========================================================= */

function mixSystem(){

    const b=bounds();


    particles.forEach(
        p=&gt;{

            if(
                p.lattice
            )
                return;


            /*
               Once Mix is pressed,
               the original container
               restriction is intentionally
               removed.

               This allows diffusion.
            */

            p.container=
                null;


            p.x=
                b.left+
                15+
                Math.random()*
                (
                    b.right-
                    b.left-
                    30
                );


            p.y=
                b.top+
                15+
                Math.random()*
                (
                    b.bottom-
                    b.top-
                    30
                );


            const phase=
                p.phase===&quot;dissolved&quot;
                ?
                &quot;liquid&quot;
                :
                p.phase;


            const speed=
                baseSpeed({

                    mass:p.mass,

                    phase:phase

                });


            const angle=
                Math.random()*
                Math.PI*2;


            p.vx=
                Math.cos(angle)*
                speed;

            p.vy=
                Math.sin(angle)*
                speed;

        }
    );


    running=true;

    paused=false;


    document.getElementById(
        &quot;status&quot;
    ).innerHTML=
    &quot;🔀 &lt;b&gt;Particles mixed.&lt;/b&gt;&quot;;

}

);

document.getElementById(

    function(){

        concentration=

  </div>
</div>

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
