  }

    position: fixed; inset: 0; width: 100%; height: 100dvh;
    overflow: hidden; background: #070b14;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  #appStage {
    width: 1280px;
    height: 720px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform-style: flat;
  }

  #appStage iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  /* FLOATING MOBILE NAVIGATION, PAN & ZOOM BAR */
  .nav-overlay-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99990;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;
    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

  /* UNHIDE TRIGGER BUTTON */
  .nav-toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 99989;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    display: none; place-items: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .nav-toggle-btn.visible {
    display: grid !important;
  }

  .rotate-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(20px) saturate(180%);

    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }
  .rotate-card {
    width: min(440px, 90vw); padding: 36px 28px; border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);

    padding: 4px 12px; border-radius: 99px;
    background: rgba(123, 209, 255, 0.12); border: 1px solid rgba(123, 209, 255, 0.3);
    color: #7bd1ff; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;

  .rotate-icon-wrap {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;
    animation: phoneRotate 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff, #a7b3d8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {
    margin: 0; color: #94a3b8; font-size: 0.92rem; line-height: 1.5; font-weight: 450;

  .btn-rotate {

  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>

                        &lt;input id=&quot;toggle-umbra&quot; type=&quot;checkbox&quot; checked class=&quot;accent-amber-500 w-4 h-4 cursor-pointer&quot;&gt;
                    &lt;/label&gt;
                    &lt;label class=&quot;flex items-center justify-between text-xs cursor-pointer hover:text-amber-300 transition-all&quot;&gt;
                        &lt;span class=&quot;flex items-center gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-circle text-blue-500/30 border border-blue-500 bg-blue-950 rounded p-1 text-[7px] w-5 text-center&quot;&gt;&lt;/i&gt; Show Penumbra Zone&lt;/span&gt;
                        &lt;input id=&quot;toggle-penumbra&quot; type=&quot;checkbox&quot; checked class=&quot;accent-amber-500 w-4 h-4 cursor-pointer&quot;&gt;
                    &lt;/label&gt;
                    &lt;label class=&quot;flex items-center justify-between text-xs cursor-pointer hover:text-amber-300 transition-all&quot;&gt;
                        &lt;span class=&quot;flex items-center gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-circle text-rose-500/30 border border-rose-500 bg-rose-950 rounded p-1 text-[7px] w-5 text-center&quot;&gt;&lt;/i&gt; Show Antumbra Zone&lt;/span&gt;
                        &lt;input id=&quot;toggle-antumbra&quot; type=&quot;checkbox&quot; checked class=&quot;accent-amber-500 w-4 h-4 cursor-pointer&quot;&gt;
                    &lt;/label&gt;
                    &lt;label class=&quot;flex items-center justify-between text-xs cursor-pointer hover:text-amber-300 transition-all&quot;&gt;
                        &lt;span class=&quot;flex items-center gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-bezier-curve text-amber-400 text-xs w-5 text-center&quot;&gt;&lt;/i&gt; Show Light Path Rays&lt;/span&gt;
                        &lt;input id=&quot;toggle-rays&quot; type=&quot;checkbox&quot; checked class=&quot;accent-amber-500 w-4 h-4 cursor-pointer&quot;&gt;
                    &lt;/label&gt;
                    &lt;label class=&quot;flex items-center justify-between text-xs cursor-pointer hover:text-amber-300 transition-all&quot;&gt;
                        &lt;span class=&quot;flex items-center gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-tags text-slate-400 text-xs w-5 text-center&quot;&gt;&lt;/i&gt; Show Entity Labels&lt;/span&gt;
                        &lt;input id=&quot;toggle-labels&quot; type=&quot;checkbox&quot; checked class=&quot;accent-amber-500 w-4 h-4 cursor-pointer&quot;&gt;
                    &lt;/label&gt;
                    &lt;label class=&quot;flex items-center justify-between text-xs cursor-pointer hover:text-amber-300 transition-all&quot;&gt;
                        &lt;span class=&quot;flex items-center gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-circle-notch text-slate-400 text-xs w-5 text-center&quot;&gt;&lt;/i&gt; Show Orbit Guideline&lt;/span&gt;
                        &lt;input id=&quot;toggle-guideline&quot; type=&quot;checkbox&quot; checked class=&quot;accent-amber-500 w-4 h-4 cursor-pointer&quot;&gt;
                    &lt;/label&gt;
                &lt;/div&gt;
            &lt;/div&gt;

        &lt;/div&gt;

        &lt;!-- Left Sidebar Explainer Footer --&gt;
        &lt;div class=&quot;p-5 border-t border-slate-800/80 bg-slate-950/80 shrink-0&quot;&gt;
            &lt;h2 id=&quot;explain-header&quot; class=&quot;font-bold text-xs text-amber-400 mb-1.5 flex items-center gap-2 header-font&quot;&gt;
                &lt;i class=&quot;fa-solid fa-microscope text-sm&quot;&gt;&lt;/i&gt; REAL-TIME EXPLICER
            &lt;/h2&gt;
            &lt;p id=&quot;explain-body&quot; class=&quot;text-xs text-slate-400 leading-relaxed&quot;&gt;
                Select an eclipse preset above to align the system. Pause orbital motion at any moment to rotate/pinch to zoom and inspect how light intersections form physical shadow cones.
            &lt;/p&gt;
        &lt;/div&gt;
    &lt;/aside&gt;

    &lt;!-- Main Space Simulation Area --&gt;
    &lt;main class=&quot;flex-1 w-full h-screen relative overflow-hidden&quot;&gt;
        
        &lt;!-- WebGL Canvas Container --&gt;
        &lt;div id=&quot;canvas-container&quot; class=&quot;w-full h-full relative bg-[#020203]&quot;&gt;
            
            &lt;!-- Asset Loading Screen Overlay --&gt;
            &lt;div id=&quot;loader&quot; class=&quot;absolute inset-0 flex flex-col items-center justify-center bg-[#030306]/95 z-30 transition-opacity duration-700&quot;&gt;
                &lt;div class=&quot;relative w-16 h-16 mb-4&quot;&gt;
                    &lt;div class=&quot;absolute inset-0 rounded-full border-4 border-slate-900&quot;&gt;&lt;/div&gt;
                    &lt;div class=&quot;absolute inset-0 rounded-full border-4 border-t-amber-500 border-r-rose-500 animate-spin&quot;&gt;&lt;/div&gt;
                &lt;/div&gt;
                &lt;h3 class=&quot;font-semibold text-sm header-font tracking-widest text-slate-200&quot;&gt;PROCEDURALLY TEXTURING THE COSMOS...&lt;/h3&gt;
                &lt;p class=&quot;text-[11px] text-slate-500 mt-1&quot;&gt;Generating high-fidelity vector maps and stellar vectors&lt;/p&gt;
            &lt;/div&gt;

            &lt;!-- Interactivity Hints HUD (Lower Right) --&gt;
            &lt;div class=&quot;absolute bottom-5 right-5 z-20 flex flex-col items-end gap-2 pointer-events-none&quot;&gt;
                &lt;div class=&quot;glass-panel px-3 py-2 rounded-xl text-[10px] font-bold tracking-widest text-emerald-400 flex items-center gap-2 shadow-lg&quot;&gt;
                    &lt;span class=&quot;w-2 h-2 rounded-full bg-emerald-500 animate-pulse inline-block&quot;&gt;&lt;/span&gt;
                    WEBGL ACTIVE RENDERING
                &lt;/div&gt;
                &lt;div id=&quot;navigation-hint&quot; class=&quot;glass-panel px-3 py-2 rounded-xl text-[10px] text-slate-400 flex items-center gap-2 shadow-lg&quot;&gt;
                    &lt;i class=&quot;fa-solid fa-arrows-to-eye text-amber-500&quot;&gt;&lt;/i&gt;
                    &lt;span&gt;Interact anywhere to toggle Fullscreen | Drag to rotate | Scroll/Pinch to zoom&lt;/span&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- Dynamic Alert Notifications Floating Panel --&gt;
            &lt;div class=&quot;absolute top-5 right-5 z-20 flex flex-col gap-4 pointer-events-none max-w-sm&quot;&gt;
                
                &lt;!-- Atmospheric Scattering (Blood Moon) Alert Overlay --&gt;
                &lt;div id=&quot;scattering-alert&quot; class=&quot;glass-panel p-4 rounded-2xl hidden items-center gap-4 border-red-500/30 bg-red-950/20 shadow-xl transition-all duration-300&quot;&gt;
                    &lt;div class=&quot;w-11 h-11 rounded-xl bg-red-900/30 flex items-center justify-center border border-red-500/40 shrink-0&quot;&gt;
                        &lt;i class=&quot;fa-solid fa-circle-radiation text-red-500 animate-pulse text-lg&quot;&gt;&lt;/i&gt;
                    &lt;/div&gt;
                    &lt;div&gt;
                        &lt;h2 class=&quot;text-[9px] uppercase font-bold tracking-widest text-red-400&quot;&gt;Rayleigh Scattering Active&lt;/h2&gt;
                        &lt;p id=&quot;scattering-desc&quot; class=&quot;text-[11px] text-slate-300 leading-snug&quot;&gt;Earth&#39;s atmosphere filters shortwave blue light, refracting red wavelengths into the Umbra, transforming the Moon deep crimson!&lt;/p&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;!-- Eclipse Classification Panel (Annular vs Total) --&gt;
                &lt;div id=&quot;eclipse-type-panel&quot; class=&quot;glass-panel p-4 rounded-2xl hidden items-center gap-4 border-amber-500/20 bg-amber-950/10 shadow-xl transition-all duration-300&quot;&gt;
                    &lt;div class=&quot;w-11 h-11 rounded-xl bg-amber-900/30 flex items-center justify-center border border-amber-500/40 shrink-0&quot;&gt;
                        &lt;i class=&quot;fa-solid fa-star text-amber-400 text-lg&quot;&gt;&lt;/i&gt;
                    &lt;/div&gt;
                    &lt;div&gt;
                        &lt;h2 class=&quot;text-[9px] uppercase font-bold tracking-widest text-amber-400&quot;&gt;Alignment Status&lt;/h2&gt;
                        &lt;p id=&quot;eclipse-type-desc&quot; class=&quot;text-[11px] text-slate-200 font-bold leading-snug&quot;&gt;Verifying geometries...&lt;/p&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- Insertion target container for ThreeJS renderer --&gt;
            &lt;div id=&quot;canvas-3d&quot; class=&quot;w-full h-full cursor-grab active:cursor-grabbing&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;

    &lt;/main&gt;

    &lt;script&gt;
        const container = document.getElementById(&#39;canvas-3d&#39;);
        const loader = document.getElementById(&#39;loader&#39;);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020204);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
        camera.position.set(40, 60, 115);

        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // OrbitControls for mouse &amp; touch orbital adjustments
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 450;
        controls.minDistance = 15;

        // Dynamic vector textures generated instantly to bypass external image dependencies
        function createEarthTexture() {
            const canvas = document.createElement(&#39;canvas&#39;);
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext(&#39;2d&#39;);
            
            ctx.fillStyle = &#39;#0a1a36&#39;;
            ctx.fillRect(0, 0, 1024, 512);
            
            ctx.fillStyle = &#39;#1c3e1e&#39;;
            const seedNodes = 22;
            for (let i = 0; i &lt; seedNodes; i++) {
                const cx = (i / seedNodes) * 1024 + (Math.random() - 0.5) * 60;
                const cy = 120 + Math.random() * 272;
                const radius = 90 + Math.random() * 110;
                
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = &#39;#102d13&#39;;
                ctx.beginPath();
                ctx.arc(cx + (Math.random() - 0.5) * 50, cy + (Math.random() - 0.5) * 50, radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = &#39;#1c3e1e&#39;;
            }
            
            ctx.fillStyle = &#39;#564d39&#39;;
            for (let i = 0; i &lt; 30; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, 180 + Math.random() * 152, Math.random() * 30 + 10, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = &#39;rgba(255, 255, 255, 0.4)&#39;;
            for (let i = 0; i &lt; 50; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 100 + 40, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createMoonTexture() {
            const canvas = document.createElement(&#39;canvas&#39;);
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext(&#39;2d&#39;);
            
            ctx.fillStyle = &#39;#6e6e6e&#39;;
            ctx.fillRect(0, 0, 512, 256);
            
            ctx.fillStyle = &#39;#525252&#39;;
            for (let i = 0; i &lt; 10; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 50 + 20, 0, Math.PI * 2);
                ctx.fill();
            }
            
            for (let i = 0; i &lt; 60; i++) {
                const cx = Math.random() * 512;
                const cy = Math.random() * 256;
                const r = Math.random() * 10 + 2;
                
                ctx.fillStyle = &#39;#3a3a3a&#39;;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = &#39;#919191&#39;;
                ctx.lineWidth = r * 0.15;
                ctx.beginPath();
                ctx.arc(cx - r*0.1, cy - r*0.1, r, 0, Math.PI * 2);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createSunTexture() {
            const canvas = document.createElement(&#39;canvas&#39;);
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext(&#39;2d&#39;);
            
            ctx.fillStyle = &#39;#ffdf33&#39;;
            ctx.fillRect(0, 0, 512, 256);
            
            for (let i = 0; i &lt; 50; i++) {
                ctx.fillStyle = &#39;rgba(255, 61, 0, 0.4)&#39;;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 40 + 10, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // Space geometry metrics
        const SUN_DIST = 150;
        const EARTH_RADIUS = 8.5;
        const SUN_RADIUS = 20;
        
        let MOON_RADIUS = 2.2;
        let MOON_ORBIT_DIST = 22.0;
        let INCLINATION = 5.1 * (Math.PI / 180);
        let speedMultiplier = 1.0;
        let isPaused = false;
        let currentMode = &#39;free&#39;; 
        let theta = Math.PI; 

        const earthTex = createEarthTexture();
        const moonTex = createMoonTexture();
        const sunTex = createSunTexture();

        // Sun Mesh
        const sunGeo = new THREE.SphereGeometry(SUN_RADIUS, 48, 48);
        const sunMat = new THREE.MeshBasicMaterial({ map: sunTex, color: 0xffffff });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.position.set(-SUN_DIST, 0, 0);
        scene.add(sunMesh);

        // Earth Mesh
        const earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, 48, 48);
        const earthMat = new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.7, metalness: 0.1 });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        earthMesh.castShadow = true;
        earthMesh.receiveShadow = true;
        scene.add(earthMesh);

        // Volumetric atmospheric halo
        const atmosGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.08, 48, 48);
        const atmosMat = new THREE.MeshBasicMaterial({
            color: 0x4fa8ff,
            transparent: true,
            opacity: 0.35,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
        scene.add(atmosMesh);

        // Moon Mesh
        const moonGeo = new THREE.SphereGeometry(MOON_RADIUS, 32, 32);
        const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.85, metalness: 0.05 });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.castShadow = true;
        moonMesh.receiveShadow = true;
        scene.add(moonMesh);

        // Umbra and Penumbra lighting points
        const solarLight = new THREE.PointLight(0xffffff, 2.8, 800, 0.4);
        solarLight.position.set(-SUN_DIST, 0, 0);
        solarLight.castShadow = true;
        solarLight.shadow.mapSize.width = 4096;
        solarLight.shadow.mapSize.height = 4096;
        solarLight.shadow.camera.near = 50;
        solarLight.shadow.camera.far = 400;
        solarLight.shadow.bias = -0.0003;
        scene.add(solarLight);

        const stellarLight = new THREE.AmbientLight(0x0b0d13, 0.2);
        scene.add(stellarLight);

        // Orbital line path
        const orbitCurve = new THREE.EllipseCurve(0, 0, MOON_ORBIT_DIST, MOON_ORBIT_DIST);
        const orbitPoints = orbitCurve.getPoints(128);
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints.map(p =&gt; new THREE.Vector3(p.x, 0, p.y)));
        const orbitMat = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.2 });
        const orbitGuideline = new THREE.LineLoop(orbitGeo, orbitMat);
        scene.add(orbitGuideline);

        // Starfield background
        const starGeo = new THREE.BufferGeometry();
        const starCount = 2000;
        const starCoords = new Float32Array(starCount * 3);
        for (let i = 0; i &lt; starCount * 3; i += 3) {
            const r = 350 + Math.random() * 450;
            const u = Math.random();
            const v = Math.random();
            const thetaLocal = u * 2.0 * Math.PI;
            const phiLocal = Math.acos(2.0 * v - 1.0);
            
            starCoords[i] = r * Math.sin(phiLocal) * Math.cos(thetaLocal);
            starCoords[i+1] = r * Math.sin(phiLocal) * Math.sin(thetaLocal);
            starCoords[i+2] = r * Math.cos(phiLocal);
        }
        starGeo.setAttribute(&#39;position&#39;, new THREE.BufferAttribute(starCoords, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.85, transparent: true, opacity: 0.75 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // Volumetric shadow cones structure
        const shadowConesGroup = new THREE.Group();
        scene.add(shadowConesGroup);

        let umbraMesh, penumbraMesh, antumbraMesh;

        function rebuildShadowCones() {
            while(shadowConesGroup.children.length &gt; 0) {
                const child = shadowConesGroup.children[0];
                shadowConesGroup.remove(child);
                child.geometry.dispose();
                child.material.dispose();
            }

            const targetRadius = (currentMode === &#39;solar&#39;) ? MOON_RADIUS : EARTH_RADIUS;
            const distance = (currentMode === &#39;solar&#39;) ? (SUN_DIST - MOON_ORBIT_DIST) : SUN_DIST;
            const umbraLength = (targetRadius * distance) / (SUN_RADIUS - targetRadius);

            // A. Umbra dark cone
            const umbraGeo = new THREE.CylinderGeometry(0, targetRadius, umbraLength, 32, 1, true);
            const umbraMat = new THREE.MeshBasicMaterial({
                color: 0x010102,
                transparent: true,
                opacity: 0.75,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.NormalBlending
            });
            umbraMesh = new THREE.Mesh(umbraGeo, umbraMat);
            umbraMesh.rotation.x = Math.PI / 2;
            umbraMesh.position.z = umbraLength / 2;
            shadowConesGroup.add(umbraMesh);

            // B. Antumbra copper cone
            const antumbraLength = 160; 
            const antumbraSlope = targetRadius / umbraLength;
            const antumbraOuterRadius = antumbraSlope * antumbraLength;

            const antumbraGeo = new THREE.CylinderGeometry(antumbraOuterRadius, 0, antumbraLength, 32, 1, true);
            const antumbraMat = new THREE.MeshBasicMaterial({
                color: 0x4a1205, 
                transparent: true,
                opacity: 0.35,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            antumbraMesh = new THREE.Mesh(antumbraGeo, antumbraMat);
            antumbraMesh.rotation.x = Math.PI / 2;
            antumbraMesh.position.z = umbraLength + (antumbraLength / 2);
            shadowConesGroup.add(antumbraMesh);

            // C. Penumbra outer cone
            const penumbraApexDistance = (targetRadius * distance) / (SUN_RADIUS + targetRadius);
            const penumbraLength = distance + 150; 
            const penumbraSlope = targetRadius / penumbraApexDistance;
            const penumbraOuterRadius = targetRadius + (penumbraLength * penumbraSlope);

            const penumbraGeo = new THREE.CylinderGeometry(penumbraOuterRadius, targetRadius, penumbraLength, 32, 1, true);
            const penumbraMat = new THREE.MeshBasicMaterial({
                color: 0x1d3557, 
                transparent: true,
                opacity: 0.18,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.NormalBlending
            });
            penumbraMesh = new THREE.Mesh(penumbraGeo, penumbraMat);
            penumbraMesh.rotation.x = Math.PI / 2;
            penumbraMesh.position.z = penumbraLength / 2;
            shadowConesGroup.add(penumbraMesh);
        }

        rebuildShadowCones();

        // Light tracking ray lines
        const rayLinesGroup = new THREE.Group();
        scene.add(rayLinesGroup);

        function rebuildLightPathRays() {
            while(rayLinesGroup.children.length &gt; 0) {
                const child = rayLinesGroup.children[0];
                rayLinesGroup.remove(child);
                child.geometry.dispose();
                child.material.dispose();
            }

            const targetRadius = (currentMode === &#39;solar&#39;) ? MOON_RADIUS : EARTH_RADIUS;
            const targetPos = (currentMode === &#39;solar&#39;) ? moonMesh.position : earthMesh.position;
            const distance = (currentMode === &#39;solar&#39;) ? (SUN_DIST - MOON_ORBIT_DIST) : SUN_DIST;

            const umbraLength = (targetRadius * distance) / (SUN_RADIUS - targetRadius);
            const apexZ = targetPos.x + umbraLength;

            const sunTop = new THREE.Vector3(-SUN_DIST, 0, SUN_RADIUS);
            const sunBottom = new THREE.Vector3(-SUN_DIST, 0, -SUN_RADIUS);
            const targetTop = new THREE.Vector3(targetPos.x, 0, targetRadius);
            const targetBottom = new THREE.Vector3(targetPos.x, 0, -targetRadius);
            const apexPoint = new THREE.Vector3(apexZ, 0, 0);

            const neonMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.4 });

            const geoOuter1 = new THREE.BufferGeometry().setFromPoints([sunTop, targetTop, apexPoint]);
            rayLinesGroup.add(new THREE.Line(geoOuter1, neonMat));

            const geoOuter2 = new THREE.BufferGeometry().setFromPoints([sunBottom, targetBottom, apexPoint]);
            rayLinesGroup.add(new THREE.Line(geoOuter2, neonMat));

            const extX = targetPos.x + 100;
            const slopeCrossing = (SUN_RADIUS + targetRadius) / distance;
            const extY_Inner1 = -targetRadius - (100 * slopeCrossing);
            const geoCrossing1 = new THREE.BufferGeometry().setFromPoints([sunTop, targetBottom, new THREE.Vector3(extX, 0, extY_Inner1)]);
            rayLinesGroup.add(new THREE.Line(geoCrossing1, neonMat));

            const extY_Inner2 = targetRadius + (100 * slopeCrossing);
            const geoCrossing2 = new THREE.BufferGeometry().setFromPoints([sunBottom, targetTop, new THREE.Vector3(extX, 0, extY_Inner2)]);
            rayLinesGroup.add(new THREE.Line(geoCrossing2, neonMat));
        }

        // Floating dynamic entity billboard labels
        const labelGroup = new THREE.Group();
        scene.add(labelGroup);

        function createBillboardLabel(text, color) {
            const canvas = document.createElement(&#39;canvas&#39;);
            canvas.width = 256;
            canvas.height = 72;
            const ctx = canvas.getContext(&#39;2d&#39;);

            ctx.fillStyle = &#39;rgba(10, 10, 18, 0.85)&#39;;
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(4, 4, 248, 64, 16);
            } else {
                const x = 4, y = 4, w = 248, h = 64, r = 16;
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
            }
            ctx.fill();

            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.font = &#39;bold 24px Inter, sans-serif&#39;;
            ctx.fillStyle = &#39;#f8fafc&#39;;
            ctx.textAlign = &#39;center&#39;;
            ctx.textBaseline = &#39;middle&#39;;
            ctx.shadowColor = &#39;rgba(0,0,0,0.8)&#39;;
            ctx.shadowBlur = 4;
            ctx.fillText(text, 128, 36);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(16, 4.5, 1);
            return sprite;
        }

        const sunLabel = createBillboardLabel(&quot;SUN&quot;, &quot;#f59e0b&quot;);
        const earthLabel = createBillboardLabel(&quot;EARTH&quot;, &quot;#3b82f6&quot;);
        const moonLabel = createBillboardLabel(&quot;MOON&quot;, &quot;#94a3b8&quot;);
        const umbraLabel = createBillboardLabel(&quot;UMBRA&quot;, &quot;#0c0a09&quot;);
        const penumbraLabel = createBillboardLabel(&quot;PENUMBRA&quot;, &quot;#3b82f6&quot;);
        const antumbraLabel = createBillboardLabel(&quot;ANTUMBRA&quot;, &quot;#ef4444&quot;);

        labelGroup.add(sunLabel, earthLabel, moonLabel, umbraLabel, penumbraLabel, antumbraLabel);

        function updateLabelsPosition() {
            sunLabel.position.set(-SUN_DIST, SUN_RADIUS + 8, 0);
            earthLabel.position.set(0, EARTH_RADIUS + 8, 0);
            moonLabel.position.set(moonMesh.position.x, moonMesh.position.y + MOON_RADIUS + 5, moonMesh.position.z);
            
            const activeCasterX = (currentMode === &#39;solar&#39;) ? moonMesh.position.x : 0;
            const activeCasterRad = (currentMode === &#39;solar&#39;) ? MOON_RADIUS : EARTH_RADIUS;
            const distance = (currentMode === &#39;solar&#39;) ? (SUN_DIST - MOON_ORBIT_DIST) : SUN_DIST;
            const umbraLength = (activeCasterRad * distance) / (SUN_RADIUS - activeCasterRad);

            umbraLabel.position.set(activeCasterX + (umbraLength * 0.45), -activeCasterRad - 10, 0);
            penumbraLabel.position.set(activeCasterX + (umbraLength * 1.05), activeCasterRad + 16, 0);
            antumbraLabel.position.set(activeCasterX + (umbraLength * 1.6), -activeCasterRad - 10, 0);
        }

        setTimeout(() =&gt; {
            loader.style.opacity = &#39;0&#39;;
            setTimeout(() =&gt; loader.style.display = &#39;none&#39;, 700);
        }, 1200);

        // Rayleigh scattering calculation details
        const colorMoonRegular = new THREE.Color(0xa1a1aa);
        const colorBloodRed = new THREE.Color(0xef4444);
        const emissiveRed = new THREE.Color(0x450a0a);

        function updateAtmosphericScattering() {
            if (currentMode === &#39;lunar&#39;) {
                const distToShadowLine = Math.sqrt(Math.pow(moonMesh.position.y, 2) + Math.pow(moonMesh.position.z, 2));
                const umbraApexX = (EARTH_RADIUS * SUN_DIST) / (SUN_RADIUS - EARTH_RADIUS);
                
                if (moonMesh.position.x &gt; 0 &amp;&amp; moonMesh.position.x &lt; umbraApexX) {
                    const localUmbraRadius = EARTH_RADIUS * (1.0 - (moonMesh.position.x / umbraApexX));
                    
                    if (distToShadowLine &lt; localUmbraRadius) {
                        const penetrationDepth = 1.0 - (distToShadowLine / localUmbraRadius);
                        
                        moonMat.color.lerpColors(colorMoonRegular, colorBloodRed, penetrationDepth * 0.95);
                        moonMat.emissive.lerpColors(new THREE.Color(0x000000), emissiveRed, penetrationDepth * 0.85);
                        atmosMat.color.setHex(0xef4444);
                        atmosMat.opacity = 0.5;

                        document.getElementById(&#39;scattering-alert&#39;).classList.remove(&#39;hidden&#39;);
                        document.getElementById(&#39;scattering-alert&#39;).classList.add(&#39;flex&#39;);
                        return;
                    }
                }
            }
            moonMat.color.lerp(colorMoonRegular, 0.1);
            moonMat.emissive.lerp(new THREE.Color(0x000000), 0.1);
            atmosMat.color.setHex(0x4fa8ff);
            atmosMat.opacity = 0.35;
            document.getElementById(&#39;scattering-alert&#39;).classList.add(&#39;hidden&#39;);
            document.getElementById(&#39;scattering-alert&#39;).classList.remove(&#39;flex&#39;);
        }

        // Mode preset configuration
        function setSolarEclipseMode() {
            currentMode = &#39;solar&#39;;
            isPaused = true;
            theta = Math.PI; 
            animateCamera(new THREE.Vector3(25, 20, 60), new THREE.Vector3(0, 0, 0));
            updateUIState();
        }

        function setLunarEclipseMode() {
            currentMode = &#39;lunar&#39;;
            isPaused = true;
            theta = 0; 
            animateCamera(new THREE.Vector3(30, 15, 65), new THREE.Vector3(20, 0, 0));
            updateUIState();
        }

        function setFreeOrbitMode() {
            currentMode = &#39;free&#39;;
            isPaused = false;
            updateUIState();
        }

        function animateCamera(newPos, target) {
            let startPos = camera.position.clone();
            let step = 0;
            const durationSteps = 50;

            function stepAnimation() {
                if (step &lt; durationSteps) {
                    step++;
                    const t = step / durationSteps;
                    const ease = 1 - Math.pow(1 - t, 3); 
                    camera.position.lerpVectors(startPos, newPos, ease);
                    controls.target.lerp(target, ease);
                    controls.update();
                    requestAnimationFrame(stepAnimation);
                }
            }
            stepAnimation();
        }

        function updateUIState() {
            const btnSolar = document.getElementById(&#39;btn-solar-mode&#39;);
            const btnLunar = document.getElementById(&#39;btn-lunar-mode&#39;);
            const btnFree = document.getElementById(&#39;btn-free-mode&#39;);

            [btnSolar, btnLunar, btnFree].forEach(btn =&gt; {
                btn.className = btn.className.replace(/bg-\w+-500\/20 border-\w+-500\/40/g, &quot;&quot;);
            });

            const hudDesc = document.getElementById(&#39;hud-mode-desc&#39;);
            const hudIcon = document.getElementById(&#39;hud-icon&#39;);
            const explainHeader = document.getElementById(&#39;explain-header&#39;);
            const explainBody = document.getElementById(&#39;explain-body&#39;);
            const eclipseTypePanel = document.getElementById(&#39;eclipse-type-panel&#39;);

            if (currentMode === &#39;solar&#39;) {
                btnSolar.className += &quot; bg-amber-500/20 border-amber-500/40&quot;;
                hudDesc.innerText = &quot;Total / Annular Solar Alignment&quot;;
                hudIcon.className = &quot;fa-solid fa-sun text-amber-500 text-base glow-orange&quot;;
                explainHeader.innerHTML = &quot;&lt;i class=&#39;fa-solid fa-circle-radiation text-amber-400&#39;&gt;&lt;/i&gt; Solar Alignment Dynamics&quot;;
                explainBody.innerText = &quot;The Moon casts its shadow toward Earth. If the Moon is close, the Umbra cone touches Earth causing a TOTAL solar eclipse. If it is further away, the Umbra falls short, and the Earth enters the ANTUMBRA zone causing an ANNULAR &#39;Ring of Fire&#39; eclipse!&quot;;
                eclipseTypePanel.classList.remove(&#39;hidden&#39;);
                eclipseTypePanel.classList.add(&#39;flex&#39;);
            } else if (currentMode === &#39;lunar&#39;) {
                btnLunar.className += &quot; bg-red-500/20 border-red-500/40&quot;;
                hudDesc.innerText = &quot;Lunar Alignment &amp; Scattering&quot;;
                hudIcon.className = &quot;fa-solid fa-moon text-red-500 text-base glow-red&quot;;
                explainHeader.innerHTML = &quot;&lt;i class=&#39;fa-solid fa-vial text-red-400&#39;&gt;&lt;/i&gt; Rayleigh Light Scattering&quot;;
                explainBody.innerText = &quot;The Earth blocks direct sunlight, casting a large Umbra cone. As the Moon enters, the Earth&#39;s atmosphere filters out shortwave blue light, refracting red wavelengths onto the Moon&#39;s surface, turning it copper red.&quot;;
                eclipseTypePanel.classList.add(&#39;hidden&#39;);
                eclipseTypePanel.classList.remove(&#39;flex&#39;);
            } else {
                btnFree.className += &quot; bg-blue-500/20 border-blue-500/40&quot;;
                hudDesc.innerText = &quot;Free Orbit Sandbox Mode&quot;;
                hudIcon.className = &quot;fa-solid fa-earth-americas text-blue-400 text-base glow-blue&quot;;
                explainHeader.innerHTML = &quot;&lt;i class=&#39;fa-solid fa-microscope text-blue-400&#39;&gt;&lt;/i&gt; Sandbox Operations&quot;;
                explainBody.innerText = &quot;Adjust speed, orbital distance, and inclination using the sliders. Pause motion at any point to freely rotate the 3D space with your mouse, scroll to zoom, and inspect alignments close-up.&quot;;
                eclipseTypePanel.classList.add(&#39;hidden&#39;);
                eclipseTypePanel.classList.remove(&#39;flex&#39;);
            }

            const playPauseIcon = document.getElementById(&#39;play-pause-icon&#39;);
            const playPauseText = document.getElementById(&#39;play-pause-text&#39;);
            if (isPaused) {
                playPauseIcon.className = &quot;fa-solid fa-play text-emerald-500&quot;;
                playPauseText.innerText = &quot;Resume Revolution&quot;;
            } else {
                playPauseIcon.className = &quot;fa-solid fa-pause text-amber-500&quot;;
                playPauseText.innerText = &quot;Pause Revolution&quot;;
            }
        }

        // Menu system visibility operations
        const sidebarMenu = document.getElementById(&#39;sidebar-menu&#39;);
        const menuToggleBtn = document.getElementById(&#39;menu-toggle-btn&#39;);
        const menuToggleIcon = document.getElementById(&#39;menu-toggle-icon&#39;);
        const menuToggleText = document.getElementById(&#39;menu-toggle-text&#39;);
        const menuBackdrop = document.getElementById(&#39;menu-backdrop&#39;);

        function toggleMenuDrawer() {
            const isClosed = sidebarMenu.classList.contains(&#39;-translate-x-full&#39;);
            if (isClosed) {
                sidebarMenu.classList.remove(&#39;-translate-x-full&#39;);
                sidebarMenu.classList.add(&#39;translate-x-0&#39;);
                menuToggleIcon.className = &quot;fa-solid fa-xmark text-sm text-red-400&quot;;
                menuToggleText.innerText = &quot;Close Menu&quot;;
                menuBackdrop.classList.remove(&#39;opacity-0&#39;, &#39;pointer-events-none&#39;);
                menuBackdrop.classList.add(&#39;opacity-100&#39;, &#39;pointer-events-auto&#39;);
            } else {
                sidebarMenu.classList.remove(&#39;translate-x-0&#39;);
                sidebarMenu.classList.add(&#39;-translate-x-full&#39;);
                menuToggleIcon.className = &quot;fa-solid fa-bars text-sm&quot;;
                menuToggleText.innerText = &quot;Open Menu&quot;;
                menuBackdrop.classList.remove(&#39;opacity-100&#39;, &#39;pointer-events-auto&#39;);
                menuBackdrop.classList.add(&#39;opacity-0&#39;, &#39;pointer-events-none&#39;);
            }
        }

        menuToggleBtn.addEventListener(&#39;click&#39;, (e) =&gt; {
            e.stopPropagation(); 
            toggleMenuDrawer();
        });

        menuBackdrop.addEventListener(&#39;click&#39;, toggleMenuDrawer);

        // Immediate global full-screen invocation upon initial tool interaction
        function triggerImmediateFullscreen() {
            const docElement = document.documentElement;
            if (!document.fullscreenElement) {
                if (docElement.requestFullscreen) {
                    docElement.requestFullscreen().catch(err =&gt; console.log(&quot;Fullscreen request deferred: &quot;, err));
                } else if (docElement.webkitRequestFullscreen) {
                    docElement.webkitRequestFullscreen();
                } else if (docElement.msRequestFullscreen) {
                    docElement.msRequestFullscreen();
                }
            }
        }

        // Bind immediate fallback interaction hook
        window.addEventListener(&#39;click&#39;, () =&gt; {
            triggerImmediateFullscreen();
        }, { once: true });

        window.addEventListener(&#39;pointerdown&#39;, () =&gt; {
            triggerImmediateFullscreen();
        }, { once: true });

        // Event settings connections
        document.getElementById(&#39;btn-solar-mode&#39;).addEventListener(&#39;click&#39;, setSolarEclipseMode);
        document.getElementById(&#39;btn-lunar-mode&#39;).addEventListener(&#39;click&#39;, setLunarEclipseMode);
        document.getElementById(&#39;btn-free-mode&#39;).addEventListener(&#39;click&#39;, setFreeOrbitMode);

        document.getElementById(&#39;btn-play-pause&#39;).addEventListener(&#39;click&#39;, () =&gt; {
            isPaused = !isPaused;
            updateUIState();
        });

        document.getElementById(&#39;btn-reset-cam&#39;).addEventListener(&#39;click&#39;, () =&gt; {
            animateCamera(new THREE.Vector3(40, 60, 115), new THREE.Vector3(0, 0, 0));
        });

        const sliderSpeed = document.getElementById(&#39;slider-speed&#39;);
        const labelSpeed = document.getElementById(&#39;label-speed&#39;);
        sliderSpeed.addEventListener(&#39;input&#39;, (e) =&gt; {
            speedMultiplier = parseFloat(e.target.value);
            labelSpeed.innerText = speedMultiplier.toFixed(1) + &quot;x&quot;;
        });

        const sliderDistance = document.getElementById(&#39;slider-distance&#39;);
        const labelDistance = document.getElementById(&#39;label-distance&#39;);
        sliderDistance.addEventListener(&#39;input&#39;, (e) =&gt; {
            MOON_ORBIT_DIST = parseFloat(e.target.value);
            labelDistance.innerText = MOON_ORBIT_DIST.toFixed(1) + &quot; AU&quot;;
            
            const newCurve = new THREE.EllipseCurve(0, 0, MOON_ORBIT_DIST, MOON_ORBIT_DIST);
            const newPoints = newCurve.getPoints(128);
            orbitGuideline.geometry.setFromPoints(newPoints.map(p =&gt; new THREE.Vector3(p.x, 0, p.y)));
            
            rebuildShadowCones();
        });

        const sliderInclination = document.getElementById(&#39;slider-inclination&#39;);
        const labelInclination = document.getElementById(&#39;label-inclination&#39;);
        sliderInclination.addEventListener(&#39;input&#39;, (e) =&gt; {
            const deg = parseFloat(e.target.value);
            INCLINATION = deg * (Math.PI / 180);
            labelInclination.innerText = deg.toFixed(1) + &quot;°&quot;;
        });

        const toggleUmbra = document.getElementById(&#39;toggle-umbra&#39;);
        const togglePenumbra = document.getElementById(&#39;toggle-penumbra&#39;);
        const toggleAntumbra = document.getElementById(&#39;toggle-antumbra&#39;);
        const toggleRays = document.getElementById(&#39;toggle-rays&#39;);
        const toggleLabels = document.getElementById(&#39;toggle-labels&#39;);
        const toggleGuideline = document.getElementById(&#39;toggle-guideline&#39;);

        const clock = new THREE.Clock();

        function checkEclipseType() {
            if (currentMode !== &#39;solar&#39;) return;
            
            const distance = SUN_DIST - MOON_ORBIT_DIST;
            const umbraLength = (MOON_RADIUS * distance) / (SUN_RADIUS - MOON_RADIUS);
            const eclipseDesc = document.getElementById(&#39;eclipse-type-desc&#39;);
            const apexCoordinate = -MOON_ORBIT_DIST + umbraLength;
            
            if (apexCoordinate &gt;= 0) {
                eclipseDesc.innerHTML = &quot;&lt;span class=&#39;text-emerald-400&#39;&gt;TOTAL SOLAR ECLIPSE&lt;/span&gt;&lt;br&gt;&lt;span class=&#39;text-[10px] font-normal text-slate-300&#39;&gt;The Moon&#39;s Umbra cone touches Earth. Complete blockage!&lt;/span&gt;&quot;;
            } else {
                eclipseDesc.innerHTML = &quot;&lt;span class=&#39;text-rose-400&#39;&gt;ANNULAR ECLIPSE&lt;/span&gt;&lt;br&gt;&lt;span class=&#39;text-[10px] font-normal text-slate-300&#39;&gt;The Umbra ends before Earth. Earth is inside the ANTUMBRA!&lt;/span&gt;&quot;;
            }
        }

        // Active WebGL loop updates
        function renderLoop() {
            requestAnimationFrame(renderLoop);

            const dt = clock.getDelta();

            if (!isPaused) {
                theta += dt * 0.22 * speedMultiplier;
                if (theta &gt; Math.PI * 2) theta -= Math.PI * 2;
            }

            const mx = Math.cos(theta) * MOON_ORBIT_DIST;
            const mz = Math.sin(theta) * MOON_ORBIT_DIST;
            const my = Math.sin(theta) * MOON_ORBIT_DIST * Math.sin(INCLINATION);

            moonMesh.position.set(mx, my, mz);

            updateAtmosphericScattering();

            if (currentMode === &#39;solar&#39;) {
                shadowConesGroup.position.copy(moonMesh.position);
                const shadowDirection = new THREE.Vector3().subVectors(moonMesh.position, sunMesh.position).normalize();
                const shadowTarget = new THREE.Vector3().copy(moonMesh.position).add(shadowDirection);
                shadowConesGroup.lookAt(shadowTarget);
                
                rebuildLightPathRays();
                checkEclipseType();
            } else {
                shadowConesGroup.position.set(0, 0, 0);
                shadowConesGroup.lookAt(new THREE.Vector3(1, 0, 0));
                rebuildLightPathRays();
            }

            if (umbraMesh) umbraMesh.visible = toggleUmbra.checked;
            if (penumbraMesh) penumbraMesh.visible = togglePenumbra.checked;
            if (antumbraMesh) antumbraMesh.visible = toggleAntumbra.checked;
            
            rayLinesGroup.visible = (currentMode !== &#39;free&#39;) &amp;&amp; toggleRays.checked;
            labelGroup.visible = toggleLabels.checked;
            orbitGuideline.visible = toggleGuideline.checked;

            if (toggleLabels.checked) {
                updateLabelsPosition();
                labelGroup.children.forEach(sprite =&gt; {
                    sprite.quaternion.copy(camera.quaternion);
                });
            }

            earthMesh.rotation.y += dt * 0.04;
            moonMesh.rotation.y += dt * 0.02;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener(&#39;resize&#39;, onWindowResize, false);

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        renderLoop();
        updateUIState();
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
</html>
