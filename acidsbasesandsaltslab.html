<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<title>acids lab</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; margin: 0; padding: 0;
    overflow: hidden; background: #070b14;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  #viewportContainer {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    overflow: hidden; background: #070b14;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }

  #appStage {
    width: 1920px;
    height: 1080px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    will-change: transform;
  }

  #appStage iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  /* FLOATING MOBILE NAVIGATION, PAN & ZOOM BAR */
  .nav-overlay-bar {
    position: fixed;
    bottom: 12px; left: 12px;
    z-index: 99990;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 99px;
    padding: 4px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-overlay-bar.hidden {
    display: none !important;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #eef3ff; font-size: 0.8rem; font-weight: bold;
    display: grid; place-items: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }

  .nav-btn:active {
    transform: scale(0.92);
    background: rgba(123, 209, 255, 0.3);
  }

  .nav-btn.active-mode {
    background: #3b82f6; border-color: #65c9ff; color: #fff;
  }

  .nav-divider {
    width: 1px; height: 18px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 2px;
  }

  /* UNHIDE TRIGGER BUTTON */
  .nav-toggle-btn {
    position: fixed;
    bottom: 12px; left: 12px;
    z-index: 99989;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 15, 26, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #7bd1ff; font-size: 0.9rem;
    display: none; place-items: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .nav-toggle-btn.visible {
    display: grid !important;
  }

  /* HIGH-END PROFESSIONAL ROTATE OVERLAY */
  .rotate-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }
  .rotate-card {
    width: min(440px, 90vw); padding: 36px 28px; border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .rotate-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    background: rgba(123, 209, 255, 0.12); border: 1px solid rgba(123, 209, 255, 0.3);
    color: #7bd1ff; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .rotate-icon-wrap {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(123,209,255,0.2), rgba(181,140,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    display: grid; place-items: center; font-size: 2.2rem;
    margin-bottom: 4px;
    animation: phoneRotate 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes phoneRotate {
    0%, 15% { transform: rotate(0deg); }
    45%, 65% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }
  .rotate-title {
    margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff, #a7b3d8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rotate-msg {
    margin: 0; color: #94a3b8; font-size: 0.92rem; line-height: 1.5; font-weight: 450;
  }
  .btn-rotate {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, #65c9ff, #3b82f6);
    color: #061225; font-weight: 800; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-rotate:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(59, 130, 246, 0.45); }
  .btn-rotate:active { transform: translateY(1px); }
</style>
</head>
<body>

<!-- ROTATE SCREEN PROMPT -->
<div class="rotate-overlay" id="rotateOverlay">
  <div class="rotate-card">
    <div class="rotate-badge">Display Notice</div>
    <div class="rotate-icon-wrap">📱</div>
    <h2 class="rotate-title">Rotate Your Device</h2>
    <p class="rotate-msg">Please rotate your device to Landscape Mode to experience the full widescreen application interface.</p>
    <button id="btnEnterLandscape" class="btn-rotate">
      Enter Fullscreen Widescreen
    </button>
  </div>
</div>

<!-- FLOATING MOBILE NAVIGATION, PAN & ZOOM OVERLAY -->
<div class="nav-overlay-bar" id="navOverlayBar">
  <div class="nav-btn" onclick="navBack()" title="Back Page">◀</div>
  <div class="nav-btn" onclick="navForward()" title="Forward Page">▶</div>
  <div class="nav-divider"></div>
  <div class="nav-btn" onclick="zoomIn()" title="Zoom In">+</div>
  <div class="nav-btn" onclick="zoomOut()" title="Zoom Out">−</div>
  <div class="nav-btn" onclick="resetPanAndZoom()" title="Reset Screen">1:1</div>
  <div class="nav-divider"></div>
  <div class="nav-btn" onclick="panStage(0, -60)" title="Pan Up">⬆</div>
  <div class="nav-btn" onclick="panStage(0, 60)" title="Pan Down">⬇</div>
  <div class="nav-btn" onclick="panStage(-60, 0)" title="Pan Left">⬅</div>
  <div class="nav-btn" onclick="panStage(60, 0)" title="Pan Right">➡</div>
  <div class="nav-btn" id="panDragToggleBtn" onclick="togglePanDragMode()" title="Drag Pan Mode">🖐️</div>
  <div class="nav-divider"></div>
  <div class="nav-btn" onclick="toggleNavBar(true)" title="Hide Controls">✕</div>
</div>
<div class="nav-toggle-btn" id="navToggleBtn" onclick="toggleNavBar(false)" title="Show Controls">⚙️</div>

<!-- MAIN VIEWPORT STAGE -->
<div id="viewportContainer">
  <div id="appStage">
    <iframe id="contentFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads" srcdoc="&lt;!DOCTYPE html&gt;

&lt;title&gt;ACIDS, BASES AND SALTS TESTING LAB — Aurora&lt;/title&gt;
&lt;style&gt;
  :root{

  [data-theme=&quot;light&quot;]{

    --warn:#eab308;
    --danger:#ef4444;
    --ring:#2f7de8;
  }

  *{box-sizing:border-box}
  html,body{
    width:100vw; height:100vh; margin:0; padding:0; overflow:hidden;
    background:#070b14; color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, &quot;Helvetica Neue&quot;, Arial;

  }

  /* VIEWPORT WRAPPER &amp; 1920x1080 STAGE CANVAS */

    display: flex; align-items: center; justify-content: center;
  }

  #appStage {
    width: 1920px;
    height: 1080px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background:
      radial-gradient(1200px 800px at 16% 8%, #172038 0%, #0b1122 50%, #0a0f1d 100%),
      linear-gradient(180deg, #0b1122, #0b1122);
    display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8);
  }

  /* ROTATE PHONE OVERLAY FOR MOBILE PORTRAIT */
  .rotate-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(10, 15, 26, 0.96);
    backdrop-filter: blur(16px);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #eef3ff;
  }
  .rotate-card {
    max-width: 420px; padding: 28px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border: 1px solid var(--stroke); box-shadow: 0 20px 50px rgba(0,0,0,.6);
  }
  .rotate-icon { font-size: 3.5rem; margin-bottom: 12px; animation: phoneRotate 2.5s ease-in-out infinite; }
  @keyframes phoneRotate {
    0%, 10% { transform: rotate(0deg); }
    40%, 60% { transform: rotate(90deg); }
    90%, 100% { transform: rotate(0deg); }
  }

  /* Background aurora */
  .orbs div{
    position:absolute; border-radius:9999px; filter:blur(90px); opacity:.22; mix-blend-mode:screen; animation:orb 22s ease-in-out infinite;
  }
  .orbs .a{width:560px;height:560px;background:#5e6bff;top:-180px;left:-120px}
  .orbs .b{width:520px;height:520px;background:#43f2b4;right:-160px;top:38%;animation-delay:-7s}
  .orbs .c{width:460px;height:460px;background:#d279ff;left:58%;bottom:-220px;animation-delay:-12s}
  @keyframes orb{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

  /* Topbar */
  .topbar{
    padding: 12px 18px;
    background: linear-gradient(180deg, rgba(15,23,42,.90), rgba(15,23,42,.65));
    border-bottom:1px solid var(--stroke);
    backdrop-filter: blur(10px) saturate(140%);
    flex-shrink: 0;
  }
  .topbar .grid{
    display:grid; gap: 14px;
    grid-template-columns: repeat(3, minmax(210px, 1fr));
  }
  .sel{display:flex; flex-direction:column; gap:6px}
  .sel label{font-size:.85rem; color:var(--muted); font-weight: 600;}
  .pill{
    width:100%; appearance:none; outline:none; color:var(--text); font-weight:700; font-size:.92rem;
    border-radius:9999px; border:1px solid var(--stroke);
    padding:10px 16px; background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    box-shadow: inset 0 2px 10px rgba(0,0,0,.25);
    text-shadow:0 1px 0 rgba(0,0,0,.25); cursor: pointer;
  }
  select.pill option{ background:#0f162a; color:#eaf0ff }

  /* ACTION bar */
  .actions{
    margin: 10px 16px; padding: 10px 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border:1px solid var(--stroke); border-radius:14px;
    backdrop-filter: blur(10px) saturate(140%); flex-shrink: 0;
  }
  .actions .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  button{
    padding:8px 14px; border-radius:999px; border:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    color:var(--text); cursor:pointer; font-weight:800; letter-spacing:.2px; font-size:.88rem;
    transition:transform .06s ease, box-shadow .2s ease, background .3s ease;
  }
  button:active{transform:translateY(1px)}
  .primary{border:none; background:linear-gradient(180deg,#65c9ff,#5aa9ff 60%, #4f9aff); color:#061225;
    box-shadow:0 8px 16px rgba(90,169,255,.28), inset 0 1px 0 rgba(255,255,255,.55)}
  .danger{background:linear-gradient(180deg,#ff8fa1,#ff6b8b 60%, #ff5178); border:none; color:#1a0b13}
  .ghost{background:transparent}
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 14px; border-radius:999px; border:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    color:var(--text); font-weight:700; cursor:pointer; user-select:none; font-size:.85rem;
  }
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip:hover{box-shadow:0 4px 16px rgba(0,0,0,.25)}

  /* Slider */
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    height:10px; border-radius:999px; background:transparent; outline:none;
    flex:1 1 auto; min-width:160px;
    background: linear-gradient(90deg, #58a6ff 0%, #58a6ff 100%) no-repeat,
                linear-gradient(90deg, #26354f, #26354f) no-repeat;
    background-size: var(--fill, 100%) 10px, 100% 10px;
    background-position: left center, left center;
    border:1px solid var(--stroke-soft);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
    background:#d9f1ff; border:1px solid #93c8ff; box-shadow:0 2px 6px rgba(0,0,0,.4)
  }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%;
    background:#d9f1ff; border:1px solid #93c8ff; box-shadow:0 2px 6px rgba(0,0,0,.4)
  }

  /* MAIN grid */
  .main{
    display:grid; gap: 16px;
    grid-template-columns: var(--gridCols, 1fr 380px);
    padding: 0 16px 16px 16px; flex: 1; min-height: 0; overflow:hidden;
  }

  /* Panels */
  .panel{
    position:relative;
    background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1px solid var(--stroke);
    border-radius:18px; padding: 14px;
    backdrop-filter: blur(12px) saturate(120%);
    box-shadow:0 12px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    min-height:0; overflow:hidden; display: flex; flex-direction: column;
  }
  .panel .panel-content{ position:relative; width:100%; height:100%; display: flex; flex-direction: column; }
  .center .toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 6px 10px}
  .title{font-weight:900; letter-spacing:.2px; font-size: 22px;
    background:linear-gradient(90deg,#aee0ff,#e0c5ff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .badges{display:flex; gap:8px; flex-wrap:wrap}
  .badge{padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--stroke); font-size:.8rem; color:var(--muted); font-weight:600;}

  .bench{
    position:relative; border-radius:16px; flex: 1;
    display:grid; place-items:center; overflow:hidden;
    background: radial-gradient(900px 400px at 10% 0%, rgba(255,255,255,.05), rgba(255,255,255,.02));
  }

  .copyright-bar{
    position:absolute; left:0; right:0; bottom:0;
    height:6px; border-top:1px solid var(--stroke);

  }

  .rig{ position:relative; width:100%; height: 100%; max-height: 650px; aspect-ratio:16/9; margin-inline:auto; }
  svg{width:100%; height:100%}

  /* pH ring indicator (top-left corner) */
  .ph-ring{
    position:absolute; left:16px; top:14px; display:flex; align-items:center; gap:8px;
    padding:8px 14px; border-radius:999px; background:rgba(10,16,28,.65); border:1px solid var(--stroke);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06); z-index: 10;
  }
  .ring{
    width:20px; height:20px; border-radius:50%; background:conic-gradient(var(--ring), var(--ring));

  }

  /* Floating lab tools */
  .lab-tools{
    position:absolute; right:16px; top:14px; display:flex; gap:10px; z-index:15;

  #lab.react-glow { filter: drop-shadow(0 0 16px rgba(170, 210, 255, .35)); transition: filter .3s ease }

  /* Strips */

  /* Conductivity rig (popup) */

  #wireRed{ stroke:#ff6b6b; stroke-width:3.5; fill:none; filter:url(#wireGlowCond) }
  #wireBlack{ stroke:#222a3a; stroke-width:3.5; fill:none }
  .cond-plate{
    position:absolute; left:40px; top:120px; width: 320px; height: 190px; border-radius:14px;
    border:1px solid var(--stroke); background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    box-shadow:0 10px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);

  .socket.neg{ left:122px; top:34px; border-color:#91a7c7 }

  .lamp{ position:absolute; right:8px; top:18px; width: 130px; height:auto; display:grid; place-items:center; filter: drop-shadow(0 4px 16px rgba(255,180,50,.25)) }
  .switch{
    position:absolute; left: 160px; bottom: 18px;
    width: 90px; height: 36px; border-radius:999px;

  }

  .sw-led{ position:absolute; right:10px; top:-10px; width:8px; height:8px; border-radius:50%; background:#364152 }
  .switch.on .sw-led{ background:#34d399; box-shadow:0 0 8px #34d399aa }

  /* Electrodes */
  .probe{
    position:absolute; width: 20px; height: 140px;
    border-radius:99px; background:linear-gradient(180deg,#a2b4c8,#6c7c8f); border:1px solid rgba(255,255,255,.5);
    box-shadow:0 8px 16px rgba(0,0,0,.35), inset 0 2px 6px rgba(0,0,0,.25);
    pointer-events:auto; cursor:grab; user-select:none; touch-action:none;
  }
  .probe .tip{ position:absolute; left:3px; right:3px; bottom:-8px; height:14px; border-radius:6px;
    background:linear-gradient(180deg,#d8dee6,#9aa7b4); border:1px solid rgba(255,255,255,.6); box-shadow:0 4px 6px rgba(0,0,0,.35) }
  .probe .tag{ position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:.7rem; color:#e8f0ff; background:rgba(255,255,255,.08); border:1px solid var(--stroke); border-radius:999px; padding:1px 6px; white-space:nowrap; }

  /* Results panel */
  .results.panel{ display:flex; flex-direction:column; min-width:280px; }
  .results h2{ margin:0 0 12px; padding-left:24px; position:relative; font-size: 1.3rem; }
  .results h2::before{ content:&quot;📌&quot;; position:absolute; left:0; top:-2px; font-size:1.1rem; }

    border:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));

  /* History */
  .history-card{
    margin-top:12px; border:1px solid var(--stroke);

    border-radius:14px; padding:12px; flex: 1; overflow:auto;

  /* pH scale */
  .ph-scale{
    position:absolute; left:16px; bottom:20px;

    background:rgba(16,22,36,.85); border:1px solid var(--stroke); border-radius:12px; padding:12px; display:none;

  }
  .ph-scale .bar{position:relative; height:16px; border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,.5);

  .ph-scale .tick{ position:absolute; top:18px; width:1px; height:6px; background:rgba(255,255,255,.35) }
  .ph-scale .labels{display:flex; justify-content:space-between; margin-top:10px; font-size:.72rem; color:var(--muted)}

  .ph-tag{position:absolute; top:-26px; transform:translateX(-50%); font-size:.7rem; color:#fff; background:rgba(0,0,0,.35); padding:2px 6px; border-radius:999px; border:1px solid rgba(255,255,255,.28)}

  /* Resize handles */

  .handle-ne{ right:6px; top:6px; cursor:nesw-resize }
  .handle-sw{ left:6px; bottom:6px; cursor:nesw-resize }
  .handle-se{ right:6px; bottom:6px; cursor:nwse-resize }

  /* Onboarding */
  .onboard{
    position:fixed; inset:0; background:radial-gradient(1200px 800px at 50% 50%, rgba(10,14,22,.75), rgba(10,14,22,.85));

  .compare-wrap{

  .mini-controls{ display:grid; grid-template-columns:1fr 1fr auto auto; gap:8px; align-items:center }
  .mini-chip{ padding:4px 8px; border-radius:999px; border:1px solid var(--stroke); background:rgba(255,255,255,.06); font-size:.75rem; color:var(--muted) }
  .mini-lab{ width:100%; flex: 1; border-radius:12px; border:1px solid var(--stroke); background:linear-gradient(180deg, rgba(180,220,255,.08), rgba(180,220,255,.02)); position:relative; overflow:hidden; display:grid; place-items:center }

  .nature{ padding:2px 8px; border-radius:999px; border:1px solid var(--stroke); font-size:.74rem }
  .nature.acid{ background:rgba(255,100,120,.15); color:#ff9aa9 }
  .nature.base{ background:rgba(100,255,170,.15); color:#8af7c1 }
  .nature.neutral{ background:rgba(255,255,255,.08); color:var(--muted) }

  /* Neutralisation side panels */
  .neutral-panels{ display:none; position:absolute; inset:0; pointer-events:none; }
  .side-panel{
    position:absolute; top:50%; transform:translateY(-50%);
    width: 230px; pointer-events:auto;
    border:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(11,17,32,.92), rgba(11,17,32,.85));
    border-radius:14px; padding:12px;
    box-shadow:0 12px 24px rgba(0,0,0,.3);
  }
  .side-panel.left{ left:16px }
  .side-panel.right{ right:16px }
  .side-title{ font-weight:800; color:var(--muted); margin-bottom:6px; }
  .mini-beaker-slim{ width:100%; height:140px; border-radius:12px; border:1px solid rgba(255,255,255,.45); background:linear-gradient(180deg, rgba(180,220,255,.12), rgba(180,220,255,.04)); position:relative; overflow:hidden; display:grid; place-items:center; margin-bottom:6px }
  .mini-liquid-slim{ position:absolute; left:10%; right:10%; bottom:8px; height:55%; background:#89caff; border-radius:8px 8px 12px 12px; box-shadow:inset 0 1px 8px rgba(0,0,0,.25) }
  .row-sb{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap }
  .tiny{ font-size:.72rem; color:var(--muted) }
  .ml-badge{ padding:2px 8px; border-radius:999px; border:1px solid var(--stroke); font-size:.72rem; color:var(--muted); background:rgba(255,255,255,.06) }
  .vslider{ width:100% }

let currentScale = 1;

function resizeStage() {
  const stage = document.getElementById(&#39;appStage&#39;);
  if (!stage) return;
  const stageW = 1920;
  const stageH = 1080;
  const windowW = window.innerWidth;
  const windowH = window.innerHeight;

  currentScale = Math.min(windowW / stageW, windowH / stageH);
  stage.style.transform = `translate(-50%, -50%) scale(${currentScale})`;
}

function checkOrientation() {
  const rotateOverlay = document.getElementById(&#39;rotateOverlay&#39;);
  const isPortrait = window.innerHeight &gt; window.innerWidth &amp;&amp; window.innerWidth &lt; 1024;
  if (isPortrait) {
    rotateOverlay.style.display = &#39;flex&#39;;
  } else {
    rotateOverlay.style.display = &#39;none&#39;;
  }
  resizeStage();
}

document.getElementById(&#39;btnEnterLandscape&#39;).addEventListener(&#39;click&#39;, () =&gt; {
  document.getElementById(&#39;rotateOverlay&#39;).style.display = &#39;none&#39;;
});

window.addEventListener(&#39;resize&#39;, () =&gt; {
  checkOrientation();
  resizeStage();
});
window.addEventListener(&#39;orientationchange&#39;, () =&gt; {

/* Resizable panels with scaling */
function initResizablePanels(){
  function onPointerDown(e){
    const handle = e.currentTarget;
    const dir = handle.dataset.dir;
    const panel = handle.closest(&#39;.panel&#39;);
    const isSim = panel.id === &#39;simPanel&#39;; const isRes = panel.id === &#39;resPanel&#39;;

    const mainRect = mainGrid.getBoundingClientRect();
    const leftRect = simPanel.getBoundingClientRect();
    const rightRect = resPanel.getBoundingClientRect();

    const gap = 16;
    const containerW = mainRect.width / currentScale;

    const startX = e.clientX, startY = e.clientY;
    const startLeftW = leftRect.width / currentScale, startRightW = rightRect.width / currentScale;
    const startPanelH = panel.getBoundingClientRect().height / currentScale;

    handle.setPointerCapture(e.pointerId||1);

    function move(ev){
      const dx = (ev.clientX - startX) / currentScale;
      const dy = (ev.clientY - startY) / currentScale;

      let newLeftW = startLeftW, newRightW = startRightW;
      const minLeft=500, minRight=280;

      if(isSim){
        if(dir.includes(&#39;e&#39;)) newLeftW = Math.max(minLeft, Math.min(containerW-gap-minRight, startLeftW + dx));
        if(dir.includes(&#39;w&#39;)) newLeftW = Math.max(minLeft, Math.min(containerW-gap-minRight, startLeftW - dx));
        newRightW = containerW - gap - newLeftW;
      }
      if(isRes){
        if(dir.includes(&#39;e&#39;)) newRightW = Math.max(minRight, Math.min(containerW-gap-minLeft, startRightW + dx));
        if(dir.includes(&#39;w&#39;)) newRightW = Math.max(minRight, Math.min(containerW-gap-minLeft, startRightW - dx));
        newLeftW = containerW - gap - newRightW;
      }
      mainGrid.style.setProperty(&#39;--gridCols&#39;, `${Math.round(newLeftW)}px ${Math.round(newRightW)}px`);

      const minH = 300, maxH = 800;
      let newH = startPanelH;
      if(dir.includes(&#39;s&#39;)) newH = Math.max(minH, Math.min(maxH, startPanelH + dy));
      if(dir.includes(&#39;n&#39;)) newH = Math.max(minH, Math.min(maxH, startPanelH - dy));
      panel.style.height = Math.round(newH) + &#39;px&#39;;
    }
    function up(ev){
      try{ handle.releasePointerCapture(ev.pointerId||1) }catch(_){}
      window.removeEventListener(&#39;pointermove&#39;, move);
      window.removeEventListener(&#39;pointerup&#39;, up);
    }
    window.addEventListener(&#39;pointermove&#39;, move);
    window.addEventListener(&#39;pointerup&#39;, up);
  }
  document.querySelectorAll(&#39;#simPanel .resize-handle, #resPanel .resize-handle&#39;).forEach(h=&gt;h.addEventListener(&#39;pointerdown&#39;, onPointerDown));
}

});

    const natBadge = document.getElementById(id===&#39;miniA&#39;?&#39;miniANature&#39;:&#39;miniBNature&#39;);
    let curPH=7, filled=false;

    subSel.value = (id===&#39;miniA&#39;) ? &#39;hcl_industrial&#39; : &#39;sodium_hydroxide&#39;;
    updatePH(false);

    function updatePH(reveal = false){
      curPH = SUBS[subSel.value]?.pH ?? 7;
      if (reveal) {
        pHChip.textContent = `pH ${curPH.toFixed(1)}`;
        setNatureBadge(natBadge, curPH);
      } else {
        pHChip.textContent = `pH ?`;
        natBadge.textContent = `—`;
      }
    }
    subSel.addEventListener(&#39;change&#39;, () =&gt; updatePH(false));

    btnFill.addEventListener(&#39;click&#39;, ()=&gt;{
      liq.setAttribute(&#39;y&#39;, 160-60); liq.setAttribute(&#39;height&#39;, 60);
      liq.setAttribute(&#39;fill&#39;, &#39;#89caff&#39;); filled=true; beep(420,0.05);
    });
    btnAdd.addEventListener(&#39;click&#39;, ()=&gt;{
      if(!filled) return;
      const indKey=indSel.value;
      if(indKey===&#39;none&#39;) return;
      const col = (INDICATORS[indKey]||INDICATORS.universal).color(curPH);
      liq.setAttribute(&#39;fill&#39;, col);
      updatePH(true); // Reveal pH when tested
    });
  });
  miniInited=true;
}

/* ====== Neutralisation workflow ====== */
let neutralInited=false;
function H_from_pH(pH){ return Math.pow(10, -pH) }
function OH_from_pH(pH){ return Math.pow(10, -(14 - pH)) }
function updateNeutralSlimColors(){
  const pHA = SUBS[neutralState.acidKey]?.pH ?? 7;
  const pHB = SUBS[neutralState.baseKey]?.pH ?? 7;
  acidLiquidSlim.style.background = INDICATORS.universal.color(pHA);
  baseLiquidSlim.style.background = INDICATORS.universal.color(pHB);
}
function initNeutralisationOnce(){
  if(!neutralInited){
    fillSelectWithSubstances(acidSelect);
    fillSelectWithSubstances(baseSelect);
    acidSelect.value = neutralState.acidKey;
    baseSelect.value = neutralState.baseKey;
    [acidML, baseML].forEach(styleRange);
    acidMLBadge.textContent = `${acidML.value} mL`;
    baseMLBadge.textContent = `${baseML.value} mL`;
    updateNeutralSlimColors();

    acidSelect.addEventListener(&#39;change&#39;, ()=&gt;{ neutralState.acidKey=acidSelect.value; updateNeutralSlimColors() });
    baseSelect.addEventListener(&#39;change&#39;, ()=&gt;{ neutralState.baseKey=baseSelect.value; updateNeutralSlimColors() });

    acidML.addEventListener(&#39;input&#39;, ()=&gt;{ styleRange(acidML); neutralState.mlA=Number(acidML.value); acidMLBadge.textContent=`${acidML.value} mL` });
    baseML.addEventListener(&#39;input&#39;, ()=&gt;{ styleRange(baseML); neutralState.mlB=Number(baseML.value); baseMLBadge.textContent=`${baseML.value} mL` });

    acidCollect.addEventListener(&#39;click&#39;, ()=&gt;{ neutralState.loadedA=neutralState.mlA; acidLoaded.textContent=`Loaded: ${neutralState.loadedA} mL`; beep(500,0.05) });
    baseCollect.addEventListener(&#39;click&#39;, ()=&gt;{ neutralState.loadedB=neutralState.mlB; baseLoaded.textContent=`Loaded: ${neutralState.loadedB} mL`; beep(500,0.05) });

    acidAdd.addEventListener(&#39;click&#39;, ()=&gt; addToMain(&#39;acid&#39;));
    baseAdd.addEventListener(&#39;click&#39;, ()=&gt; addToMain(&#39;base&#39;));

    neutralInited=true;
  }
  if(!state.filled || state.mode!==&#39;neutral&#39;){
    state.beakerLabelOverride=&#39;Neutral water&#39;;
    setPH(7, false);
    liquidRect.setAttribute(&#39;fill&#39;, &quot;#89caff&quot;); wavePath.setAttribute(&#39;fill&#39;, &quot;#89caff&quot;);
    setLevel(.54); state.filled=true;
  }
  if(!neutralState.active){
    neutralState.active=true;
    neutralState.netMoles=0;
    neutralState.volL=0.2;
    neutralState.loadedA=0; neutralState.loadedB=0;
    acidLoaded.textContent=&#39;Loaded: 0 mL&#39;; baseLoaded.textContent=&#39;Loaded: 0 mL&#39;;
  }
}
function addToMain(kind){
  const isAcid = (kind===&#39;acid&#39;);
  const loaded = isAcid ? neutralState.loadedA : neutralState.loadedB;
  if(loaded&lt;=0) return;

  const key = isAcid ? neutralState.acidKey : neutralState.baseKey;
  const pH = SUBS[key]?.pH ?? 7;
  const volL = loaded/1000;

  let delta = 0;
  if(isAcid){
    const molH = (pH&lt;7? H_from_pH(pH) : 1e-7) * volL;
    delta = molH;
  }else{
    const molOH = (pH&gt;7? OH_from_pH(pH) : 1e-7) * volL;
    delta = -molOH;
  }

  const panelEl = isAcid ? document.getElementById(&#39;acidPanel&#39;) : document.getElementById(&#39;basePanel&#39;);
  const startRect = panelEl.querySelector(&#39;.mini-beaker-slim&#39;).getBoundingClientRect();
  const rigRect = rig.getBoundingClientRect();
  const sx = (startRect.left + startRect.width/2 - rigRect.left) / currentScale;
  const sy = (startRect.bottom - rigRect.top) / currentScale - 8;
  const targetY = state.surfaceCssY + 14;
  const dropColor = INDICATORS.universal.color(pH);
  for(let i=0;i&lt;12;i++){
    const jitterX=(Math.random()-0.5)*24;
    setTimeout(()=&gt;spawnRigDrop(sx+jitterX,sy,dropColor,targetY),i*60);
  }
  lab.classList.add(&#39;react-glow&#39;); setTimeout(()=&gt;lab.classList.remove(&#39;react-glow&#39;),800);

  const prevHex=liquidRect.getAttribute(&#39;fill&#39;);
  neutralState.netMoles += delta;
  neutralState.volL += volL;

  let finalPH=7;
  if(neutralState.netMoles&gt;1e-15){
    const H = neutralState.netMoles/neutralState.volL;
    finalPH = -Math.log10(Math.max(1e-14,H));
  }else if(neutralState.netMoles&lt;-1e-15){
    const OH = (-neutralState.netMoles)/neutralState.volL;
    const pOH = -Math.log10(Math.max(1e-14,OH));
    finalPH = 14 - pOH;
  }else{
    finalPH=7;
  }
  finalPH = Math.max(0, Math.min(14, finalPH));
  setPH(finalPH, true); // REVEAL pH UPON NEUTRALISATION ADDITION

  const newHex = INDICATORS.universal.color(finalPH);
  mixBeakerColorTo(newHex, 900);
  beep();

  const addLabel = `${isAcid?&#39;Acid&#39;:&#39;Base&#39;}: ${labelForSubKey(key).split(&#39;—&#39;)[0].trim()} — ${loaded} mL`;
  state.beakerLabelOverride = `Neutralisation Mix — ${addLabel}`;
  resultCard.style.display=&#39;block&#39;;
  resIndicator.textContent = &#39;Indicator: Neutralisation (mix)&#39;;
  resSubstance.textContent = `Substance: ${addLabel}`;
  resPH.textContent = `pH: ${finalPH.toFixed(2)}`;
  const nature= (finalPH&lt;7?&#39;Acidic&#39;:finalPH&gt;7?&#39;Basic (Alkaline)&#39;:&#39;Neutral&#39;);
  resNature.textContent=nature;
  resNature.style.background= nature.startsWith(&#39;Acidic&#39;)?&#39;rgba(255,100,120,.15)&#39;:nature.startsWith(&#39;Basic&#39;)?&#39;rgba(100,255,170,.15)&#39;:&#39;rgba(255,255,255,.08)&#39;;
  fromSq.style.background=prevHex; toSq.style.background=newHex;
  fromTxt.textContent=`from ${colorName(prevHex)}`; toTxt.textContent=`to ${colorName(newHex)}`;
  pushHistory({indicator:&#39;Neutralisation&#39;, substance:addLabel, pH:finalPH.toFixed(2), from:prevHex, to:newHex});

  if(isAcid){ neutralState.loadedA=0; acidLoaded.textContent=&#39;Loaded: 0 mL&#39;; }
  else { neutralState.loadedB=0; baseLoaded.textContent=&#39;Loaded: 0 mL&#39;; }
}

/* ====== Init ====== */
function init(){
  ensureTicks(); setPH(7, false); styleRange(concSlider);
  ensureWireInit(); animateWires(); toggleCondRig(false);
  initResizablePanels();
  checkOrientation();
  setMode(&#39;single&#39;);
  showOnboard();
}
init();

/* Utility buttons */
btnBubbles.addEventListener(&#39;click&#39;,()=&gt;{ state.bubbles=!state.bubbles; if(state.mode!==&#39;compare&#39;){ if(state.bubbles) startBubbles(); else stopBubbles() } });
condSwitch.addEventListener(&#39;click&#39;,()=&gt;{ condState.on=!condState.on; condSwitch.classList.toggle(&#39;on&#39;,condState.on); condSwitch.setAttribute(&#39;aria-pressed&#39;, condState.on?&#39;true&#39;:&#39;false&#39;); updateConductivity() });
&lt;/script&gt;

<script>
  const STAGE_W = 1920;
  const STAGE_H = 1080;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;
      baseScale = Math.min(windowW / STAGE_W, windowH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => { checkOrientation(); resizeStage(); });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { checkOrientation(); resizeStage(); }, 200);
  });

  checkOrientation();
  resizeStage();
</script>
