<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attend Pro - V4</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
            --holiday: #f59e0b;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Topbar & Controls */
        .topbar { background-color: var(--surface); height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: var(--shadow); position: fixed; width: 100%; top: 0; z-index: 100; }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .topbar-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 3px; }
        
        .menu-btn { background: none; border: none; font-size: 22px; color: var(--text); cursor: pointer; margin-right: 10px; transition: 0.3s; }
        .menu-btn:hover { color: var(--primary); }
        .brand { font-size: 18px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        .btn-topbar-icon { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .btn-topbar-icon:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-topbar-icon:disabled { opacity: 0.4; cursor: not-allowed; }

        .cloud-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: #fee2e2; color: var(--danger); font-weight: 500; display: flex; align-items: center; gap: 5px; }
        .cloud-badge.connected { background: #d1fae5; color: var(--success); }
        
        .btn-topbar-save { background: var(--primary); color: white; border: none; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px; }
        .btn-topbar-save:hover { background: var(--primary-hover); }

        .sidebar { position: fixed; top: 0; left: -310px; width: 310px; height: 100vh; background-color: var(--surface); box-shadow: 4px 0 10px rgba(0,0,0,0.1); z-index: 1000; transition: 0.4s; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 18px; font-weight: 600; color: var(--primary); }
        .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-light); }
        .nav-item { padding: 12px 16px; margin-bottom: 8px; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 12px; color: var(--text-light); transition: all 0.3s ease; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background-color: var(--primary); color: white; }
        
        .sidebar-cloud-box { background: #f9fafb; border: 1px dashed var(--border); padding: 15px; border-radius: 8px; margin-top: auto; }
        .sidebar-cloud-box label { font-size: 12px; font-weight: 600; color: var(--text-light); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; opacity: 0; transition: 0.3s; }
        .overlay.show { display: block; opacity: 1; }

        /* Main Content */
        .main-content { margin-top: 65px; padding: 20px; max-width: 1400px; margin-left: auto; margin-right: auto; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Elements */
        .panel { background: var(--surface); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; width: 100%; }
        .panel-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; width: 100%; }
        
        input, select, textarea { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 14px; width: 100%; background: #fff; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }

        .btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-holiday { background: transparent; border: 1px solid var(--holiday); color: var(--holiday); }
        .btn-holiday:hover { background: var(--holiday); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--bg); color: var(--text); }
        .btn-outline.active { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        .toggle-group { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
        .toggle-group .btn { border-radius: 0; border: none; padding: 8px 14px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: var(--bg); font-weight: 500; color: var(--text-light); }
        tr:hover { background-color: #f9fafb; }

        .reg-input { padding: 6px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; width: 140px; }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 48px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--danger); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Report Table Styling */
        .report-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        .report-table th, .report-table td { padding: 5px 3px; text-align: center; border: 1px solid #d1d5db; font-size: 11px; min-width: 22px; }
        .cell-p { color: var(--success); font-weight: 700; background: #f0fdf4; }
        .cell-a { color: var(--danger); font-weight: 700; background: #fef2f2; }
        .cell-h { background: #fffbeb; vertical-align: middle; }
        .cell-none { color: #9ca3af; }

        .vertical-text {
            writing-mode: vertical-rl; transform: rotate(180deg);
            text-align: center; margin: auto; font-weight: 600;
            color: var(--holiday); letter-spacing: 1px;
            max-height: 200px; white-space: nowrap; font-size: 10px;
        }

        .holiday-banner { background: #fffbeb; color: #b45309; padding: 20px; border-radius: 8px; text-align: center; border: 1px dashed #f59e0b; font-weight: 500; margin-top: 10px; }

        /* Hierarchy UI */
        .accordion { background: #fafafa; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .accordion-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .accordion-header:hover { background: #f3f4f6; }
        .accordion-body { padding: 15px; border-top: 1px solid var(--border); background: white; display: none; }
        .accordion-body.open { display: block; }
        .bulk-input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; }

        .action-btns { display: flex; gap: 6px; align-items: center; }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--text); color: white; padding: 12px 20px; border-radius: 8px; box-shadow: var(--shadow); transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 1000; font-size: 14px; }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Dashboard Cards */
        .card-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--surface); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); display: flex; align-items: center; gap: 15px; }
        .card-icon { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .card-info h3 { font-size: 13px; color: var(--text-light); }
        .card-info p { font-size: 22px; font-weight: 600; }

        /* --- A4 Page Framework --- */
        .a4-wrapper { width: 100%; overflow-x: auto; padding-bottom: 15px; -webkit-overflow-scrolling: touch; }
        .a4-container { display: flex; flex-direction: row; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; min-width: max-content; margin: 0 auto; }
        .a4-page { background: #ffffff; padding: 12mm 15mm; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-radius: 6px; border: 1px solid var(--border); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: all 0.3s ease; }
        .a4-page.landscape { width: 297mm; min-height: 200mm; }
        .a4-page.portrait { width: 210mm; min-height: 285mm; }

        .a4-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 12px; }
        .a4-header .org-title { font-size: 16px; font-weight: 700; color: var(--primary); text-transform: uppercase; line-height: 1.2; }
        .a4-header .org-subtitle { font-size: 11px; color: var(--text-light); font-weight: 500; }
        .a4-header .hdr-right { text-align: right; }
        .a4-header .report-main-heading { font-size: 14px; font-weight: 700; color: var(--danger); text-transform: uppercase; letter-spacing: 0.5px; }
        .a4-header .report-sub-details { font-size: 11px; color: var(--text); font-weight: 500; }

        .a4-body { flex-grow: 1; overflow-x: auto; }
        .a4-footer { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 12px; font-size: 10px; color: var(--text-light); }
        .a4-footer .ftr-sig { border-top: 1px solid #9ca3af; width: 140px; text-align: center; padding-top: 2px; }

        @media (max-width: 768px) {
            .main-content { padding: 12px; margin-top: 60px; }
            .filters { flex-direction: column; align-items: stretch; }
            .filters input, .filters select, .filters button, .toggle-group { width: 100% !important; }
            .panel-header { flex-direction: column; align-items: stretch; }
            .card-container { grid-template-columns: 1fr; }
            .a4-container { flex-direction: column; align-items: center; min-width: 100%; }
            .a4-page { transform: scale(0.92); transform-origin: top center; margin-bottom: -15px; }
        }

        @media print {
            body { background: white !important; color: black !important; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .topbar, .sidebar, .overlay, .menu-btn, .btn, .panel-header, .filters, .toast, .bulk-input-group, .accordion, .card-container, #dashStatsContainer, #settings, .legend-box { display: none !important; }
            .main-content { margin: 0 !important; padding: 0 !important; max-width: none !important; width: 100% !important; }
            .panel { box-shadow: none !important; padding: 0 !important; border: none !important; background: transparent !important; margin: 0 !important; }
            .a4-wrapper { overflow: visible !important; }
            .a4-container { display: block !important; margin: 0 !important; min-width: 100% !important; }
            .a4-page { width: 100% !important; max-width: none !important; min-height: 98vh !important; box-shadow: none !important; border: none !important; border-radius: 0 !important; padding: 4mm 6mm !important; margin: 0 !important; transform: none !important; page-break-after: always !important; break-after: page !important; page-break-inside: avoid !important; }
            body.print-daily .section:not(#attendance) { display: none !important; }
            body.print-summary .section:not(#dashboard), body.print-summary #reportContainer { display: none !important; }
            body.print-report .section:not(#dashboard), body.print-report #summaryContainer { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="topbar">
        <div class="topbar-left">
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="brand"><i class="fas fa-clipboard-check"></i> SmartAttend</div>
            <button class="btn-topbar-icon" id="btnUndo" onclick="undoAction()" title="Undo action" disabled><i class="fas fa-undo"></i> Undo</button>
            <button class="btn-topbar-icon" id="btnRedo" onclick="redoAction()" title="Redo action" disabled><i class="fas fa-redo"></i> Redo</button>
        </div>
        <div class="topbar-right">
            <div id="cloudStatusBadge" class="cloud-badge">
                <i class="fas fa-exclamation-circle"></i> Local Storage Only
            </div>
            <button class="btn-topbar-save" onclick="manualSaveToCloud()" title="Save all data to backend Google Sheets">
                <i class="fas fa-cloud-upload-alt"></i> Save Data
            </button>
        </div>
    </div>

    <!-- Sidebar Menu -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            Menu <button class="close-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="nav-item active" onclick="switchTab('dashboard')"><i class="fas fa-home"></i> Dashboard</div>
        <div class="nav-item" onclick="switchTab('attendance')"><i class="fas fa-user-check"></i> Mark Attendance</div>
        <div class="nav-item" onclick="switchTab('settings')"><i class="fas fa-cog"></i> Settings & Classes</div>

        <div class="sidebar-cloud-box">
            <label><i class="fas fa-cloud-upload-alt"></i> Google Apps Script URL</label>
            <input type="url" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec" style="margin: 8px 0; font-size:12px;">
            <div style="display:flex; gap:6px;">
                <button class="btn btn-primary btn-sm" style="flex:1;" onclick="saveScriptUrl()"><i class="fas fa-plug"></i> Connect</button>
                <button class="btn btn-outline btn-sm" onclick="syncWithCloud()"><i class="fas fa-sync"></i> Sync</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Dashboard Section -->
        <div id="dashboard" class="section active">
            <div class="panel">
                <div class="panel-header" style="border-bottom: 1px solid var(--border); padding-bottom: 15px;">
                    <div class="filters">
                        <button class="btn btn-outline active" id="btnViewCards" onclick="setDashView('cards')"><i class="fas fa-chart-pie"></i> Overview</button>
                        <button class="btn btn-outline" id="btnViewSummary" onclick="setDashView('summary')"><i class="fas fa-table"></i> Daily Summary</button>
                        <button class="btn btn-outline" id="btnViewReport" onclick="setDashView('report')"><i class="fas fa-calendar-alt"></i> Total Monthly Report</button>
                    </div>
                    <div style="display:flex; gap:10px; width:100%; flex-wrap:wrap; justify-content:space-between; margin-top:10px;">
                        <div class="toggle-group">
                            <button class="btn btn-outline active" id="btnLandscape" onclick="setOrientation('landscape')"><i class="fas fa-file-alt"></i> Landscape</button>
                            <button class="btn btn-outline" id="btnPortrait" onclick="setOrientation('portrait')"><i class="fas fa-file"></i> Portrait</button>
                        </div>
                        <button class="btn btn-outline" onclick="printDashboardView()"><i class="fas fa-print"></i> Print A4 View</button>
                    </div>
                </div>
                
                <div class="filters" style="margin-top: 15px;">
                    <input type="date" id="dashDate" style="max-width: 200px;">
                    <select id="dashClassSelect" onchange="updateDashSectionDropdown()" style="max-width: 220px;"></select>
                    <select id="dashSectionSelect" onchange="triggerDashUpdate()" style="max-width: 220px;"></select>
                </div>
            </div>

            <!-- View 1: Stats Cards -->
            <div id="dashStatsContainer" class="card-container">
                <div class="card"><div class="card-icon" style="background:#e0e7ff; color:var(--primary);"><i class="fas fa-users"></i></div>
                    <div class="card-info"><h3>Total Students</h3><p id="dashTotalStudents">0</p></div></div>
                <div class="card"><div class="card-icon" style="background:#d1fae5; color:var(--success);"><i class="fas fa-check"></i></div>
                    <div class="card-info"><h3>Present</h3><p id="dashPresent">0</p></div></div>
                <div class="card"><div class="card-icon" style="background:#fee2e2; color:var(--danger);"><i class="fas fa-times"></i></div>
                    <div class="card-info"><h3>Absent</h3><p id="dashAbsent">0</p></div></div>
            </div>

            <!-- View 2: Summary Table -->
            <div id="summaryContainer" style="display:none; width:100%;"></div>

            <!-- View 3: Full Monthly Report -->
            <div id="reportContainer" style="display:none; width:100%;"></div>
        </div>

        <!-- Mark Attendance Section -->
        <div id="attendance" class="section">
            <div class="panel">
                <div class="panel-header">
                    <div class="filters">
                        <input type="date" id="attDate" style="max-width: 200px;">
                        <select id="attClassSelect" onchange="updateAttSectionDropdown()" style="max-width: 220px;"></select>
                        <select id="attSectionSelect" onchange="renderAttendanceSheet()" style="max-width: 220px;"></select>
                    </div>
                    <div style="display:flex; gap:10px; width:100%; flex-wrap:wrap; justify-content:flex-end; margin-top:10px;">
                        <button class="btn btn-holiday" id="btnHoliday" onclick="declareHoliday()"><i class="fas fa-umbrella-beach"></i> Declare Holiday</button>
                        <button class="btn btn-outline" onclick="triggerPrint('print-daily')"><i class="fas fa-print"></i> Print Sheet</button>
                        <button class="btn btn-primary" id="btnSaveAtt" onclick="saveAttendance()"><i class="fas fa-save"></i> Save Attendance</button>
                    </div>
                </div>
                <div id="attendanceTableContainer"></div>
            </div>
        </div>

        <!-- Settings Section -->
        <div id="settings" class="section">
            <div class="panel">
                <h2>Institute & Cloud Configuration</h2>
                
                <div class="bulk-input-group" style="margin-top:15px;">
                    <label><strong>Google Apps Script Web App URL</strong></label>
                    <input type="url" id="settingsScriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-primary" style="width: fit-content;" onclick="saveScriptUrlFromSettings()"><i class="fas fa-link"></i> Save & Connect</button>
                        <button class="btn btn-outline" style="width: fit-content;" onclick="syncWithCloud()"><i class="fas fa-cloud-download-alt"></i> Sync All Cloud Data</button>
                    </div>
                </div>

                <div class="bulk-input-group" style="margin-top:15px;">
                    <label><strong>Organization / Institute Name</strong></label>
                    <input type="text" id="orgNameInput" placeholder="e.g. St. Xavier High School / Tech Academy">
                    
                    <label><strong>Tagline / Subtitle / Address</strong></label>
                    <input type="text" id="orgTaglineInput" placeholder="e.g. Academic Session 2026-2027 | New Delhi">
                    
                    <label><strong>Academic Session Start Month</strong></label>
                    <select id="orgStartMonthSelect">
                        <option value="1">January</option>
                        <option value="4">April</option>

                        <option value="6">June</option>
                        <option value="8" selected>August</option>
                        <option value="9">September</option>
                    </select>

                    <button class="btn btn-primary" style="width: fit-content;" onclick="saveOrgDetails()"><i class="fas fa-save"></i> Save Organization Info</button>
                </div>

                <h2 style="margin-top: 30px;">Classes & Student Structure</h2>
                <div class="bulk-input-group" style="margin-top:15px;">
                    <label><strong>Add New Classes</strong> (One per line)</label>
                    <textarea id="bulkClassesInput" placeholder="e.g.&#10;Grade 10&#10;Computer Science 1st Year"></textarea>
                    <button class="btn btn-primary" style="width: fit-content;" onclick="addClasses()">Add Classes</button>
                </div>
                <div id="hierarchyContainer"></div>
                <hr style="margin: 30px 0; border: none; border-top: 1px solid var(--border);">
                <button class="btn btn-danger" onclick="clearAllData()"><i class="fas fa-trash-alt"></i> Factory Reset System</button>
            </div>
        </div>

    </div>

    <div id="toast" class="toast">Message here</div>

    <script>
        // State
        let instituteData = JSON.parse(localStorage.getItem('smartAttendInst')) || [];
        let attendanceData = JSON.parse(localStorage.getItem('smartAttendRecords')) || {};
        let orgData = JSON.parse(localStorage.getItem('smartAttendOrg')) || {
            name: "SmartAttend Institute",
            tagline: "Academic Attendance Register",
            startMonth: 8
        };
        let scriptUrl = localStorage.getItem('smartAttendScriptUrl') || '';
        let currentDashView = 'cards';
        let printOrientation = 'landscape';

        // UNDO / REDO HISTORY STACK SYSTEM
        let undoStack = [];
        let redoStack = [];
        const MAX_STACK_SIZE = 30;

        function pushStateSnapshot() {
            const snapshot = JSON.stringify({
                instituteData: instituteData,
                attendanceData: attendanceData,
                orgData: orgData
            });
            if (undoStack.length > 0 && undoStack[undoStack.length - 1] === snapshot) return;
            undoStack.push(snapshot);
            if (undoStack.length > MAX_STACK_SIZE) undoStack.shift();
            redoStack = []; 
            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            document.getElementById('btnUndo').disabled = (undoStack.length === 0);
            document.getElementById('btnRedo').disabled = (redoStack.length === 0);
        }

        function undoAction() {
            if (undoStack.length === 0) return;
            const currentState = JSON.stringify({ instituteData, attendanceData, orgData });
            redoStack.push(currentState);

            const lastState = JSON.parse(undoStack.pop());
            instituteData = lastState.instituteData;
            attendanceData = lastState.attendanceData;
            orgData = lastState.orgData;

            saveLocalState(false);
            refreshAllViews();
            updateUndoRedoUI();
            showToast("Undo applied!");
        }

        function redoAction() {
            if (redoStack.length === 0) return;
            const currentState = JSON.stringify({ instituteData, attendanceData, orgData });
            undoStack.push(currentState);

            const nextState = JSON.parse(redoStack.pop());
            instituteData = nextState.instituteData;
            attendanceData = nextState.attendanceData;

        function setScriptUrl(url) {
            scriptUrl = url;
            localStorage.setItem('smartAttendScriptUrl', url);
            document.getElementById('scriptUrlInput').value = url;
            document.getElementById('settingsScriptUrl').value = url;
            if(url) {

        async function postToCloud(payload) {
            if(!scriptUrl) return null;
            try {
                payload.startMonth = orgData.startMonth || 8;
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch(e) {
                console.error("Cloud Sync Error:", e);
                return null;
            }
        }

        async function manualSaveToCloud() {
            if (!scriptUrl) {
                showToast('Please set your Apps Script Web App URL first in Settings', 'error');
                return;
            }
            showToast('Saving all data to Google Sheets...');
            const res = await postToCloud({
                action: "saveAllData",
                orgData: orgData,
                instituteData: instituteData,
                attendanceData: attendanceData
            });

            if (res && res.status === "success") {
                updateCloudBadge(true);
                showToast('All Data Saved to Cloud Backend!', 'success');
            } else {
                updateCloudBadge(false);
                showToast('Failed to save to cloud backend.', 'error');
            }
        }

        async function syncWithCloud(silent = false) {
            if(!scriptUrl) {
                if(!silent) showToast('Please enter Apps Script URL first', 'error');
                return;
            }

            if(!silent) showToast('Syncing with Google Sheets...');

            const res = await postToCloud({ action: "getAllData" });

            if(res && res.status === "success") {
                updateCloudBadge(true);
                
                if(res.instituteData && res.instituteData.length) {
                    instituteData = res.instituteData;
                }
                if(res.attendanceData && Object.keys(res.attendanceData).length) {
                    attendanceData = res.attendanceData;
                }
                if(res.orgData && res.orgData.name) {
                    orgData = res.orgData;
                }

                saveLocalState(true);

                await postToCloud({
                    action: "saveAllData",
                    orgData: orgData,
                    instituteData: instituteData,
                    attendanceData: attendanceData
                });

                refreshAllViews();
                if(!silent) showToast('Cloud Sync Complete!');
            } else {
                updateCloudBadge(false);
                if(!silent) showToast('Cloud connection failed. Using local data.', 'error');
            }
        }

            if(!lines.length) return showToast('Enter section names', 'error');
            const cls = instituteData.find(c => c.id === classId);
            lines.forEach(name => cls.sections.push({ id: 's_' + Date.now() + Math.random().toString(36).substr(2,5), name, students: [] }));

        function addStudents(classId, sectionId) {
            pushStateSnapshot();
            const text = document.getElementById(`bulkStuInput_${sectionId}`).value;
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            if(!lines.length) return showToast('Enter student names', 'error');
            const sec = instituteData.find(c => c.id === classId).sections.find(s => s.id === sectionId);
            
            let currentRoll = sec.students.length;
            lines.forEach(line => {
                let rollNo = (currentRoll + 1).toString();
                let regNo = "";
                let name = line;

                if (line.includes('|')) {
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 3) { rollNo = parts[0]; regNo = parts[1]; name = parts[2]; }
                    else if (parts.length === 2) { rollNo = parts[0]; name = parts[1]; }
                } else {
                    const match = line.match(/^(\d+)[\s,\-\.:\t]+(.+)$/);
                    if (match) {
                        rollNo = match[1].trim();
                        name = match[2].trim();
                        let parsedNum = parseInt(match[1], 10);
                        if (!isNaN(parsedNum) && parsedNum >= currentRoll) currentRoll = parsedNum;
                    } else {
                        currentRoll++;
                    }
                }

                sec.students.push({
                    id: 'st_' + Date.now() + Math.random().toString(36).substr(2,5),
                    rollNo: rollNo,
                    regNo: regNo,
                    name: name
                });
            });

            saveLocalState(false); 
            renderHierarchy(); 
            document.getElementById(`body_${classId}`).classList.add('open'); 
            document.getElementById(`body_${sectionId}`).classList.add('open'); 
            showToast('Students added successfully!');
        }

            pushStateSnapshot();

            document.querySelectorAll('.reg-input').forEach(inp => {
                const stId = inp.getAttribute('data-st-id');
                const regVal = inp.value.trim();
                if (sec) {
                    const st = sec.students.find(s => s.id === stId);
                    if (st) st.regNo = regVal;
                }
            });

            saveLocalState(false);

            const records = {}; 
            document.querySelectorAll('.att-toggle').forEach(t => records[t.getAttribute('data-id')] = t.checked);
            
            if(!attendanceData[date]) attendanceData[date] = {};
            attendanceData[date][`${cId}_${sId}`] = records; 
            
            saveLocalState(false);
            if(scriptUrl) postToCloud({ action: "saveAttendance", instituteData, attendanceData });

            showToast('Attendance & Reg Numbers Saved Successfully!'); 
            triggerDashUpdate();
        }

                attendanceData[date][`${cId}_${sId}`] = { _isHoliday: true, note: note };

                renderAttendanceSheet(); triggerDashUpdate(); showToast('Holiday Declared!', 'success');

            let total = 0, p = 0, a = 0;
            const dayRec = attendanceData[date] || {};

            instituteData.forEach(c => {
                if(cId && c.id !== cId) return;
                c.sections.forEach(s => {
                    if(sId && s.id !== sId) return;
                    total += s.students.length;
                    const rec = dayRec[`${c.id}_${s.id}`];
                    const isHoli = rec === "HOLIDAY" || rec?._isHoliday;
                    if(rec && !isHoli) { s.students.forEach(st => { rec[st.id]===false ? a++ : p++; }); }
                });
            });
            document.getElementById('dashTotalStudents').innerText = total; document.getElementById('dashPresent').innerText = p; document.getElementById('dashAbsent').innerText = a;
        }

        function generateSummaryTable() {
            const date = dashDate.value, cId = document.getElementById('dashClassSelect').value, sId = document.getElementById('dashSectionSelect').value;
            const dayRec = attendanceData[date] || {};
            const container = document.getElementById('summaryContainer');

            let html = `<table><thead><tr><th>Class</th><th>Section</th><th>Total Enrolled</th><th>Present</th><th>Absent</th><th>Status</th></tr></thead><tbody>`;
            let dataFound = false;

            instituteData.forEach(c => {
                if(cId && c.id !== cId) return;
                c.sections.forEach(s => {
                    if(sId && s.id !== sId) return;
                    dataFound = true;
                    const enrolled = s.students.length;
                    let p = 0, a = 0, statusText = `<span style="color:var(--text-light)">Not Taken</span>`;
                    const rec = dayRec[`${c.id}_${s.id}`];
                    const isHoli = rec === "HOLIDAY" || rec?._isHoliday;

                    if(isHoli) {
                        statusText = `<span style="color:var(--holiday); font-weight:600;"><i class="fas fa-umbrella-beach"></i> ${rec.note || "Holiday"}</span>`;
                    } else if (rec) {
                        statusText = `<span style="color:var(--success); font-weight:600;"><i class="fas fa-check-circle"></i> Completed</span>`;
                        s.students.forEach(st => { rec[st.id]===false ? a++ : p++; });
                    }

                    html += `<tr><td><strong>${c.name}</strong></td><td>${s.name}</td><td>${enrolled}</td>
                        <td style="color:var(--success); font-weight:bold;">${p}</td>
                        <td style="color:var(--danger); font-weight:bold;">${a}</td>
                        <td>${statusText}</td></tr>`;
                });
            });
            
            if(!dataFound) html += `<tr><td colspan="6" style="text-align:center;">No class/section matches criteria.</td></tr>`;
            html += `</tbody></table>`;
            container.innerHTML = `<div class="a4-wrapper"><div class="a4-container">${buildA4PageHtml("DAILY SUMMARY AUDIT REPORT", `Date: ${date}`, html, "Daily Summary Register")}</div></div>`;
        }

        function generateFullReport() {
            const cId = document.getElementById('dashClassSelect').value, sId = document.getElementById('dashSectionSelect').value;
            const container = document.getElementById('reportContainer');
            if(!cId || !sId) return container.innerHTML = `<div class="a4-wrapper"><div class="a4-container">${buildA4PageHtml("MONTHLY ATTENDANCE REGISTER", "Class & Section Not Selected", "<p style='text-align:center; color:gray; padding:40px;'>Select Class and Section to view full report.</p>")}</div></div>`;
            
            const cls = instituteData.find(c=>c.id===cId), sec = cls.sections.find(s=>s.id===sId);
            const key = `${cId}_${sId}`;
            let dates = Object.keys(attendanceData).filter(d => attendanceData[d][key] !== undefined).sort();
            
            if(!dates.length) return container.innerHTML = `<div class="a4-wrapper"><div class="a4-container">${buildA4PageHtml("MONTHLY ATTENDANCE REGISTER", `${cls.name} (${sec.name})`, "<p style='text-align:center; color:gray; padding:40px;'>No attendance records found for this section yet.</p>")}</div></div>`;

            const startD = new Date(dates[0]), endD = new Date(); 
            let currY = startD.getFullYear(), currM = startD.getMonth();
            const eY = endD.getFullYear(), eM = endD.getMonth();
            
            let allA4PagesHtml = '';
            const legendBox = `<div class="legend-box" style="background:#f9fafb; padding:6px 10px; border-radius:6px; margin-bottom:8px; font-size:10px; border:1px solid var(--border);"><strong>Legend:</strong> <span class="cell-p">P (Present)</span> | <span class="cell-a">A (Absent)</span> | <span style="color:var(--holiday); font-weight:bold;">Holiday Note</span></div>`;

            while(currY < eY || (currY === eY && currM <= eM)) {
                const daysInMonth = new Date(currY, currM + 1, 0).getDate();
                const mName = new Date(currY, currM).toLocaleString('default', { month: 'long' });
                
                // PART 1 (Days 1 - 15) - Includes Roll, Reg No, Student Name
                let p1Table = legendBox + `<table class="report-table"><thead><tr><th>Roll</th><th>Reg No</th><th style="min-width:100px; text-align:left;">Name</th>`;
                for(let d=1; d<=15; d++) p1Table += `<th>${d}</th>`;
                p1Table += `</tr></thead><tbody>`;

                const totalStudents = sec.students.length;
                sec.students.sort((a,b)=>a.rollNo.localeCompare(b.rollNo,undefined,{numeric:true})).forEach((st, sIndex) => {
                    p1Table += `<tr><td>${st.rollNo}</td><td>${st.regNo || '-'}</td><td style="text-align:left; font-weight:500;">${st.name}</td>`;
                    
                    for(let d=1; d<=15; d++) {
                        const dateStr = `${currY}-${String(currM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        const rec = attendanceData[dateStr]?.[key];
                        const isHoli = rec === "HOLIDAY" || rec?._isHoliday;
                        
                        if(isHoli) {
                            if(sIndex === 0) p1Table += `<td rowspan="${totalStudents}" class="cell-h"><div class="vertical-text">${rec.note || "HOLIDAY"}</div></td>`;
                        }
                        else if(rec && rec[st.id] !== false) { p1Table += `<td class="cell-p">P</td>`; }
                        else if(rec && rec[st.id] === false) { p1Table += `<td class="cell-a">A</td>`; }
                        else { p1Table += `<td class="cell-none">-</td>`; }
                    }
                    p1Table += `</tr>`;
                });
                p1Table += `</tbody></table>`;

                allA4PagesHtml += buildA4PageHtml("MONTHLY ATTENDANCE REGISTER", `${cls.name} (${sec.name}) | ${mName} ${currY} | Part 1`, p1Table, "Monthly Register - Part 1");

                // PART 2 (Days 16 - End) - OMITS Roll No, Reg No, Name. Starts directly with Day 16
                let p2Table = legendBox + `<table class="report-table"><thead><tr>`;
                for(let d=16; d<=daysInMonth; d++) p2Table += `<th>${d}</th>`;
                p2Table += `<th>Total P</th><th>Total A</th><th>Att %</th></tr></thead><tbody>`;

                sec.students.forEach((st, sIndex) => {
                    let pCount = 0, aCount = 0;
                    for(let d=1; d<=daysInMonth; d++) {
                        const dateStr = `${currY}-${String(currM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        const rec = attendanceData[dateStr]?.[key];
                        if(rec && !rec._isHoliday && rec !== "HOLIDAY") {
                            if(rec[st.id] !== false) pCount++; else aCount++;
                        }
                    }

                    const totalMarkedDays = pCount + aCount;
                    const attPctStr = totalMarkedDays > 0 ? Math.round((pCount / totalMarkedDays) * 100) + "%" : "0%";

                    p2Table += `<tr>`;
                    
                    for(let d=16; d<=daysInMonth; d++) {
                        const dateStr = `${currY}-${String(currM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        const rec = attendanceData[dateStr]?.[key];
                        const isHoli = rec === "HOLIDAY" || rec?._isHoliday;
                        
                        if(isHoli) {
                            if(sIndex === 0) p2Table += `<td rowspan="${totalStudents}" class="cell-h"><div class="vertical-text">${rec.note || "HOLIDAY"}</div></td>`;
                        }
                        else if(rec && rec[st.id] !== false) { p2Table += `<td class="cell-p">P</td>`; }
                        else if(rec && rec[st.id] === false) { p2Table += `<td class="cell-a">A</td>`; }
                        else { p2Table += `<td class="cell-none">-</td>`; }
                    }
                    
                    p2Table += `<td style="background:#f0fdf4; color:var(--success); font-weight:bold;">${pCount}</td>
                                <td style="background:#fef2f2; color:var(--danger); font-weight:bold;">${aCount}</td>
                                <td style="background:#e0e7ff; color:var(--primary); font-weight:bold;">${attPctStr}</td></tr>`;
                });
                p2Table += `</tbody></table>`;

                allA4PagesHtml += buildA4PageHtml("MONTHLY ATTENDANCE REGISTER", `${cls.name} (${sec.name}) | ${mName} ${currY} | Part 2`, p2Table, "Monthly Register - Part 2");

                currM++; if(currM > 11) { currM = 0; currY++; }
            }

            container.innerHTML = `<div class="a4-wrapper"><div class="a4-container">${allA4PagesHtml}</div></div>`;
        }

        function triggerPrint(printClass) {
            let dynamicStyle = document.getElementById('dynamicPrintStyle');
            if(dynamicStyle) dynamicStyle.remove();
            dynamicStyle = document.createElement('style');
            dynamicStyle.id = 'dynamicPrintStyle';
            dynamicStyle.innerHTML = `@media print { @page { size: A4 ${printOrientation}; margin: 5mm; } }`;
            document.head.appendChild(dynamicStyle);

            document.body.className = `${printClass} print-${printOrientation}`;
            window.print();
            setTimeout(() => { document.body.className = ''; }, 1000);
        }

        function printDashboardView() {
            if(currentDashView === 'cards') return alert("Overview Cards view cannot be printed. Switch to Daily Summary or Total Monthly Report.");
            if(currentDashView === 'summary') triggerPrint('print-summary');
            if(currentDashView === 'report') triggerPrint('print-report');
        }

        async function clearAllData() { 
            const confirm1 = confirm('FACTORY RESET WARNING:\n\nAre you sure you want to completely reset the system?');
            if(!confirm1) return;

            const confirm2 = confirm('FINAL CONFIRMATION:\n\nThis will PERMANENTLY DELETE:\n1. All Google Sheets files created in Google Drive\n2. All local browser storage data\n3. All student directories & attendance logs\n\nProceed with full factory reset?');
            if(!confirm2) return;

            showToast('Resetting backend and local storage...');

            if (scriptUrl) {
                await postToCloud({ action: "factoryReset" });
            }

            localStorage.clear(); 
            location.reload(); 
        }

        function showToast(msg, type="success") { 
            const t=document.getElementById('toast'); 
            t.innerText=msg; 
            t.style.background=type==="success"?"var(--success)":"var(--danger)"; 
            t.classList.add('show'); 
            setTimeout(()=>t.classList.remove('show'),3000); 
        }
    </script>
</body>
</html>
