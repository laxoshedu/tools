        // Generate Microscopic Particles
        function createParticles(beaker) {
            const list = [];
            const bX = beaker.x + 10;
            const bY = beaker.y + 25;
            const bW = beaker.w - 20;
            const bH = beaker.h - 30;
            const sub = substanceData[beaker.soluteKey];

            if (sub.category === &#39;solution&#39;) {
                for (let i = 0; i &lt; 45; i++) {
                    list.push({
                        x: bX + Math.random() * bW,
                        y: bY + Math.random() * bH,
                        r: 0.9,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        type: &#39;ion&#39;,
                        isIlluminated: false
                    });
                }
            } else if (sub.category === &#39;colloid&#39;) {
                // SLOW Brownian Motion for Colloids
                for (let i = 0; i &lt; 85; i++) {
                    list.push({
                        x: bX + Math.random() * bW,
                        y: bY + Math.random() * bH,
                        r: 2.8,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        type: &#39;colloid&#39;,
                        isIlluminated: false
                    });
                }
            } else if (sub.category === &#39;suspension&#39;) {
                for (let i = 0; i &lt; 70; i++) {
                    list.push({
                        x: bX + Math.random() * bW,
                        y: bY + Math.random() * (bH - 15),
                        r: Math.random() * 3.5 + 3,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: Math.random() * 0.35 + 0.15,
                        settled: false,
                        type: &#39;suspension&#39;,
                        isIlluminated: false
                    });
                }
            }
            particles[beaker.id] = list;
        }

        // Re-stir Functionality
        function reStirBeaker(beaker) {
            const list = particles[beaker.id];
            if (!list) return;

            list.forEach(p =&gt; {
                if (p.type === &#39;suspension&#39;) {
                    p.settled = false;
                    p.y = beaker.y + 30 + Math.random() * (beaker.h - 60);
                    p.vx = (Math.random() - 0.5) * 1.5;
                    p.vy = Math.random() * 0.4 + 0.1;
                } else {
                    p.vx = (Math.random() - 0.5) * 0.8;
                    p.vy = (Math.random() - 0.5) * 0.8;
                }
            });
        }

        // Main Drawing Routine
        function drawScene(targetCtx, isMagnified = false) {
            if (!isMagnified) {
                targetCtx.fillStyle = &quot;#020617&quot;;
                targetCtx.fillRect(0, 0, canvas.width, canvas.height);

                // Lab Bench
                targetCtx.fillStyle = &quot;#1e293b&quot;;
                targetCtx.fillRect(0, 410, canvas.width, 130);
                targetCtx.strokeStyle = &quot;#334155&quot;;
                targetCtx.lineWidth = 2;
                targetCtx.beginPath();
                targetCtx.moveTo(0, 410);
                targetCtx.lineTo(canvas.width, 410);
                targetCtx.stroke();

                drawShelfAndJars(targetCtx);
            }

            // Draw Dark Screens
            screens.forEach(s =&gt; drawDarkScreen(targetCtx, s, isMagnified));

            // Draw Beakers
            beakers.forEach(b =&gt; drawBeaker(targetCtx, b, isMagnified));

            // Physics Update &amp; Particle Drawing
            updateAndDrawParticles(targetCtx, isMagnified);

            // Compute Laser Optics
            lasers.forEach(l =&gt; {
                if (l.isOn) {
                    const screenImpact = calculateAndDrawLight(targetCtx, l);
                    if (screenImpact &amp;&amp; screenImpact.hit) {
                        drawScreenImpactSpot(targetCtx, screenImpact);
                    }
                }
            });

            // Draw Tools
            if (!isMagnified) {
                lasers.forEach(l =&gt; drawLaserDevice(targetCtx, l));
                drawStirringRod(targetCtx);
            }
        }

        function drawShelfAndJars(targetCtx) {
            targetCtx.fillStyle = &quot;#334155&quot;;
            targetCtx.fillRect(shelf.x, shelf.y + shelf.h - 8, shelf.w, 10);

            jars.forEach(j =&gt; {
                const sub = substanceData[j.subKey];
                targetCtx.fillStyle = &quot;#1e293b&quot;;
                targetCtx.strokeStyle = &quot;#64748b&quot;;
                targetCtx.lineWidth = 2;
                targetCtx.fillRect(j.x, j.y, j.w, j.h);
                targetCtx.strokeRect(j.x, j.y, j.w, j.h);

                targetCtx.fillStyle = &quot;#475569&quot;;
                targetCtx.fillRect(j.x - 2, j.y - 6, j.w + 4, 6);

                targetCtx.fillStyle = sub.color;
                targetCtx.fillRect(j.x + 4, j.y + 18, j.w - 8, j.h - 22);

                targetCtx.fillStyle = &quot;#ffffff&quot;;
                targetCtx.font = &quot;bold 8px Segoe UI&quot;;
                targetCtx.textAlign = &quot;center&quot;;
                targetCtx.fillText(sub.name, j.x + j.w/2, j.y + 13);
            });
        }

        function drawStirringRod(targetCtx) {
            targetCtx.save();
            targetCtx.fillStyle = &quot;rgba(224, 242, 254, 0.75)&quot;;
            targetCtx.strokeStyle = &quot;rgba(255, 255, 255, 0.9)&quot;;
            targetCtx.lineWidth = 2;
            targetCtx.fillRect(rod.x, rod.y, rod.w, rod.h);
            targetCtx.strokeRect(rod.x, rod.y, rod.w, rod.h);

            targetCtx.fillStyle = &quot;#38bdf8&quot;;
            targetCtx.beginPath();
            targetCtx.arc(rod.x + rod.w/2, rod.y, 7, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.restore();
        }

        function drawBeaker(targetCtx, b, isMagnified) {
            let liquidColor = &quot;rgba(56, 189, 248, 0.12)&quot;;
            if (b.state === &#39;unmixed&#39;) {
                liquidColor = &quot;rgba(148, 163, 184, 0.22)&quot;;
            } else if (b.state === &#39;prepared&#39;) {
                const sub = substanceData[b.soluteKey];
                liquidColor = sub.liquidTint;
            }

            targetCtx.fillStyle = liquidColor;
            targetCtx.fillRect(b.x + 5, b.y + 20, b.w - 10, b.h - 25);

            if (b.state === &#39;unmixed&#39;) {
                const sub = substanceData[b.soluteKey];
                targetCtx.fillStyle = sub.color;
                targetCtx.beginPath();
                targetCtx.ellipse(b.x + b.w/2, b.y + b.h - 10, b.w/2 - 12, 7, 0, 0, Math.PI * 2);
                targetCtx.fill();
            }

            targetCtx.strokeStyle = &quot;rgba(255, 255, 255, 0.6)&quot;;
            targetCtx.lineWidth = 3.5;
            targetCtx.beginPath();
            targetCtx.moveTo(b.x, b.y);
            targetCtx.lineTo(b.x, b.y + b.h);
            targetCtx.quadraticCurveTo(b.x + b.w/2, b.y + b.h + 8, b.x + b.w, b.y + b.h);
            targetCtx.lineTo(b.x + b.w, b.y);
            targetCtx.stroke();

            targetCtx.beginPath();
            targetCtx.ellipse(b.x + b.w/2, b.y + 20, b.w/2 - 5, 7, 0, 0, Math.PI * 2);
            targetCtx.strokeStyle = &quot;rgba(255, 255, 255, 0.4)&quot;;
            targetCtx.lineWidth = 2;
            targetCtx.stroke();

            if (!isMagnified) {
                targetCtx.fillStyle = &quot;#e2e8f0&quot;;
                targetCtx.font = &quot;bold 13px Segoe UI&quot;;
                targetCtx.textAlign = &quot;center&quot;;
                targetCtx.fillText(b.name, b.x + b.w/2, b.y - 25);

                let statusText = &quot;Pure Water&quot;;
                let badgeColor = &quot;#38bdf8&quot;;

                if (b.state === &#39;unmixed&#39;) {
                    statusText = &quot;Unmixed (Stir Me)&quot;;
                    badgeColor = &quot;#fbbf24&quot;;
                } else if (b.state === &#39;prepared&#39;) {
                    const sub = substanceData[b.soluteKey];
                    statusText = sub.name;
                    badgeColor = sub.category === &#39;solution&#39; ? &quot;#4ade80&quot; : sub.category === &#39;colloid&#39; ? &quot;#facc15&quot; : &quot;#f87171&quot;;
                }

                targetCtx.fillStyle = badgeColor;
                targetCtx.font = &quot;bold 11px Segoe UI&quot;;
                targetCtx.fillText(statusText, b.x + b.w/2, b.y - 8);
            }
        }

        function updateAndDrawParticles(targetCtx, isMagnified) {
            beakers.forEach(b =&gt; {
                const list = particles[b.id];
                if (!list) return;

                const minX = b.x + 8, maxX = b.x + b.w - 8;
                const minY = b.y + 22, maxY = b.y + b.h - 8;

                list.forEach(p =&gt; {
                    if (isSimulating) {
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.type === &#39;colloid&#39;) {
                            p.vx += (Math.random() - 0.5) * 0.04;
                            p.vy += (Math.random() - 0.5) * 0.04;
                            p.vx = Math.max(-0.4, Math.min(0.4, p.vx));
                            p.vy = Math.max(-0.4, Math.min(0.4, p.vy));
                        }

                        if (p.type === &#39;suspension&#39; &amp;&amp; p.y &gt;= maxY - 4) {
                            p.settled = true;
                            p.vy = 0; p.vx = 0;
                        }

                        if (p.x &lt; minX || p.x &gt; maxX) p.vx *= -1;
                        if (p.y &lt; minY || p.y &gt; maxY) p.vy *= -1;
                    }

                    if (isMagnified) {
                        targetCtx.fillStyle = p.type === &#39;ion&#39; ? &quot;#a5f3fc&quot; : p.type === &#39;colloid&#39; ? &quot;#ffffff&quot; : &quot;#cbd5e1&quot;;

                        if (p.isIlluminated) {
                            targetCtx.shadowColor = laserColors[currentColorIdx];
                            targetCtx.shadowBlur = 10;
                            targetCtx.fillStyle = &quot;#ffffff&quot;;
                        }

                        targetCtx.beginPath();
                        targetCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        targetCtx.fill();
                        targetCtx.shadowBlur = 0;
                    }

                    p.isIlluminated = false;
                });
            });
        }

        function drawDarkScreen(targetCtx, s, isMagnified) {
            targetCtx.fillStyle = &quot;#334155&quot;;
            targetCtx.fillRect(s.x - 3, s.y - 15, s.w + 6, s.h + 30);

            targetCtx.fillStyle = &quot;#090d16&quot;;
            targetCtx.fillRect(s.x, s.y, s.w, s.h);

            targetCtx.strokeStyle = &quot;#1e293b&quot;;
            targetCtx.lineWidth = 1;
            for (let y = s.y + 15; y &lt; s.y + s.h; y += 15) {
                targetCtx.beginPath();
                targetCtx.moveTo(s.x, y);
                targetCtx.lineTo(s.x + s.w, y);
                targetCtx.stroke();
            }

            if (!isMagnified) {
                targetCtx.fillStyle = &quot;#94a3b8&quot;;
                targetCtx.font = &quot;bold 11px Segoe UI&quot;;
                targetCtx.textAlign = &quot;center&quot;;
                targetCtx.fillText(&quot;SCREEN &quot; + s.id, s.x + s.w/2, s.y - 20);
            }
        }

        function calculateAndDrawLight(targetCtx, laserObj) {
            const color = laserColors[currentColorIdx];
            const tipX = laserObj.x + Math.cos(laserObj.angle) * 36;
            const tipY = laserObj.y + Math.sin(laserObj.angle) * 36;
            const dirX = Math.cos(laserObj.angle);
            const dirY = Math.sin(laserObj.angle);

            let px = tipX;
            let py = tipY;
            let intensity = 1.0;
            let screenHit = null;

            targetCtx.lineWidth = 3;

            for (let d = 0; d &lt; 1200; d += 4) {
                let nextX = px + dirX * 4;
                let nextY = py + dirY * 4;

                for (let s of screens) {
                    if (nextX &gt;= s.x &amp;&amp; nextX &lt;= s.x + s.w &amp;&amp; nextY &gt;= s.y &amp;&amp; nextY &lt;= s.y + s.h) {
                        screenHit = { hit: true, screen: s, y: nextY, intensity: intensity, beakerKey: getBeakerSoluteKeyAt(px, py) };
                        break;
                    }
                }
                if (screenHit) break;

                let currentBeaker = beakers.find(b =&gt;
                    px &gt;= b.x + 5 &amp;&amp; px &lt;= b.x + b.w - 5 &amp;&amp; py &gt;= b.y + 20 &amp;&amp; py &lt;= b.y + b.h - 8
                );

                targetCtx.beginPath();
                targetCtx.moveTo(px, py);
                targetCtx.lineTo(nextX, nextY);

                if (!currentBeaker) {
                    targetCtx.strokeStyle = color;
                    targetCtx.globalAlpha = 0.45 * intensity;
                    targetCtx.stroke();
                } else {
                    const sub = currentBeaker.state === &#39;prepared&#39; ? substanceData[currentBeaker.soluteKey] : null;

                    if (!sub || sub.category === &#39;solution&#39;) {
                        targetCtx.strokeStyle = color;
                        targetCtx.globalAlpha = 0.03;
                        targetCtx.stroke();
                        intensity *= 0.998;
                    } else if (sub.category === &#39;colloid&#39;) {
                        targetCtx.strokeStyle = &quot;#ffffff&quot;;
                        targetCtx.lineWidth = 6;
                        targetCtx.globalAlpha = 0.9 * intensity;
                        targetCtx.stroke();

                        targetCtx.beginPath();
                        targetCtx.moveTo(px, py);
                        targetCtx.lineTo(nextX, nextY);
                        targetCtx.strokeStyle = color;
                        targetCtx.lineWidth = 14;
                        targetCtx.globalAlpha = 0.4 * intensity;
                        targetCtx.stroke();
                        targetCtx.lineWidth = 3;
                        intensity *= 0.985;

                        const list = particles[currentBeaker.id];
                        if (list) {
                            list.forEach(p =&gt; {
                                if (Math.hypot(p.x - px, p.y - py) &lt; 10) p.isIlluminated = true;
                            });
                        }
                    } else if (sub.category === &#39;suspension&#39;) {
                        targetCtx.strokeStyle = color;
                        targetCtx.lineWidth = 8;
                        targetCtx.globalAlpha = 0.35 * intensity;
                        targetCtx.stroke();
                        targetCtx.lineWidth = 3;
                        intensity *= 0.93;

                        const list = particles[currentBeaker.id];
                        if (list) {
                            list.forEach(p =&gt; {
                                if (Math.hypot(p.x - px, p.y - py) &lt; 12) p.isIlluminated = true;
                            });
                        }
                    }
                }

                px = nextX;
                py = nextY;
            }

            targetCtx.globalAlpha = 1.0;
            return screenHit;
        }

        function getBeakerSoluteKeyAt(px, py) {
            let b = beakers.find(b =&gt; px &gt;= b.x - 20 &amp;&amp; px &lt;= b.x + b.w + 20);
            return b &amp;&amp; b.state === &#39;prepared&#39; ? b.soluteKey : null;
        }

        function drawScreenImpactSpot(targetCtx, impact) {
            const color = laserColors[currentColorIdx];
            targetCtx.save();

            const spotX = impact.screen.x + impact.screen.w / 2;
            const spotY = impact.y;
            const sub = impact.beakerKey ? substanceData[impact.beakerKey] : null;

            if (sub &amp;&amp; sub.category === &#39;colloid&#39;) {
                let grad = targetCtx.createRadialGradient(spotX, spotY, 2, spotX, spotY, 18);
                grad.addColorStop(0, &#39;#ffffff&#39;);
                grad.addColorStop(0.35, color);
                grad.addColorStop(1, &#39;transparent&#39;);
                targetCtx.fillStyle = grad;
                targetCtx.beginPath();
                targetCtx.arc(spotX, spotY, 18, 0, Math.PI * 2);
                targetCtx.fill();
            } else if (sub &amp;&amp; sub.category === &#39;suspension&#39;) {
                targetCtx.fillStyle = color;
                targetCtx.globalAlpha = 0.28 * impact.intensity;
                targetCtx.beginPath();
                targetCtx.arc(spotX, spotY, 12, 0, Math.PI * 2);
                targetCtx.fill();
            } else {
                targetCtx.fillStyle = &quot;#ffffff&quot;;
                targetCtx.shadowColor = color;
                targetCtx.shadowBlur = 12;
                targetCtx.beginPath();
                targetCtx.arc(spotX, spotY, 4, 0, Math.PI * 2);
                targetCtx.fill();
            }

            targetCtx.restore();
        }

        function drawLaserDevice(targetCtx, l) {
            targetCtx.save();
            targetCtx.translate(l.x, l.y);
            targetCtx.rotate(l.angle);

            targetCtx.fillStyle = &quot;#334155&quot;;
            targetCtx.strokeStyle = &quot;#64748b&quot;;
            targetCtx.lineWidth = 2;
            targetCtx.fillRect(-35, -12, 60, 24);
            targetCtx.strokeRect(-35, -12, 60, 24);

            targetCtx.fillStyle = laserColors[currentColorIdx];
            targetCtx.fillRect(25, -9, 9, 18);

            targetCtx.fillStyle = l.isOn ? &quot;#22c55e&quot; : &quot;#ef4444&quot;;
            targetCtx.fillRect(-28, -8, 16, 16);
            targetCtx.strokeStyle = &quot;#ffffff&quot;;
            targetCtx.lineWidth = 1;
            targetCtx.strokeRect(-28, -8, 16, 16);

            targetCtx.fillStyle = &quot;#ffffff&quot;;
            targetCtx.font = &quot;bold 8px Segoe UI&quot;;
            targetCtx.textAlign = &quot;center&quot;;
            targetCtx.fillText(l.isOn ? &quot;ON&quot; : &quot;OFF&quot;, -20, 3);

            targetCtx.restore();
        }

        function drawMagnifier() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(magnifier.x, magnifier.y, magnifier.radius, 0, Math.PI * 2);
            ctx.clip();

            ctx.save();
            ctx.translate(magnifier.x, magnifier.y);
            ctx.scale(magnifier.zoom, magnifier.zoom);
            ctx.translate(-magnifier.x, -magnifier.y);

            drawScene(ctx, true);

            beakers.forEach(b =&gt; {
                const list = particles[b.id];
                const color = laserColors[currentColorIdx];
                if (list) {
                    list.forEach(p =&gt; {
                        if (p.isIlluminated &amp;&amp; Math.hypot(p.x - magnifier.x, p.y - magnifier.y) &lt; magnifier.radius) {
                            ctx.strokeStyle = color;
                            ctx.lineWidth = 0.9;
                            for (let a = 0; a &lt; Math.PI * 2; a += Math.PI / 3) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p.x + Math.cos(a) * 10, p.y + Math.sin(a) * 10);
                                ctx.stroke();
                            }
                        }
                    });
                }
            });

            ctx.restore();

            let gradient = ctx.createLinearGradient(
                magnifier.x - magnifier.radius, magnifier.y - magnifier.radius,
                magnifier.x + magnifier.radius, magnifier.y + magnifier.radius
            );
            gradient.addColorStop(0, &#39;rgba(255, 255, 255, 0.35)&#39;);
            gradient.addColorStop(0.5, &#39;rgba(255, 255, 255, 0.05)&#39;);
            gradient.addColorStop(1, &#39;rgba(0, 0, 0, 0.2)&#39;);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(magnifier.x, magnifier.y, magnifier.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = &quot;#94a3b8&quot;;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(magnifier.x, magnifier.y, magnifier.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = &quot;#475569&quot;;
            ctx.lineWidth = 10;
            ctx.lineCap = &quot;round&quot;;
            ctx.beginPath();
            ctx.moveTo(magnifier.x + magnifier.radius * 0.7, magnifier.y + magnifier.radius * 0.7);
            ctx.lineTo(magnifier.x + magnifier.radius * 1.4, magnifier.y + magnifier.radius * 1.4);
            ctx.stroke();

            ctx.restore();
        }

        // --- Responsive Coordinate Scaling ---
        function getPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX = evt.clientX;
            let clientY = evt.clientY;

            if (evt.touches &amp;&amp; evt.touches.length &gt; 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // --- Interaction Logic Functions ---
        function handleStart(m) {
            // 1. Drag Magnifier
            if (Math.hypot(m.x - magnifier.x, m.y - magnifier.y) &lt; magnifier.radius) {
                magnifier.isDragging = true;
                dragOffsetX = m.x - magnifier.x;
                dragOffsetY = m.y - magnifier.y;
                return true;
            }

            // 2. Drag Glass Stirring Rod
            if (m.x &gt;= rod.x - 12 &amp;&amp; m.x &lt;= rod.x + rod.w + 12 &amp;&amp; m.y &gt;= rod.y - 12 &amp;&amp; m.y &lt;= rod.y + rod.h + 12) {
                rod.isDragging = true;
                rod.lastX = m.x;
                rod.lastY = m.y;
                dragOffsetX = m.x - rod.x;
                dragOffsetY = m.y - rod.y;
                return true;
            }

            // 3. Drag Powder Jars
            for (let j of jars) {
                if (m.x &gt;= j.x - 10 &amp;&amp; m.x &lt;= j.x + j.w + 10 &amp;&amp; m.y &gt;= j.y - 10 &amp;&amp; m.y &lt;= j.y + j.h + 10) {
                    j.isDragging = true;
                    dragOffsetX = m.x - j.x;
                    dragOffsetY = m.y - j.y;
                    return true;
                }
            }

            // 4. Lasers Interaction
            for (let l of lasers) {
                let dx = m.x - l.x;
                let dy = m.y - l.y;
                let localX = dx * Math.cos(-l.angle) - dy * Math.sin(-l.angle);
                let localY = dx * Math.sin(-l.angle) + dy * Math.cos(-l.angle);

                if (localX &gt;= -35 &amp;&amp; localX &lt;= -10 &amp;&amp; localY &gt;= -15 &amp;&amp; localY &lt;= 15) {
                    l.isOn = !l.isOn;
                    return true;
                }

                let tipX = l.x + Math.cos(l.angle) * 36;
                let tipY = l.y + Math.sin(l.angle) * 36;
                if (Math.hypot(m.x - tipX, m.y - tipY) &lt; 25) {
                    l.isDraggingTip = true;
                    return true;
                }

                if (Math.hypot(m.x - l.x, m.y - l.y) &lt; 35) {
                    l.isDraggingBody = true;
                    dragOffsetX = m.x - l.x;
                    dragOffsetY = m.y - l.y;
                    return true;
                }
            }
            return false;
        }

        function handleMove(m) {
            if (magnifier.isDragging) {
                magnifier.x = m.x - dragOffsetX;
                magnifier.y = m.y - dragOffsetY;
            } else if (rod.isDragging) {
                rod.x = m.x - dragOffsetX;
                rod.y = m.y - dragOffsetY;

                beakers.forEach(b =&gt; {
                    if (rod.x &gt;= b.x &amp;&amp; rod.x &lt;= b.x + b.w &amp;&amp; rod.y + rod.h &gt;= b.y + 20 &amp;&amp; rod.y + rod.h &lt;= b.y + b.h) {
                        let speed = Math.hypot(m.x - rod.lastX, m.y - rod.lastY);

                        if (b.state === &#39;unmixed&#39;) {
                            b.stirAmount += speed;
                            if (b.stirAmount &gt; 320) {
                                b.state = &#39;prepared&#39;;
                                createParticles(b);
                            }
                        } else if (b.state === &#39;prepared&#39;) {
                            reStirBeaker(b);
                        }
                    }
                });
                rod.lastX = m.x;
                rod.lastY = m.y;
            } else {
                jars.forEach(j =&gt; {
                    if (j.isDragging) {
                        j.x = m.x - dragOffsetX;
                        j.y = m.y - dragOffsetY;
                    }
                });

                lasers.forEach(l =&gt; {
                    if (l.isDraggingBody) {
                        l.x = m.x - dragOffsetX;
                        l.y = m.y - dragOffsetY;
                    } else if (l.isDraggingTip) {
                        l.angle = Math.atan2(m.y - l.y, m.x - l.x);
                    }
                });
            }
        }

        function handleEnd() {
            magnifier.isDragging = false;
            rod.isDragging = false;
            lasers.forEach(l =&gt; { l.isDraggingBody = false; l.isDraggingTip = false; });

            jars.forEach(j =&gt; {
                if (j.isDragging) {
                    j.isDragging = false;
                    beakers.forEach(b =&gt; {
                        if (j.x + j.w/2 &gt;= b.x &amp;&amp; j.x + j.w/2 &lt;= b.x + b.w &amp;&amp; j.y + j.h &gt;= b.y &amp;&amp; j.y &lt;= b.y + b.h) {
                            if (b.state === &#39;water&#39;) {
                                b.state = &#39;unmixed&#39;;
                                b.soluteKey = j.subKey;
                                b.stirAmount = 0;
                            }
                        }
                    });
                    j.x = j.homeX; j.y = j.homeY;
                }
            });

            rod.x = rod.homeX; rod.y = rod.homeY;
        }

        // --- Mouse Event Listeners ---
        canvas.addEventListener(&#39;mousedown&#39;, (e) =&gt; handleStart(getPos(e)));
        canvas.addEventListener(&#39;mousemove&#39;, (e) =&gt; handleMove(getPos(e)));
        window.addEventListener(&#39;mouseup&#39;, handleEnd);

        // --- Mobile Touch Event Listeners ---
        canvas.addEventListener(&#39;touchstart&#39;, (e) =&gt; {
            if (handleStart(getPos(e))) {
                e.preventDefault();
            }
        }, { passive: false });

        canvas.addEventListener(&#39;touchmove&#39;, (e) =&gt; {
            handleMove(getPos(e));
            e.preventDefault();
        }, { passive: false });

        window.addEventListener(&#39;touchend&#39;, handleEnd);

        // UI Controls Events
        document.getElementById(&#39;laserColorBtn&#39;).addEventListener(&#39;click&#39;, () =&gt; {
            currentColorIdx = (currentColorIdx + 1) % laserColors.length;
        });

        document.getElementById(&#39;toggleParticlesBtn&#39;).addEventListener(&#39;click&#39;, () =&gt; {
            isSimulating = !isSimulating;
        });

        document.getElementById(&#39;resetLabBtn&#39;).addEventListener(&#39;click&#39;, () =&gt; {
            resetLab();
        });

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawScene(ctx, false);
            drawMagnifier();
            requestAnimationFrame(animate);
        }

        // Start Virtual Lab
        animate();
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </div>
</div>

<script>
  const STAGE_W = 1280;
  const STAGE_H = 720;
  const IS_CUSTOM_SCALE = false;
  const CUSTOM_SCALE_VAL = 51.8;
  const REQUIRE_LANDSCAPE = true;
  const AUTO_FULLSCREEN = true;

  let baseScale = 1;
  let userZoomMultiplier = 1.0;
  let panX = 0;
  let panY = 0;
  let isPanDragActive = false;
  let isDragging = false;
  let startX = 0, startY = 0;
  let resizeTimeout = null;
  let lastWinW = 0;
  let lastWinH = 0;

  function resizeStage() {
    const stage = document.getElementById('appStage');
    if (!stage) return;

    const currentW = window.innerWidth;
    const currentH = window.innerHeight;

    if (IS_CUSTOM_SCALE) {
      baseScale = CUSTOM_SCALE_VAL / 100;
    } else {
      baseScale = Math.min(currentW / STAGE_W, currentH / STAGE_H);
    }
    const finalScale = baseScale * userZoomMultiplier;
    stage.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${finalScale})`;
  }

  /* NAVIGATION & ZOOM CONTROLS */
  function navBack() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.back();
    } catch(e) {
      window.history.back();
    }
  }

  function navForward() {
    try {
      const iframe = document.getElementById('contentFrame');
      iframe.contentWindow.history.forward();
    } catch(e) {
      window.history.forward();
    }
  }

  function zoomIn() {
    userZoomMultiplier = Math.min(4.0, userZoomMultiplier + 0.15);
    resizeStage();
  }

  function zoomOut() {
    userZoomMultiplier = Math.max(0.2, userZoomMultiplier - 0.15);
    resizeStage();
  }

  function panStage(dx, dy) {
    panX += dx;
    panY += dy;
    resizeStage();
  }

  function resetPanAndZoom() {
    userZoomMultiplier = 1.0;
    panX = 0;
    panY = 0;
    resizeStage();
  }

  function togglePanDragMode() {
    isPanDragActive = !isPanDragActive;
    const btn = document.getElementById('panDragToggleBtn');
    const iframe = document.getElementById('contentFrame');
    const container = document.getElementById('viewportContainer');

    if (isPanDragActive) {
      btn.classList.add('active-mode');
      iframe.style.pointerEvents = 'none';
      container.style.cursor = 'grab';
    } else {
      btn.classList.remove('active-mode');
      iframe.style.pointerEvents = 'auto';
      container.style.cursor = 'default';
    }
  }

  /* MOUSE & TOUCH DRAG PANNING */
  const container = document.getElementById('viewportContainer');

  container.addEventListener('pointerdown', (e) => {
    if (!isPanDragActive) return;
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    container.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    resizeStage();
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (isPanDragActive) container.style.cursor = 'grab';
  });

  function toggleNavBar(hide) {
    const bar = document.getElementById('navOverlayBar');
    const toggleBtn = document.getElementById('navToggleBtn');
    if (!bar || !toggleBtn) return;
    if (hide) {
      bar.classList.add('hidden');
      toggleBtn.classList.add('visible');
    } else {
      bar.classList.remove('hidden');
      toggleBtn.classList.remove('visible');
    }
  }

  function checkOrientation() {
    const rotateOverlay = document.getElementById('rotateOverlay');
    if (!rotateOverlay) {
      resizeStage();
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 1024;
    if (REQUIRE_LANDSCAPE && isPortrait) {
      rotateOverlay.style.display = 'flex';
    } else {
      rotateOverlay.style.display = 'none';
    }
    resizeStage();
  }

  function requestFullscreenIfPossible() {
    if (!AUTO_FULLSCREEN) return;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (req) {
        req.call(docEl).catch(() => {});
      }
    }
    window.removeEventListener('pointerdown', requestFullscreenIfPossible, { capture: true });
  }

  if (AUTO_FULLSCREEN) {
    window.addEventListener('pointerdown', requestFullscreenIfPossible, { capture: true, once: true });
  }

  const btnLandscape = document.getElementById('btnEnterLandscape');
  if (btnLandscape) {
    btnLandscape.addEventListener('click', () => {
      requestFullscreenIfPossible();
      const rotateOverlay = document.getElementById('rotateOverlay');
      if (rotateOverlay) rotateOverlay.style.display = 'none';
    });
  }

  window.addEventListener('resize', () => {
    const wDiff = Math.abs(window.innerWidth - lastWinW);
    const hDiff = Math.abs(window.innerHeight - lastWinH);

    // Filter out minor vertical resize shifts caused by mobile web browsers toggling top/bottom UI bars
    if (lastWinW > 0 && wDiff < 15 && hDiff < 80) return;

    lastWinW = window.innerWidth;
    lastWinH = window.innerHeight;

    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      checkOrientation();
      resizeStage();
    }, 60);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      lastWinW = window.innerWidth;
      lastWinH = window.innerHeight;
      checkOrientation();
      resizeStage();
    }, 200);
  });

  lastWinW = window.innerWidth;
  lastWinH = window.innerHeight;
  checkOrientation();
  resizeStage();
</script>
</body>
</html>
